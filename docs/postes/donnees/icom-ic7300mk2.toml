# Fiche publique du poste : source des tableaux https://bob56fr.github.io/openRemoteTRX/postes/
# (scripts/build_rigs_doc.py). Chaque état vient d'un essai réel (rapports de qualification gardés par le qualifieur).
# États : valide, partiel (note obligatoire), echec (note obligatoire), non_teste, non_declare (Hamlib ne le propose pas).

[poste]
fabricant = "Icom"
modele = "IC-7300MK2"
hamlib_model = 3094
statut = "validation_en_cours"     # valide | restreint | validation_en_cours | refuse
resume = "Poste de référence du projet : station en service depuis le 2026-10 (Debian 13). Requalifié le 2026-11-19 avec le nouveau déroulé (réception sur antenne, émissions sur charge fictive) : toute la sécurité d'émission validée ; restent le split, les filtres et les essais au téléphone."
resume_en = "Reference rig of the project: station in service since 2026-10 (Debian 13). Requalified on 2026-11-19 with the new flow (receive on antenna, transmissions on dummy load): all transmit safety validated; split, filters and phone drills remain."

[[essais]]
date = "2026-11-19"
station = "0.208.0"
hamlib = "4.7.2"
systeme = "Windows 11"
quoi = "Split (touche SPLIT de l'opérateur, émission puis coupure par la station) et coupleur pas à pas avec l'opérateur : marche / arrêt relus, émissions FM 20 W sur antenne réelle désaccordée (TOS 2,7 coupleur à l'arrêt, accord au PTT sur 40 m), réglages du coupleur lus par le second port"
quoi_en = "Split (operator SPLIT key, transmission then cut by the station) and tuner step by step with the operator: on / off read back, FM 20 W transmissions on a real mistuned antenna (SWR 2.7 tuner off, tuning on PTT on 40 m), tuner settings read through the second port"

[[essais]]
date = "2026-11-19"
station = "0.204.0"
hamlib = "4.7.2"
systeme = "Windows 11"
quoi = "Requalification : réception sur antenne (7,061 MHz), spectre par le port B, qualification avec émission sur charge fictive (27,430 MHz, 5 W), coupleur, VOX, 5 essais automatiques, opérateur sur place, arrêt et démarrage de la station"
quoi_en = "Requalification: receive on antenna (7.061 MHz), spectrum through port B, qualification with transmission on dummy load (27.430 MHz, 5 W), tuner, VOX, 5 automatic drills, local operator, station stop and start-up"

[[essais]]
date = "2026-11-18"
station = "0.199.0"
hamlib = "4.7.2"
systeme = "Windows 11"
quoi = "Qualification complète (trx-qualif, charge fictive), valise : relevés, exploration, 5 essais automatiques"
quoi_en = "Full qualification (trx-qualif, dummy load), qualification kit: snapshots, exploration, 5 automatic drills"

[[essais]]
date = "2026-11-13"
station = "0.133.0"
hamlib = "5.0.0~git"
systeme = "Debian 13"
quoi = "Exploration et qualification sans émission ; station en service (CAT, PTT, audio, spectre HF)"
quoi_en = "Exploration and qualification without transmitting; station in service (CAT, PTT, audio, HF spectrum)"

[fonctions]
# --- Sécurité d'émission
ptt_relu = { etat = "valide", note = "3 cycles, coupure en 78 ms au plus. dump_caps annonce « PTT type: None » avec Hamlib 4.7.2 (« Rig capable » avec 5.0) : le PTT par CAT marche quand même.", note_en = "3 cycles, cut within 78 ms. dump_caps reports « PTT type: None » with Hamlib 4.7.2 (« Rig capable » with 5.0): CAT PTT works anyway." }
tot = { etat = "valide", note = "TOT de 8 s coupé à 8,1 s, de 20 s à 20,0 s.", note_en = "8 s TOT cut at 8.1 s, 20 s at 20.0 s." }
battements = { etat = "valide", note = "Réception 2,1 s après le dernier battement.", note_en = "Receive 2.1 s after the last heartbeat." }
deconnexion = { etat = "valide", note = "Réception en 0,1 s.", note_en = "Receive within 0.1 s." }
perte_cat = { etat = "valide", note = "Liaison CAT coupée 1,5 s pendant l'émission : réception 1,7 s après.", note_en = "CAT link cut for 1.5 s while transmitting: receive 1.7 s later." }
hors_bande = { etat = "valide", note = "Émission refusée sur 1,760 MHz, aucune émission vue.", note_en = "Transmission refused on 1.760 MHz, none seen." }
operateur_local = { etat = "valide", note = "Émission au micro du poste vue ; émission à distance refusée ensuite (local_active).", note_en = "Rig-microphone transmission seen; remote transmission refused afterwards (local_active)." }
demarrage = { etat = "valide", note = "Aucune émission vue pendant le démarrage de la station ; station arrêtée pendant une émission : réception en 0,41 s.", note_en = "No transmission seen while the station starts; station stopped while transmitting: receive within 0.41 s." }
# --- Fréquence
frequence = { etat = "valide", note = "8 bandes écrites et relues au hertz.", note_en = "8 bands written and read back to the hertz." }
split = { etat = "valide", note = "Split mis par l'opérateur (touche SPLIT, VFO B réglé au poste) : fréquence d'émission relue par la station (28,365 MHz pour une réception sur 28,360), émission en split, réception inchangée ; split éteint pendant l'émission : coupure par la station (split_changed). Attention : « S 1 VFOB » de Hamlib 4.7.2 ÉCHANGE les VFO sur ce poste (la fréquence de réception change) : la station n'écrit jamais le split.", note_en = "Split set by the operator (SPLIT key, VFO B set at the rig): transmit frequency read back by the station (28.365 MHz for receive on 28.360), split transmission, receive unchanged; split switched off while transmitting: cut by the station (split_changed). Caution: Hamlib 4.7.2 « S 1 VFOB » SWAPS the VFOs on this rig (the receive frequency changes): the station never writes the split." }
rit = { etat = "valide", note = "Le RIT et le ΔTX partagent le même décalage.", note_en = "RIT and ΔTX share the same offset." }
xit = { etat = "valide" }
vfo = { etat = "non_declare", cause = "hamlib", note = "« Can get VFO: N » : voyant VFO A / B absent.", note_en = "« Can get VFO: N »: no VFO A / B indicator." }
# --- Modes et filtres
modes_base = { etat = "valide" }
modes_donnees = { etat = "valide", note = "PKTUSB, PKTLSB, FM-D et AM-D (pas PKTFM / PKTAM avec Hamlib 4.7).", note_en = "PKTUSB, PKTLSB, FM-D and AM-D (not PKTFM / PKTAM with Hamlib 4.7)." }
filtres = { etat = "valide", note = "Préréglages FIL1, FIL2 et FIL3 choisis et relus par le second port CI-V (commande 26 00), comme depuis la page et l'application ; filtre d'origine remis. Les largeurs des préréglages ne sont jamais écrites (une largeur envoyée par Hamlib les réécrirait).", note_en = "FIL1, FIL2 and FIL3 presets selected and read back through the second CI-V port (command 26 00), as from the page and the app; original filter restored. Preset widths are never written (a width sent through Hamlib would rewrite them)." }
# --- Réception
preampli = { etat = "valide", note = "Valeurs 1 et 2 = P.AMP1 et P.AMP2 (pas des dB).", note_en = "Values 1 and 2 = P.AMP1 and P.AMP2 (not dB)." }
attenuateur = { etat = "valide", note = "20 dB.", note_en = "20 dB." }
agc = { etat = "valide" }
nr = { etat = "valide" }
nr_niveau = { etat = "valide" }
nb = { etat = "valide" }
nb_niveau = { etat = "partiel", note = "Lu ; écriture refusée par le poste (RPRT -9), en USB aussi, NB en marche (deux qualifications).", note_en = "Read; write refused by the rig (RPRT -9), in USB too, with NB on (two qualifications)." }
anf = { etat = "valide" }
notch_manuel = { etat = "valide", note = "Fréquence du notch sans plage déclarée : non réglable à distance.", note_en = "Notch frequency without a declared range: not adjustable remotely." }
squelch = { etat = "valide" }
# --- Émission
puissance = { etat = "valide" }
compresseur = { etat = "valide" }
tuner = { etat = "valide", note = "Accord automatique à la prise d'émission PAR LA CAT (PTT Start) vu sur antenne réelle désaccordée, bande des 40 m : coupleur relu 2 (accord en cours) et puissance réduite d'un tiers pendant 0,6 s, puis 1 (accordé), TOS 1,0. Réglages du poste requis : MENU > SET > Function > Tuner : [TUNER] Switch = Auto (état mémorisé PAR BANDE), PTT Start = ON. Accord au PTT non garanti hors des bandes radioamateur (comportement du poste, aussi au micro) : une fréquence nouvelle hors bandes peut rester sans accord.", note_en = "Automatic tuning when transmitting OVER CAT (PTT Start) seen on a real mistuned antenna, 40 m band: tuner read 2 (tuning) and power reduced by a third for 0.6 s, then 1 (tuned), SWR 1.0. Required rig settings: MENU > SET > Function > Tuner: [TUNER] Switch = Auto (state stored PER BAND), PTT Start = ON. Tuning on PTT not guaranteed outside amateur bands (rig behaviour, also with the microphone): a new frequency outside the bands may stay untuned." }
vox = { etat = "valide", note = "Phonie seulement (manuel avancé p. 2-5 : « SSB, AM, and FM modes ») : sans son aucune émission, à la voix au micro émission puis retour en réception. NON déclenchable par l'USB (inactif en mode données, et le son USB ne module qu'en mode données). Attention : coupé en mode données, il RESTE en marche en phonie. La station ne le propose jamais à distance et le COUPE à chaque connexion d'opérateur (depuis 0.208.0).", note_en = "Voice modes only (advanced manual p. 2-5: « SSB, AM, and FM modes »): no transmission without audio, voice into the microphone keys then releases. NOT triggerable over USB (inactive in data modes, and USB audio only modulates in data modes). Caution: switched off in a data mode, it STAYS on in voice modes. The station never offers it remotely and switches it OFF at every operator connection (since 0.208.0)." }
# --- Mesures
s_metre = { etat = "valide", note = "Valeurs hors de la plage déclarée par Hamlib (ex. -54 pour 0..60) : table de calibration.", note_en = "Values outside the range declared by Hamlib (e.g. -54 for 0..60): calibration table." }
puissance_mesuree = { etat = "valide", note = "Monte environ 0,3 s après la prise d'émission.", note_en = "Rises about 0.3 s after keying." }
ros = { etat = "valide", note = "1,0 sur charge fictive, 2,7 sur une antenne désaccordée (coupleur à l'arrêt), 1,0 après accord : la mesure suit vraiment l'antenne.", note_en = "1.0 on a dummy load, 2.7 on a mistuned antenna (tuner off), 1.0 after tuning: the reading really follows the antenna." }
alc = { etat = "valide", note = "Monte avec la modulation (0,59 à -12 dBFS en mode données) ; ≈ 0,14 SANS modulation : jamais une preuve de modulation à lui seul (la puissance l'est).", note_en = "Rises with modulation (0.59 at -12 dBFS in data mode); ≈ 0.14 WITHOUT modulation: never a proof of modulation on its own (power is)." }
tension = { etat = "valide", note = "14,4 V lus (hors de la plage déclarée 0..1).", note_en = "14.4 V read (outside the declared 0..1 range)." }
temperature = { etat = "non_declare", cause = "hamlib", note = "TEMP_METER absent : seuils de température du poste sans effet.", note_en = "No TEMP_METER: rig temperature thresholds have no effect." }
# --- Audio USB
audio_rx = { etat = "valide", note = "Sur antenne : -28,5 dBFS sur 7,061 MHz (S9). Carte « USB Audio Device » (C-Media) derrière le hub USB interne du poste ; sous Windows, son nom (« 2- … ») change avec la prise USB.", note_en = "On antenna: -28.5 dBFS on 7.061 MHz (S9). « USB Audio Device » card (C-Media) behind the rig's internal USB hub; on Windows its name (« 2- … ») changes with the USB port." }
audio_tx = { etat = "partiel", note = "En mode données seulement (PKTUSB, DATA MOD = USB). Niveau d'envoi conseillé ≈ -18 dBFS pour USB MOD Level 30 % (ALC 0,59 à -12 dBFS). Windows : volume de la sortie à 100, améliorations désactivées.", note_en = "Data modes only (PKTUSB, DATA MOD = USB). Advised send level ≈ -18 dBFS for USB MOD Level 30 % (ALC 0.59 at -12 dBFS). Windows: output volume 100, enhancements off." }
# --- Spectre
spectre_hf = { etat = "valide", note = "Par le second port CI-V (port B) : 32 balayages en 8 s à la qualification ; figé pendant l'émission (normal).", note_en = "Through the second CI-V port (port B): 32 sweeps in 8 s at the qualification; frozen while transmitting (normal)." }

[hamlib]
non_exploite = ["AGC_TIME", "ANTIVOX", "BKINDL", "CWPITCH", "FBKIN", "ID_METER", "KEYSPD", "LOCK", "MICGAIN", "MON",
                "MONITOR_GAIN", "NOTCHF_RAW", "OVF_STATUS", "PBT_IN", "PBT_OUT", "RAWSTR", "RF", "RFPOWER_METER_WATTS",
                "SBKIN", "SCOPE", "SEND_MORSE", "SEND_VOICE_MEM", "SPECTRUM", "TONE", "TRANSCEIVE", "TSQL", "USB_AF", "VOX",
                "VOXDELAY", "VOXGAIN"]
constats = ["La lecture « p KEYERTYPE » fait planter rigctl / rigctld 4.7.2 sous Windows (signalé à Hamlib) ; la station ne la fait jamais.",
            "ANN déclaré mais refusé (RPRT -1)."]
constats_en = ["Reading « p KEYERTYPE » crashes rigctl / rigctld 4.7.2 on Windows (reported to Hamlib); the station never does it.",
               "ANN declared but refused (RPRT -1)."]
