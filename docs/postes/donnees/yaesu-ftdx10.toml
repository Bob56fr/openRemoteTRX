# Fiche publique du poste : source des tableaux https://bob56fr.github.io/openRemoteTRX/postes/
# (scripts/build_rigs_doc.py). Chaque état vient d'un essai réel (rapports de qualification gardés par le qualifieur).
# États : valide, partiel (note obligatoire), echec (note obligatoire), non_teste, non_declare (Hamlib ne le propose pas).
# Préparation et menus du poste : docs/postes/yaesu-ftdx10-ftdx101.md.

[poste]
fabricant = "Yaesu"
modele = "FTDX10"
hamlib_model = 1042
statut = "validation_en_cours"
resume = "Premier essai le 2026-11-16 : liaison CAT, exploration sans émission et essai du poste en réception seule. JAMAIS ESSAYÉ EN ÉMISSION : toute la sécurité d'émission reste à qualifier (valise, charge fictive)."
resume_en = "First test on 2026-11-16: CAT link, exploration without transmitting and rig test in receive only. NEVER TRIED TRANSMITTING: all transmit safety remains to be qualified (kit, dummy load)."

[[essais]]
date = "2026-11-16"
station = "0.153.0"
hamlib = "4.7.2"
systeme = "Windows"
quoi = "Liaison CAT (port CP2105 « Enhanced », 38400 bauds), exploration sans émission (trx-qualif --explorer), essai du poste en réception seule"
quoi_en = "CAT link (CP2105 « Enhanced » port, 38400 baud), exploration without transmitting (trx-qualif --explorer), rig test in receive only"

[fonctions]
# --- Sécurité d'émission : rien d'essayé (aucune émission)
ptt_relu = { etat = "non_teste", note = "PTT lu en 40 ms ; jamais commandé. dump_caps annonce « PTT type: None » mais le PTT par CAT est déclaré.", note_en = "PTT read in 40 ms; never keyed. dump_caps reports « PTT type: None » but CAT PTT is declared." }
tot = { etat = "non_teste" }
battements = { etat = "non_teste" }
deconnexion = { etat = "non_teste" }
perte_cat = { etat = "non_teste" }
hors_bande = { etat = "non_teste" }
operateur_local = { etat = "non_teste" }
demarrage = { etat = "non_teste" }
# --- Fréquence
frequence = { etat = "valide", note = "Écrite et relue par l'exploration (bords de la couverture, fréquence d'origine remise) ; couverture plus large que déclarée (29 kHz à 61 MHz acceptés).", note_en = "Written and read back by the exploration (coverage edges, original frequency restored); wider coverage than declared (29 kHz to 61 MHz accepted)." }
split = { etat = "non_teste" }
rit = { etat = "non_teste", note = "Lu en 40 ms ; écriture pas encore essayée.", note_en = "Read in 40 ms; write not tried yet." }
xit = { etat = "non_teste", note = "Lu en 40 ms ; écriture pas encore essayée.", note_en = "Read in 40 ms; write not tried yet." }
vfo = { etat = "non_teste", note = "Déclaré lisible par Hamlib (VFOA, VFOB, MEM) : voyant VFO à essayer.", note_en = "Declared readable by Hamlib (VFOA, VFOB, MEM): VFO indicator to be tried." }
# --- Modes et filtres
modes_base = { etat = "non_teste", note = "Mode lu ; jamais changé par l'exploration.", note_en = "Mode read; never changed by the exploration." }
modes_donnees = { etat = "non_teste" }
filtres = { etat = "non_teste" }
# --- Réception
preampli = { etat = "non_teste", note = "Déclaré : AMP1 et AMP2 (10 et 20 dB).", note_en = "Declared: AMP1 and AMP2 (10 and 20 dB)." }
attenuateur = { etat = "non_teste", note = "Déclaré : 6, 12, 18 dB.", note_en = "Declared: 6, 12, 18 dB." }
agc = { etat = "non_teste" }
nr = { etat = "non_teste", note = "Lu en 40 ms.", note_en = "Read in 40 ms." }
nr_niveau = { etat = "non_teste" }
nb = { etat = "non_teste", note = "Lu en 40 ms.", note_en = "Read in 40 ms." }
nb_niveau = { etat = "non_teste" }
anf = { etat = "non_teste", note = "Lu en 40 ms.", note_en = "Read in 40 ms." }
notch_manuel = { etat = "non_teste", note = "Lu en 40 ms.", note_en = "Read in 40 ms." }
squelch = { etat = "non_teste" }
# --- Émission
puissance = { etat = "non_teste" }
compresseur = { etat = "partiel", note = "Fonction illisible : « PR; » refusé par le poste (« ?; »), 2,45 s puis RPRT -9 ; la station abandonne cette lecture pour ce poste (ORT-2025). Niveau écrit et relu, mais 0 refusé (RPRT -14) alors que déclaré.", note_en = "Function unreadable: « PR; » refused by the rig (« ?; »), 2.45 s then RPRT -9; the station drops this read for this rig (ORT-2025). Level written and read back, but 0 refused (RPRT -14) although declared." }
tuner = { etat = "non_teste", note = "Lu en 40 ms ; jamais mis en marche automatiquement.", note_en = "Read in 40 ms; never switched on automatically." }
vox = { etat = "non_teste" }
# --- Mesures
s_metre = { etat = "valide", note = "Lu en 40 ms ; valeurs hors de la plage déclarée (ex. -48) : table de calibration.", note_en = "Read in 40 ms; values outside the declared range (e.g. -48): calibration table." }
puissance_mesuree = { etat = "non_teste" }
ros = { etat = "non_teste" }
alc = { etat = "non_teste", note = "Échelle de l'ALC Yaesu pas encore relevée.", note_en = "Yaesu ALC scale not measured yet." }
tension = { etat = "valide", note = "13,4 V lus (hors de la plage déclarée).", note_en = "13.4 V read (outside the declared range)." }
temperature = { etat = "non_declare" }
# --- Audio USB
audio_rx = { etat = "valide", note = "Essai du poste en réception seule (carte « USB Audio CODEC » du poste).", note_en = "Rig test in receive only (rig « USB Audio CODEC » card)." }
audio_tx = { etat = "non_teste", note = "Menus à régler : MOD SOURCE = REAR, REAR SELECT = USB, RPORT GAIN.", note_en = "Menus to set: MOD SOURCE = REAR, REAR SELECT = USB, RPORT GAIN." }
# --- Spectre
spectre_hf = { etat = "non_declare", note = "Aucune donnée du scope par la CAT Yaesu (la commande SS ne règle que l'affichage) : spectre audio seulement.", note_en = "No scope data over Yaesu CAT (the SS command only sets the display): audio spectrum only." }

[hamlib]
constats = ["« u COMP » : 2,45 s puis refus (le poste répond « ?; », Hamlib réessaie comme si le poste était occupé ; signalé à Hamlib).",
            "« L COMP 0 » refusé alors que la plage déclarée est 0..1.",
            "get Tuning Step déclaré mais refusé ; BAND_SELECT refusé ; BKINDL non relu."]
constats_en = ["« u COMP »: 2.45 s then refused (the rig answers « ?; », Hamlib retries as if the rig were busy; reported to Hamlib).",
               "« L COMP 0 » refused although the declared range is 0..1.",
               "get Tuning Step declared but refused; BAND_SELECT refused; BKINDL not read back."]
