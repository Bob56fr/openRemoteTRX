# Postes potentiellement compatibles : interface USB INTÉGRÉE pour la CAT ET le son (un seul câble USB : port série
# virtuel pour la CAT + carte son USB du poste). Liste établie d'après la documentation des fabricants, PAS d'après
# des essais : « potentiellement compatible » ne veut pas dire « validé » (fiches validées : docs/postes/donnees/).
# Page publique : section « Postes à USB intégré » de https://bob56fr.github.io/openRemoteTRX/postes/
# Après tout changement : python scripts/build_rigs_doc.py (tests/test_rigs_doc.py le vérifie).
#
# Champs : fabricant, modele, hamlib_model (numéro de `rigctl -l`), hamlib_etat (état du pilote dans Hamlib 4.7.2 :
# Stable, Beta, Alpha, Untested), fiche (nom d'une fiche de docs/postes/donnees/ si le poste a été essayé),
# a_confirmer (true = USB audio intégré non vérifié dans la documentation du fabricant), remarque / remarque_en.

hamlib_version = "4.7.2"

