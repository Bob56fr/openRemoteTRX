# Contenu du mode d'emploi d'openRemoteTRX Console (page publiée sur GitHub Pages, affichée dans le site rf-diy.com), en
# FRANÇAIS : la référence. Mêmes sections, dans le même ordre, dans contenu.en.toml, contenu.de.toml, contenu.es.toml.
# Fabriqué par : python scripts/build_console_doc.py  (résultat dans docs/site/console/).
# La LISTE des menus (thèmes, numéros, libellés) vient du code (trxstation/console.py, catalogues trxstation/i18n/) ;
# ici, seulement les explications. Chaque menu de la console doit avoir sa section [menus.<nom de la méthode>] dans
# CHAQUE langue : sinon la fabrication et les tests échouent.
# Ces textes servent AUSSI à l'aide de la touche « h » de la console (trxstation/console_help.json, fabriqué par le même script).
# Texte en HTML simple (p, ul, li, code, strong, em, a). Aucun script, aucune image ni ressource externe.
# Exemples génériques uniquement : jamais d'adresse IP, de nom de machine, de port réel ni de clé.

[page]
titre = "openRemoteTRX Console : mode d'emploi"
intro = """
<p><strong>openRemoteTRX Console</strong> est le tableau de commande de la station, sur le PC (Debian ou Windows) ou le
Raspberry Pi relié au poste. Elle sert à installer et configurer la station, la démarrer, l'essayer, la mettre à jour
et la dépanner. Le pilotage du poste (fréquence, mode, émission) se fait ailleurs : dans la page web de la station ou
l'application Android.</p>
<p><strong>L'ouvrir</strong> : sous Debian, « openRemoteTRX Console » dans le menu des applications ; sous Windows, le raccourci
« openRemoteTRX » du menu Démarrer ; partout, <code>trx-console</code> tapé dans un terminal.</p>
<p><strong>Trois présentations, les mêmes menus</strong> :</p>
<ul>
<li><strong>Écran plein</strong> (par défaut, dans le terminal) : les thèmes à gauche avec leur pictogramme, l'aide du
menu choisi à droite, l'état de la station en tête. Flèches et Entrée, ou les chiffres ; <code>+</code> déplie tous les
thèmes, <code>-</code> les replie ; <code>r</code> ou Échap revient aux thèmes ; F5 actualise ; la souris marche aussi
(survol = aide, double-clic = ouvrir). Fonctionne en SSH et sous Windows.</li>
<li><strong>Console texte</strong> : <code>trx-console --texte</code>, menus numérotés au clavier, pour un terminal
simple.</li>
<li><strong>Dans le navigateur</strong> : une fois openRemoteTRX Console mise sur le réseau (menu 4.6), depuis n'importe quel PC,
tablette ou téléphone du réseau local ou du VPN, à l'adresse <code>https://&lt;station&gt;:8444/</code>, avec un compte
opérateur administrateur. Les thèmes deviennent des tuiles et les menus des formulaires (boutons, champs, oui / non) ;
le tableau de bord et <code>station.toml</code> s'affichent dans la page. Sur la station elle-même :
<code>trx-console --web</code>, ou la touche <code>w</code> de l'écran plein.</li>
</ul>
<p><strong>Les numéros</strong> : les menus sont rangés en 8 thèmes. Tape le numéro du thème puis celui du menu, ou
directement les deux : <code>4.1</code> pour appairer un téléphone. <code>0</code> choisit la <strong>langue</strong>
(français, English, Deutsch, Español) et le <strong>niveau d'affichage</strong> : Basic (mettre en service, utiliser,
demander de l'aide ; par défaut), Normal (tous les réglages courants), Expert (en plus, réglages fins et outils de
développement). Le niveau cache des menus pour simplifier, sans rien interdire : un numéro tapé ouvre toujours son
menu.</p>
<p><strong>Un doute sur un menu ?</strong> Tape <code>h</code> puis son numéro (<code>h 4.1</code>) : la console
affiche, sans rien lancer, à quoi sert ce menu, quand s'en servir et ce qu'il modifie (les textes de cette page).
Dans le navigateur, l'aide s'affiche au survol d'un menu.</p>
<p><strong>La console ne fait jamais émettre le poste d'elle-même.</strong> Seuls deux essais peuvent le faire passer
en émission, sur charge fictive et après avoir tapé <code>EMETTRE</code> à chaque étape : l'essai complet du poste
(menu 2.2, choix 2) et la qualification complète d'un poste (menu 8.3, choix 5). Une fois démarrée, la station
n'émet que sur commande d'un opérateur, depuis la page web ou l'application.</p>
"""
lecture = """
<p><strong>Premier déploiement ?</strong> Suis le parcours ci-dessous dans l'ordre. <strong>Station déjà en
service ?</strong> Va directement au thème qui t'intéresse dans le sommaire. <strong>Tu aides à déboguer ?</strong>
Voir la partie « Dépannage avancé ».</p>
"""

[ui]   # textes de la page elle-même
lang_name = "Français"
langs = "Langue :"
version = "openRemoteTRX version {version}"
nav_first = "Premier déploiement"
nav_menus = "Les menus"
nav_expert = "Dépannage avancé"
h_first = "Premier déploiement, pas à pas"
h_menus = "Les menus de la console"
menus_intro = """
<p>Chaque thème commence par une courte présentation, puis ses menus : touche un menu pour lire à quoi il sert, quand
s'en servir et ce qu'il modifie. <span class="sudo">Mot de passe de session demandé</span> : le menu change la
configuration de la station et demande ton mot de passe (sudo), une seule fois par session dans le navigateur. Les
réponses aux questions (oui, non, OUI, EMETTRE…) ne tiennent compte ni des majuscules ni des accents ; <code>q</code>
quitte la console.</p>
"""
dt_role = "À quoi il sert"
dt_when = "Quand"
dt_changes = "Ce qu'il modifie"
dt_rights = "Droits"
