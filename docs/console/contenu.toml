# ------------------------------------------------------------------ parcours du débutant

[[parcours]]
titre = "Installer le logiciel"
texte = """
<p>Sur un PC Debian 12 ou 13 avec bureau : décompresse le paquet <code>trx-remote-debian-X.Y.Z.zip</code> dans
Téléchargements, ouvre un terminal dans le dossier obtenu et tape :</p>
<pre>sudo bash install.sh</pre>
<p>Ton mot de passe de session est demandé (rien ne s'affiche pendant la frappe : c'est normal). À la fin,
<strong>déconnecte-toi puis reconnecte-toi</strong> pour que les droits soient pris en compte.</p>
<p>Tu viens d'une station Windows ? Pose son fichier <code>station.toml</code> à côté de <code>install.sh</code>
avant de lancer l'installation : comptes, bandes et alertes seront repris.</p>
<p>Sur un PC Windows 10 ou 11 : décompresse <code>trx-remote-windows-X.Y.Z.zip</code> et double-clique sur
<code>installer.cmd</code>. Le raccourci « openRemoteTRX » du menu Démarrer ouvre ensuite openRemoteTRX Console.</p>
"""

[[parcours]]
titre = "Configurer la station (menu 2.1)"
texte = """
<p>Au premier lancement, openRemoteTRX Console propose l'assistant. Il demande, dans l'ordre : le modèle du poste (liste
Hamlib), le port série du CAT, la méthode de PTT, les cartes son (réception et émission), les bandes autorisées
à l'émission, l'accès réseau et le premier compte (identifiant et mot de passe pour la page web).</p>
<p>Le poste est interrogé <strong>en lecture seule</strong> pendant l'assistant : aucune émission. Rien n'est
enregistré si tu abandonnes en cours de route. Plus tard, une seule partie se refait sans tout reprendre (menus 2.5 à
2.9, 3.2, 3.3, 4.5).</p>
"""

[[parcours]]
titre = "Vérifier (menu 6.1)"
texte = """
<p>Le diagnostic passe tout en revue sans rien modifier. Chaque ligne est <strong>OK</strong>, à
<strong>surveiller</strong> ou en <strong>échec</strong>, avec la marche à suivre. Corrige les échecs avant
d'aller plus loin (menu 8.1 pour retoucher la configuration, ou relance l'assistant).</p>
"""

[[parcours]]
titre = "Essayer le poste (menu 2.2)"
texte = """
<p>Avant tout, la carte son du poste ne doit <strong>pas</strong> être le son par défaut du PC : sous Debian,
<em>Paramètres &gt; Son</em>, choisis en sortie les haut-parleurs du PC et en entrée son micro (sous Windows,
<em>Paramètres &gt; Système &gt; Son</em>). Sinon le bureau occupe la carte et ses sons partent vers le poste.</p>
<p>Commence par l'essai <strong>en réception seule</strong> (choix 1) : liaison CAT, son reçu, changement de
fréquence et de mode, largeurs de filtre, spectre. Ensuite seulement, l'essai <strong>complet</strong> (choix 2)
vérifie l'émission : <strong>charge fictive obligatoire</strong>, puissance réduite, confirmation demandée à
chaque étape. La station est arrêtée pendant l'essai.</p>
<p>L'essai réussi, enregistre la configuration de ce poste sous un nom (menu 2.3) : tu pourras la recharger d'un
coup si tu changes de poste.</p>
"""

[[parcours]]
titre = "Démarrer (menu 1.1) et se connecter"
texte = """
<p>Le menu 1.1 démarre la station ; refais un diagnostic (menu 6.1) quelques secondes plus tard. Sur le téléphone
ou un autre PC du même réseau, ouvre <code>https://&lt;adresse-de-la-station&gt;:8443</code> et connecte-toi avec
le compte créé par l'assistant. Pour ne plus voir l'avertissement du navigateur, installe l'autorité de la station
sur chaque appareil (menu 4.4). Pour l'application Android, scanne le QR code du menu 4.1. Pour l'accès depuis
l'extérieur, voir la documentation « Accès distant » du projet.</p>
<p>Dernière étape conseillée : les alertes sur le téléphone (menu 3.5, avec une alerte d'essai).</p>
"""

# ------------------------------------------------------------------ présentation des thèmes
# [themes.<id du thème>] (id de MENU_THEMES dans trxstation/console.py) : texte = présentation, debut = par où commencer.

[themes.station]
texte = """
<p>Le quotidien de la station : la <strong>démarrer</strong>, l'<strong>arrêter</strong>, la <strong>regarder
vivre</strong> (tableau de bord) et la <strong>sortir du mode sûr</strong>. La station démarre seule avec le PC ; ces
menus servent après un changement de réglage, avant de brancher ou débrancher le poste, ou quand la page web ne répond
plus. Le poste est toujours remis en réception au démarrage comme à l'arrêt.</p>
"""
debut = """
<p>Le 1.1 après la configuration, le 1.3 pour surveiller une émission ; le 1.4 seulement après avoir compris pourquoi
la station est passée en mode sûr (menus 6.1 et 6.2).</p>
"""

[themes.hardware]
texte = """
<p>Tout ce qui relie la station au poste : modèle et liaison CAT, méthode de PTT, cartes son, spectre HF, récepteur
SDR, allumage à distance et niveau du son reçu. L'<strong>assistant complet</strong> (2.1) pose toutes les questions
de la mise en service ; les menus 2.5 à 2.9 en reprennent chacun <strong>une seule partie</strong> (Entrée garde le
réglage actuel) pour corriger un point sans tout refaire. L'<strong>essai du poste</strong> (2.2) vérifie le résultat,
d'abord en réception seule. Pendant ces menus, la station est arrêtée : le port série et les cartes son doivent être
libres.</p>
"""
debut = """
<p>Premier déploiement : 2.1, puis 2.2 (réception seule, puis émission sur charge fictive), puis 2.3 pour enregistrer
le poste. Ensuite, le menu de la seule partie qui a changé (autre câble : 2.5 ; autre carte son : 2.6).</p>
"""

[themes.safety]
texte = """
<p>Les garde-fous de l'émission à distance : les <strong>bandes</strong> où la station accepte d'émettre (liste vide =
réception seule), la <strong>puissance</strong> et la <strong>durée maximale</strong> d'une émission (TOT), ce qui se
passe quand quelqu'un émet <strong>au micro du poste</strong>, les seuils de <strong>température</strong> et les
<strong>alertes</strong> sur ton téléphone. Ces réglages ne se changent que sur la station, jamais depuis le téléphone.
Le superviseur veille en plus, de son côté : au-delà du TOT absolu, il remet le poste en réception.</p>
"""
debut = """
<p>À la mise en service : 3.2 (bandes de ta licence), 3.3 (puissance et TOT), 3.5 (alertes, avec une alerte d'essai).
Le 3.4 si quelqu'un se sert aussi du poste sur place.</p>
"""

[themes.access]
texte = """
<p>Qui peut se connecter, d'où et comment : <strong>appairage</strong> de l'application Android (QR code),
<strong>comptes opérateurs</strong> (un par appareil), <strong>visiteurs</strong> en réception seule,
<strong>certificat</strong> HTTPS de la station, <strong>réseau</strong> sur lequel elle écoute (cette machine, réseau
local ou VPN) et <strong>openRemoteTRX Console sur le réseau</strong>. Les comptes sont relus sans redémarrer : un compte
désactivé est déconnecté aussitôt. Aucun VPN n'est imposé, mais la station ne s'ouvre jamais sans HTTPS ni mot de
passe.</p>
"""
debut = """
<p>4.5 pour ouvrir la station au réseau local, 4.3 pour créer un compte par appareil, 4.4 pour installer l'autorité de
la station sur chaque appareil, 4.1 pour appairer l'application.</p>
"""

[themes.features]
texte = """
<p>Les fonctions facultatives, <strong>hors service</strong> tant que tu ne les mets pas en marche : Cluster DX (spots
sur le spectre), Breizh Audio Box (traitement de la voix), présence de groupe (amis), mesure de TOS, diffusion en
direct pour des auditeurs. Le menu 5.5 met chacune en service ou l'arrête d'un numéro (ainsi que FreeDV, SELCALL, le
SDR, le monitoring et la sonde réseau) ; les autres menus les règlent. Aucune ne fait émettre la station sans une
action d'un opérateur depuis la page ou l'application.</p>
"""
debut = """
<p>Le 5.5 pour voir ce qui est en service, puis le menu de la fonction voulue. Une fonction qui demande d'autres
réglages indique le menu où les faire.</p>
"""

[themes.troubleshooting]
texte = """
<p>Quand quelque chose ne va pas. Le <strong>diagnostic</strong> (6.1) passe tout en revue sans rien modifier et dit
quoi faire pour chaque ligne en échec. Le <strong>journal</strong> (6.2) explique une coupure, la <strong>qualité du
réseau</strong> (6.4) une liaison qui coupe. Le <strong>rapport de dépannage</strong> (6.3) est un zip sans aucun mot
de passe, à joindre à une demande d'aide. Le <strong>monitoring entre stations</strong> (6.5) permet à un ami de suivre
ta station et de t'aider à distance, sans VPN ni port ouvert.</p>
"""
debut = """
<p>Toujours le 6.1 d'abord. Pour demander de l'aide : le 6.3 ; si quelqu'un peut t'aider en direct, le 6.5.</p>
"""

[themes.updates]
texte = """
<p>Les nouvelles versions sont <strong>signées</strong> : la station vérifie la signature avant d'installer. Une
nouvelle version est annoncée en tête de la console (menu 7.1 marqué) ; tu peux lire les notes de chaque version
sautée avant d'installer. L'ancienne version est gardée : le 7.2 y revient sans Internet. Le 7.3 installe un paquet
zip déposé à la main (station sans Internet, version d'essai). Une mise à jour est refusée pendant une émission ;
configuration et certificats sont conservés. Sous Windows, la mise à jour se fait en lançant
<code>installer.cmd</code> du nouveau paquet : le menu 7.1 le rappelle.</p>
"""
debut = """
<p>Le 7.1 quand le cadre « NOUVELLE VERSION » apparaît ; le 7.2 si la nouvelle version pose problème.</p>
"""

[themes.expert]
texte = """
<p>Pour aller plus loin : modifier directement <code>station.toml</code> (8.1, sur une copie vérifiée : un réglage
faux n'est jamais enregistré), lancer les tests automatiques du logiciel (8.2), qualifier un poste jamais essayé
(8.3) et afficher l'état de la station dans la barre du bureau (8.4). La plupart de ces menus sont cachés au niveau
Basic.</p>
"""
debut = """
<p>Le 8.4 une fois après l'installation, pour garder un œil sur la station. Les autres sur demande, ou pour aider au
débogage.</p>
"""

# ------------------------------------------------------------------ référence des menus
# Champs : role (à quoi il sert), quand (quand l'utiliser), modifie (ce qu'il change), admin (mot de passe
# demandé : sudo), expert (facultatif : détails pour le dépannage).

[menus.diagnostic]
role = "Contrôle complet de la station, en lecture seule : système, logiciels, configuration, matériel (ports série, cartes son), services, spectre HF, Cluster DX, accès réseau et mises à jour. En fin de bilan, trois lignes « Modes de la station » : Breizh Audio Box (activé ou non, état de la liaison), écoute des visiteurs (ouverte ou fermée, nombre maximal) et comptes visiteurs (pseudo, désactivé, expiré), sans aucun secret."
quand = "Après l'installation, après chaque changement, et en premier réflexe dès que quelque chose ne va pas."
modifie = "Rien. Aucune commande au poste, aucune émission."
admin = false
expert = "<p>Même résultat sans le menu : <code>trx-console --diagnostic</code> (code de sortie différent de 0 en cas d'échec, utilisable dans un script).</p>"

[menus.assistant]
role = "Assistant de configuration : poste, ports, PTT, cartes son, bandes autorisées, accès réseau, comptes. Écrit <code>station.toml</code>."
quand = "Au premier déploiement, ou pour tout reprendre (changement de poste, d'interface audio, de PC)."
modifie = "<code>station.toml</code> (seulement si tu vas au bout). La station est arrêtée pendant l'assistant puis redémarrée à la demande."
admin = true
expert = "<p>Le poste n'est interrogé qu'en lecture. Une configuration importée d'une ancienne station (<code>station.import.toml</code>) sert de point de départ.</p><p>À l'ajout d'un poste, l'assistant demande si la <strong>rediffusion d'enregistrements</strong> est autorisée (application : enregistrer l'audio reçu puis le renvoyer en émission, durée limitée au temps maximal d'émission moins 5 s). Réponse par défaut : non. Rediffuser l'émission d'une station à des tiers est en général interdit au service amateur : n'accepter que si tu en as l'usage et sous ta responsabilité (<code>[safety] allow_replay</code>).</p>"

[menus.monitor]
role = "Tableau de bord en direct, dans le terminal : fréquence, mode, émission ou réception, clients connectés, services, matériel, audio, journal. Il s'ouvre dans un <strong>nouvel onglet</strong> ou une nouvelle fenêtre (Windows Terminal, GNOME Terminal, tmux, screen) : openRemoteTRX Console reste ouverte à côté ; en SSH sans tmux, il s'ouvre dans le même terminal."
quand = "Pour surveiller la station sur place, ou pendant un essai."
modifie = "Rien, sauf une touche : <strong>STOP TX</strong> force la réception. Le tableau de bord ne peut jamais faire émettre. Dans le navigateur, le même tableau de bord est dessiné par la page, avec le même bouton STOP TX."
admin = false

[menus.hwtest]
role = "Essai guidé du vrai poste. Choix 1 : réception seule (CAT, son reçu, accord, largeurs de filtre, écran du spectre). Choix 2 : la même chose puis l'émission."
quand = "Après l'assistant, après un changement de câble ou d'interface audio, ou pour qualifier un nouveau poste."
modifie = "Rien dans la configuration. Le choix 2 fait émettre le poste : charge fictive, puissance réduite, confirmation (taper <code>EMETTRE</code>) à chaque étape. La station est arrêtée pendant l'essai."
admin = true
expert = "<p>Le résumé final de l'essai s'affiche à l'écran : copie-le dans ta demande d'aide. Les réponses tapées ne tiennent compte ni des majuscules ni des accents (« emettre », « Émettre » et « EMETTRE » sont acceptés).</p>"

[menus.start]
role = "Démarre (ou redémarre) la station : rigctld, passerelle, superviseur."
quand = "Après la configuration, après une modification, ou si la page web ne répond plus."
modifie = "L'état des services. Le poste est toujours remis en réception au démarrage."
admin = true

[menus.stop]
role = "Arrête la station."
quand = "Avant de brancher ou débrancher le poste ou l'interface audio, ou pour utiliser un autre logiciel sur le poste."
modifie = "L'état des services. Le poste reste en réception."
admin = true

[menus.journal]
role = "Affiche les 80 dernières lignes du journal des services de la station."
quand = "Quand le diagnostic signale un service en échec, ou pour comprendre une coupure d'émission."
modifie = "Rien."
admin = true
expert = "<p>Journal complet : <code>journalctl -u trx-gateway -u trx-supervisor -u rigctld --since \"1 hour ago\"</code>. Sous Windows : dernières lignes des fichiers du dossier <code>logs</code> placé à côté de <code>station.toml</code>.</p>"

[menus.report]
role = "Crée un rapport de dépannage (fichier zip sur le Bureau) : diagnostic, journaux, configuration <strong>sans aucun mot de passe</strong>, versions, matériel détecté, rapports envoyés depuis la page, identifiant de la station."
quand = "Pour demander de l'aide : joins ce zip à ta demande."
modifie = "Rien (un fichier est créé sur le Bureau)."
admin = false
expert = "<p>Sans le menu : <code>trx-console --rapport</code>. Le fichier <code>station.toml</code> du rapport a ses secrets masqués ; vérifie quand même son contenu avant de l'envoyer si tu le souhaites. Le rapport joint aussi les traces des outils arrêtés sur une erreur inattendue (dossier <code>plantages</code>, code ORT-9312).</p>"

[menus.clear_safe_mode]
role = "Sort du <strong>mode sûr</strong>. Le superviseur y place la station après des pannes répétées : poste en réception, accès coupé."
quand = "Seulement après avoir trouvé et corrigé la cause (menus 6.1 et 6.2)."
modifie = "Efface le mode sûr mémorisé et redémarre la station."
admin = true
expert = "<p>Le mode sûr survit aux redémarrages et aux corrections : il faut le lever explicitement ici.</p>"

[menus.update]
role = "Mise à jour par Internet : présente la nouvelle version, propose de voir la nature des changements (notes de CHAQUE version publiée depuis la tienne, la plus récente d'abord, par pages : Entrée = suite, q = arrêter là), puis l'installe après vérification de sa signature. À jour : propose une nouvelle recherche immédiate sur GitHub."
quand = "Quand un cadre « NOUVELLE VERSION … DISPONIBLE » apparaît en haut de la console (jaune dans un terminal) et que le menu 7.1 est marqué « <== NOUVELLE VERSION ». La recherche a lieu 2 minutes après le démarrage de la station puis toutes les 24 h."
modifie = "Installe la nouvelle version à côté de l'ancienne (gardée pour le menu 7.2). <code>station.toml</code> et les certificats sont conservés. Refusé tant que le poste émet. Il faut taper le numéro de version pour confirmer. Sous Windows, le menu ne fait que l'annoncer : la mise à jour se fait en lançant <code>installer.cmd</code> du nouveau paquet."
admin = true

[menus.rollback]
role = "Revient à la version précédente, gardée lors de la dernière mise à jour, sans Internet."
quand = "Si la nouvelle version pose problème."
modifie = "La version active. La configuration est conservée."
admin = true

[menus.cluster]
role = "Réglages du Cluster DX : spots suivis, sources (RBN, serveurs telnet, web), filtres, essai des sources."
quand = "Pour afficher les spots sur le spectre et les pastilles des boutons de bande dans la page."
modifie = "La section Cluster de <code>station.toml</code> ; redémarrage proposé ensuite."
admin = true

[menus.install_zip]
role = "Installe une version à partir d'un fichier <code>trx-remote-debian-X.Y.Z.zip</code> déposé sur le Bureau, dans Téléchargements ou dans le dossier personnel."
quand = "Station sans Internet, version d'essai, ou retour à une version précise."
modifie = "Comme le menu 7.1 : nouvelle version à côté de l'ancienne, configuration conservée. Un paquet non signé demande de taper <code>OUI</code> puis le numéro de version."
admin = true
expert = "<p>Déposer le zip ne suffit pas : il faut l'installer ici. Compte-rendu : <code>/var/log/trx-remote-install.log</code>.</p>"

[menus.edit_config]
role = "Modifie <code>station.toml</code> sur une copie : dans l'éditeur nano au terminal (Bloc-notes sous Windows), dans un champ de la page dans le navigateur."
quand = "Pour un réglage précis sans relancer tout l'assistant."
modifie = "<code>station.toml</code>, seulement si la copie est valide : elle est vérifiée, les différences sont montrées, une confirmation est demandée et l'ancienne version est gardée à côté. Une configuration invalide n'est jamais écrite."
admin = true
expert = "<p>Dans nano : Ctrl+O puis Entrée pour enregistrer, Ctrl+X pour quitter. Les copies de sauvegarde s'appellent <code>station.toml.avant-modification-AAAAMMJJ-HHMMSS</code>.</p><p>Notice de TOUS les réglages (rôle, valeur par défaut, bornes, sécurité, menu qui les modifie) : <code>https://bob56fr.github.io/openRemoteTRX/station-toml/</code>, aussi sur le site rf-diy.com.</p>"

[menus.expert]
role = "Menu expert : lance toute la suite de tests automatiques du logiciel sur la station."
quand = "Pour aider au débogage, ou vérifier qu'une installation est saine."
modifie = "Rien. Les tests utilisent un poste <strong>simulé</strong> : aucune commande au vrai poste, aucune émission. La station est arrêtée pendant les tests (7 à 10 minutes sur un PC récent, 30 minutes ou plus sur un petit PC) puis relancée à la demande."
admin = true
expert = "<p>Le résultat est enregistré sur le Bureau (<code>trx-remote-tests-AAAAMMJJ-HHMM.txt</code>) : transmets ce fichier si des tests échouent. L'outil de test (pytest) est installé au premier usage (Internet nécessaire).</p><p>Les points s'affichent au fur et à mesure ; sans rien de nouveau pendant une minute, la console rappelle que les tests continuent. Un test vraiment bloqué 10 minutes affiche la pile de ses fils d'exécution : c'est ce qu'il faut transmettre (Ctrl+C arrête les tests).</p>"

[menus.qualif]
role = "Qualification d'un poste avec <code>trx-qualif</code>, pour un expert qui veut aller le plus loin possible avec un poste jamais essayé mais connu de Hamlib. Choix 1 : cahier de test et incohérences de Hamlib, sans toucher au poste. Choix 2 : exploration sans émission (tout ce que Hamlib déclare est lu et comparé aux réponses du poste). Choix 3 : la même chose en lecture seule. Choix 4 : qualification sans émission. Choix 5 : qualification complète. Choix 6 : valise de qualification sur place (relevés du poste avant / après, exploration, qualification, essais de sécurité chronométrés, rapport zip pour Claude)."
quand = "Avant d'utiliser un nouveau modèle de poste, ou pour préparer un rapport aux développeurs de Hamlib."
modifie = "Rien dans la configuration. Les choix 2 et 4 changent la fréquence et quelques réglages de réception du poste, puis les remettent ; le mode n'est jamais changé par l'exploration. Seul le choix 5 fait émettre (charge fictive, confirmation <code>EMETTRE</code> à chaque étape). La station est arrêtée pendant l'essai."
admin = true
expert = "<p>Rapports dans le dossier d'état de la station (<code>qualifications/</code>) : <code>exploration.json</code>, <code>constats.txt</code>, brouillons <code>fiche-poste.md</code> et <code>rapport-hamlib.md</code> (en anglais), trace de toutes les commandes (<code>cat_trace.log</code>). L'exploration n'envoie jamais de commande de PTT et s'arrête net si le poste passe en émission (micro du poste). Les largeurs de filtre ne sont essayées qu'avec <code>trx-qualif --filtres</code> : sur un Icom, chaque largeur envoyée est écrite dans un préréglage FIL1/2/3.</p>"

[menus.temperature]
role = "Seuils de température du poste : premier seuil (avertissement dans la page et notification), second seuil (émission à distance coupée et refusée jusqu'au retour sous le premier seuil). 40 et 50 °C par défaut."
quand = "Si ton poste chauffe en usage normal (modes numériques en continu, par exemple) ou pour plus de prudence."
modifie = "Les clés <code>rig_temp_warn_c</code> et <code>rig_temp_cut_c</code> de <code>station.toml</code>, par le même chemin vérifié que le menu 8.1."
admin = true
expert = "<p>Sans effet si le poste ne donne pas sa température par Hamlib (cas de l'IC-7300MK2). L'opérateur au micro du poste n'est jamais coupé pour ce motif.</p>"

[menus.indicator]
role = "Active ou désactive l'<strong>indicateur de la barre du haut</strong> (bureau GNOME) : un voyant à gauche du son (vert réception, rouge émission, orange alerte, gris station arrêtée, violet mode sûr), la fréquence ou le compte à rebours d'émission, et au clic l'état complet : émission, fréquence et filtre, clients web connectés, liaison avec le poste, opérateur sur place, dernière coupure, température, alimentation, spectre HF, Cluster DX, mise à jour disponible, version et identifiant. Sous Windows, ce menu lance l'<strong>indicateur près de l'horloge</strong> (mêmes couleurs, lecture seule) et choisit s'il démarre à chaque ouverture de session."
quand = "Une fois, après l'installation (puis une déconnexion et reconnexion), pour garder un œil sur la station en permanence."
modifie = "Seulement l'affichage de ton bureau. L'indicateur ne fait que LIRE l'état publié par la station : il ne peut rien commander."
admin = false
expert = "<p>Fichiers lus chaque seconde : <code>/run/trx-remote/gateway-status.json</code>, et dans <code>/var/lib/trx-remote/</code> : <code>safe_mode</code>, <code>cluster/status.json</code>, <code>update/latest.json</code>, <code>station-id</code>. Extension installée dans <code>/usr/share/gnome-shell/extensions/trx-distant@rf-diy.com</code>. Le menu de l'indicateur ouvre aussi la page web, openRemoteTRX Console et le tableau de bord.</p>"

[menus.profiles]
role = "Profils de poste, pour qui pilote plusieurs TRX tour à tour : <strong>enregistrer</strong> la configuration du poste en service sous un nom (« IC-7300 maison »), la <strong>recharger</strong> plus tard, ou supprimer un profil. Le profil en service est signalé dans la liste."
quand = "Après avoir configuré et essayé un poste (menus 2.1 et 2.2) : enregistre-le. Pour changer de poste : branche-le, charge son profil, la station redémarre avec lui."
modifie = "Charger un profil ne change que les réglages du POSTE dans <code>station.toml</code> (modèle, ports, PTT, cartes son, spectre), par le même chemin vérifié que le menu 8.1 (différences montrées, confirmation, ancienne version gardée). Comptes, réseau, bandes autorisées et sécurités ne bougent jamais. Refusé pendant une émission."
admin = true
expert = "<p>Fichiers : <code>/etc/trx-remote/profils/&lt;nom&gt;.toml</code>. Chaque profil porte un numéro de format. Un profil d'une ancienne version est converti au chargement quand c'est possible (une clé manquante prend sa valeur par défaut) ; sinon, ou s'il vient d'une version plus récente, il est refusé avec la marche à suivre : refaire la configuration de ce poste (menu 2.1) puis l'enregistrer de nouveau. Le fichier d'origine n'est jamais modifié au chargement.</p>"

[menus.pairing]
role = "Affiche ce qu'il faut pour <strong>appairer l'application Android</strong> avec cette station : l'adresse à saisir, les comptes autorisés, l'<strong>empreinte du certificat</strong> (SHA-256, sur deux lignes), puis un <strong>QR code</strong> à scanner avec l'application (« Scanner le QR code de la station ») : il remplit l'adresse, l'identifiant et l'empreinte. S'il y a plusieurs adresses ou plusieurs comptes, la console demande lesquels mettre dans le QR code (Entrée = choix proposé). Ni le QR code ni l'écran ne contiennent de mot de passe : la station ne les connaît pas en clair, il se saisit dans l'application."
quand = "Au moment d'ajouter la station dans l'application Android, et après avoir refait le certificat (menu 4.4)."
modifie = "Rien : lecture seule."
admin = false
expert = "<p>Même affichage en ligne de commande : <code>trx-setup --output /etc/trx-remote/station.toml --empreinte</code>. Si le certificat n'est lisible que par la station, la console le relit avec les droits d'administration. Station limitée à cette machine (boucle locale) : aucun téléphone ne peut s'y connecter, la console le dit. Derrière un proxy HTTPS, l'empreinte à épingler est celle du certificat du proxy (pas de QR code). Le QR code est dessiné pour un terminal à fond sombre ; l'application lit aussi un terminal clair. S'il n'apparaît pas (paquet « segno » absent), réinstaller la station (menu 7.3) ou saisir l'empreinte à la main.</p>"

[menus.swr_report]
role = "Affiche la <strong>dernière mesure de TOS</strong> de l'antenne rangée sur la station : date, puissance, mode, plage, et le TOS de chaque point avec une petite barre (« ÉLEVÉ » au-dessus de 2), le meilleur point et les réglages du poste qui n'auraient pas été remis. <strong>Lecture seule</strong> : la console ne lance jamais de mesure (un outil ne peut que couper une émission) ; la mesure se lance depuis la page ou l'application."
quand = "Pour retrouver une mesure faite à distance, la comparer avec une nouvelle, ou vérifier qu'un réglage du poste a bien été remis après une mesure interrompue."
modifie = "Rien."
admin = false
expert = "<p>Fichier lu : <code>swr.json</code> dans le dossier d'état de la station (derniers choix de chaque compte, temps de lecture du TOS étalonné par modèle de poste, dernière mesure). Réglages de la station : section <code>[swr]</code> de <code>station.toml</code> (menu 8.1 : <code>enabled</code>, plafond de puissance <code>max_power_pct</code>, <code>max_points</code>, <code>point_tx_max_s</code>). Détail : <code>docs/tos-cahier-des-charges.md</code>.</p>"

[menus.visitors]
role = "Gère les <strong>visiteurs en réception seule</strong> : des comptes qui écoutent la station et voient l'écran de l'opérateur, sans <strong>aucune</strong> commande vers le poste (ni fréquence, ni mode, ni émission, ni STOP). On y règle le <strong>nombre maximal</strong> de visiteurs (0 = écoute fermée sur la station ; sinon, c'est l'opérateur qui ouvre ou ferme l'écoute depuis sa page ou l'application, commutateur « Écoute des visiteurs », fermé par défaut), le commutateur <strong>« opérateur requis »</strong> (visiteurs admis seulement si un opérateur est connecté, et déconnectés après une attente réglable, 60 s par défaut, s'il perd la liaison), l'écoute <strong>hors des bandes</strong> de la station (coupée par défaut : silence) et la cadence du spectre HF des visiteurs (5 images par seconde par défaut). On y crée, modifie (pseudo, mot de passe, activé, date de fin) et supprime les comptes visiteurs, on <strong>déconnecte</strong> un visiteur connecté, et on <strong>rouvre l'écoute</strong> suspendue par une surcharge."
quand = "Avant une démonstration en radio-club, une formation ou l'écoute partagée d'un QSO ; pour retirer l'accès à un visiteur (désactiver ou supprimer son compte)."
modifie = "Les comptes et la section <code>[access]</code> de <code>station.toml</code>, par le même chemin vérifié que le menu 8.1 (différences montrées, confirmation, ancienne version gardée ; le fichier est réécrit dans sa forme standard). La station les relit d'elle-même en quelques secondes, <strong>sans redémarrer</strong> : un compte désactivé, expiré ou supprimé est déconnecté aussitôt. « Déconnecter » ne touche pas à <code>station.toml</code>."
admin = true
expert = "<p>Les autres connectés ne voient jamais l'identifiant d'un compte, seulement son <strong>pseudo</strong> (plusieurs comptes peuvent porter le même) ; seul un opérateur voit identifiants et adresses. Pendant une émission, les visiteurs entendent la voix de l'opérateur (ce qui part vers le poste) ; le code SELCALL ne leur est jamais montré. Un visiteur ne peut envoyer que deux commandes (relire l'état, afficher ou non le spectre HF) : tout le reste est refusé par la station, et au-delà de 20 refus en une minute sa connexion est fermée avec une alerte. Les visiteurs ont leur propre quota : ils ne prennent jamais la place d'un opérateur. Si la station souffre (processeur à 85 °C, chargé à 90 %, passerelle en retard de plus de 100 ms ou mémoire presque pleine, pendant 10 s), les visiteurs sont déconnectés avec la cause précise ; l'écoute se rouvre d'elle-même après 5 minutes nettement en dessous, ou à la main (choix 6) après 3 coupures en une heure. Seuils : <code>[access] overload_*</code> (menu 8.1). Retransmettre ce que l'on reçoit à des tiers engage la responsabilité de l'opérateur : voir le guide d'accès distant. Détail : <code>docs/visiteurs-cahier-des-charges.md</code>.</p>"

[menus.operators]
role = "Gère les <strong>comptes opérateurs</strong>, ceux qui commandent le poste et émettent. La règle : <strong>un compte par appareil</strong> (PC, téléphone, tablette), nommé d'après l'appareil (<code>PC</code>, <code>S25</code>…). Un même compte ouvert sur un second appareil ferme la connexion du premier, et coupe son émission. On y <strong>ajoute</strong> un compte (mot de passe saisi ou généré, puis QR code d'appairage de ce compte pour l'application Android), on <strong>change un mot de passe</strong>, on <strong>désactive ou réactive</strong> un compte, on choisit son <strong>pseudo</strong> (montré aux autres connectés) et on le <strong>supprime</strong>. Les comptes connectés sont signalés."
quand = "À l'arrivée d'un nouvel appareil (téléphone, tablette, second PC) ; après la perte ou le vol d'un téléphone (désactiver son compte) ; pour changer un mot de passe."
modifie = "Les comptes <code>[[clients]]</code> de <code>station.toml</code>, par le même chemin vérifié que le menu 8.1 (différences montrées, confirmation, ancienne version gardée ; le fichier est réécrit dans sa forme standard). La station les relit d'elle-même en quelques secondes, <strong>sans redémarrer</strong> : la connexion d'un compte désactivé, supprimé ou dont le mot de passe a changé est fermée aussitôt (son émission est coupée)."
admin = true
expert = "<p>Le <strong>dernier compte opérateur actif</strong> ne peut être ni désactivé ni supprimé : la station ne serait plus pilotable. Le mot de passe n'est jamais enregistré en clair (empreinte scrypt seulement) : un mot de passe oublié se <strong>remplace</strong>. Un compte par appareil permet aussi de savoir qui émet (la station refuse l'émission aux autres pendant ce temps) et de retirer un seul appareil. Même chose en ligne de commande : <code>trx-setup --output /etc/trx-remote/station.toml --add-client NOM</code> ou <code>--set-password NOM</code>. Les comptes <strong>visiteurs</strong> (réception seule) sont au menu 4.2.</p>"

[menus.sdr]
role = "Prépare le <strong>récepteur SDR</strong> de la station (réception seule, à côté du TRX). On y <strong>recherche les SDR</strong> branchés sur tous les ports USB, hubs compris (SDRplay, clés RTL-SDR), <strong>sans en ouvrir aucun</strong> : type, numéro de série, emplacement (port, hub) et état (libre, pris par un programme, pris par le pilote TV du noyau, SDR de cette station). On <strong>choisit le SDR de la station par son numéro de série</strong> (jamais par son port), puis la <strong>largeur</strong> (2, 6 ou 8 MHz), l'<strong>antenne</strong> (A ou B), les <strong>plafonds</strong> de processeur et de mémoire du module, et on le <strong>met en service</strong>. Une clé RTL-SDR dont le numéro d'usine est en double peut recevoir un <strong>nouveau numéro de série</strong> (une seule clé branchée, mémoire de la clé sauvegardée avant, puis la débrancher et la rebrancher)."
quand = "À l'arrivée d'un SDR ; quand un SDR change de port ou qu'un second SDR est branché (vérifier que la station garde le bon) ; si le SDR consomme trop sur un petit PC (largeur, plafonds)."
modifie = "La section <code>[sdr]</code> de <code>station.toml</code> (et « sdr » dans <code>[modules] run</code> à la mise en service), par le même chemin vérifié que le menu 8.1 ; redémarrage de la station proposé. La recherche ne modifie rien et n'ouvre aucun SDR."
admin = true
expert = "<p>Un SDR <strong>pris</strong> (par exemple par un autre projet) ou dont le numéro de série est <strong>en double</strong> (fréquent sur les clés RTL-SDR d'usine) est refusé : la station se tromperait d'appareil. La recherche signale aussi un SDR branché sur le <strong>même hub que le poste</strong> (à éviter). Même chose en ligne de commande : <code>trx-sdr --list</code> (avec <code>sudo</code>, le nom du programme qui tient une clé RTL-SDR est affiché).</p>"

[menus.certificate]
role = "Montre le <strong>certificat HTTPS</strong> de la station (noms et adresses, échéance, origine) et le refait <strong>signé par l'autorité de la station</strong>. Une fois cette autorité installée sur un appareil (PC, téléphone), le navigateur n'affiche plus d'avertissement et peut <strong>retenir le mot de passe</strong> (Chrome refuse de l'enregistrer sur un certificat non reconnu). Le lien de téléchargement de l'autorité est affiché ; la page le propose aussi."
quand = "Une fois, pour ne plus voir l'avertissement du navigateur et retrouver le mot de passe enregistré ; pour ajouter un nom ou une adresse (VPN, nom local) au certificat."
modifie = "Les fichiers du dossier <code>tls</code> de la station (autorité créée au besoin, certificat de la passerelle refait) et <code>[network] tls_cert</code> / <code>tls_key</code> si besoin. L'empreinte change : l'<strong>application Android doit être appairée de nouveau</strong> (menu 4.1). La station doit redémarrer pour l'utiliser (proposé)."
admin = true
expert = "<p>L'autorité est <strong>limitée par des contraintes de nom</strong> aux adresses privées (réseau local, VPN) et aux noms de la station : même volée, sa clé ne permettrait pas d'usurper un autre site sur les appareils qui l'ont installée. Sa clé reste sur la station, lisible par l'administrateur seul. Elle est réutilisée tant que ses contraintes couvrent les noms demandés ; un nouveau nom DNS impose une nouvelle autorité, à réinstaller. Même chose en ligne de commande : <code>trx-setup --output /etc/trx-remote/station.toml --autorite-station [NOMS…]</code>.</p>"

[menus.rig]
role = "Change le <strong>poste</strong> et sa liaison : modèle Hamlib (avec les réglages conseillés d'un poste connu), port série du CAT, débit, méthode PTT, puis un <strong>test de liaison en lecture seule</strong> (aucune émission). La station est arrêtée pendant les questions : le port série doit être libre. Les mêmes questions que la partie correspondante de l'assistant complet (menu 2.1), et seulement elles : Entrée garde chaque réglage actuel, le reste de la configuration n'est pas touché. Relève aussi l'identité USB du port, vérifiée avant chaque allumage à distance (menu 2.8)."
quand = "Nouveau poste, port série changé (autre câble, autre prise USB), débit modifié dans les menus du poste, test de liaison en échec."
modifie = "La configuration de la station (<code>station.toml</code>), avec les droits d'administration ; l'ancienne version est gardée (<code>station.toml.bak</code>). Rien n'est écrit si tu abandonnes. La station est redémarrée sur ta demande pour prendre le changement."
admin = true

[menus.sound]
role = "Choisit les <strong>cartes son</strong> : celle qui reçoit le son du poste et celle qui envoie la voix vers le poste. La station est arrêtée pendant les questions : une carte occupée n'apparaît pas dans la liste. Les mêmes questions que la partie correspondante de l'assistant complet (menu 2.1), et seulement elles : Entrée garde chaque réglage actuel, le reste de la configuration n'est pas touché."
quand = "Pas de son reçu, voix qui ne part pas, carte son changée ou rebranchée sur une autre prise."
modifie = "La configuration de la station (<code>station.toml</code>), avec les droits d'administration ; l'ancienne version est gardée (<code>station.toml.bak</code>). Rien n'est écrit si tu abandonnes. La station est redémarrée sur ta demande pour prendre le changement."
admin = true

[menus.hf_spectrum]
role = "Active ou coupe le <strong>spectre HF</strong> (waterfall du poste) par le second port série d'un Icom réglé en CI-V. Le port est vérifié station arrêtée ; il faut confirmer en tapant OUI que les réglages USB SEND / USB Keying du poste sont faits, car un second port mal réglé peut mettre le poste en émission. Les mêmes questions que la partie correspondante de l'assistant complet (menu 2.1), et seulement elles : Entrée garde chaque réglage actuel, le reste de la configuration n'est pas touché."
quand = "Après avoir réglé le second port CI-V du poste, ou pour couper le spectre. Sans objet pour les postes qui ne sont pas des Icom."
modifie = "La configuration de la station (<code>station.toml</code>), avec les droits d'administration ; l'ancienne version est gardée (<code>station.toml.bak</code>). Rien n'est écrit si tu abandonnes. La station est redémarrée sur ta demande pour prendre le changement."
admin = true

[menus.remote_power]
role = "Met en service (ou hors service) l'<strong>allumage et l'extinction du poste à distance</strong> : un opérateur qui se connecte allume le poste s'il est éteint, et STOP maintenu 3 s dans la page ou l'application permet de l'éteindre (avec confirmation). <strong>Hors service par défaut.</strong> La mise en service est refusée si Hamlib ne déclare pas la fonction pour ton poste ; elle propose d'abord un essai (station arrêtée le temps de l'essai, poste éteint puis rallumé, aucune émission) et relève l'identité USB du port du poste, vérifiée avant chaque allumage. Options : extinction automatique après un délai sans aucune connexion, alertes ntfy à chaque allumage ou extinction."
quand = "Pour une station distante qu'il faut pouvoir rallumer sans aller au shack, avec un poste qui garde son USB alimenté une fois éteint (Yaesu FTDX10 par la prise USB). Refaire la mise en service après avoir changé le poste de prise USB."
modifie = "La configuration de la station (<code>station.toml</code> : section <code>[power]</code> et identité USB des ports dans <code>[rig]</code>), avec les droits d'administration ; l'ancienne version est gardée (<code>station.toml.bak</code>). Rien n'est écrit si tu abandonnes. La station est redémarrée sur ta demande pour prendre le changement."
admin = true

[menus.rx_gain]
role = "Règle le <strong>gain du son reçu</strong> envoyé par la station à tous les terminaux (téléphones, page, visiteurs, diffusion) et le <strong>limiteur du son reçu</strong> (crêtes plafonnées à -1 dBFS, en service par défaut). Le menu montre le niveau reçu en ce moment et propose un gain pour viser -20 dBFS. Avec le limiteur, un gain fort ne sature pas ; le couper ne sert qu'au diagnostic. Le volume propre à chaque téléphone se règle dans la page ou l'application."
quand = "Quand le son reçu est trop faible ou trop fort sur tous les terminaux, par exemple avec un poste dont la sortie USB n'est pas réglable (Yaesu FTDX10). Mesurer avec la station démarrée et du signal sur l'antenne."
modifie = "La configuration de la station (<code>station.toml</code> : <code>rx_gain_db</code> et <code>rx_limiter</code> de la section <code>[audio]</code>), avec les droits d'administration ; l'ancienne version est gardée (<code>station.toml.bak</code>). Rien n'est écrit si tu abandonnes. La station est redémarrée sur ta demande pour prendre le changement."
admin = true

[menus.bands]
role = "Décide qui empêche d'émettre hors de tes bandes : la station (liste des bandes autorisées, points de départ région 1 IARU à vérifier selon ta licence) ou le poste lui-même. <strong>Liste vide = réception seule.</strong> Les mêmes questions que la partie correspondante de l'assistant complet (menu 2.1), et seulement elles : Entrée garde chaque réglage actuel, le reste de la configuration n'est pas touché."
quand = "À la mise en service, après un changement de licence, ou si la station refuse une émission dans une bande permise."
modifie = "La configuration de la station (<code>station.toml</code>), avec les droits d'administration ; l'ancienne version est gardée (<code>station.toml.bak</code>). Rien n'est écrit si tu abandonnes. La station est redémarrée sur ta demande pour prendre le changement."
admin = true

[menus.transmit]
role = "Règle la <strong>puissance maximale</strong> du poste (la page l'affiche en watts) et la <strong>durée maximale d'une émission</strong> (TOT, 90 s par défaut, bip 10 s avant la coupure, plafond de la station). Le superviseur coupe de toute façon au-delà du TOT absolu. Les mêmes questions que la partie correspondante de l'assistant complet (menu 2.1), et seulement elles : Entrée garde chaque réglage actuel, le reste de la configuration n'est pas touché."
quand = "À la mise en service, ou pour raccourcir ou allonger la durée d'une émission."
modifie = "La configuration de la station (<code>station.toml</code>), avec les droits d'administration ; l'ancienne version est gardée (<code>station.toml.bak</code>). Rien n'est écrit si tu abandonnes. La station est redémarrée sur ta demande pour prendre le changement."
admin = true

[menus.access_network]
role = "Choisit d'où l'on se connecte à la station : cette machine seulement, ou le réseau local et le VPN en <strong>HTTPS</strong> avec un certificat signé par l'autorité de la station. Un nouveau certificat impose de refaire l'appairage de l'application (menu 4.1). Les mêmes questions que la partie correspondante de l'assistant complet (menu 2.1), et seulement elles : Entrée garde chaque réglage actuel, le reste de la configuration n'est pas touché."
quand = "À la mise en service, après un changement d'adresse du PC, ou pour ouvrir la station au téléphone."
modifie = "La configuration de la station (<code>station.toml</code>), avec les droits d'administration ; l'ancienne version est gardée (<code>station.toml.bak</code>). Rien n'est écrit si tu abandonnes. La station est redémarrée sur ta demande pour prendre le changement."
admin = true

[menus.remote_console]
role = "Met <strong>openRemoteTRX Console sur le réseau</strong> : les mêmes menus dans le navigateur de n'importe quel PC, tablette ou téléphone du réseau local ou du VPN, sans SSH ni raccourci, à l'adresse <code>https://&lt;station&gt;:8444/</code>. On s'y connecte avec un <strong>compte opérateur marqué administrateur</strong> (choisis ici) ; la session se ferme après 30 minutes sans action ; le mot de passe sudo de la station reste demandé une fois par session. 5 échecs bloquent l'adresse 15 minutes et chaque connexion envoie une alerte ntfy. Jamais joignable depuis Internet. Un administrateur connecté à la page de pilotage y trouve aussi le lien."
quand = "Pour administrer la station depuis un autre appareil, sans connaître SSH."
modifie = "La configuration de la station (<code>station.toml</code> : <code>[remote_console]</code> et la marque <code>admin</code> des comptes), avec les droits d'administration ; l'ancienne version est gardée. Sous Debian, le service <code>trx-console-web@compte</code> est mis en marche ou arrêté ; sous Windows, la station est redémarrée."
admin = true

[menus.local_operator]
role = "Règle ce que fait la station quand quelqu'un <strong>émet au micro du poste</strong>, devant lui. <strong>Station partagée</strong> (défaut) : cette émission n'est coupée que par le <strong>TOT absolu</strong> du superviseur (135 s par défaut), ou après la durée tolérée (300 s par défaut) quand la présence de l'opérateur est prouvée (il a touché le poste juste avant). Sinon, toute émission locale est coupée aussitôt. L'émission à distance reste bloquée pendant une émission locale puis 2 minutes."
quand = "À la mise en service, si un opérateur se sert du poste sur place, ou si la station passe en mode sûr après des émissions au micro du poste."
modifie = "La section <code>[supervisor]</code> de <code>station.toml</code> (<code>allow_local_tx</code>, <code>tot_abs_s</code>, <code>local_tx_max_s</code>), par le chemin vérifié du menu 8.1 ; la station redémarre sur ta demande."
admin = true

[menus.alerts]
role = "Règle les <strong>alertes sur le téléphone</strong> par ntfy : l'adresse (un sujet long et secret : qui le connaît lit les alertes ; l'écran ne la montre jamais en entier), la langue (français, anglais, allemand ou espagnol ; le journal reste en français), le message « Station en service » (toutes les N heures, sans sonnerie), et <strong>envoie une alerte d'essai</strong> (code ORT-8025) pour vérifier que tout arrive."
quand = "À la mise en service (guide, partie 6), après un changement de téléphone ou d'abonnement ntfy, ou quand aucune alerte n'arrive."
modifie = "La section <code>[supervisor]</code> de <code>station.toml</code> (<code>notify_url</code>, <code>notify_lang</code>, <code>alive_every_h</code>), par le chemin vérifié du menu 8.1 ; l'essai n'écrit rien."
admin = true

[menus.features_switch]
role = "Met en service ou arrête chaque <strong>fonction</strong> de la station d'un numéro : Cluster DX, FreeDV, activité FreeDV, SELCALL, présence de groupe, monitoring, SDR, Breizh Audio Box, sonde réseau, mesure de TOS, diffusion en direct. L'interrupteur règle à la fois la fonction et le lancement de son module. Une fonction qui demande d'autres réglages est refusée avec le menu où les faire."
quand = "Pour essayer ou retirer une fonction sans éditer <code>station.toml</code>."
modifie = "Les sections des fonctions (<code>enabled</code>) et <code>[modules] run</code> de <code>station.toml</code>, par le chemin vérifié du menu 8.1 ; la station redémarre sur ta demande."
admin = true

[menus.diffusion]
role = "Fait entendre le son du TRX à quelques <strong>auditeurs sur Internet</strong>, sans compte sur la station : ils écoutent sur la page d'un <strong>serveur de diffusion</strong> et ne joignent jamais la station. On y voit l'<strong>état</strong> (en direct ou non, canal, auditeurs, temps restant, qui l'a lancée), on <strong>lance</strong> une diffusion (canal <strong>privé</strong> par défaut, avec identifiant et mot de passe, ou public ; durée, 1 heure par défaut ; ta voix pendant tes émissions, <strong>non</strong> par défaut) et on l'<strong>arrête</strong>. On y lit ou on change le <strong>mot de passe des auditeurs</strong> (« En générer un » : ceux qui écoutent ne sont pas coupés), on règle le <strong>serveur</strong> (adresse, nom de la station, codec, <strong>diffusion hors des bandes autorisées</strong> : non par défaut, silence pour les auditeurs) et on enregistre ses <strong>secrets</strong> (mot de passe source et clé, jamais affichés). Un <strong>avertissement</strong> est à confirmer au tout premier lancement."
quand = "Pour faire écouter le poste à des amis ou à un club, le temps d'une soirée ou d'un concours ; à la mise en place, avec ce que t'a donné l'administrateur du serveur."
modifie = "<code>[diffusion]</code> de <code>station.toml</code> (serveur, station, codec, hors bandes) par le chemin vérifié du menu 8.1, et le fichier <code>diffusion.key</code> (0600, lisible seulement par le service). Rien ne touche au poste : le module « diffusion » n'a aucun droit sur lui ; ce qui est diffusé est de ta responsabilité."
admin = true

[menus.breizh]
role = "Relie la station à <strong>Breizh Audio Box</strong>, le traitement de la voix qui tourne sur un PC du même réseau local : la voix de l'opérateur passe par Breizh avant d'aller au poste. On y <strong>crée la clé d'appairage</strong> (montrée <strong>une seule fois</strong>, à recopier dans l'onglet « OpenRemoteTRX » des réglages de Breizh avec l'adresse de la station et le port), on règle l'<strong>adresse IP</strong> et le <strong>port UDP</strong> du PC de Breizh, on <strong>active ou désactive</strong> le passage par Breizh, on fait un <strong>essai de la liaison sans son</strong> et on lit le <strong>journal</strong> (connexions, replis, refus). L'état de la liaison en ce moment (prêt, émission par Breizh, repli, refus, aller-retour) s'affiche en tête."
quand = "À la mise en place de Breizh, après une réinstallation de Breizh (nouvelle clé), quand la page ou l'application signalent un repli, ou pour vérifier la liaison avant une émission."
modifie = "La clé : fichier <code>breizh.key</code> à côté de <code>station.toml</code> (jamais dedans), avec les droits de la configuration. L'adresse, le port et l'activation : section <code>[breizh]</code> de <code>station.toml</code>, par le même chemin vérifié que le menu 8.1 (différences montrées, confirmation, ancienne version gardée) ; la station les prend au <strong>redémarrage</strong> (proposé). L'essai et le journal ne modifient rien."
admin = true
expert = "<p><strong>Sécurité</strong> : Breizh ne peut jamais faire émettre la station ; elle garde le PTT, le TOT, la porte audio et son limiteur, et passe en direct à gain réduit (−6 dB par défaut) si Breizh ne répond plus pendant 100 ms, sans couper l'émission. Le mode OpenRemoteTRX de Breizh coupe son CAT. Le son du micro circule <strong>en clair</strong> sur le réseau local : seule une adresse IP <strong>privée</strong> est acceptée. Sur le PC de Breizh, le pare-feu doit laisser entrer l'UDP du port choisi (47100 par défaut). L'essai envoie un appel et cinq PING, jamais de son ; si la station est en marche avec Breizh activé, Breizh répond « occupé » (il sert déjà la passerelle) : c'est normal, l'état est en tête du menu. Réglages fins (délais, gain de repli, retour automatique) : <code>[breizh]</code>, menu 8.1 et la notice de <code>station.toml</code>. Détail : <code>docs/breizh-cahier-des-charges.md</code>.</p>"

[menus.network]
role = "Montre la <strong>qualité des liaisons</strong> entre la station et les téléphones ou navigateurs connectés : pour chacun, l'état (bonne, moyenne, faible, coupure), le type de réseau, la perte et le temps aller-retour ; l'état des <strong>sondes de la station</strong> vers la box et vers Internet ; la <strong>dernière coupure</strong> avec son tronçon probable ; et l'avertissement <strong>« profil VPN probablement partagé »</strong> quand deux appareils semblent utiliser le même profil VPN. On y lit la <strong>synthèse</strong> des 24 dernières heures ou des 30 derniers jours (coupures, durée, tronçons, heures les plus touchées, par réseau), on crée un <strong>export anonyme</strong> sur le Bureau pour l'équipe de développement, et on peut <strong>tout effacer</strong>."
quand = "Quand la liaison coupe souvent (en voiture, en 4G, à travers un VPN), pour savoir si c'est le téléphone, le réseau mobile, le tunnel, la box ou la station ; avant de demander de l'aide (export)."
modifie = "Rien, sauf « Tout effacer » (confirmation en tapant EFFACER) : l'historique réseau de la station (coupures, statistiques, appareils vus). Les seuils de l'indicateur choisis dans la page ou l'application sont gardés. L'export est un fichier zip sur le Bureau."
admin = true
expert = "<p>La station envoie un battement d'une seconde à chaque client connecté et en attend l'écho ; trois battements sans réponse font une coupure. Après chaque coupure, elle croise ses propres sondes (box, Internet, ping sinon TCP), les mesures remises par le client (dont l'accès à la station en HTTPS pendant la coupure) et la régularité des coupures pour dire quel tronçon a probablement lâché ; c'est une probabilité, jamais une certitude. Deux appareils sur le <strong>même profil VPN</strong> se volent la liaison toutes les 15 à 30 s : <strong>un profil par appareil</strong>. La sonde ne fait que mesurer : elle n'agit jamais sur l'émission. Fichiers : dossier <code>netprobe</code> du dossier d'état (journal de 7 jours, coupures et statistiques de 30 jours). Même synthèse en ligne de commande : <code>trx-netreport</code> (<code>--jours 30</code>, <code>--export FICHIER</code>). Réglages : section <code>[netprobe]</code> de <code>station.toml</code> (menu 8.1). « Tout effacer » demande <code>sudo</code> : les fichiers appartiennent au compte de la station. Détail : <code>docs/netprobe-cahier-des-charges.md</code>.</p>"

[menus.friends]
role = "Gère la <strong>présence de groupe</strong> : le <strong>pseudo</strong> de la station, les <strong>groupes d'amis</strong> (créer, inviter par un lien et un <strong>QR code</strong>, rejoindre avec une invitation reçue, quitter, supprimer), et ce que la station <strong>partage</strong> dans chaque groupe (fréquence et mode, « On Air » seulement, ou un court texte ; invisible). On y voit aussi qui, dans chaque groupe, est en QSO, en réception, au shack, absent ou hors ligne."
quand = "Pour mettre en place la présence avec des amis équipés d'openRemoteTRX, ou quand la page et l'application ne sont pas à portée de main."
modifie = "Les réglages de présence de la station, rangés à part dans le dossier d'état (pas dans station.toml) ; la création, l'invitation, l'adhésion et le départ passent par le relais de présence. Rien ne touche au poste : un QSY vers un ami se fait depuis la page ou l'application."
admin = true
expert = "<p>La console dépose sa demande pour le module « presence » (fichier <code>presence-request.json</code> du dossier d'état, par <code>sudo</code> s'il le faut) et lit sa réponse (<code>presence/console-reply.json</code>, effacée après une minute : elle peut contenir une invitation). La fonction s'active dans <code>station.toml</code> (menu 8.1) : <code>[presence] enabled = true</code> et « presence » dans <code>[modules] run</code>, puis redémarrer la station. Le relais ne voit que des états chiffrés : ni fréquence, ni mode, ni statut. Une invitation contient la clé du groupe : la transmettre seulement à la personne invitée ; elle ne sert qu'une fois et expire après 7 jours. Détail : <code>docs/presence-cahier-des-charges.md</code>.</p>"

[menus.monitoring]
role = "<strong>Aider un opérateur en difficulté</strong>, ou <strong>être aidé</strong>, sans VPN ni port ouvert. Celui qui aide crée un <strong>code de 10 caractères</strong> et le dicte ; l'opérateur aidé le tape ; les deux comparent <strong>6 chiffres</strong> de vive voix. L'opérateur aidé choisit ce qu'il envoie (essentiel, ou diagnostic avec l'état du poste ; fréquence et mode seulement s'il le veut). On y voit les dernières nouvelles et les derniers codes d'erreur de chaque station suivie, on demande ou on accepte le <strong>mode assistance</strong> (nouvelles toutes les 30 secondes, pour une durée choisie), on met en pause et on termine une liaison. Celui qui aide peut aussi demander le <strong>rapport de dépannage</strong> (celui du menu 6.3, entièrement masqué) ; l'opérateur aidé l'accepte ou l'envoie de lui-même (choix 10), et celui qui aide le copie sur son Bureau. Celui qui aide reçoit une <strong>alerte</strong> sur son téléphone (ntfy de sa station) quand une station suivie ne donne plus de nouvelles, quand elle revient, ou quand elle signale un événement critique."
quand = "Quand un opérateur a besoin d'aide pour sa station, ou quand tu en demandes : au téléphone avec la personne qui aide, menu ouvert des deux côtés."
modifie = "Les liaisons, le pseudo et ce qui est envoyé, rangés à part dans le dossier d'état (pas dans station.toml) ; tout passe chiffré par le relais. Rien ne touche au poste : la station qui aide ne peut que lire et DEMANDER, jamais commander ; l'opérateur aidé peut tout arrêter à tout moment."
admin = true
expert = "<p>La console dépose sa demande pour le module « monlink » (fichier <code>monlink-request.json</code> du dossier d'état, par <code>sudo</code> s'il le faut) et lit sa réponse (<code>monlink/console-reply.json</code>, effacée après une minute). La fonction s'active dans <code>station.toml</code> (menu 8.1) : <code>[monitor_link] enabled = true</code> et « monlink » dans <code>[modules] run</code>, puis redémarrer la station. Tout ce qui part est masqué (mots de passe, adresses, numéros de série, nom de la machine). Le code sert une fois et expire après 15 minutes ; des chiffres différents = liaison refusée. Détail : <code>docs/cdc-monitoring.md</code> § 17.</p>"

# ------------------------------------------------------------------ dépannage avancé

[[expert]]
titre = "En-tête de la console"
texte = """
<p>La première ligne donne la <strong>version installée</strong>, la deuxième l'état (en marche, arrêtée, pas
encore configurée). Une fois la station configurée viennent l'<strong>adresse</strong> où la joindre depuis la
page web ou l'application (adresses IP de la machine et port ; « cette machine seulement » si elle n'écoute qu'en
local), puis l'<strong>état du poste</strong> : tension d'alimentation et température, telles que la station les
lit (« — » : valeur que le poste ne fournit pas ; l'IC-7300MK2, par exemple, ne donne pas sa température ;
« mesures indisponibles » : station arrêtée). La dernière ligne donne l'<strong>identifiant de la station</strong> :
un code unique créé au premier démarrage, qui permet de rapprocher plusieurs rapports d'une même station. Il n'est
envoyé nulle part automatiquement.</p>
"""

[[expert]]
titre = "Fichiers utiles"
texte = """
<ul>
<li><code>/etc/trx-remote/station.toml</code> : configuration (modifier par le menu 8.1).</li>
<li><code>/var/lib/trx-remote/</code> : état de la station (mode sûr, mémoires, rapports de la page, identifiant <code>station-id</code>, Cluster DX).</li>
<li><code>/run/trx-remote/gateway-status.json</code> : état en direct publié par la passerelle (lu par le tableau de bord).</li>
<li><code>/opt/trx-remote/releases/</code> : versions installées côte à côte ; <code>/opt/trx-remote/current</code> pointe sur la version active.</li>
<li><code>/var/log/trx-remote-install.log</code> : compte-rendu des installations et mises à jour.</li>
</ul>
<p>Sous Windows :</p>
<ul>
<li><code>C:\\ProgramData\\trx-remote\\station.toml</code> : configuration (modifier par le menu 8.1), avec à côté le dossier <code>logs</code> (journaux) et l'état de la station.</li>
<li><code>%LOCALAPPDATA%\\Programs\\TRX distant</code> : versions installées.</li>
</ul>
"""

[[expert]]
titre = "Relevés sur le poste (lecture seule)"
texte = """
<p>Pour un poste Icom avec un second port CI-V (spectre), un relevé brut des réglages, sans aucune écriture,
aide à établir le format réel des réponses. Station arrêtée (menu 1.2), puis :</p>
<pre>/opt/trx-remote/current/venv/bin/python -m trxstation.devtools.civ_scope --port /dev/serial/by-id/&lt;port-B&gt; --reglages</pre>
<p>Le résultat est enregistré dans un dossier <code>spectre-reglages-…</code> : joins-le à ta demande.</p>
"""

[[expert]]
titre = "Transmettre un problème"
texte = """
<ol>
<li>Dans la page web : section « Signaler un problème » (texte relu avant l'envoi).</li>
<li>Sur la station : menu 6.3 (rapport de dépannage), et si besoin le résultat du menu 8.2.</li>
<li>Décris ce que tu faisais, ce que tu attendais et ce qui s'est passé, avec l'heure approximative.</li>
</ol>
"""
