# Contenido del manual de openRemoteTRX Console (página publicada en GitHub Pages, mostrada en el sitio rf-diy.com), en
# ESPAÑOL. La referencia es contenu.toml (francés): mismas secciones, en el mismo orden.
# Generado por: python scripts/build_console_doc.py  (resultado en docs/site/console/).
# La LISTA de menús (temas, números, etiquetas) viene del código (trxstation/console.py, catálogos trxstation/i18n/);
# aquí, solo las explicaciones. Cada menú de la consola debe tener su sección [menus.<nombre del método>] en
# CADA idioma: si no, la generación y las pruebas fallan.
# Estos textos sirven TAMBIÉN para la ayuda de la tecla « h » de la consola (trxstation/console_help.json, generado por el mismo script).
# Texto en HTML simple (p, ul, li, code, strong, em, a). Ningún script, ninguna imagen ni recurso externo.
# Solo ejemplos genéricos: nunca direcciones IP, nombres de equipo, puertos reales ni claves.

[page]
titre = "openRemoteTRX Console: manual de uso"
intro = """
<p><strong>openRemoteTRX Console</strong> es el panel de mando de la estación openRemoteTRX, en el PC (o la Raspberry Pi)
conectado al transceptor. Sirve para instalar y configurar la estación, arrancarla, probarla, actualizarla y
resolver sus problemas. Se abre desde el menú de aplicaciones (« openRemoteTRX Console ») o escribiendo <code>trx-console</code>
en un terminal.</p>
<p>Los menús están ordenados por tema (Estación, Transceptor y hardware, Seguridad de emisión y alertas, Acceso y cuentas, Funciones, Diagnóstico y asistencia,
Actualizaciones, Experto y preferencias; números cambiados en 0.166.0): escribe el número del tema y luego el del menú, o directamente los dos, por ejemplo <code>4.1</code>
para emparejar un teléfono. <code>0</code> cambia el idioma de la consola (français, English, Deutsch, Español) y el <strong>nivel de visualización</strong>: Básico (puesta en servicio, uso, pedir ayuda), Normal (todos los ajustes habituales), Experto (además, ajustes finos y herramientas de desarrollo). El nivel oculta menús para simplificar, sin prohibir nada: un número tecleado siempre abre su menú. Básico por defecto; en el navegador, idioma y nivel se cambian con un clic en la parte superior de la página.</p>
<p><strong>Pantalla completa</strong> (desde la versión 0.170.0): a la izquierda, los temas con su pictograma; flechas para elegir, Intro para desplegar un tema o abrir un menú; o las cifras, como en la consola de texto (una cifra abre un tema, luego una cifra abre su menú; 0 = idioma; r o Esc vuelve a los temas; + despliega todos los temas, - los pliega todos; F5 actualiza; con el ratón, pasar sobre un menú muestra su ayuda, un clic lo elige, un segundo clic o un doble clic lo abre); a la derecha, la ayuda del menú elegido; arriba, el estado de la estación. El menú abierto se desarrolla como en la consola de texto y luego vuelve la pantalla. Funciona por SSH y en Windows. <code>trx-console --texte</code> conserva la consola de texto (menús numerados con el teclado, descrita abajo); <code>TRX_CONSOLE_SANS_ICONES=1</code> quita los pictogramas.</p>
<p><strong>En el navegador</strong> (desde la versión 0.175.0): tecla <code>w</code> de la pantalla completa, o <code>trx-console --web</code>. Los mismos menús en mosaicos, la ayuda al pasar el ratón, y el menú elegido se desarrolla en un terminal integrado en la página. La página solo escucha en la propia estación y se abre con una dirección de un solo uso; desde otro PC, por un túnel SSH (guía del operador, parte 7.5).</p>
<p><strong>¿Dudas sobre un menú?</strong> Escribe <code>h</code> y su número (por ejemplo <code>h 4.1</code>):
la consola muestra, sin ejecutar nada, para qué sirve ese menú, cuándo usarlo y qué modifica (los textos de esta página).</p>
<p>Nunca transmite por sí misma: los únicos menús que pueden poner el transceptor en transmisión son la prueba
completa (menú 2.2, con confirmación en cada paso) y, por supuesto, la estación una vez arrancada, manejada desde la página web.</p>
"""
lecture = """
<p><strong>¿Primera instalación?</strong> Sigue el recorrido de abajo en orden. <strong>¿Estación ya en
servicio?</strong> Ve directamente a la referencia de los menús. <strong>¿Ayudas a depurar?</strong> Consulta la parte
« Solución de problemas avanzada ».</p>
"""

[ui]   # textos de la propia página
lang_name = "Español"
langs = "Idioma:"
version = "openRemoteTRX versión {version}"
nav_first = "Primera instalación"
nav_menus = "Los menús"
nav_expert = "Solución de problemas avanzada"
h_first = "Primera instalación, paso a paso"
h_menus = "Los menús de la consola"
menus_intro = """
<p>El menú principal muestra los temas: escribe el número de un tema y luego el de uno de sus menús, o directamente
los dos (<code>7.3</code>); <code>r</code> vuelve al menú principal, <code>0</code> cambia el idioma, <code>q</code>
sale. Los antiguos números 10 a 24 (un solo nivel, hasta la versión 0.125.0) se siguen aceptando durante un tiempo: la
consola indica el nuevo. Las respuestas a las preguntas (sí, no, OUI, EMETTRE...) no distinguen mayúsculas
ni acentos. <span class="sudo">Contraseña</span>: el menú pide tu contraseña de sesión (sudo).</p>
"""
dt_role = "Para qué sirve"
dt_when = "Cuándo"
dt_changes = "Qué modifica"
dt_rights = "Derechos"
rights_yes = "se pide la contraseña de sesión"
rights_no = "no"
more = "Para saber más"
