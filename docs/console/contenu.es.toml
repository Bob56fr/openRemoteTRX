texte = """
<p>La primera línea da la <strong>versión instalada</strong>, la segunda el estado (en marcha, detenida, aún no
configurada). Una vez configurada la estación aparecen la <strong>dirección</strong> para llegar a ella desde la
página web o la aplicación (direcciones IP del equipo y puerto; « solo este equipo » si solo escucha en
local) y luego el <strong>estado del transceptor</strong>: tensión de alimentación y temperatura, tal como la estación las
lee (« — »: valor que el transceptor no proporciona; el IC-7300MK2, por ejemplo, no da su temperatura;
« medidas no disponibles »: estación detenida). La última línea da el <strong>identificador de la estación</strong>:
un código único creado en el primer arranque, que permite relacionar varios informes de una misma estación. No se
envía a ningún sitio automáticamente.</p>
"""

[[expert]]
titre = "Archivos útiles (Debian)"
texte = """
<ul>
<li><code>/etc/trx-remote/station.toml</code>: configuración (modificar con el menú 3.2).</li>
<li><code>/var/lib/trx-remote/</code>: estado de la estación (modo seguro, memorias, informes de la página, identificador <code>station-id</code>, DX Cluster).</li>
<li><code>/run/trx-remote/gateway-status.json</code>: estado en directo publicado por la pasarela (leído por el panel).</li>
<li><code>/opt/trx-remote/releases/</code>: versiones instaladas una junto a otra; <code>/opt/trx-remote/current</code> apunta a la versión activa.</li>
<li><code>/var/log/trx-remote-install.log</code>: informe de las instalaciones y actualizaciones.</li>
</ul>
"""

