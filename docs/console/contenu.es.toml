# ------------------------------------------------------------------ recorrido del principiante

[[parcours]]
titre = "Instalar el software"
texte = """
<p>En un PC Debian 12 o 13 con escritorio: descomprime el paquete <code>trx-remote-debian-X.Y.Z.zip</code> en
Descargas, abre un terminal en la carpeta obtenida y escribe:</p>
<pre>sudo bash install.sh</pre>
<p>Se pide tu contraseña de sesión (no se muestra nada mientras escribes: es normal). Al final,
<strong>cierra la sesión y vuelve a iniciarla</strong> para que se apliquen los derechos.</p>
<p>¿Vienes de una estación Windows? Coloca su archivo <code>station.toml</code> junto a <code>install.sh</code>
antes de lanzar la instalación: se recuperarán las cuentas, las bandas y las alertas.</p>
"""

[[parcours]]
titre = "Configurar la estación (menú 2.1)"
texte = """
<p>En el primer arranque, openRemoteTRX Console propone el asistente. Pide, por orden: el modelo del transceptor (lista
Hamlib), el puerto serie del CAT, el método de PTT, las tarjetas de sonido (recepción y transmisión), las bandas
autorizadas para transmitir, el acceso a la red y la primera cuenta (usuario y contraseña para la página web).</p>
<p>El transceptor se consulta <strong>en solo lectura</strong> durante el asistente: ninguna transmisión. No se
guarda nada si abandonas a medio camino.</p>
"""

[[parcours]]
titre = "Comprobar (menú 6.1)"
texte = """
<p>El diagnóstico lo revisa todo sin modificar nada. Cada línea es <strong>OK</strong>, a
<strong>vigilar</strong> o un <strong>fallo</strong>, con los pasos a seguir. Corrige los fallos antes de
continuar (menú 8.1 para retocar la configuración, o vuelve a lanzar el asistente).</p>
"""

[[parcours]]
titre = "Probar el transceptor (menú 2.2)"
texte = """
<p>Antes de nada, la tarjeta de sonido del transceptor <strong>no</strong> debe ser el sonido por defecto del PC: en Debian,
<em>Configuración &gt; Sonido</em>, elige como salida los altavoces del PC y como entrada su micrófono (en Windows,
<em>Configuración &gt; Sistema &gt; Sonido</em>). Si no, el escritorio ocupa la tarjeta y sus sonidos van al transceptor.</p>
<p>Empieza por la prueba <strong>solo en recepción</strong> (opción 1): enlace CAT, sonido recibido, cambio de
frecuencia y de modo, anchos de filtro, espectro. Solo después, la prueba <strong>completa</strong> (opción 2)
comprueba la transmisión: <strong>carga artificial obligatoria</strong>, potencia reducida, confirmación pedida en
cada paso. La estación se detiene durante la prueba.</p>
"""

[[parcours]]
titre = "Arrancar (menú 1.1) y conectarse"
texte = """
<p>El menú 1.1 arranca la estación; repite un diagnóstico (menú 6.1) unos segundos después. En el teléfono
o en otro PC de la misma red, abre <code>https://&lt;adresse-de-la-station&gt;:8443</code> y conéctate con
la cuenta creada por el asistente. Para el acceso desde el exterior, consulta la documentación « Acceso remoto » del proyecto.</p>
"""

# ------------------------------------------------------------------ referencia de los menús
# Campos: role (para qué sirve), quand (cuándo usarlo), modifie (qué cambia), admin (se pide
# contraseña: sudo), expert (opcional: detalles para la solución de problemas).

[menus.diagnostic]
role = "Control completo de la estación, en solo lectura: sistema, software, configuración, hardware (puertos serie, tarjetas de sonido), servicios, espectro HF, DX Cluster, acceso a la red y actualizaciones. Al final del balance, tres líneas « Modos de la estación »: Breizh Audio Box (activado o no, estado del enlace), escucha de los visitantes (abierta o cerrada, número máximo) y cuentas de visitantes (seudónimo, desactivada, caducada), sin ningún secreto."
quand = "Después de la instalación, después de cada cambio y como primer reflejo en cuanto algo va mal."
modifie = "Nada. Ninguna orden al transceptor, ninguna transmisión."
admin = false
expert = "<p>El mismo resultado sin el menú: <code>trx-console --diagnostic</code> (código de salida distinto de 0 en caso de fallo, utilizable en un script).</p>"

[menus.assistant]
role = "Asistente de configuración: transceptor, puertos, PTT, tarjetas de sonido, bandas autorizadas, acceso a la red, cuentas. Escribe <code>station.toml</code>."
quand = "En la primera instalación, o para rehacerlo todo (cambio de transceptor, de interfaz de audio, de PC)."
modifie = "<code>station.toml</code> (solo si llegas hasta el final). La estación se detiene durante el asistente y luego se reinicia si lo pides."
admin = true
expert = "<p>El transceptor solo se consulta en lectura. Una configuración importada de una estación anterior (<code>station.import.toml</code>) sirve de punto de partida.</p><p>Al añadir un transceptor, el asistente pregunta si se autoriza la <strong>retransmisión de grabaciones</strong> (aplicación: grabar el audio recibido y luego reenviarlo en transmisión, con una duración limitada al tiempo máximo de transmisión menos 5 s). Respuesta por defecto: no. Retransmitir a terceros la emisión de una estación suele estar prohibido en el servicio de aficionados: acepta solo si lo necesitas y bajo tu responsabilidad (<code>[safety] allow_replay</code>).</p>"

[menus.monitor]
role = "Panel en directo, en el terminal: frecuencia, modo, transmisión o recepción, receptor SDR si está en servicio, clientes conectados, servicios, ordenador, audio, red (botón «Detalle»), servicios en línea (relé, difusión, alertas ntfy) si una de estas funciones está en servicio, registro. Se abre en una <strong>pestaña nueva</strong> o ventana (Windows Terminal, GNOME Terminal, tmux, screen): openRemoteTRX Console sigue abierta al lado; por SSH sin tmux, se abre en el mismo terminal."
quand = "Para vigilar la estación in situ, o durante una prueba."
modifie = "Nada, salvo una tecla: <strong>STOP TX</strong> fuerza la recepción. El panel nunca puede hacer transmitir."
admin = false

[menus.hwtest]
role = "Prueba guiada del transceptor real. Opción 1: solo recepción (CAT, sonido recibido, sintonía, anchos de filtro, pantalla del espectro). Opción 2: lo mismo y después la transmisión."
quand = "Después del asistente, después de un cambio de cable o de interfaz de audio, o para cualificar un transceptor nuevo."
modifie = "Nada en la configuración. La opción 2 hace transmitir al transceptor: carga artificial, potencia reducida, confirmación (escribir <code>EMETTRE</code>) en cada paso. La estación se detiene durante la prueba."
admin = true
expert = "<p>El resumen final de la prueba se muestra en pantalla: cópialo en tu solicitud de ayuda. Las respuestas escritas no distinguen mayúsculas ni acentos (se aceptan « emettre », « Émettre » y « EMETTRE »).</p>"

[menus.start]
role = "Arranca (o reinicia) la estación: rigctld, pasarela, supervisor."
quand = "Después de la configuración, después de una modificación, o si la página web ya no responde."
modifie = "El estado de los servicios. El transceptor siempre vuelve a recepción al arrancar."
admin = true

[menus.stop]
role = "Detiene la estación."
quand = "Antes de conectar o desconectar el transceptor o la interfaz de audio, o para usar otro programa con el transceptor."
modifie = "El estado de los servicios. El transceptor se queda en recepción."
admin = true

[menus.journal]
role = "Muestra las 80 últimas líneas del registro de los servicios de la estación."
quand = "Cuando el diagnóstico señala un servicio con fallo, o para entender un corte de transmisión."
modifie = "Nada."
admin = true
expert = "<p>Registro completo: <code>journalctl -u trx-gateway -u trx-supervisor -u rigctld --since \"1 hour ago\"</code>. En Windows: últimas líneas de los archivos de la carpeta <code>logs</code> junto a <code>station.toml</code>.</p>"

[menus.report]
role = "Crea un informe de solución de problemas (archivo zip en el Escritorio): diagnóstico, registros, configuración <strong>sin ninguna contraseña</strong>, versiones, hardware detectado, informes enviados desde la página, identificador de la estación. En la consola web, un botón <strong>«Descargar el informe»</strong> lo descarga en el aparato que muestra la página (PC, tableta, teléfono). Números de serie y direcciones enmascarados."
quand = "Para pedir ayuda: adjunta este zip a tu solicitud."
modifie = "Nada (se crea un archivo en el Escritorio)."
admin = false
expert = "<p>Sin el menú: <code>trx-console --rapport</code>. El archivo <code>station.toml</code> del informe tiene sus secretos ocultos; aun así, revisa su contenido antes de enviarlo si quieres. El informe incluye también las trazas de las herramientas detenidas por un error inesperado (carpeta <code>plantages</code>, código ORT-9312).</p>"

[menus.clear_safe_mode]
role = "<strong>Reactiva la estación</strong> tras un <strong>bloqueo de seguridad</strong>. El supervisor bloquea la estación tras fallos repetidos: parada sin peligro (transceptor en recepción, acceso cortado), espera una intervención."
quand = "Solo después de haber encontrado y corregido la causa (menús 6.1 y 6.2). Mientras la estación está en bloqueo de seguridad, un marco rojo lo recuerda en la parte superior de la consola, con la causa (pastilla roja «BLOQUEO DE SEGURIDAD» en la consola web: un clic abre este menú)."
modifie = "Borra el bloqueo de seguridad memorizado y reinicia la estación."
admin = true
expert = "<p>El bloqueo de seguridad sobrevive a los reinicios y a las correcciones: hay que reactivar la estación explícitamente aquí.</p>"

[menus.update]
role = "Actualización por Internet: presenta la nueva versión, propone ver la naturaleza de los cambios (notas de CADA versión publicada desde la tuya, la más reciente primero, por páginas: Intro = seguir, q = parar ahí) y luego la instala tras comprobar su firma. Si ya estás al día: propone una nueva búsqueda inmediata en GitHub."
quand = "Cuando aparece un recuadro « NUEVA VERSIÓN … DISPONIBLE » arriba en la consola (amarillo en un terminal) y el menú 7.1 está marcado « <== NUEVA VERSIÓN ». La búsqueda se hace 2 minutos después del arranque de la estación y luego cada 24 h."
modifie = "Instala la nueva versión junto a la anterior (conservada para el menú 7.2). <code>station.toml</code> y los certificados se conservan. Se rechaza mientras el transceptor transmite. Si el transceptor no responde (cable USB desconectado, transceptor apagado), la consola lo explica y propone continuar: escribiendo SI, la actualización detiene ella misma la estación (nunca si se ha visto una transmisión). Hay que escribir el número de versión para confirmar."
admin = true

[menus.rollback]
role = "Vuelve a la versión anterior, conservada en la última actualización, sin Internet."
quand = "Si la nueva versión da problemas."
modifie = "La versión activa. La configuración se conserva."
admin = true

[menus.cluster]
role = "Ajustes del DX Cluster: spots seguidos, fuentes (RBN, servidores telnet, web), filtros, prueba de las fuentes."
quand = "Para mostrar los spots en el espectro y las marcas de los botones de banda en la página."
modifie = "La sección Cluster de <code>station.toml</code>; después se propone reiniciar."
admin = true

[menus.install_zip]
role = "Instala una versión a partir de un archivo <code>trx-remote-debian-X.Y.Z.zip</code> dejado en el Escritorio, en Descargas o en la carpeta personal."
quand = "Estación sin Internet, versión de prueba, o vuelta a una versión concreta."
modifie = "Como el menú 7.1: nueva versión junto a la anterior, configuración conservada. Un paquete sin firmar pide escribir <code>OUI</code> y luego el número de versión."
admin = true
expert = "<p>Dejar el zip no basta: hay que instalarlo aquí. Informe: <code>/var/log/trx-remote-install.log</code>.</p>"

[menus.changes]
role = "Muestra en una tabla los últimos cambios de openRemoteTRX (correcciones, novedades, seguridad) que afectan a TU modelo de equipo, con la fecha y la versión que los trae; si quieres, también los que valen para todos los equipos. 50 líneas como máximo; ★ = propio de tu equipo o de su marca. Los cambios de versiones publicadas pero aún no instaladas (lista descargada con la búsqueda de actualizaciones) se marcan [próximo], y el menú 7.1 los muestra antes de instalar. Opción 2: los tickets de GitHub (abiertos y cerrados) de tu equipo, según la etiqueta puesta por la lista «Modelo de transceptor» de los formularios, con su dirección."
quand = "Para saber qué ha cambiado para tu equipo a lo largo de las versiones, antes o después de una actualización."
modifie = "Nada (solo lectura)."
admin = false

[menus.edit_config]
role = "Modifica <code>station.toml</code> en el editor nano, sobre una copia."
quand = "Para un ajuste concreto sin volver a lanzar todo el asistente."
modifie = "<code>station.toml</code>, solo si la copia es válida: se comprueba, se muestran las diferencias, se pide confirmación y la versión anterior se guarda al lado. Una configuración no válida nunca se escribe."
admin = true
expert = "<p>En nano: Ctrl+O y luego Intro para guardar, Ctrl+X para salir. Las copias de seguridad se llaman <code>station.toml.avant-modification-AAAAMMJJ-HHMMSS</code>.</p><p>Referencia de TODOS los ajustes (función, valor por defecto, límites, seguridad, menú que los modifica): <code>https://bob56fr.github.io/openRemoteTRX/station-toml/</code>, también en el sitio rf-diy.com.</p>"

[menus.expert]
role = "Menú experto: lanza todo el conjunto de pruebas automáticas del software en la estación."
quand = "Para ayudar a depurar, o comprobar que una instalación está sana."
modifie = "Nada. Las pruebas usan un transceptor <strong>simulado</strong>: ninguna orden al transceptor real, ninguna transmisión. La estación se detiene durante las pruebas (7 a 10 minutos en un PC reciente, 30 minutos o más en un PC pequeño) y luego se reinicia si lo pides."
admin = true
expert = "<p>El resultado se guarda en el Escritorio (<code>trx-remote-tests-AAAAMMJJ-HHMM.txt</code>): envía este archivo si fallan pruebas. La herramienta de pruebas (pytest) se instala en el primer uso (hace falta Internet).</p><p>Los puntos se muestran a medida que avanzan; si no hay nada nuevo durante un minuto, la consola recuerda que las pruebas continúan. Una prueba realmente bloqueada 10 minutos muestra la pila de sus hilos de ejecución: eso es lo que hay que enviar (Ctrl+C detiene las pruebas).</p>"

[menus.qualif]
role = "Cualificación de un transceptor con <code>trx-qualif</code>, para un experto que quiere llegar lo más lejos posible con un transceptor nunca probado pero conocido por Hamlib. Opción 1: plan de pruebas e incoherencias de Hamlib, sin tocar el transceptor. Opción 2: exploración sin transmisión (todo lo que Hamlib declara se lee y se compara con las respuestas del transceptor). Opción 3: lo mismo, solo lectura. Opción 4: cualificación sin transmisión. Opción 5: cualificación completa. Opción 6: maletín de cualificación in situ (estado del equipo antes / después, exploración, cualificación, pruebas de seguridad cronometradas, informe zip para Claude)."
quand = "Antes de usar un modelo de transceptor nuevo, o para preparar un informe para los desarrolladores de Hamlib."
modifie = "Nada en la configuración. Las opciones 2 y 4 cambian la frecuencia y algunos ajustes de recepción del transceptor y luego los restablecen; la exploración nunca cambia el modo. Solo la opción 5 transmite (carga artificial, confirmación <code>EMETTRE</code> en cada paso). La estación se detiene durante la prueba."
admin = true
expert = "<p>Informes en la carpeta de estado de la estación (<code>qualifications/</code>): <code>exploration.json</code>, <code>constats.txt</code>, borradores <code>fiche-poste.md</code> y <code>rapport-hamlib.md</code> (en inglés), registro de todas las órdenes (<code>cat_trace.log</code>). La exploración nunca envía una orden de PTT y se detiene en seco si el transceptor pasa a transmisión (su propio micrófono). Los anchos de filtro solo se prueban con <code>trx-qualif --filtres</code>: en un Icom, cada ancho enviado se escribe en un preajuste FIL1/2/3.</p>"

[menus.temperature]
role = "Umbrales de temperatura del transceptor: primer umbral (aviso en la página y notificación), segundo umbral (transmisión remota cortada y rechazada hasta volver por debajo del primer umbral). 40 y 50 °C por defecto."
quand = "Si tu transceptor se calienta en uso normal (modos digitales en continuo, por ejemplo) o para más prudencia."
modifie = "Las claves <code>rig_temp_warn_c</code> y <code>rig_temp_cut_c</code> de <code>station.toml</code>, por el mismo camino comprobado que el menú 8.1."
admin = true
expert = "<p>Sin efecto si el transceptor no da su temperatura por Hamlib (caso del IC-7300MK2). El operador al micrófono del transceptor nunca se corta por este motivo.</p>"

[menus.indicator]
role = "Activa o desactiva el <strong>indicador de la barra superior</strong> (escritorio GNOME): un piloto a la izquierda del sonido (verde recepción, rojo transmisión, naranja alerta, gris estación detenida, violeta bloqueo de seguridad), la frecuencia o la cuenta atrás de transmisión y, al hacer clic, el estado completo: transmisión, frecuencia y filtro, clientes web conectados, enlace con el transceptor, operador in situ, último corte, temperatura, alimentación, espectro HF, DX Cluster, actualización disponible, versión e identificador. En Windows, este menú arranca el <strong>indicador junto al reloj</strong> (mismos colores, solo lectura) y elige si arranca en cada inicio de sesión."
quand = "Una vez, después de la instalación (y de cerrar y volver a abrir la sesión), para vigilar la estación en todo momento."
modifie = "Solo la visualización de tu escritorio. El indicador solo LEE el estado publicado por la estación: no puede controlar nada."
admin = false
expert = "<p>Archivos leídos cada segundo: <code>/run/trx-remote/gateway-status.json</code>, y en <code>/var/lib/trx-remote/</code>: <code>safe_mode</code>, <code>cluster/status.json</code>, <code>update/latest.json</code>, <code>station-id</code>. Extensión instalada en <code>/usr/share/gnome-shell/extensions/trx-distant@rf-diy.com</code>. El menú del indicador también abre la página web, openRemoteTRX Console y el panel.</p>"

[menus.profiles]
role = "Perfiles de transceptor, para quien maneja varios TRX por turnos: <strong>guardar</strong> la configuración del transceptor en servicio con un nombre (« IC-7300 casa »), <strong>volver a cargarla</strong> más tarde, o eliminar un perfil. El perfil en servicio se indica en la lista."
quand = "Después de configurar y probar un transceptor (menús 2.1 y 2.2): guárdalo. Para cambiar de transceptor: conéctalo, carga su perfil y la estación se reinicia con él."
modifie = "Cargar un perfil solo cambia los ajustes del TRANSCEPTOR en <code>station.toml</code> (modelo, puertos, PTT, tarjetas de sonido, espectro), por el mismo camino comprobado que el menú 8.1 (diferencias mostradas, confirmación, versión anterior guardada). Cuentas, red, bandas autorizadas y seguridades nunca cambian. Se rechaza durante una transmisión."
admin = true
expert = "<p>Archivos: <code>/etc/trx-remote/profils/&lt;nom&gt;.toml</code>. Cada perfil lleva un número de formato. Un perfil de una versión antigua se convierte al cargarlo cuando es posible (una clave que falta toma su valor por defecto); si no, o si viene de una versión más reciente, se rechaza con los pasos a seguir: rehacer la configuración de ese transceptor (menú 2.1) y volver a guardarlo. El archivo original nunca se modifica al cargarlo.</p>"

[menus.pairing]
role = "Muestra lo necesario para <strong>emparejar la aplicación Android</strong> con esta estación: la dirección que hay que introducir, las cuentas autorizadas, la <strong>huella del certificado</strong> (SHA-256, en dos líneas) y un <strong>código QR</strong> para escanear con la aplicación (« Scanner le QR code de la station »): rellena la dirección, el usuario y la huella. Si hay varias direcciones o varias cuentas, la consola pregunta cuáles poner en el código QR (Intro = opción propuesta). Ni el código QR ni la pantalla contienen contraseñas: la estación no las conoce en claro, se introducen en la aplicación."
quand = "Al añadir la estación en la aplicación Android, y después de rehacer el certificado (menú 2.1)."
modifie = "Nada: solo lectura."
admin = false
expert = "<p>La misma información en línea de comandos: <code>trx-setup --output /etc/trx-remote/station.toml --empreinte</code>. Si el certificado solo lo puede leer la estación, la consola lo relee con derechos de administración. Estación limitada a este equipo (bucle local): ningún teléfono puede conectarse, la consola lo indica. Detrás de un proxy HTTPS, la huella que hay que fijar es la del certificado del proxy (sin código QR). El código QR está dibujado para un terminal de fondo oscuro; la aplicación también lo lee en un terminal claro. Si no aparece (falta el paquete « segno »), reinstala la estación (menú 7.3) o introduce la huella a mano.</p>"

[menus.swr_report]
role = "Muestra la <strong>última medida de ROE</strong> de la antena guardada en la estación: fecha, potencia, modo, rango y la ROE de cada punto con una pequeña barra (« ÉLEVÉ » por encima de 2), el mejor punto y los ajustes del transceptor que no se hayan restablecido. <strong>Solo lectura</strong>: la consola nunca lanza una medida (una herramienta solo puede cortar una transmisión); la medida se lanza desde la página o la aplicación."
quand = "Para recuperar una medida hecha a distancia, compararla con una nueva, o comprobar que un ajuste del transceptor se restableció bien tras una medida interrumpida."
modifie = "Nada."
admin = false
expert = "<p>Archivo leído: <code>swr.json</code> en la carpeta de estado de la estación (últimas elecciones de cada cuenta, tiempo de lectura de la ROE calibrado por modelo de transceptor, última medida). Ajustes de la estación: sección <code>[swr]</code> de <code>station.toml</code> (menú 8.1: <code>enabled</code>, tope de potencia <code>max_power_pct</code>, <code>max_points</code>, <code>point_tx_max_s</code>). Detalle: <code>docs/tos-cahier-des-charges.md</code>.</p>"

[menus.visitors]
role = "Gestiona los <strong>visitantes solo en recepción</strong>: cuentas que escuchan la estación y ven la pantalla del operador, sin <strong>ninguna</strong> orden hacia el transceptor (ni frecuencia, ni modo, ni transmisión, ni STOP). Aquí se ajusta el <strong>número máximo</strong> de visitantes (0 = escucha cerrada en la estación; si no, es el operador quien abre o cierra la escucha desde su página o la aplicación, interruptor « Écoute des visiteurs », cerrado por defecto), el interruptor <strong>« operador requerido »</strong> (visitantes admitidos solo si hay un operador conectado, y desconectados tras una espera ajustable, 60 s por defecto, si este pierde el enlace), la escucha <strong>fuera de las bandas</strong> de la estación (cortada por defecto: silencio) y la cadencia del espectro HF de los visitantes (5 imágenes por segundo por defecto). Aquí se crean, modifican (seudónimo, contraseña, activada, fecha de fin) y eliminan las cuentas de visitantes, se <strong>desconecta</strong> a un visitante conectado y se <strong>reabre la escucha</strong> suspendida por una sobrecarga."
quand = "Antes de una demostración en un radioclub, una formación o la escucha compartida de un QSO; para retirar el acceso a un visitante (desactivar o eliminar su cuenta)."
modifie = "Las cuentas y la sección <code>[access]</code> de <code>station.toml</code>, por el mismo camino comprobado que el menú 8.1 (diferencias mostradas, confirmación, versión anterior guardada; el archivo se reescribe en su forma estándar). La estación los relee por sí sola en unos segundos, <strong>sin reiniciar</strong>: una cuenta desactivada, caducada o eliminada se desconecta en el acto. « Desconectar » no toca <code>station.toml</code>."
admin = true
expert = "<p>Los demás conectados nunca ven el usuario de una cuenta, solo su <strong>seudónimo</strong> (varias cuentas pueden llevar el mismo); solo un operador ve usuarios y direcciones. Durante una transmisión, los visitantes oyen la voz del operador (lo que va hacia el transceptor); el código SELCALL nunca se les muestra. Un visitante solo puede enviar dos órdenes (releer el estado, mostrar o no el espectro HF): todo lo demás lo rechaza la estación, y por encima de 20 rechazos en un minuto su conexión se cierra con una alerta. Los visitantes tienen su propia cuota: nunca ocupan el lugar de un operador. Si la estación sufre (procesador a 85 °C, carga al 90 %, pasarela con más de 100 ms de retraso o memoria casi llena, durante 10 s), los visitantes se desconectan con la causa precisa; la escucha se reabre sola tras 5 minutos claramente por debajo, o a mano (opción 6) tras 3 cortes en una hora. Umbrales: <code>[access] overload_*</code> (menú 8.1). Retransmitir a terceros lo que se recibe compromete la responsabilidad del operador: consulta la guía de acceso remoto. Detalle: <code>docs/visiteurs-cahier-des-charges.md</code>.</p>"

[menus.operators]
role = "Gestiona las <strong>cuentas de operador</strong>, las que controlan el transceptor y emiten. La regla: <strong>una cuenta por dispositivo</strong> (PC, teléfono, tableta), con el nombre del dispositivo (<code>PC</code>, <code>S25</code>…). La misma cuenta abierta en un segundo dispositivo cierra la conexión del primero y corta su emisión. Aquí se <strong>añade</strong> una cuenta (contraseña escrita o generada, y después el código QR de emparejamiento de esa cuenta para la aplicación Android), se <strong>cambia una contraseña</strong>, se <strong>desactiva o reactiva</strong> una cuenta, se elige su <strong>seudónimo</strong> (visible para los demás conectados) y se <strong>elimina</strong>. Las cuentas conectadas se señalan."
quand = "Al llegar un dispositivo nuevo (teléfono, tableta, segundo PC); tras la pérdida o el robo de un teléfono (desactivar su cuenta); para cambiar una contraseña."
modifie = "Las cuentas <code>[[clients]]</code> de <code>station.toml</code>, por el mismo camino comprobado que el menú 8.1 (diferencias mostradas, confirmación, versión anterior guardada; el archivo se reescribe en su forma estándar). La estación las relee sola en pocos segundos, <strong>sin reiniciar</strong>: la conexión de una cuenta desactivada, eliminada o cuya contraseña ha cambiado se cierra en el acto (su emisión se corta)."
admin = true
expert = "<p>La <strong>última cuenta de operador activa</strong> no se puede desactivar ni eliminar: la estación ya no se podría controlar. La contraseña nunca se guarda en claro (solo la huella scrypt): una contraseña olvidada se <strong>sustituye</strong>. Una cuenta por dispositivo permite también saber quién emite (la estación niega la emisión a los demás mientras tanto) y retirar un solo dispositivo. Lo mismo en línea de órdenes: <code>trx-setup --output /etc/trx-remote/station.toml --add-client NOMBRE</code> o <code>--set-password NOMBRE</code>. Las cuentas de <strong>visitante</strong> (solo recepción) están en el menú 4.2.</p>"

[menus.sdr]
role = "Prepara el <strong>receptor SDR</strong> de la estación (solo recepción, junto al TRX). Se <strong>buscan los SDR</strong> conectados a todos los puertos USB, hubs incluidos (SDRplay, llaves RTL-SDR), <strong>sin abrir ninguno</strong>: tipo, número de serie, ubicación (puerto, hub) y estado (libre, ocupado por un programa, ocupado por el controlador TV del núcleo, SDR de esta estación). Se <strong>elige el SDR de la estación por su número de serie</strong> (nunca por su puerto), luego el <strong>ancho</strong> (2, 6 u 8 MHz), la <strong>antena</strong> (A o B), los <strong>límites</strong> de procesador y memoria del módulo, y se <strong>pone en servicio</strong>. Una llave RTL-SDR cuyo número de fábrica está duplicado puede recibir un <strong>nuevo número de serie</strong> (una sola llave conectada, su memoria guardada antes, luego desconectarla y volver a conectarla)."
quand = "Al llegar un SDR; cuando un SDR cambia de puerto o se conecta un segundo SDR (comprobar que la estación conserva el correcto); si el SDR consume demasiado en un PC pequeño (ancho, límites)."
modifie = "La sección <code>[sdr]</code> de <code>station.toml</code> (y « sdr » en <code>[modules] run</code> al ponerlo en servicio), por el mismo camino verificado que el menú 8.1; se propone reiniciar la estación. La búsqueda no cambia nada y no abre ningún SDR."
admin = true
expert = "<p>Un SDR <strong>ocupado</strong> (por ejemplo por otro proyecto) o cuyo número de serie está <strong>duplicado</strong> (frecuente en las llaves RTL-SDR de fábrica) se rechaza: la estación confundiría los aparatos. La búsqueda también señala un SDR conectado al <strong>mismo hub que el equipo</strong> (a evitar). Lo mismo en línea de comandos: <code>trx-sdr --list</code> (con <code>sudo</code> se muestra el nombre del programa que ocupa una llave RTL-SDR).</p>"

[menus.certificate]
role = "Muestra el <strong>certificado HTTPS</strong> de la estación (nombres y direcciones, caducidad, origen) y lo rehace <strong>firmado por la autoridad de la estación</strong>. Una vez instalada esta autoridad en un dispositivo (PC, teléfono), el navegador deja de avisar y puede <strong>recordar la contraseña</strong> (Chrome se niega a guardarla con un certificado no reconocido). Se muestra el enlace de descarga de la autoridad; la página también lo ofrece."
quand = "Una vez, para que el navegador deje de avisar y recuperar la contraseña guardada; para añadir un nombre o una dirección (VPN, nombre local) al certificado."
modifie = "Los archivos de la carpeta <code>tls</code> de la estación (autoridad creada si hace falta, certificado de la pasarela rehecho) y <code>[network] tls_cert</code> / <code>tls_key</code> si hace falta. La huella cambia: hay que <strong>emparejar de nuevo la aplicación Android</strong> (menú 4.1). La estación debe reiniciarse para usarlo (se propone)."
admin = true
expert = "<p>La autoridad está <strong>limitada por restricciones de nombre</strong> a las direcciones privadas (red local, VPN) y a los nombres de la estación: incluso robada, su clave no permitiría suplantar otro sitio en los dispositivos que la instalaron. Su clave permanece en la estación, legible solo por el administrador. Se reutiliza mientras sus restricciones cubran los nombres pedidos; un nuevo nombre DNS exige una nueva autoridad, que hay que reinstalar. Lo mismo en línea de comandos: <code>trx-setup --output /etc/trx-remote/station.toml --autorite-station [NOMBRES…]</code>.</p>"

[menus.rig]
role = "Cambia el <strong>transceptor</strong> y su enlace: modelo Hamlib (con los ajustes aconsejados de un transceptor conocido), puerto serie CAT, velocidad, método PTT y luego una <strong>prueba del enlace solo en lectura</strong> (sin emisión). La estación se detiene durante las preguntas: el puerto serie debe estar libre. Las mismas preguntas que la parte correspondiente del asistente completo (menú 2.1), y solo esas: Intro conserva cada ajuste actual, el resto de la configuración no se toca. Registra también la identidad USB del puerto, comprobada antes de cada encendido remoto (menú 2.8)."
quand = "Transceptor nuevo, puerto serie cambiado (otro cable, otra toma USB), velocidad cambiada en los menús del transceptor, prueba del enlace fallida."
modifie = "La configuración de la estación (<code>station.toml</code>), con derechos de administrador; se conserva la versión anterior (<code>station.toml.bak</code>). No se escribe nada si abandonas. La estación se reinicia a petición para aplicar el cambio."
admin = true

[menus.sound]
role = "Elige las <strong>tarjetas de sonido</strong>: la que recibe el audio del transceptor y la que envía la voz hacia él. La estación se detiene durante las preguntas: una tarjeta ocupada no aparece en la lista. Las mismas preguntas que la parte correspondiente del asistente completo (menú 2.1), y solo esas: Intro conserva cada ajuste actual, el resto de la configuración no se toca."
quand = "Sin audio recibido, voz que no sale, tarjeta de sonido cambiada o conectada en otra toma."
modifie = "La configuración de la estación (<code>station.toml</code>), con derechos de administrador; se conserva la versión anterior (<code>station.toml.bak</code>). No se escribe nada si abandonas. La estación se reinicia a petición para aplicar el cambio."
admin = true

[menus.hf_spectrum]
role = "Activa o desactiva el <strong>espectro HF</strong> (cascada del transceptor) por el segundo puerto serie de un Icom ajustado en CI-V. El puerto se comprueba con la estación detenida; confirmas escribiendo SÍ que los ajustes USB SEND / USB Keying están hechos, porque un segundo puerto mal ajustado puede poner el transceptor en emisión. Las mismas preguntas que la parte correspondiente del asistente completo (menú 2.1), y solo esas: Intro conserva cada ajuste actual, el resto de la configuración no se toca."
quand = "Después de ajustar el segundo puerto CI-V, o para desactivar el espectro. No aplica a transceptores que no sean Icom."
modifie = "La configuración de la estación (<code>station.toml</code>), con derechos de administrador; se conserva la versión anterior (<code>station.toml.bak</code>). No se escribe nada si abandonas. La estación se reinicia a petición para aplicar el cambio."
admin = true

[menus.remote_power]
role = "Activa (o desactiva) el <strong>encendido y apagado remoto del equipo</strong>: un operador que se conecta enciende el equipo si está apagado, y STOP mantenido 3 s en la página o la aplicación lo apaga (con confirmación). <strong>Desactivado por defecto.</strong> La activación se rechaza si Hamlib no declara la función para tu equipo; primero propone una prueba (estación detenida durante la prueba, equipo apagado y encendido, sin emisión) y registra la identidad USB del puerto del equipo, comprobada antes de cada encendido. Opciones: apagado automático tras un tiempo sin ninguna conexión, alertas ntfy en cada encendido o apagado."
quand = "Para una estación remota que hay que poder encender sin ir al cuarto de radio, con un equipo que mantiene su USB alimentado una vez apagado (Yaesu FTDX10 por la toma USB). Repetirlo tras cambiar el equipo de toma USB."
modifie = "La configuración de la estación (<code>station.toml</code>: sección <code>[power]</code> e identidad USB de los puertos en <code>[rig]</code>), con derechos de administración; se conserva la versión anterior (<code>station.toml.bak</code>). No se escribe nada si abandonas. La estación se reinicia si lo pides para aplicar el cambio."
admin = true

[menus.rx_gain]
role = "Ajusta la <strong>ganancia del audio recibido</strong> que la estación envía a todos los terminales (teléfonos, página, visitantes, difusión) y el <strong>limitador del audio recibido</strong> (picos limitados a -1 dBFS, activo por defecto). El menú muestra el nivel recibido en este momento y propone una ganancia para llegar a -20 dBFS. Con el limitador, una ganancia alta no satura; apagarlo solo sirve para un diagnóstico. El volumen de cada teléfono se ajusta en la página o la aplicación."
quand = "Cuando el audio recibido es demasiado débil o fuerte en todos los terminales, por ejemplo con un equipo cuya salida USB no se puede ajustar (Yaesu FTDX10). Medir con la estación arrancada y señal en la antena."
modifie = "La configuración de la estación (<code>station.toml</code>: <code>rx_gain_db</code> y <code>rx_limiter</code> de la sección <code>[audio]</code>), con derechos de administrador; se guarda la versión anterior (<code>station.toml.bak</code>). No se escribe nada si abandonas. La estación se reinicia a petición para tomar el cambio."
admin = true

[menus.squelch_cal]
role = "<strong>Calibra el squelch</strong> para que la marca naranja sobre el S-meter (página y aplicación) y el valor mostrado («S5,4») sigan la pantalla del equipo, en todos los modos. Delante del equipo, pones el squelch en 1, 2… 9 y luego 9+10; cada vez la consola lee el ajuste SQL publicado por la estación (solo lectura: no se escribe nada en el equipo, ninguna emisión). Opción 2: <strong>exportación</strong> en zip para adjuntar a un ticket de GitHub (calibración, modo y estado del squelch en cada punto, capacidades declaradas por Hamlib, ajustes del momento, ficha técnica, versiones; ni número de serie ni dirección) para que una próxima versión conozca la tabla de este modelo. Opción 3: borrar."
quand = "Cuando la marca del squelch no corresponde a la pantalla del equipo. Estación en marcha, equipo encendido."
modifie = "La configuración de la estación (<code>station.toml</code>, sección <code>[squelch_cal]</code>), con derechos de administración; se conserva la versión anterior. Releída sin reiniciar: se aplica en la próxima conexión de la página y de la aplicación. La exportación se escribe en el Escritorio (botón de descarga en la consola web)."
admin = true

[menus.bands]
role = "Decide quién impide emitir fuera de tus bandas: la estación (lista de bandas permitidas, puntos de partida de la región 1 IARU a comprobar según tu licencia) o el propio transceptor. <strong>Lista vacía = solo recepción.</strong> Las mismas preguntas que la parte correspondiente del asistente completo (menú 2.1), y solo esas: Intro conserva cada ajuste actual, el resto de la configuración no se toca."
quand = "En la puesta en servicio, tras un cambio de licencia, o si la estación rechaza una emisión en una banda permitida."
modifie = "La configuración de la estación (<code>station.toml</code>), con derechos de administrador; se conserva la versión anterior (<code>station.toml.bak</code>). No se escribe nada si abandonas. La estación se reinicia a petición para aplicar el cambio."
admin = true

[menus.transmit]
role = "Ajusta la <strong>potencia máxima</strong> del transceptor (la página la muestra en vatios) y la <strong>duración máxima de una emisión</strong> (TOT, 90 s por defecto, pitido 10 s antes del corte, techo de la estación). El supervisor corta de todos modos más allá del TOT absoluto. Las mismas preguntas que la parte correspondiente del asistente completo (menú 2.1), y solo esas: Intro conserva cada ajuste actual, el resto de la configuración no se toca."
quand = "En la puesta en servicio, o para acortar o alargar una emisión."
modifie = "La configuración de la estación (<code>station.toml</code>), con derechos de administrador; se conserva la versión anterior (<code>station.toml.bak</code>). No se escribe nada si abandonas. La estación se reinicia a petición para aplicar el cambio."
admin = true

[menus.access_network]
role = "Elige desde dónde se puede conectar a la estación: solo esta máquina, o la red local y la VPN en <strong>HTTPS</strong> con un certificado firmado por la autoridad de la estación. Un certificado nuevo obliga a emparejar de nuevo la aplicación (menú 4.1). Las mismas preguntas que la parte correspondiente del asistente completo (menú 2.1), y solo esas: Intro conserva cada ajuste actual, el resto de la configuración no se toca."
quand = "En la puesta en servicio, tras un cambio de dirección del PC, o para abrir la estación al teléfono."
modifie = "La configuración de la estación (<code>station.toml</code>), con derechos de administrador; se conserva la versión anterior (<code>station.toml.bak</code>). No se escribe nada si abandonas. La estación se reinicia a petición para aplicar el cambio."
admin = true

[menus.remote_console]
role = "Pone <strong>openRemoteTRX Console en la red</strong>: los mismos menús en el navegador de cualquier PC, tableta o teléfono de la red local o del VPN, sin SSH ni acceso directo, en <code>https://&lt;station&gt;:8444/</code>. Conexión con una <strong>cuenta de operador marcada administradora</strong> (elegida aquí); la sesión se cierra tras 30 minutos sin acción; la contraseña sudo de la estación se sigue pidiendo una vez por sesión. 5 fallos bloquean la dirección 15 minutos y cada conexión envía una alerta ntfy. Nunca accesible desde Internet. Un administrador conectado a la página de control también encuentra allí el enlace."
quand = "Para administrar la estación desde otro dispositivo, sin saber SSH. Una instalación nueva en la red ya la tiene en servicio (asistente 2.1, primera cuenta de operador como administradora): este menú la detiene o elige otras cuentas. Mientras está desactivada, su dirección muestra una página «Consola web desactivada» que remite a este menú (en la red, con certificado), y la cabecera de la consola indica «activada pero no responde» si está activada pero no responde."
modifie = "La configuración de la estación (<code>station.toml</code>: <code>[remote_console]</code> y la marca <code>admin</code> de las cuentas), con derechos de administrador; se guarda la versión anterior. En Debian se arranca o se para el servicio <code>trx-console-web@cuenta</code>; en Windows se reinicia la estación."
admin = true

[menus.local_operator]
role = "Ajusta lo que hace la estación cuando alguien <strong>emite con el micrófono del transceptor</strong>, delante de él. <strong>Estación compartida</strong> (por defecto): esa emisión solo la corta el <strong>TOT absoluto</strong> del supervisor (135 s por defecto), o tras la duración tolerada (300 s por defecto) cuando la presencia del operador está probada (tocó el transceptor justo antes). Si no, toda emisión local se corta en el acto. La emisión remota queda bloqueada durante una emisión local y 2 minutos después."
quand = "En la puesta en servicio, si un operador usa el transceptor en el lugar, o si la estación pasa a bloqueo de seguridad tras emisiones con el micrófono del transceptor."
modifie = "La sección <code>[supervisor]</code> de <code>station.toml</code> (<code>allow_local_tx</code>, <code>tot_abs_s</code>, <code>local_tx_max_s</code>), por el camino comprobado del menú 8.1; la estación se reinicia a petición."
admin = true

[menus.alerts]
role = "Ajusta las <strong>alertas en el teléfono</strong> por ntfy: la dirección (un tema largo y secreto: quien lo conoce lee las alertas; la pantalla nunca la muestra entera), el idioma (fr o en), el mensaje «Estación en servicio» (cada N horas, sin sonido), y <strong>envía una alerta de prueba</strong> (código ORT-8025) para comprobar que todo llega."
quand = "En la puesta en servicio (guía, parte 6), tras cambiar de teléfono o de suscripción ntfy, o cuando no llega ninguna alerta."
modifie = "La sección <code>[supervisor]</code> de <code>station.toml</code> (<code>notify_url</code>, <code>notify_lang</code>, <code>alive_every_h</code>), por el camino comprobado del menú 8.1; la prueba no escribe nada."
admin = true

[menus.features_switch]
role = "Activa o para cada <strong>función</strong> de la estación con su número: DX Cluster, FreeDV, actividad FreeDV, SELCALL, presencia de grupo, monitorización, SDR, Breizh Audio Box, sonda de red, medida de ROE, difusión en directo. El interruptor ajusta a la vez la función y el arranque de su módulo. Una función que necesita otros ajustes se rechaza indicando el menú donde hacerlos."
quand = "Para probar o retirar una función sin editar <code>station.toml</code>."
modifie = "Las secciones de las funciones (<code>enabled</code>) y <code>[modules] run</code> de <code>station.toml</code>, por el camino comprobado del menú 8.1; la estación se reinicia a petición."
admin = true

[menus.diffusion]
role = "Hace oír el sonido del TRX a unos pocos <strong>oyentes en Internet</strong>, sin cuenta en la estación: escuchan en la página de un <strong>servidor de difusión</strong> y nunca llegan a la estación. Se ve el <strong>estado</strong> (en directo o no, canal, oyentes, tiempo restante, quién la inició), se <strong>inicia</strong> una difusión (canal <strong>privado</strong> por defecto, con usuario y contraseña, o público; duración, 1 hora por defecto; su voz durante sus emisiones, <strong>no</strong> por defecto) y se <strong>detiene</strong>. Se lee o se cambia la <strong>contraseña de los oyentes</strong> («Generar una»: los que ya escuchan no se cortan), se ajusta el <strong>servidor</strong> (dirección, nombre de la estación, códec, <strong>difusión fuera de las bandas autorizadas</strong>: no por defecto, silencio para los oyentes) y se guardan sus <strong>secretos</strong> (contraseña de la fuente y clave, nunca mostrados). Hay que confirmar una <strong>advertencia</strong> en el primerísimo inicio."
quand = "Para que unos amigos o un club oigan el equipo durante una velada o un concurso; en la puesta en marcha, con lo que le dio el administrador del servidor."
modifie = "<code>[diffusion]</code> de <code>station.toml</code> (servidor, estación, códec, fuera de bandas) por el camino verificado del menú 8.1, y el archivo <code>diffusion.key</code> (0600, legible solo por el servicio). Nada toca el equipo: el módulo «diffusion» no tiene ningún derecho sobre él; lo que difunde es su responsabilidad."
admin = true

[menus.breizh]
role = "Conecta la estación con <strong>Breizh Audio Box</strong>, el procesado de voz que funciona en un PC de la misma red local: la voz del operador pasa por Breizh antes de llegar al transceptor. Aquí se <strong>crea la clave de emparejamiento</strong> (mostrada <strong>una sola vez</strong>, que hay que copiar en la pestaña « OpenRemoteTRX » de los ajustes de Breizh con la dirección de la estación y el puerto), se ajustan la <strong>dirección IP</strong> y el <strong>puerto UDP</strong> del PC de Breizh, se <strong>activa o desactiva</strong> el paso por Breizh, se hace una <strong>prueba del enlace sin sonido</strong> y se lee el <strong>registro</strong> (conexiones, repliegues, rechazos). El estado actual del enlace (listo, transmisión por Breizh, repliegue, rechazo, ida y vuelta) se muestra arriba."
quand = "Al instalar Breizh, después de reinstalar Breizh (clave nueva), cuando la página o la aplicación señalan un repliegue, o para comprobar el enlace antes de una transmisión."
modifie = "La clave: archivo <code>breizh.key</code> junto a <code>station.toml</code> (nunca dentro), con los derechos de la configuración. La dirección, el puerto y la activación: sección <code>[breizh]</code> de <code>station.toml</code>, por el mismo camino comprobado que el menú 8.1 (diferencias mostradas, confirmación, versión anterior guardada); la estación los aplica al <strong>reiniciar</strong> (se propone). La prueba y el registro no modifican nada."
admin = true
expert = "<p><strong>Seguridad</strong>: Breizh nunca puede hacer transmitir la estación; esta conserva el PTT, el TOT, la puerta de audio y su limitador, y pasa a directo con ganancia reducida (−6 dB por defecto) si Breizh deja de responder durante 100 ms, sin cortar la transmisión. El modo OpenRemoteTRX de Breizh desactiva su CAT. El sonido del micrófono circula <strong>sin cifrar</strong> por la red local: solo se acepta una dirección IP <strong>privada</strong>. En el PC de Breizh, el cortafuegos debe dejar entrar el UDP del puerto elegido (47100 por defecto). La prueba envía una llamada y cinco PING, nunca sonido; si la estación está en marcha con Breizh activado, Breizh responde « ocupado » (ya atiende a la pasarela): es normal, el estado está arriba del menú. Ajustes finos (plazos, ganancia de repliegue, vuelta automática): <code>[breizh]</code>, menú 8.1 y la referencia de <code>station.toml</code>. Detalle: <code>docs/breizh-cahier-des-charges.md</code>.</p>"

[menus.network]
role = "Muestra la <strong>calidad de los enlaces</strong> entre la estación y los teléfonos o navegadores conectados: para cada uno, el estado (buena, media, débil, corte), el tipo de red, la pérdida y el tiempo de ida y vuelta; el estado de las <strong>sondas de la estación</strong> hacia el router y hacia Internet; el <strong>último corte</strong> con su tramo probable; y el aviso <strong>« perfil VPN probablemente compartido »</strong> cuando dos dispositivos parecen usar el mismo perfil VPN. Aquí se lee la <strong>síntesis</strong> de las últimas 24 horas o de los últimos 30 días (cortes, duración, tramos, horas más afectadas, por red), se crea una <strong>exportación anónima</strong> en el Escritorio para el equipo de desarrollo, y se puede <strong>borrar todo</strong>."
quand = "Cuando el enlace se corta a menudo (en el coche, en 4G, a través de una VPN), para saber si es el teléfono, la red móvil, el túnel, el router o la estación; antes de pedir ayuda (exportación)."
modifie = "Nada, salvo « Borrar todo » (confirmación escribiendo EFFACER): el historial de red de la estación (cortes, estadísticas, dispositivos vistos). Los umbrales del indicador elegidos en la página o la aplicación se conservan. La exportación es un archivo zip en el Escritorio."
admin = true
expert = "<p>La estación envía un latido cada segundo a cada cliente conectado y espera su eco; tres latidos sin respuesta cuentan como un corte. Tras cada corte, cruza sus propias sondas (router, Internet, ping o si no TCP), las medidas entregadas por el cliente (incluido el acceso a la estación en HTTPS durante el corte) y la regularidad de los cortes para decir qué tramo ha fallado probablemente; es una probabilidad, nunca una certeza. Dos dispositivos con el <strong>mismo perfil VPN</strong> se roban el enlace cada 15 a 30 s: <strong>un perfil por dispositivo</strong>. La sonda solo mide: nunca actúa sobre la transmisión. Archivos: carpeta <code>netprobe</code> de la carpeta de estado (registro de 7 días, cortes y estadísticas de 30 días). La misma síntesis en línea de comandos: <code>trx-netreport</code> (<code>--jours 30</code>, <code>--export FICHIER</code>). Ajustes: sección <code>[netprobe]</code> de <code>station.toml</code> (menú 8.1). « Borrar todo » pide <code>sudo</code>: los archivos pertenecen a la cuenta de la estación. Detalle: <code>docs/netprobe-cahier-des-charges.md</code>.</p>"

[menus.friends]
role = "Gestiona la <strong>presencia de grupo</strong>: el <strong>seudónimo</strong> de la estación, los <strong>grupos de amigos</strong> (crear, invitar con un enlace y un <strong>código QR</strong>, unirse con una invitación recibida, salir, eliminar) y lo que la estación <strong>comparte</strong> en cada grupo (frecuencia y modo, solo « On Air », o un texto corto; invisible). También se ve quién, en cada grupo, está en QSO, en recepción, en el cuarto de radio, ausente o desconectado."
quand = "Para poner en marcha la presencia con amigos equipados con openRemoteTRX, o cuando la página y la aplicación no están a mano."
modifie = "Los ajustes de presencia de la estación, guardados aparte en la carpeta de estado (no en station.toml); la creación, la invitación, la adhesión y la salida pasan por el relé de presencia. Nada toca el transceptor: un QSY hacia un amigo se hace desde la página o la aplicación."
admin = true
expert = "<p>La consola deja su solicitud para el módulo « presence » (archivo <code>presence-request.json</code> de la carpeta de estado, con <code>sudo</code> si hace falta) y lee su respuesta (<code>presence/console-reply.json</code>, borrada al cabo de un minuto: puede contener una invitación). La función se activa en <code>station.toml</code> (menú 8.1): <code>[presence] enabled = true</code> y « presence » en <code>[modules] run</code>, y luego reiniciar la estación. El relé solo ve estados cifrados: ni frecuencia, ni modo, ni estado. Una invitación contiene la clave del grupo: transmítela solo a la persona invitada; solo sirve una vez y caduca a los 7 días. Detalle: <code>docs/presence-cahier-des-charges.md</code>.</p>"

[menus.monitoring]
role = "<strong>Ayudar a un operador en apuros</strong>, o <strong>recibir ayuda</strong>, sin VPN ni puerto abierto. Quien ayuda crea un <strong>código de 10 caracteres</strong> y lo dicta; el operador ayudado lo teclea; ambos comparan <strong>6 cifras</strong> de viva voz. El operador ayudado elige lo que envía (esencial, o diagnóstico con el estado de la radio; frecuencia y modo solo si lo desea). Se ven las últimas noticias y los últimos códigos de error de cada estación seguida, se pide o se acepta el <strong>modo asistencia</strong> (noticias cada 30 segundos, durante el tiempo elegido), se pausa y se termina un enlace. Quien ayuda puede también pedir el <strong>informe de diagnóstico</strong> (el del menú 6.3, totalmente enmascarado); el operador ayudado lo acepta o lo envía por su cuenta (opción 10), y quien ayuda lo copia en su Escritorio. Quien ayuda recibe una <strong>alerta</strong> en su teléfono (ntfy de su estación) cuando una estación seguida deja de dar noticias, cuando vuelve, o cuando señala un evento crítico."
quand = "Cuando un operador necesita ayuda con su estación, o cuando usted la pide: al teléfono con quien ayuda, menú abierto en ambos lados."
modifie = "Los enlaces, el seudónimo y lo que se envía, guardados aparte en la carpeta de estado (no en station.toml); todo pasa cifrado por el relé. Nada toca la radio: la estación que ayuda solo puede leer y PEDIR, nunca mandar; el operador ayudado puede detenerlo todo en cualquier momento."
admin = true
expert = "<p>La consola deja su solicitud para el módulo « monlink » (archivo <code>monlink-request.json</code> de la carpeta de estado, con <code>sudo</code> si hace falta) y lee su respuesta (<code>monlink/console-reply.json</code>, borrada tras un minuto). La función se activa en <code>station.toml</code> (menú 8.1): <code>[monitor_link] enabled = true</code> y « monlink » en <code>[modules] run</code>, luego reiniciar la estación. Todo lo enviado va enmascarado (contraseñas, direcciones, números de serie, nombre del equipo). El código sirve una vez y caduca a los 15 minutos; cifras distintas = enlace rechazado. Detalle: <code>docs/cdc-monitoring.md</code> § 17.</p>"

# ------------------------------------------------------------------ solución de problemas avanzada

[menus.analyzer]
role = "Da el enlace del <strong>analizador de los informes de diagnóstico</strong>: una página del sitio rf-diy.com donde se deposita el zip del menú 6.3 (o el recibido de un amigo por el monitoring, menú 6.5 opción 10). El análisis se hace <strong>en tu navegador</strong>: el informe no se envía a ninguna parte. La página está en francés."
quand = "Después del menú 6.3, para ver los problemas encontrados antes de pedir ayuda, o cuando ayudas a alguien que te ha enviado su informe."
modifie = "Nada: el menú solo muestra el enlace y los pasos a seguir."
admin = false

[menus.screen_share]
role = "<strong>Pantalla compartida</strong>, solo lectura, a través del relé de rf-diy.com (cifrada de extremo a extremo). Opción 1 (Debian y Raspberry Pi): la consola da un código de 10 caracteres que dictas a la persona que te ayuda, y se reinicia; todo lo que se muestra lo ve ella en directo. Opción 2 (en todas partes, Windows incluido): escribes el código dictado por un amigo y ves su consola. Quien mira no puede <strong>escribir nada</strong>: el amigo escribe lo que le dicen (por teléfono, por ejemplo). <strong>Ctrl+]</strong> detiene la compartición (la consola sigue); salir de la consola lo detiene todo; 2 horas como máximo. También en línea de órdenes: <code>trx-console --partage</code> y <code>trx-console --voir CÓDIGO</code>."
quand = "Cuando un amigo no consigue instalar o configurar su estación: comparte su pantalla y tú lo guías de viva voz viendo lo que ve. Funciona incluso antes de que exista station.toml. Solo en la consola de texto (terminal o SSH), no en la consola web; la ventana de quien mira debe ser al menos tan grande como la del amigo (el título de la ventana lo indica)."
modifie = "Nada en la estación: la consola solo se reinicia bajo un pseudoterminal mientras dura la compartición, y su pantalla se envía al relé, que la borra al cabo de 10 minutos o al final de la compartición."
admin = false

[menus.config_download]
role = "Hace una <strong>copia de seguridad de station.toml</strong> (todos los ajustes de la estación) en el Escritorio; en la consola web, un botón la descarga en tu dispositivo. La copia contiene las huellas de las contraseñas y la dirección de las alertas ntfy: guárdala para ti."
quand = "Antes de un cambio importante, antes de reinstalar la estación o para guardar una copia de los ajustes fuera de la estación."
modifie = "Nada: la configuración no cambia; se escribe una copia fechada en el Escritorio de la cuenta de la consola."
admin = false

[[expert]]
titre = "Cabecera de la consola"
texte = """
<p>La primera línea da la <strong>versión instalada</strong>, la segunda el estado (en marcha, detenida, aún no
configurada). Una vez configurada la estación aparecen la <strong>dirección</strong> para llegar a ella desde la
página web o la aplicación (direcciones IP del equipo y puerto; « solo este equipo » si solo escucha en
local) y luego el <strong>estado del transceptor</strong>: tensión de alimentación y temperatura, tal como la estación las
lee (« — »: valor que el transceptor no proporciona; el IC-7300MK2, por ejemplo, no da su temperatura;
« medidas no disponibles »: estación detenida). La última línea da el <strong>identificador de la estación</strong>:
un código único creado en el primer arranque, que permite relacionar varios informes de una misma estación. No se
envía a ningún sitio automáticamente.</p>
"""

[[expert]]
titre = "Archivos útiles (Debian)"
texte = """
<ul>
<li><code>/etc/trx-remote/station.toml</code>: configuración (modificar con el menú 8.1).</li>
<li><code>/var/lib/trx-remote/</code>: estado de la estación (bloqueo de seguridad, memorias, informes de la página, identificador <code>station-id</code>, DX Cluster).</li>
<li><code>/run/trx-remote/gateway-status.json</code>: estado en directo publicado por la pasarela (leído por el panel).</li>
<li><code>/opt/trx-remote/releases/</code>: versiones instaladas una junto a otra; <code>/opt/trx-remote/current</code> apunta a la versión activa.</li>
<li><code>/var/log/trx-remote-install.log</code>: informe de las instalaciones y actualizaciones.</li>
</ul>
"""

[[expert]]
titre = "Lecturas del transceptor (solo lectura)"
texte = """
<p>Para un transceptor Icom con un segundo puerto CI-V (espectro), una lectura en bruto de los ajustes, sin ninguna escritura,
ayuda a establecer el formato real de las respuestas. Con la estación detenida (menú 1.2):</p>
<pre>/opt/trx-remote/current/venv/bin/python -m trxstation.devtools.civ_scope --port /dev/serial/by-id/&lt;port-B&gt; --reglages</pre>
<p>El resultado se guarda en una carpeta <code>spectre-reglages-…</code>: adjúntala a tu solicitud.</p>
"""

[[expert]]
titre = "Comunicar un problema"
texte = """
<ol>
<li>En la página web: sección « Signaler un problème » (texto revisado antes del envío).</li>
<li>En la estación: menú 6.3 (informe de solución de problemas) y, si hace falta, el resultado del menú 8.2.</li>
<li>Describe lo que estabas haciendo, lo que esperabas y lo que pasó, con la hora aproximada.</li>
</ol>
"""
