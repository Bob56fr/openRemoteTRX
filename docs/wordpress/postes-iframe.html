<!-- Postes essayés avec openRemoteTRX (tableaux de comparaison et fiche de chaque poste), affichés depuis GitHub Pages.
     À coller UNE FOIS dans un bloc « HTML personnalisé » de WordPress : la page se met à jour toute seule à chaque
     fiche ajoutée ou corrigée dans le dépôt (docs/postes/donnees/). La page envoie sa hauteur ; ce petit script
     l'applique à l'iframe (pas de double barre de défilement). Seuls les messages de GitHub Pages sont acceptés. -->
<iframe id="trx-postes-doc" src="https://bob56fr.github.io/openRemoteTRX/postes/" title="Postes essayés avec openRemoteTRX"
        loading="lazy" referrerpolicy="no-referrer"
        sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"
        style="display:block;width:100%;height:3200px;border:0;border-radius:8px;background:#0f141c"></iframe>
<p style="font-size:.9em;opacity:.75">Page introuvable ? <a href="https://bob56fr.github.io/openRemoteTRX/postes/"
   target="_blank" rel="noopener noreferrer">Ouvrir la liste des postes dans un nouvel onglet</a>.</p>
<script>
(function () {
  var frame = document.getElementById("trx-postes-doc");
  window.addEventListener("message", function (event) {
    if (event.origin !== "https://bob56fr.github.io" || event.source !== frame.contentWindow) return;
    var data = event.data;
    if (!data || data.type !== "trx-doc-height") return;
    var height = Number(data.height);
    if (isFinite(height) && height >= 200 && height <= 60000) frame.style.height = Math.ceil(height) + "px";
  });
})();
</script>
