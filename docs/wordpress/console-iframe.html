<!-- Mode d'emploi de TRX Console, affiché depuis GitHub Pages. À coller UNE FOIS dans un bloc « HTML personnalisé »
     de WordPress : la page se met à jour toute seule à chaque version publiée.
     La page envoie sa hauteur ; ce petit script l'applique à l'iframe (pas de double barre de défilement).
     Seuls les messages venant de GitHub Pages du projet sont acceptés. -->
<iframe id="trx-console-doc" src="https://bob56fr.github.io/openRemoteTRX/console/" title="Mode d'emploi de TRX Console"
        loading="lazy" referrerpolicy="no-referrer"
        sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"
        style="display:block;width:100%;height:2400px;border:0;border-radius:8px;background:#0f141c"></iframe>
<p style="font-size:.9em;opacity:.75">Page introuvable ? <a href="https://bob56fr.github.io/openRemoteTRX/console/"
   target="_blank" rel="noopener noreferrer">Ouvrir le mode d'emploi dans un nouvel onglet</a>.</p>
<script>
(function () {
  var frame = document.getElementById("trx-console-doc");
  window.addEventListener("message", function (event) {
    if (event.origin !== "https://bob56fr.github.io" || event.source !== frame.contentWindow) return;
    var data = event.data;
    if (!data || data.type !== "trx-doc-height") return;
    var height = Number(data.height);
    if (isFinite(height) && height >= 200 && height <= 40000) frame.style.height = Math.ceil(height) + "px";
  });
})();
</script>
