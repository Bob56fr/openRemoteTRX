<!-- Guide de l'opérateur (mise en service d'une station), affiché depuis GitHub Pages. À coller UNE FOIS dans un
     bloc « HTML personnalisé » de WordPress : la page se met à jour toute seule à chaque publication.
     La page envoie sa hauteur ; ce petit script l'applique à l'iframe (pas de double barre de défilement).
     Seuls les messages venant de GitHub Pages du projet sont acceptés.
     « allow-same-origin » laisse la page (origine github.io, distincte du site) garder les cases cochées du
     récapitulatif dans le navigateur ; elle n'a aucun accès au site WordPress. -->
<iframe id="trx-guide" src="https://bob56fr.github.io/openRemoteTRX/guide/" title="Guide de l'opérateur openRemoteTRX"
        loading="lazy" referrerpolicy="no-referrer"
        sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-modals"
        style="display:block;width:100%;height:4000px;border:0;border-radius:8px;background:#0f141c"></iframe>
<p style="font-size:.9em;opacity:.75">Page introuvable ? <a href="https://bob56fr.github.io/openRemoteTRX/guide/"
   target="_blank" rel="noopener noreferrer">Ouvrir le guide dans un nouvel onglet</a>.</p>
<script>
(function () {
  var frame = document.getElementById("trx-guide");
  window.addEventListener("message", function (event) {
    if (event.origin !== "https://bob56fr.github.io" || event.source !== frame.contentWindow) return;
    var data = event.data;
    if (!data || data.type !== "trx-doc-height") return;
    var height = Number(data.height);
    if (isFinite(height) && height >= 200 && height <= 60000) frame.style.height = Math.ceil(height) + "px";
  });
})();
</script>
