<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 672" width="760" height="672" role="img" aria-labelledby="a-titre a-desc" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <title id="a-titre">Drei Seiten der Station im Browser</title>
  <desc id="a-desc">Drei getrennte Seiten, jede direkt mit ihrem eigenen Port des Stations-PCs verbunden, unter derselben Adresse: die Web-App (https://&lt;station&gt;:8443) zum Steuern des Transceivers, die einzige, die senden kann; openRemoteTRX Console (https://&lt;station&gt;:8444) zum Einrichten und zur Fehlersuche, nur für Administratorkonten; das Dashboard der Vitalwerte (https://&lt;station&gt;:8450), nur lesend, unter Debian und Raspberry Pi.</desc>
