<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 990" width="640" height="990" role="img" aria-labelledby="titre desc" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <title id="titre">Les briques d'une station openRemoteTRX</title>
  <desc id="desc">De haut en bas : l'utilisateur (navigateur ou application Android) joint par le réseau la passerelle du PC de la station ; la passerelle commande le poste par rigctld (Hamlib) et échange le son avec sa carte son ; le superviseur surveille le tout, ne peut que couper l'émission et envoie les alertes ntfy ; openRemoteTRX Console, trx-monitor et l'indicateur lisent l'état ; station.toml porte la configuration ; le poste est relié par un seul câble USB.</desc>
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa8bb"/>
    </marker>
    <marker id="flecheR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e0524a"/>
    </marker>
  </defs>
  <rect width="640" height="990" rx="14" fill="#0f141c"/>

  <!-- Côté utilisateur -->
  <text x="20" y="34" fill="#9aa8bb" font-size="15" font-weight="600" letter-spacing=".5">CÔTÉ UTILISATEUR</text>
  <rect x="20" y="48" width="285" height="96" rx="10" fill="#171e29" stroke="#4c9be8" stroke-width="2"/>
  <text x="162" y="84" fill="#dbe3ee" font-size="19" font-weight="700" text-anchor="middle">Navigateur</text>
  <text x="162" y="108" fill="#9aa8bb" font-size="15" text-anchor="middle">la page web de la station</text>
  <text x="162" y="128" fill="#9aa8bb" font-size="15" text-anchor="middle">(PC, tablette, téléphone)</text>
  <rect x="335" y="48" width="285" height="96" rx="10" fill="#171e29" stroke="#4c9be8" stroke-width="2"/>
  <text x="477" y="84" fill="#dbe3ee" font-size="19" font-weight="700" text-anchor="middle">Application Android</text>
  <text x="477" y="108" fill="#9aa8bb" font-size="15" text-anchor="middle">openRemoteTRX</text>
  <text x="477" y="128" fill="#9aa8bb" font-size="15" text-anchor="middle">+ Android Auto en voiture</text>

  <!-- Réseau -->
  <line x1="162" y1="146" x2="162" y2="268" stroke="#9aa8bb" stroke-width="2" marker-start="url(#fleche)" marker-end="url(#fleche)"/>
  <line x1="477" y1="146" x2="477" y2="268" stroke="#9aa8bb" stroke-width="2" marker-start="url(#fleche)" marker-end="url(#fleche)"/>
  <rect x="80" y="172" width="480" height="66" rx="33" fill="#0b1017" stroke="#2a3445" stroke-width="1.5"/>
  <text x="320" y="200" fill="#dbe3ee" font-size="16" font-weight="600" text-anchor="middle">Réseau local, VPN ou Internet</text>
  <text x="320" y="223" fill="#9aa8bb" font-size="14" text-anchor="middle">HTTPS port 8443 (commandes) + WebRTC (son)</text>

  <!-- PC de la station -->
  <rect x="10" y="252" width="620" height="540" rx="12" fill="none" stroke="#2a3445" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="360" y="742" fill="#9aa8bb" font-size="15" font-weight="600" letter-spacing=".5">PC DE LA STATION</text>
  <text x="360" y="764" fill="#9aa8bb" font-size="14">(Debian ou Windows)</text>

  <rect x="30" y="272" width="580" height="110" rx="10" fill="#171e29" stroke="#4c9be8" stroke-width="2.5"/>
  <text x="320" y="306" fill="#dbe3ee" font-size="20" font-weight="700" text-anchor="middle">Passerelle  ·  trx-gateway</text>
  <text x="320" y="331" fill="#9aa8bb" font-size="15" text-anchor="middle">sert la page, vérifie les comptes, transporte le son,</text>
  <text x="320" y="352" fill="#9aa8bb" font-size="15" text-anchor="middle">décide de l'émission : PTT en bascule, TOT, bandes,</text>
  <text x="320" y="373" fill="#9aa8bb" font-size="15" text-anchor="middle">retour en réception si le téléphone ne répond plus</text>

  <rect x="30" y="432" width="270" height="96" rx="10" fill="#171e29" stroke="#4c9be8" stroke-width="2"/>
  <text x="165" y="466" fill="#dbe3ee" font-size="19" font-weight="700" text-anchor="middle">rigctld (Hamlib)</text>
  <text x="165" y="490" fill="#9aa8bb" font-size="15" text-anchor="middle">parle au poste ; écoute sur</text>
  <text x="165" y="510" fill="#9aa8bb" font-size="15" text-anchor="middle">cette machine seulement</text>

  <rect x="340" y="432" width="270" height="96" rx="10" fill="#171e29" stroke="#e0524a" stroke-width="2"/>
  <text x="475" y="466" fill="#dbe3ee" font-size="19" font-weight="700" text-anchor="middle">Superviseur</text>
  <text x="475" y="490" fill="#9aa8bb" font-size="15" text-anchor="middle">trx-supervisor : surveille,</text>
  <text x="475" y="510" fill="#9aa8bb" font-size="15" text-anchor="middle">ne peut que COUPER l'émission</text>

  <rect x="90" y="580" width="210" height="80" rx="10" fill="#171e29" stroke="#3fae72" stroke-width="2"/>
  <text x="195" y="613" fill="#dbe3ee" font-size="18" font-weight="700" text-anchor="middle">station.toml</text>
  <text x="195" y="638" fill="#9aa8bb" font-size="15" text-anchor="middle">la configuration</text>

  <rect x="340" y="580" width="270" height="110" rx="10" fill="#171e29" stroke="#3fae72" stroke-width="2"/>
  <text x="475" y="612" fill="#dbe3ee" font-size="18" font-weight="700" text-anchor="middle">Outils de la station</text>
  <text x="475" y="636" fill="#9aa8bb" font-size="15" text-anchor="middle">openRemoteTRX Console, trx-monitor,</text>
  <text x="475" y="656" fill="#9aa8bb" font-size="15" text-anchor="middle">indicateur : lisent l'état ;</text>
  <text x="475" y="676" fill="#9aa8bb" font-size="15" text-anchor="middle">seule action : STOP TX</text>

  <!-- Flux internes -->
  <line x1="165" y1="384" x2="165" y2="430" stroke="#9aa8bb" stroke-width="2" marker-end="url(#fleche)"/>
  <text x="173" y="412" fill="#9aa8bb" font-size="13">commandes</text>
  <line x1="475" y1="430" x2="475" y2="386" stroke="#e0524a" stroke-width="2" marker-end="url(#flecheR)"/>
  <text x="483" y="412" fill="#e0524a" font-size="13">surveille, relance</text>
  <line x1="338" y1="470" x2="302" y2="470" stroke="#e0524a" stroke-width="2" marker-end="url(#flecheR)"/>

  <!-- Vers le poste et les alertes -->
  <line x1="55" y1="530" x2="55" y2="838" stroke="#9aa8bb" stroke-width="2" marker-end="url(#fleche)"/>
  <text x="62" y="740" fill="#9aa8bb" font-size="14">CAT</text>
  <line x1="320" y1="384" x2="320" y2="838" stroke="#9aa8bb" stroke-width="2" marker-start="url(#fleche)" marker-end="url(#fleche)"/>
  <text x="328" y="560" fill="#9aa8bb" font-size="14">son</text>
  <polyline points="612,480 622,480 622,836" fill="none" stroke="#e0524a" stroke-width="2" marker-end="url(#flecheR)"/>

  <!-- Poste et alertes -->
  <rect x="30" y="840" width="380" height="130" rx="10" fill="#171e29" stroke="#dbe3ee" stroke-width="2"/>
  <text x="220" y="874" fill="#dbe3ee" font-size="20" font-weight="700" text-anchor="middle">Poste (TRX) : Yaesu FTDX10</text>
  <text x="220" y="900" fill="#9aa8bb" font-size="15" text-anchor="middle">un seul câble USB :</text>
  <text x="220" y="922" fill="#9aa8bb" font-size="15" text-anchor="middle">CAT par l'« Enhanced COM Port »</text>
  <text x="220" y="944" fill="#9aa8bb" font-size="15" text-anchor="middle">son par l'« USB Audio CODEC »</text>

  <rect x="430" y="840" width="195" height="130" rx="10" fill="#171e29" stroke="#e0524a" stroke-width="2"/>
  <text x="527" y="878" fill="#dbe3ee" font-size="18" font-weight="700" text-anchor="middle">Alertes ntfy</text>
  <text x="527" y="904" fill="#9aa8bb" font-size="15" text-anchor="middle">sur ton téléphone :</text>
  <text x="527" y="926" fill="#9aa8bb" font-size="15" text-anchor="middle">coupure, panne,</text>
  <text x="527" y="948" fill="#9aa8bb" font-size="15" text-anchor="middle">mode sûr</text>

  <!-- Étiquette posée par-dessus la ligne du son (croisement) -->
  <rect x="305" y="441" width="30" height="17" rx="3" fill="#0f141c"/>
  <text x="320" y="454" fill="#e0524a" font-size="13" font-weight="700" text-anchor="middle">T 0</text>
</svg>
