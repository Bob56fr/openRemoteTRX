# Notice des réglages de station.toml (page publique, thème sombre, iframe du site rf-diy.com).
# La LISTE des réglages et leurs valeurs par défaut viennent du code (trxstation/config.py) ; les explications d'ici.
# Un réglage sans explication, ou une explication sans réglage, arrête scripts/build_station_toml_doc.py et les tests.
# Contenu public : exemples génériques seulement, jamais d'adresse IP réelle, de nom de machine, d'identifiant ni de clé.
#
# [reglages."section.cle"] : role (obligatoire), niveau = "courant" | "expert", et au besoin : bornes, securite,
# exemple, defaut (remplace la valeur du code quand elle dépend du système), depuis (version d'apparition).

[page]
titre = "Réglages de la station : station.toml"
intro = """
<p><code>station.toml</code> est le fichier de configuration de la station : le poste, les cartes son, le réseau, les
sécurités d'émission, les comptes, les fonctions facultatives. Il est écrit par l'assistant de TRX Console et se modifie
ensuite par TRX Console (menu 8.1, et les menus spécialisés cités pour chaque section). La station le <strong>vérifie</strong>
à chaque démarrage : une valeur incohérente est refusée avec un message précis, jamais ignorée en silence.</p>
"""
lecture = """
<p><strong>Débutant</strong> : seuls les réglages <span class="courant">courant</span> vous concernent ; l'assistant les règle
pour vous. Les réglages <span class="pro">expert</span> ont des valeurs par défaut sûres : n'y touchez qu'en connaissance
de cause. Emplacement du fichier : <code>/etc/trx-remote/station.toml</code> (Debian, Raspberry Pi),
<code>C:\\ProgramData\\trx-remote\\station.toml</code> (Windows).</p>
"""

# ---------------------------------------------------------------- sections

[sections.racine]
titre = "En-tête du fichier"
intro = "<p>Deux numéros gérés par la station elle-même.</p>"
ou = "Rien à faire : écrits par la station."
relu = "redemarrage"

[sections.rig]
titre = "Le poste [rig]"
intro = "<p>Le transceiver piloté par Hamlib : modèle, liaison CAT, commande du PTT, modes et puissance.</p>"
ou = "Assistant (menu 2.1), profils de poste (menu 2.3), ou menu 8.1."
relu = "redemarrage"

[sections.audio]
titre = "Le son [audio]"
intro = "<p>Les deux sens audio entre la station et le poste (interface son type Digirig, SignaLink, ou carte USB du poste).</p>"
ou = "Assistant (menu 2.1), profils de poste (menu 2.3), ou menu 8.1."
relu = "redemarrage"

[sections.tools]
titre = "Outils [tools]"
intro = "<p>Où trouver Hamlib quand il n'est pas dans le chemin du système.</p>"
ou = "Assistant (menu 2.1) ou menu 8.1."
relu = "redemarrage"

[sections.network]
titre = "Réseau [network]"
intro = "<p>Comment la page web et l'application joignent la station. Voir aussi le guide d'accès distant (VPN ou port exposé avec HTTPS).</p>"
ou = "Assistant (menu 2.1), appairage d'un téléphone (menu 4.1), ou menu 8.1."
relu = "redemarrage"

[sections.safety]
titre = "Sécurités d'émission [safety]"
intro = "<p>Les règles que la station applique à TOUTE émission demandée à distance, indépendamment de la page et de l'application.</p>"
ou = "Menu 8.1 ; seuils de température : menu 3.1 ; rediffusion : assistant (menu 2.1)."
relu = "redemarrage"

[sections.bands]
titre = "Bandes autorisées [[bands]]"
intro = """
<p>Une entrée par bande où l'émission est permise. <strong>Liste vide = réception seule.</strong> Les bandes proposées
par l'assistant (IARU Région 1) sont un point de départ : vérifiez-les pour votre licence et votre pays.</p>
"""
ou = "Assistant (menu 2.1) ou menu 8.1."
relu = "redemarrage"

[sections.clients]
titre = "Comptes [[clients]]"
intro = "<p>Une entrée par compte qui peut se connecter : opérateurs (contrôle complet) et visiteurs (écoute seule).</p>"
ou = "Assistant (menu 2.1), visiteurs (menu 4.2), commande <code>trx-setup --add-client</code>."
relu = "chaud"

[sections.access]
titre = "Visiteurs en réception seule [access]"
intro = "<p>Des comptes qui écoutent la station et voient l'écran de l'opérateur, sans aucune commande vers le poste.</p>"
ou = "Menu 4.2."
relu = "chaud"

[sections.swr]
titre = "Mesure de TOS [swr]"
intro = "<p>La courbe de TOS de l'antenne, lancée depuis la page ou l'application : une courte porteuse FM par point. Dernière mesure : menu 5.4.</p>"
ou = "Menu 8.1."
relu = "redemarrage"

[sections.power]
titre = "Allumage et extinction du poste à distance [power]"
intro = "<p>Allumer le poste à la connexion d'un opérateur et l'éteindre depuis la page ou l'application (STOP maintenu 3 s). Hors service par défaut. Seulement pour un poste qui le permet par la CAT (Hamlib : « set / get Power Stat ») et qui garde son USB alimenté une fois éteint. La station n'émet jamais pour allumer ou éteindre le poste.</p>"
ou = "TRX Console, menu 2.8 (mise en service avec un essai éteindre / rallumer) ; réglages fins : menu 8.1."
relu = "redemarrage"

[sections.breizh]
titre = "Breizh Audio Box dans l'émission [breizh]"
intro = "<p>Le son du micro passe par Breizh Audio Box (traitement de la voix) sur un autre PC du réseau local avant d'aller au poste. Si Breizh ne répond plus, la station repasse seule en direct. Le son du micro circule EN CLAIR sur le réseau local : seulement sur un réseau de confiance.</p>"
ou = "Menu 8.1 ; la clé d'appairage se crée avec TRX Console (fichier <code>breizh.key</code> à côté de station.toml)."
relu = "redemarrage"

[sections.netprobe]
titre = "Sonde de qualité réseau [netprobe]"
intro = "<p>La station mesure en continu la liaison avec chaque téléphone ou navigateur connecté (pertes, temps aller-retour, gigue, coupures) et dit après une coupure quel tronçon a probablement lâché. Un petit indicateur l'affiche ; les statistiques des 30 derniers jours, l'effacement et l'export sont dans la page et l'application. La sonde ne fait que mesurer : elle n'agit jamais sur l'émission.</p>"
ou = "Menu 8.1. Les seuils de l'indicateur choisis dans la page ou l'application (statistiques, rubrique « Seuils ») sont rangés à part et priment sur ceux d'ici."
relu = "redemarrage"

[sections.presence]
titre = "Présence de groupe [presence]"
intro = "<p>Un groupe d'amis équipés d'openRemoteTRX voit qui est actif sur sa station et, si chacun le veut, sur quelle fréquence et dans quel mode. Un relais sur Internet transporte des états CHIFFRÉS qu'il ne peut pas lire. Le module « presence » n'a aucun droit sur le poste : il ne peut ni émettre ni changer de fréquence ; un QSY vers un ami se fait seulement par un appui de l'opérateur, en réception.</p>"
ou = "Menu 8.1, et ajouter « presence » à <code>[modules] run</code>. Les groupes, le pseudo et ce qui est partagé se règlent dans la page, l'application ou TRX Console (rangés à part, pas dans station.toml)."
relu = "redemarrage"

[sections.monitor_link]
titre = "Monitoring inter-stations [monitor_link]"
intro = "<p>Pour AIDER un opérateur en difficulté, ou ÊTRE AIDÉ, sans VPN ni port ouvert : la station de l'opérateur aidé envoie, par le même relais que la présence et chiffré de bout en bout, ce que SON opérateur a accepté (battement, santé de la machine, état du poste sans fréquence ni mode par défaut, codes d'erreur), toujours masqué (mots de passe, adresses, numéros de série). La station qui aide ne peut que lire et DEMANDER : aucune commande vers la station aidée n'existe. Le module « monlink » n'a aucun droit sur le poste.</p>"
ou = "Menu 8.1, et ajouter « monlink » à <code>[modules] run</code>. Pseudo, invitations, liaisons et profils d'envoi se règlent dans TRX Console (rangés à part, pas dans station.toml)."
relu = "redemarrage"

[sections.diffusion]
titre = "Diffusion en direct [diffusion]"
intro = "<p>Faire entendre le son du TRX à quelques internautes qui n'ont AUCUN compte sur la station, comme un podcast en direct : la station envoie le son à un serveur de diffusion (Icecast), et les auditeurs l'écoutent sur la page de ce serveur ou dans VLC. Ils ne joignent jamais la station. Fermée par défaut, privée par défaut (identifiant et mot de passe d'auditeur), 1 heure par défaut ; la voix émise par l'opérateur n'est diffusée que s'il le demande. Le module « diffusion » n'a aucun droit sur le poste. Aucun serveur n'est imposé : celui que donne l'administrateur du serveur, avec le mot de passe source et la clé des métadonnées (fichier à part, jamais dans station.toml).</p>"
ou = "Menu 8.1, et ajouter « diffusion » à <code>[modules] run</code>. Protocole : <code>docs/protocole-diffusion.md</code> du dépôt."
relu = "redemarrage"

[sections.remote_console]
titre = "TRX Console sur le réseau [remote_console]"
intro = "<p>TRX Console dans le navigateur, depuis n'importe quel PC, tablette ou téléphone du réseau local ou du VPN, sans SSH : <code>https://&lt;station&gt;:8444/</code>. On s'y connecte avec un compte <strong>opérateur marqué administrateur</strong> (<code>admin = true</code> dans <code>[[clients]]</code>) ; la session se ferme après 30 minutes sans action. La console tourne sous un compte Linux ordinaire, jamais root : le mot de passe sudo reste demandé dans le terminal, une fois par session. Jamais joignable depuis Internet (adresses publiques refusées).</p>"
ou = "Menu 4.6 de TRX Console."
relu = "redemarrage"

[sections.spectrum]
titre = "Spectre HF du poste [spectrum]"
intro = "<p>Le spectre et le waterfall HF du poste dans la page et l'application, par un second port du poste (Icom) ou par Hamlib.</p>"
ou = "Assistant (menu 2.1), profils de poste (menu 2.3), ou menu 8.1."
relu = "redemarrage"

[sections.freedv]
titre = "FreeDV en réception [freedv]"
intro = "<p>La station décode elle-même la voix numérique FreeDV (RADE V1) avec deux programmes de l'équipe FreeDV, lancés seulement quand l'opérateur choisit le mode FreeDV dans la page : tous les connectés, visiteurs compris, entendent alors la voix décodée à la place du son du poste, avec la synchro, le SNR et les indicatifs reçus. Réception seulement : rien n'est émis, et le poste n'est pas touché.</p>"
ou = "Menu 8.1 ; le mode FreeDV se choisit dans la page (rubrique « FreeDV »), il n'est pas gardé au redémarrage."
relu = "redemarrage"

[sections.sdr]
titre = "Récepteur SDR [sdr]"
intro = "<p>Un récepteur SDR en parallèle du TRX, en réception seule : son waterfall s'affiche dans la page (rubrique « SDR »). Le SDR est désigné par son numéro de série. Il faut installer à la main l'API du fabricant AVANT la station, qui compile alors le programme sdr-core, et ajouter « sdr » à <code>[modules] run</code>.</p>"
ou = "Menu 8.1 ; le centre, le gain et la cadence se règlent ensuite depuis la page."
relu = "redemarrage"

[sections.selcall]
titre = "SELCALL [selcall]"
intro = "<p>Squelch numérique par appel de groupe : le son reçu reste coupé jusqu'à l'appel de votre code.</p>"
ou = "Menu 8.1 ; le code et les options se règlent depuis la page ou l'application."
relu = "redemarrage"

[sections.cluster]
titre = "Cluster DX [cluster]"
intro = "<p>Les spots des clusters DX, du RBN et des cibistes, affichés sur le spectre et en liste.</p>"
ou = "Menu 8.1 ; mots de passe des sources : fichier <code>secrets.toml</code> (jamais ici)."
relu = "redemarrage"

[sections."cluster.source"]
titre = "Sources du Cluster DX [[cluster.source]]"
intro = "<p>Une entrée par source de spots (cluster telnet, RBN, site web).</p>"
ou = "Menu 8.1."
relu = "redemarrage"

[sections.supervisor]
titre = "Superviseur [supervisor]"
intro = """
<p>La seconde couche de sécurité, indépendante de la passerelle : elle surveille l'émission, rigctld et la machine, coupe
l'émission en cas de doute et relance ce qui ne répond plus.</p>
"""
ou = "Menu 8.1."
relu = "redemarrage"

[sections.modules]
titre = "Modules [modules]"
intro = "<p>Programmes complémentaires lancés à côté de la station (Cluster DX…), reliés par un bus local.</p>"
ou = "Menu 8.1."
relu = "redemarrage"

[sections.update]
titre = "Mises à jour [update]"
intro = "<p>Recherche des nouvelles versions publiées (rien n'est installé sans votre accord).</p>"
ou = "Menu 8.1 ; installation : menu 7.1."
relu = "redemarrage"

# ---------------------------------------------------------------- racine

[reglages."racine.schema_version"]
role = "Version du format du fichier. La station la met à jour elle-même lors d'une migration."
niveau = "expert"

[reglages."racine.config_revision"]
role = "Compteur incrémenté à chaque enregistrement par TRX Console : permet de savoir quelle version du fichier est en service."
niveau = "expert"

# ---------------------------------------------------------------- rig

[reglages."rig.model"]
role = "Numéro du modèle du poste dans Hamlib (liste : <code>rigctl -l</code>). 1 = poste factice, pour essayer sans matériel."
niveau = "courant"
exemple = "IC-7300MK2 : 3094 (Hamlib 4.7)."

[reglages."rig.port"]
role = "Port série de la liaison CAT. Sous Linux, préférez le nom stable <code>/dev/serial/by-id/…</code> (il ne change pas d'un redémarrage à l'autre)."
niveau = "courant"
exemple = "Windows : <code>COM8</code> ; Linux : <code>/dev/serial/by-id/usb-Silicon_Labs_…-if00-port0</code>."

[reglages."rig.speed"]
role = "Débit série de la liaison CAT. Vide : le débit par défaut de Hamlib pour ce modèle. Doit être identique au réglage du poste."
niveau = "courant"
exemple = "19200, 115200."

[reglages."rig.ptt_type"]
role = "Comment la station passe le poste en émission : <code>RIG</code> (commande CAT), <code>RTS</code> ou <code>DTR</code> (ligne d'un port série), <code>GPIO</code> / <code>GPION</code> (broche du Raspberry Pi), <code>NONE</code> (aucune : réception seule)."
niveau = "courant"
securite = "La station relit l'état du PTT après chaque commande ; avec <code>NONE</code>, aucune émission n'est possible."

[reglages."rig.ptt_port"]
role = "Port de la commande PTT quand elle n'est pas sur le port CAT (RTS ou DTR d'un autre port). Vide : le port CAT."
niveau = "expert"

[reglages."rig.extra_conf"]
role = "Options supplémentaires passées à rigctld (<code>-C nom=valeur</code>), pour un poste qui en a besoin."
niveau = "expert"
securite = "Interdits ici : les options du spectre (<code>async</code>, <code>multicast_…</code>, réglées par [spectrum]) et <code>cache_timeout</code>. La station lance toujours rigctld avec <code>cache_timeout=0</code> (depuis 0.134.0) : avec un cache, rigctld renvoie après une coupure la valeur commandée au lieu de l'état réel du poste, et un poste resté en émission paraîtrait coupé."
exemple = "[\"civaddr=0x94\"]"

[reglages."rig.tx_modes"]
role = "Modes dans lesquels l'émission est permise ; vide = tous. Sur les Icom, l'audio de la carte son USB n'est émis qu'en modes données (USB-D, LSB-D, FM-D…) : dans un autre mode, le poste modulerait avec son propre micro."
niveau = "courant"
securite = "Une demande d'émission dans un mode absent de la liste est refusée. La mesure de TOS utilise le premier mode FM permis ici (FM, PKTFM ou FM-D)."
exemple = "Icom : [\"PKTUSB\", \"PKTLSB\", \"FM-D\", \"AM-D\"]."

[reglages."rig.max_power_w"]
role = "Puissance maximale du poste en watts. 0 : inconnue, la page et l'application affichent des pourcentages au lieu de watts."
niveau = "courant"
exemple = "100 pour un poste de 100 W."

[reglages."rig.tuner"]
role = "Le coupleur d'antenne intégré du poste est utilisé. À chaque connexion d'un opérateur, la station lit alors les réglages d'accord automatique du poste par le second port CI-V (IC-7300MK2 : [TUNER] Switch = Auto, PTT Start = ON) et prévient s'ils sont faux ou impossibles à vérifier. Elle ne les change jamais."
niveau = "courant"
securite = "À distance, sans accord automatique à la prise d'émission, une nouvelle fréquence peut émettre sur un TOS élevé. Hors des bandes radioamateur, l'accord au PTT n'est pas garanti par le poste."
exemple = "true si l'antenne passe par le coupleur du poste ; false (défaut) sinon."
depuis = "0.210.0"

[reglages."rig.port_usb"]
role = "Identité USB du port du poste (fabricant, produit, numéro de série, interface), relevée à la mise en service de l'allumage à distance. Avant chaque allumage, la station vérifie que le port de <code>port</code> est TOUJOURS celui du poste ; s'il a changé (autre prise USB sous Windows), l'allumage est refusé et le nouveau port est nommé."
niveau = "expert"
securite = "La station ne fait que LIRE cette identité ; elle n'ouvre jamais un autre port de sa propre initiative (un port série ouvert par erreur peut lever RTS ou DTR, donc un PTT)."
exemple = "<code>10C4:EA70 SN=01D0F21E IF=00</code> (port « Enhanced » du CP2105 d'un FTDX10) ; vide = non relevée."
depuis = "0.222.0"

[reglages."rig.ptt_port_usb"]
role = "Identité USB du port du PTT quand il est séparé du port du poste (PTT par RTS ou DTR) ; même vérification que <code>port_usb</code>."
niveau = "expert"
exemple = "Vide (défaut) : PTT par la CAT, ou port non relevé."
depuis = "0.222.0"

# ---------------------------------------------------------------- audio

[reglages."audio.capture_device"]
role = "Carte son qui reçoit l'audio du poste (le son entendu à distance). Vide : la carte par défaut du système."
niveau = "courant"
exemple = "Linux : <code>plughw:CARD=CODEC,DEV=0</code> ; Windows : <code>Microphone (USB Audio CODEC)</code>."

[reglages."audio.playback_device"]
role = "Carte son qui envoie l'audio vers le poste (votre voix en émission). Vide : la carte par défaut du système."
niveau = "courant"

[reglages."audio.sample_rate"]
role = "Fréquence d'échantillonnage. Seule la valeur 48 000 est gérée (codec Opus)."
niveau = "expert"
bornes = "48000 uniquement."

[reglages."audio.rx_gain_db"]
role = "Gain appliqué au son reçu, en dB (négatif = moins fort), pour tous les terminaux, visiteurs et diffusion compris. Réglé par TRX Console, menu 2.9, qui propose une valeur d'après le niveau reçu."
niveau = "courant"
bornes = "-40 à +20 dB."

[reglages."audio.rx_limiter"]
role = "Limiteur du son reçu : crêtes plafonnées à -1 dBFS avant les terminaux, pour qu'un gain fort ou un signal puissant ne sature pas. <code>false</code> = gain appliqué sans plafond (saturation possible), pour un diagnostic seulement. TRX Console, menu 2.9."
niveau = "courant"
depuis = "0.227.0"
exemple = "rx_limiter = true"

[reglages."audio.tx_gain_db"]
role = "Gain appliqué au son envoyé au poste, en dB."
niveau = "courant"
securite = "Un excès sature l'émetteur : réglez-le sur charge fictive en surveillant l'ALC."

# ---------------------------------------------------------------- tools

[reglages."tools.hamlib_dir"]
role = "Dossier d'installation de Hamlib sous Windows (celui qui contient <code>bin\\rigctld.exe</code>). Vide : Hamlib doit être dans le PATH."
niveau = "courant"
exemple = "<code>C:\\Program Files\\hamlib-w64-4.7.2</code>"

# ---------------------------------------------------------------- network

[reglages."network.rigctld_host"]
role = "Adresse d'écoute de rigctld, le service Hamlib qui parle au poste."
niveau = "expert"
securite = "rigctld n'a AUCUNE authentification : il doit écouter en local seulement (127.0.0.1). La station refuse toute autre valeur."

[reglages."network.rigctld_port"]
role = "Port local de rigctld."
niveau = "expert"

[reglages."network.gateway_bind"]
role = "Adresse d'écoute de la station pour la page et l'application. <code>127.0.0.1</code> : cette machine seulement ; l'adresse de la machine sur votre VPN ; ou <code>0.0.0.0</code> : toutes ses adresses."
niveau = "courant"
securite = "Hors de la machine, HTTPS est exigé (<code>tls_cert</code>, <code>tls_key</code>), sauf <code>allow_insecure_http</code> dans un VPN."

[reglages."network.gateway_port"]
role = "Port de la station pour la page web et l'application."
niveau = "courant"

[reglages."network.web_client"]
role = "Sert la page web de contrôle sur le même port que l'application. false : application seulement."
niveau = "expert"

[reglages."network.tls_cert"]
role = "Certificat HTTPS de la station (fichier PEM). L'assistant en génère un ; son empreinte sert à l'appairage du téléphone (menu 4.1)."
niveau = "courant"

[reglages."network.tls_key"]
role = "Clé privée du certificat HTTPS."
niveau = "courant"
securite = "Fichier secret : il ne doit être lisible que par la station."

[reglages."network.allow_insecure_http"]
role = "Autorise l'écoute hors de la machine SANS HTTPS. À n'accepter que dans un VPN qui chiffre déjà tout."
niveau = "expert"
securite = "Sur Internet sans VPN, mots de passe et audio passeraient en clair : laissez false."

[reglages."network.trusted_proxies"]
role = "Adresses (ou plages) des relais de confiance devant la station, dont l'en-tête X-Forwarded-For est cru pour connaître l'adresse réelle du client."
niveau = "expert"

[reglages."network.ice_servers"]
role = "Serveurs STUN/TURN pour établir l'audio (WebRTC) à travers Internet. [] : réseau local ou VPN seulement."
niveau = "expert"

# ---------------------------------------------------------------- safety

[reglages."safety.tot_s"]
role = "Temps maximal d'une émission (TOT) en secondes : au-delà, la station repasse en réception, avec un bip d'avertissement avant."
niveau = "courant"
bornes = "Au-dessus de 0 et au plus <code>tot_ceiling_s</code>."
securite = "Limite aussi la durée d'un enregistrement rediffusé (TOT moins 5 s)."

[reglages."safety.tot_ceiling_s"]
role = "Plafond du TOT : la valeur de <code>tot_s</code> ne peut pas le dépasser."
niveau = "courant"
securite = "Le superviseur coupe de son côté au-delà de <code>[supervisor] tot_abs_s</code>, qui doit rester plus grand."

[reglages."safety.enforce_bands"]
role = "true : la station refuse d'émettre hors des <code>[[bands]]</code>. false : c'est le poste qui l'interdit (par exemple le « TX limit » des Icom) ; la responsabilité vous revient."
niveau = "courant"
securite = "Avec true et une liste de bandes vide, aucune émission n'est possible (réception seule)."

[reglages."safety.warn_before_s"]
role = "Secondes avant la fin du TOT où l'avertissement est donné."
niveau = "expert"
bornes = "Entre 0 et <code>tot_s</code>."

[reglages."safety.heartbeat_interval_ms"]
role = "Cadence attendue des battements du téléphone ou de la page pendant une émission (preuve que le client est toujours là)."
niveau = "expert"

[reglages."safety.heartbeat_timeout_ms"]
role = "Sans battement depuis ce délai, la station repasse en réception (client perdu, réseau coupé)."
niveau = "expert"
securite = "Ne l'augmentez pas sans raison : c'est ce qui coupe une émission dont le client a disparu."

[reglages."safety.rig_temp_warn_c"]
role = "Température du poste (si Hamlib la donne) à partir de laquelle un avertissement est affiché et envoyé."
niveau = "courant"
bornes = "Entre 20 et 90 °C, plus petit que <code>rig_temp_cut_c</code>."

[reglages."safety.rig_temp_cut_c"]
role = "Au-delà, l'émission à distance est coupée et refusée jusqu'au retour sous <code>rig_temp_warn_c</code>."
niveau = "courant"

[reglages."safety.swr_alert"]
role = "TOS au-dessus duquel la station prévient l'opérateur qui émet (bandeau rouge et bip dans la page), si le TOS lu reste au-dessus plus d'une seconde ; une alerte par émission. 0 : arrêt."
niveau = "courant"
bornes = "0, ou de 1,2 à 10."
securite = "Alerte SEULEMENT : la station ne coupe jamais l'émission pour un TOS élevé (le poste réduit déjà sa puissance de lui-même)."
exemple = "2.0 (défaut)."
depuis = "0.212.0"

[reglages."safety.allow_replay"]
role = "Autorise la rediffusion d'un enregistrement de l'audio reçu (page et application) : enregistrer un correspondant puis le renvoyer en émission. Demandé par l'assistant à l'ajout du poste ; refusé par défaut."
niveau = "courant"
securite = "Rediffuser l'émission d'une station à des tiers est en général INTERDIT au service amateur : n'activez qu'en connaissance de cause, sous votre responsabilité."
depuis = "0.91.0"

[reglages."safety.rig_tot_warn"]
role = "TOT du poste (minuterie d'émission interne) LU à la connexion d'un opérateur : s'il est sur OFF, la page et l'application le disent, une fois par jour et par compte. Seulement pour un poste dont la lecture a été qualifiée (aujourd'hui l'Icom IC-7300MK2, PTT par la CAT) ; pour les autres, l'assistant rappelle de le régler."
niveau = "courant"
securite = "LECTURE seule : la station ne change jamais le TOT du poste et n'empêche pas d'émettre. Une lecture incertaine (poste muet, réponse inattendue) ne donne jamais « OFF » : aucun avis."
exemple = "true (défaut)."
depuis = "0.245.0"

# ---------------------------------------------------------------- bands

[reglages."bands.name"]
role = "Nom de la bande, affiché dans les messages."
niveau = "courant"
exemple = "\"40m\""

[reglages."bands.low_mhz"]
role = "Limite basse de la bande, en MHz."
niveau = "courant"
exemple = "7.000"

[reglages."bands.high_mhz"]
role = "Limite haute de la bande, en MHz."
niveau = "courant"
exemple = "7.200"

# ---------------------------------------------------------------- clients

[reglages."clients.id"]
role = "Identifiant de connexion du compte, saisi dans la page ou l'application."
niveau = "courant"
exemple = "\"telephone\", \"voiture\""

[reglages."clients.token"]
role = "Ancien secret en clair (anciennes versions). Toujours accepté, mais à remplacer par un mot de passe (<code>password_hash</code>)."
niveau = "expert"
securite = "Un secret en clair dans le fichier est lisible par qui lit le fichier : remplacez-le."

[reglages."clients.password_hash"]
role = "Empreinte du mot de passe (scrypt) ; jamais le mot de passe lui-même. Écrite par l'assistant, le menu 4.2 ou <code>trx-setup --set-password</code>."
niveau = "courant"

[reglages."clients.role"]
role = "<code>operator</code> : contrôle complet ; <code>listener</code> : visiteur en écoute seule, aucune commande vers le poste."
niveau = "courant"

[reglages."clients.pseudo"]
role = "Nom montré aux autres connectés à la place de l'identifiant (plusieurs comptes peuvent porter le même)."
niveau = "courant"

[reglages."clients.enabled"]
role = "false : connexion refusée, et une connexion en cours est fermée."
niveau = "courant"

[reglages."clients.expires"]
role = "Date de fin du compte (AAAA-MM-JJ, heure de la station) ; vide : jamais."
niveau = "courant"

[reglages."clients.admin"]
role = "true : ce compte opérateur peut aussi ouvrir TRX Console sur le réseau (<code>[remote_console]</code>, menu 4.6). Les autres opérateurs pilotent le poste mais n'administrent pas la station."
niveau = "courant"
bornes = "Opérateurs seulement (jamais un visiteur)."
securite = "Le mot de passe d'un compte administrateur ouvre la configuration de la station : à ne pas prêter."
depuis = "0.178.0"

# ---------------------------------------------------------------- access

[reglages."access.max_listeners"]
role = "Nombre de visiteurs connectés en même temps ; 0 : écoute des visiteurs fermée sur la station. Sinon, l'opérateur ouvre ou ferme l'écoute depuis sa page ou l'application."
niveau = "courant"
bornes = "0 à 20."

[reglages."access.max_operators"]
role = "Nombre de connexions opérateur en même temps (quota à part : un visiteur ne prend jamais la place d'un opérateur)."
niveau = "expert"
bornes = "1 à 8."

[reglages."access.listeners_need_operator"]
role = "true : visiteurs admis seulement si un opérateur est connecté à distance."
niveau = "courant"

[reglages."access.operator_grace_s"]
role = "Après la perte du dernier opérateur, attente avant de déconnecter les visiteurs."
niveau = "expert"
bornes = "0 à 600 s."

[reglages."access.listeners_outside_bands"]
role = "false : silence pour les visiteurs quand la réception sort des bandes de la station."
niveau = "courant"

[reglages."access.listener_spectrum_fps"]
role = "Cadence maximale du spectre HF envoyé aux visiteurs (images par seconde) ; l'opérateur garde la sienne."
niveau = "expert"
bornes = "1 à 20."

[reglages."access.overload_temp_c"]
role = "Protection de la station : température du processeur au-delà de laquelle (pendant 10 s) les visiteurs sont déconnectés."
niveau = "expert"
bornes = "50 à 105 °C."

[reglages."access.overload_cpu_pct"]
role = "Même protection : charge du processeur (tous cœurs) en %."
niveau = "expert"
bornes = "50 à 100 %."

[reglages."access.overload_lag_ms"]
role = "Même protection : retard de la boucle de la station, en millisecondes."
niveau = "expert"
bornes = "20 à 2000 ms."

[reglages."access.overload_mem_pct"]
role = "Même protection : mémoire libre minimale, en %."
niveau = "expert"
bornes = "1 à 50 %."

# ---------------------------------------------------------------- swr

[reglages."power.enabled"]
role = "true : allumage du poste à la connexion d'un opérateur et extinction depuis la page ou l'application. false (défaut) : ni allumage ni extinction à distance."
niveau = "courant"
securite = "Extinction refusée pendant toute émission et quand le poste est utilisé sur place ; après un allumage, la station relit le PTT et remet le poste en réception s'il s'est allumé en émission."
exemple = "Mettre en service par le menu 2.8 de TRX Console, qui essaie d'abord d'éteindre et de rallumer le poste."
depuis = "0.222.0"

[reglages."power.on_timeout_s"]
role = "Attente de la réponse du poste après l'ordre d'allumage. Au-delà, l'allumage est déclaré en échec avec un message clair."
niveau = "expert"
bornes = "5 à 120 s (défaut 30 ; un FTDX10 répond en 8 s environ)."
depuis = "0.222.0"

[reglages."power.idle_off"]
role = "Extinction automatique du poste quand plus personne n'est connecté (opérateur ni visiteur) depuis <code>idle_off_hours</code> heures, sans diffusion en cours ni action sur le poste. Reportée de 10 min pendant une émission, jamais forcée."
niveau = "courant"
exemple = "false (défaut)."
depuis = "0.222.0"

[reglages."power.idle_off_hours"]
role = "Délai sans aucune connexion avant l'extinction automatique."
niveau = "courant"
bornes = "1 à 168 h (défaut 4)."
depuis = "0.222.0"

[reglages."power.notify"]
role = "Alerte ntfy à chaque allumage, extinction ou échec (qui, comment). Un poste allumé EN ÉMISSION alerte toujours, même sans ce réglage."
niveau = "courant"
exemple = "false (défaut) ; exige <code>[supervisor] notify_url</code>."
depuis = "0.222.0"

[reglages."swr.enabled"]
role = "false : la mesure de TOS n'est pas proposée."
niveau = "courant"
depuis = "0.90.0"

[reglages."swr.max_power_pct"]
role = "Plafond de puissance de la mesure, en % de la puissance du poste. L'opérateur choisit la puissance (15 % par défaut) sous ce plafond."
niveau = "courant"
bornes = "5 à 50 %."
securite = "Jamais au-dessus de 50 % : quelques watts suffisent pour mesurer."
depuis = "0.90.0"

[reglages."swr.max_points"]
role = "Nombre maximal de points d'une mesure."
niveau = "expert"
bornes = "2 à 200."
depuis = "0.90.0"

[reglages."swr.point_tx_max_s"]
role = "Durée maximale de l'émission d'un point. Le temps réel est étalonné au premier usage pour chaque modèle de poste, sans dépasser cette valeur."
niveau = "expert"
bornes = "0,5 à 3 s."
depuis = "0.90.0"

# ---------------------------------------------------------------- freedv

[reglages."freedv.enabled"]
role = "true : FreeDV est proposé dans la page (rubrique et voyant « FDV ») ; les décodeurs ne tournent que pendant le mode FreeDV choisi par l'opérateur."
niveau = "courant"
securite = "Réception seulement : le mode FreeDV ne change ni la fréquence ni le mode du poste, et se refuse pendant une émission. Une panne des décodeurs n'arrête jamais la station : après 5 relances en 10 minutes, le son du poste revient."
depuis = "0.122.0"

[reglages."freedv.ka9q_path"]
role = "Programme qui décode la voix et l'indicatif (freedv-ka9q, de freedv-integrations). Un nom seul est cherché dans le PATH, puis parmi les décodeurs livrés avec la station (paquet Windows). Debian et Raspberry Pi : <code>sudo bash compiler-freedv.sh</code> (dossier du paquet) les compile et les met dans le PATH ; rien à régler ensuite."
niveau = "expert"
bornes = "Chemin d'un fichier, ou nom seul ; jamais vide. Introuvable : le mode FreeDV est refusé avec le nom du programme manquant."
exemple = "<code>freedv-ka9q</code> (défaut, Debian et Windows), ou le chemin complet d'un programme compilé à part."
depuis = "0.122.0"

[reglages."freedv.locator"]
role = "Locator Maidenhead de la station. Sert à la liste « Activité FreeDV » (module <code>freedv_activity</code> de <code>[modules] run</code>) : distance de chaque station et note de chance de réception. Il n'est envoyé nulle part : FreeDV Reporter est lu en simple observateur."
niveau = "courant"
bornes = "4 ou 6 caractères (JN18 ou JN18du), ou vide (liste sans distance, note moins juste)."
exemple = "<code>JN18du</code>"
depuis = "0.125.0"

[reglages."freedv.radae_rx_path"]
role = "Programme qui donne la synchro, le SNR et le décalage de fréquence (radae_rx, de rade_c). Un nom seul est cherché dans le PATH, puis parmi les décodeurs livrés avec la station (paquet Windows), comme freedv-ka9q."
niveau = "expert"
bornes = "Chemin d'un fichier, ou nom seul ; jamais vide."
exemple = "<code>radae_rx</code>"
depuis = "0.122.0"

# ---------------------------------------------------------------- sdr

[reglages."sdr.enabled"]
role = "true : la rubrique « SDR » (waterfall d'un récepteur SDR en parallèle du TRX) est proposée aux opérateurs. Il faut aussi « sdr » dans <code>[modules] run</code> et le numéro de série du SDR dans <code>serial</code>."
niveau = "courant"
securite = "Réception seulement : le module SDR n'a aucun droit sur le poste ; « QSY du TRX » passe par la commande habituelle de fréquence, refusée pendant une émission. Une panne du SDR n'arrête jamais la station. La protection de l'entrée du SDR contre la puissance émise par le TRX (antenne séparée, séquenceur) est à la charge de l'opérateur."
depuis = "0.140.0"

[reglages."sdr.driver"]
role = "Type de SDR. <code>sdrplay</code> : RSP de SDRplay, dont l'API s'installe à la main (logiciel du fabricant) AVANT l'installation de la station. <code>rtlsdr</code> (station 0.149.0+) : clé RTL-SDR (dont la RTL-SDR Blog V4), pilote installé par la station elle-même ; le pilote TV du noyau est écarté. Se choisit au menu 2.4 de TRX Console avec le SDR."
niveau = "expert"
bornes = "<code>sdrplay</code> ou <code>rtlsdr</code>."
depuis = "0.140.0"

[reglages."sdr.serial"]
role = "Numéro de série du SDR de cette station. Le SDR est toujours désigné par ce numéro, jamais par son port USB : sur une machine qui a plusieurs SDR, chacun sert la bonne application. <code>trx-sdr --list</code> montre les SDR libres et ceux déjà pris par une autre application."
niveau = "courant"
bornes = "Lettres et chiffres, 4 à 32 ; obligatoire quand <code>enabled = true</code>. Numéro absent au démarrage : le module attend (nouvel essai toutes les 30 s) et n'ouvre jamais un autre SDR."
securite = "Ne jamais mettre le numéro d'un SDR utilisé par une autre application de la machine."
exemple = "<code>1234567ABC</code>"
depuis = "0.140.0"

[reglages."sdr.core_path"]
role = "Programme sdr-core (cœur natif du module SDR). Vide : celui que l'installation a compilé (à côté de la station), sinon le PATH."
niveau = "expert"
bornes = "Chemin d'un fichier, ou vide."
depuis = "0.140.0"

[reglages."sdr.sample_rate_hz"]
role = "Largeur couverte par le waterfall du SDR (fréquence d'échantillonnage). 2 MHz couvre une bande HF entière ou la bande 2 m et charge peu la machine ; 6 et 8 MHz demandent beaucoup plus de calcul."
niveau = "courant"
bornes = "SDRplay : 2000000, 6000000 ou 8000000 ; clé RTL-SDR : 1024000, 2048000 ou 2400000 (Hz)."
exemple = "<code>2000000</code>"
depuis = "0.140.0"

[reglages."sdr.center_hz"]
role = "Fréquence centrale du SDR au premier démarrage. La dernière choisie depuis la page est ensuite reprise (rangée sur la station, pas dans ce fichier)."
niveau = "courant"
bornes = "1 000 à 2 000 000 000 Hz."
exemple = "<code>7100000</code>"
depuis = "0.140.0"

[reglages."sdr.antenna"]
role = "Entrée d'antenne du SDR (RSP2 : A ou B ; sans effet sur une clé RTL-SDR, qui n'en a qu'une)."
niveau = "courant"
bornes = "A ou B."
depuis = "0.140.0"

[reglages."sdr.lna_state"]
role = "État du préamplificateur (LNA) au premier démarrage : 0 = gain maximal. Se règle ensuite depuis la page, où il est présenté à l'endroit (curseur « Gain RF » : 8 = gain maximal)."
niveau = "expert"
bornes = "0 à 8."
depuis = "0.140.0"

[reglages."sdr.gain_reduction_db"]
role = "Réduction de gain de la FI au premier démarrage, utilisée quand l'AGC de la FI est coupé (<code>agc = false</code>). Se règle ensuite depuis la page ; à augmenter en cas de surcharge signalée."
niveau = "expert"
bornes = "20 à 59 dB."
depuis = "0.140.0"

[reglages."sdr.agc"]
role = "AGC matériel de la FI : le SDR règle lui-même la réduction de gain FI pour garder le signal au bon niveau ; la page n'offre alors que le curseur « Gain RF ». false : la réduction de gain se règle à la main (curseur « Gain FI »). Se change ensuite depuis la page."
niveau = "courant"
bornes = "true ou false."
depuis = "0.141.0"

[reglages."sdr.audio_port"]
role = "Port UDP par lequel le module SDR envoie le son démodulé à la passerelle. Il n'écoute qu'en 127.0.0.1 (jamais sur le réseau) et n'accepte que les paquets portant le jeton du module."
niveau = "expert"
bornes = "1024 à 65535, différent de <code>[modules] bus_port</code>. Port déjà pris : waterfall seul (code ORT-6003)."
exemple = "<code>47821</code>"
depuis = "0.142.0"

[reglages."sdr.fft_size"]
role = "Nombre de points de la FFT du waterfall : plus il est grand, plus le détail est fin."
niveau = "expert"
bornes = "Puissance de 2 de 512 à 16 384."
depuis = "0.140.0"

[reglages."sdr.bins"]
role = "Nombre de cases d'une ligne envoyée aux clients (chaque case garde le maximum des points qu'elle couvre). Moins de cases = moins de données mobiles."
niveau = "expert"
bornes = "Puissance de 2 de 128 à fft_size."
depuis = "0.140.0"

[reglages."sdr.lines_per_s"]
role = "Lignes de waterfall par seconde au premier démarrage ; se règle ensuite depuis la page."
niveau = "expert"
bornes = "1 à 15."
depuis = "0.140.0"

[reglages."sdr.max_cpu_pct"]
role = "Plafond de processeur du module SDR (sdr-core et module ensemble), en pourcentage d'UN cœur. Au-delà pendant 10 s, le module se bride lui-même par crans (waterfall ralenti, puis à 1 ligne/s, puis échantillonnage à 2 MHz) ; un cran est rendu après 5 minutes nettement sous le plafond. La passerelle bride aussi le module quand ELLE souffre, indépendamment de ce réglage."
niveau = "expert"
bornes = "20 à 800 (150 = un cœur et demi)."
exemple = "<code>150</code>"
depuis = "0.144.0"

[reglages."sdr.max_mem_mb"]
role = "Plafond de mémoire du module SDR (sdr-core et module ensemble), en Mo. Au-delà pendant 10 s, le module se bride lui-même comme pour <code>max_cpu_pct</code>."
niveau = "expert"
bornes = "50 à 4000."
exemple = "<code>400</code>"
depuis = "0.144.0"

# ---------------------------------------------------------------- presence

[reglages."presence.enabled"]
role = "true : la station s'enregistre auprès du relais et échange la présence avec les groupes dont elle est membre (« presence » doit aussi figurer dans <code>[modules] run</code>)."
niveau = "courant"
securite = "La présence ne fait que montrer : aucune donnée reçue du relais ne peut commander le poste."
depuis = "0.117.0"

[reglages."presence.relay_url"]
role = "Adresse du relais de présence."
niveau = "expert"
bornes = "https:// obligatoire ; http:// seulement vers 127.0.0.1 ou localhost (essais avec un relais sur la même machine)."
exemple = "Relais par défaut : <code>https://rf-diy.com/orx-relay/public</code> ; essai local : <code>http://127.0.0.1:8099</code>."
depuis = "0.117.0"

[reglages."presence.key_file"]
role = "Fichier des clés de la station pour la présence (signature et réception des clés de groupe). Vide : <code>presence.key</code> dans le dossier d'état, créé par le module au premier démarrage. Relatif : à côté de station.toml."
niveau = "expert"
securite = "Ce fichier identifie la station auprès du relais et des groupes : ne jamais le copier sur une autre station."
depuis = "0.117.0"

# ---------------------------------------------------------------- monitor_link

[reglages."monitor_link.enabled"]
role = "true : la station s'enregistre auprès du relais du monitoring, relève les messages de ses liaisons et envoie ce que chaque profil permet (« monlink » doit aussi figurer dans <code>[modules] run</code>). Sans liaison confirmée, rien ne part."
niveau = "courant"
securite = "Le monitoring ne fait que lire et montrer : aucun message reçu ne peut commander le poste ni la station."
depuis = "0.159.0"

[reglages."monitor_link.relay_url"]
role = "Adresse du relais du monitoring (le même que celui de la présence)."
niveau = "expert"
bornes = "https:// obligatoire ; http:// seulement vers 127.0.0.1 ou localhost (essais avec un relais sur la même machine)."
exemple = "Relais par défaut : <code>https://rf-diy.com/orx-relay/public</code> ; essai local : <code>http://127.0.0.1:8099</code>."
depuis = "0.159.0"

[reglages."monitor_link.key_file"]
role = "Fichier des clés de la station pour le monitoring (signature, chiffrement des liaisons). Vide : <code>monlink.key</code> dans le dossier d'état (sous-dossier <code>monlink</code>), créé par le module au premier démarrage. Relatif : à côté de station.toml. Différent des clés de la présence : les deux services ne peuvent pas être reliés."
niveau = "expert"
securite = "Ce fichier identifie la station auprès de ses partenaires de monitoring : ne jamais le copier sur une autre station."
depuis = "0.159.0"

# ---------------------------------------------------------------- diffusion

[reglages."diffusion.enabled"]
role = "true : le module « diffusion » accepte qu'un opérateur lance une diffusion. Aucune diffusion ne démarre seule, ni au démarrage, ni après une relance de la passerelle ou un mode sûr."
niveau = "courant"
securite = "Activer la rediffusion de son TRX est de la responsabilité de l'opérateur (la station ne filtre pas les bandes)."
depuis = "0.188.0"

[reglages."diffusion.server"]
role = "Nom du serveur de diffusion, donné par son administrateur. Vide : aucune diffusion possible (aucun serveur imposé)."
niveau = "courant"
exemple = "server = \"diffusion.example.org\""
depuis = "0.188.0"

[reglages."diffusion.station"]
role = "Nom de la station sur ce serveur (2 à 32 caractères a-z, 0-9 et -), donné par son administrateur : il forme l'adresse de la page des auditeurs (<code>https://&lt;serveur&gt;/ecoute/&lt;station&gt;</code>) et des flux."
niveau = "courant"
exemple = "station = \"f4xyz\""
depuis = "0.188.0"

[reglages."diffusion.source_port"]
role = "Port TLS où la station envoie le son, directement au serveur Icecast (pas le port 443 : un mandataire HTTP ne sait pas relayer une source)."
niveau = "expert"
bornes = "1 à 65535"
depuis = "0.188.0"

[reglages."diffusion.api_port"]
role = "Port HTTPS des métadonnées (pseudo, fréquence…) et du nombre d'auditeurs."
niveau = "expert"
bornes = "1 à 65535"
depuis = "0.188.0"

[reglages."diffusion.codec"]
role = "<code>opus</code> (32 kb/s, le plus léger, par défaut) ou <code>mp3</code> (64 kb/s : anciens iPhone, applications de radio)."
niveau = "courant"
depuis = "0.188.0"

[reglages."diffusion.audio_port"]
role = "Port UDP par lequel la passerelle donne le son au module, en 127.0.0.1 seulement (paquets signés d'un jeton). À changer seulement si un autre programme le prend."
niveau = "expert"
bornes = "1024 à 65535, différent de [modules] bus_port et de [sdr] audio_port"
depuis = "0.188.0"

[reglages."diffusion.key_file"]
role = "Fichier des secrets de la diffusion (mot de passe source, clé des métadonnées, identifiant et mot de passe des auditeurs). Vide : <code>diffusion.key</code> dans le dossier d'état (sous-dossier <code>diffusion</code>). Relatif : à côté de station.toml."
niveau = "expert"
securite = "Droits 0600 exigés sous Linux : un fichier lisible par d'autres comptes est refusé. Ne jamais le joindre à un message."
depuis = "0.188.0"

[reglages."diffusion.outside_bands"]
role = "false (défaut) : silence pour les auditeurs quand la réception sort des bandes autorisées (<code>[[bands]]</code>) ou que la fréquence est inconnue, sans arrêter la diffusion : le son revient dès que le poste rentre dans une bande. true : tout est diffusé, quelle que soit la fréquence. Indépendant de <code>[access] listeners_outside_bands</code> (visiteurs)."
niveau = "courant"
securite = "Ce qui est diffusé est de la responsabilité de l'opérateur (décision de l'utilisateur du 2026-11-17)."
depuis = "0.189.0"

[reglages."diffusion.tls"]
role = "true : connexions chiffrées et certificat du serveur vérifié. false seulement vers 127.0.0.1 (faux serveur d'essai, <code>python -m trxstation.devtools.fake_icecast</code>)."
niveau = "expert"
securite = "Refusé vers tout autre serveur : le mot de passe source passerait en clair."
depuis = "0.188.0"

[reglages."remote_console.enabled"]
role = "true : la station sert TRX Console en HTTPS sur le réseau (service <code>trx-console-web@compte</code> sous Debian, processus du superviseur sous Windows)."
niveau = "courant"
securite = "Un compte administrateur vaut presque un accès SSH à la station : mot de passe solide, réseau local ou VPN seulement. 5 échecs bloquent l'adresse 15 minutes ; chaque connexion envoie une alerte ntfy."
depuis = "0.178.0"

[reglages."remote_console.account"]
role = "Compte Linux sous lequel tourne la console (celui de l'opérateur qui administre : il doit pouvoir utiliser sudo et faire partie du groupe <code>trx</code>). Vide sous Windows."
niveau = "courant"
bornes = "Nom de compte Linux : minuscules, chiffres, _ . - (32 caractères au plus). Jamais root."
exemple = "<code>account = \"pi\"</code>"
depuis = "0.178.0"

[reglages."remote_console.port"]
role = "Port HTTPS de la console. L'adresse d'écoute est celle de la page de pilotage (<code>[network] gateway_bind</code>), avec le même certificat."
niveau = "expert"
bornes = "1024 à 65535, différent du port de la page de pilotage et de rigctld."
depuis = "0.178.0"

[reglages."remote_console.idle_min"]
role = "Durée sans action (menu ouvert, touche tapée) après laquelle la session se ferme : il faut se reconnecter."
niveau = "expert"
bornes = "5 à 240 minutes."
depuis = "0.178.0"

# ---------------------------------------------------------------- breizh

[reglages."breizh.enabled"]
role = "true : le son du micro de l'opérateur passe par Breizh Audio Box pendant l'émission, quand Breizh répond."
niveau = "courant"
securite = "Breizh ne peut jamais déclencher ni prolonger une émission : la station garde le PTT, la porte audio d'émission et son limiteur."
depuis = "0.99.0"

[reglages."breizh.host"]
role = "Adresse IP du PC où tourne Breizh Audio Box (127.0.0.1 si c'est le même PC)."
niveau = "courant"
bornes = "Adresse IP privée seulement (RFC 1918 : 10/8, 172.16/12, 192.168/16 ; lien local 169.254/16 ; locale 127/8 ; IPv6 fd00::/8, fe80::/10). Ni nom d'hôte ni adresse publique."
securite = "Le son du micro n'est pas chiffré : une adresse publique est refusée."
depuis = "0.99.0"

[reglages."breizh.port"]
role = "Port UDP sur lequel Breizh attend la station (le même que dans l'onglet « OpenRemoteTRX » de Breizh)."
niveau = "expert"
bornes = "1024 à 65535."
depuis = "0.99.0"

[reglages."breizh.key_file"]
role = "Fichier de la clé d'appairage partagée avec Breizh. Vide : <code>breizh.key</code> à côté de station.toml. La clé n'est jamais écrite dans station.toml."
niveau = "expert"
securite = "Fichier refusé s'il est lisible par tous les comptes."
depuis = "0.99.0"

[reglages."breizh.block_timeout_ms"]
role = "Délai au-delà duquel un bloc de son (10 ms) qui n'est pas revenu de Breizh part sans traitement, à gain réduit."
niveau = "expert"
bornes = "15 à 100 ms."
depuis = "0.99.0"

[reglages."breizh.lost_ms"]
role = "Sans aucun retour de Breizh pendant ce délai, l'émission continue en direct jusqu'à sa fin (repli)."
niveau = "expert"
bornes = "50 à 500 ms, plus grand que block_timeout_ms."
depuis = "0.99.0"

[reglages."breizh.fallback_gain_db"]
role = "Gain du son direct pendant un repli (Breizh perdu), pour ne pas surmoduler un son prévu pour être traité."
niveau = "expert"
bornes = "-20 à 0 dB."
depuis = "0.99.0"

[reglages."breizh.reactivate_after_s"]
role = "Après un repli, durée pendant laquelle Breizh doit répondre sans faute avant d'être repris automatiquement (jamais pendant une émission). 0 : seulement quand l'opérateur le demande."
niveau = "expert"
bornes = "0, ou 30 à 3600 s."
depuis = "0.99.0"

# ---------------------------------------------------------------- netprobe

[reglages."netprobe.enabled"]
role = "true : la station mesure la qualité de la liaison avec chaque client (battement réseau d'une seconde dans les deux sens, quelques dizaines d'octets)."
niveau = "courant"
securite = "La sonde ne fait que mesurer et afficher : elle ne coupe ni ne déclenche jamais une émission."
depuis = "0.106.0"

[reglages."netprobe.heartbeat_interval_s"]
role = "Période du battement réseau entre la station et chaque client."
niveau = "expert"
bornes = "0,5 à 10 s."
depuis = "0.106.0"

[reglages."netprobe.outage_missed_beats"]
role = "Nombre de battements sans écho qui font déclarer une coupure."
niveau = "expert"
bornes = "2 à 20."
depuis = "0.106.0"

[reglages."netprobe.lan_target"]
role = "Box (passerelle du réseau local) que la station sonde pour savoir si une coupure vient de son propre réseau. auto : la passerelle par défaut de la machine."
niveau = "expert"
depuis = "0.106.0"

[reglages."netprobe.internet_target"]
role = "Adresse sur Internet que la station sonde pour savoir si une coupure vient de la connexion de la box. Vide : aucune sonde Internet."
niveau = "expert"
depuis = "0.106.0"

[reglages."netprobe.loss_warn_pct"]
role = "Perte de battements sur 60 s à partir de laquelle l'indicateur passe à l'orange (valeur de départ)."
niveau = "expert"
bornes = "0,1 à 100 %, plus petit que loss_alert_pct."
depuis = "0.106.0"

[reglages."netprobe.loss_alert_pct"]
role = "Perte de battements sur 60 s à partir de laquelle l'indicateur passe au rouge (valeur de départ)."
niveau = "expert"
bornes = "0,1 à 100 %."
depuis = "0.106.0"

[reglages."netprobe.rtt_warn_ms"]
role = "Temps aller-retour (p95 sur 60 s) à partir duquel l'indicateur passe à l'orange. Valeur de départ : la rubrique « Seuils » des statistiques propose des valeurs d'après vos mesures."
niveau = "expert"
bornes = "20 à 5 000 ms, plus petit que rtt_alert_ms."
depuis = "0.106.0"

[reglages."netprobe.rtt_alert_ms"]
role = "Temps aller-retour (p95 sur 60 s) à partir duquel l'indicateur passe au rouge (valeur de départ)."
niveau = "expert"
bornes = "20 à 5 000 ms."
depuis = "0.106.0"

[reglages."netprobe.alert_outage_s"]
role = "Une coupure plus longue envoie une alerte par l'adresse de notification de [supervisor] (notify_url). 0 : aucune alerte de coupure."
niveau = "courant"
bornes = "0 à 3 600 s."
depuis = "0.106.0"

[reglages."netprobe.alert_cooldown_s"]
role = "Délai minimal entre deux alertes de la sonde (coupure, perte)."
niveau = "expert"
bornes = "30 à 86 400 s."
depuis = "0.106.0"

[reglages."netprobe.log_retention_days"]
role = "Durée de conservation des mesures détaillées (résumés de 10 s)."
niveau = "expert"
bornes = "1 à 30 jours."
depuis = "0.106.0"

[reglages."netprobe.stats_retention_days"]
role = "Durée de conservation des coupures et des statistiques horaires (vue des 30 derniers jours)."
niveau = "expert"
bornes = "7 à 90 jours."
depuis = "0.106.0"

[reglages."netprobe.vpn_shared_warn"]
role = "true : avertit quand deux appareils semblent partager le même profil VPN (même adresse privée, ou coupures très régulières), cause connue de coupures toutes les 15 à 30 s."
niveau = "courant"
depuis = "0.106.0"

[reglages."netprobe.rsrp_warn_dbm"]
role = "Signal 4G/5G mesuré par l'application (RSRP) sous lequel l'indicateur passe à l'orange."
niveau = "expert"
bornes = "-140 à -40 dBm, au-dessus de rsrp_alert_dbm."
depuis = "0.106.0"

[reglages."netprobe.rsrp_alert_dbm"]
role = "Signal 4G/5G (RSRP) sous lequel l'indicateur passe au rouge."
niveau = "expert"
bornes = "-140 à -40 dBm."
depuis = "0.106.0"

[reglages."netprobe.sinr_warn_db"]
role = "Rapport signal/bruit 4G/5G mesuré par l'application sous lequel l'indicateur passe à l'orange."
niveau = "expert"
bornes = "-20 à 30 dB, au-dessus de sinr_alert_db."
depuis = "0.106.0"

[reglages."netprobe.sinr_alert_db"]
role = "Rapport signal/bruit 4G/5G sous lequel l'indicateur passe au rouge."
niveau = "expert"
bornes = "-20 à 30 dB."
depuis = "0.106.0"

# ---------------------------------------------------------------- spectrum

[reglages."spectrum.enabled"]
role = "Spectre et waterfall HF du poste dans la page et l'application. false : pas de spectre HF (un seul port vers le poste)."
niveau = "courant"

[reglages."spectrum.source"]
role = "<code>civ_port</code> : second port série du poste réglé en CI-V (Icom, recommandé) ; <code>rigctld</code> : flux de Hamlib 4.6+ (déconseillé sous Windows)."
niveau = "courant"

[reglages."spectrum.data_port"]
role = "Source rigctld : port UDP local de la diffusion du spectre."
niveau = "expert"

[reglages."spectrum.max_fps"]
role = "Cadence maximale du spectre envoyé aux clients (images par seconde)."
niveau = "expert"

[reglages."spectrum.port"]
role = "Source civ_port : second port série du poste."
niveau = "courant"
securite = "Jamais le port CAT ni le port PTT. Sur l'IC-7300, régler « USB SEND » et « USB Keying » sur OFF pour ce port : sinon il pourrait mettre le poste en émission."
exemple = "Windows : <code>COM7</code> ; Linux : <code>/dev/serial/by-id/…-if02-port0</code>."

[reglages."spectrum.civ_address"]
role = "Source civ_port : adresse CI-V du poste, en hexadécimal (revérifiée à chaque ouverture)."
niveau = "courant"
exemple = "IC-7300MK2 : B6."

[reglages."spectrum.baud"]
role = "Source civ_port : débit du second port (identique au réglage du poste)."
niveau = "courant"
bornes = "9600, 19200, 38400, 57600 ou 115200."

# ---------------------------------------------------------------- selcall

[reglages."selcall.enabled"]
role = "Fonction SELCALL disponible sur cette station."
niveau = "courant"

[reglages."selcall.send_on_tx_end"]
role = "Trame SELCALL émise en fin d'émission, à la place du roger bip (seulement si le temps d'émission restant la contient)."
niveau = "courant"

[reglages."selcall.manual_repeat"]
role = "Appel manuel : nombre d'émissions de la trame."
niveau = "expert"
bornes = "1 à 5."

[reglages."selcall.manual_gap_ms"]
role = "Appel manuel : silence entre deux trames, en millisecondes."
niveau = "expert"

[reglages."selcall.filter_mode"]
role = "Ce que deviennent les tonalités SELCALL dans le son reçu : <code>mute</code> (coupées), <code>attenuate</code> (atténuées), <code>chime</code> (remplacées par un carillon)."
niveau = "expert"

[reglages."selcall.attenuation_db"]
role = "Mode attenuate : atténuation des tonalités, en dB."
niveau = "expert"

[reglages."selcall.audio_delay_ms"]
role = "Retard du son reçu pour que les tonalités soient filtrées avant d'être entendues."
niveau = "expert"
bornes = "250 à 1000 ms."

[reglages."selcall.tx_level_dbfs"]
role = "Niveau de la trame émise, sous le seuil de l'ALC (réglable automatiquement depuis la page ou l'application)."
niveau = "expert"

[reglages."selcall.notify_on_call"]
role = "Alerte ntfy (URL `notify_url` du superviseur), envoyée par la passerelle quand un appel ouvre le squelch, une par minute au plus. Le code SELCALL n'y figure jamais (une rubrique ntfy publique se devine)."
niveau = "courant"

[reglages."selcall.history_size"]
role = "Nombre de derniers codes gardés."
niveau = "expert"

# ---------------------------------------------------------------- cluster

[reglages."cluster.enabled"]
role = "Module Cluster DX (spots des clusters, du RBN et des cibistes)."
niveau = "courant"

[reglages."cluster.call"]
role = "VOTRE indicatif radioamateur, seul envoyé aux clusters et au RBN. Vide : le module refuse de démarrer."
niveau = "courant"

[reglages."cluster.cb_call"]
role = "Votre indicatif de cibiste (sources CB) ; aujourd'hui envoyé nulle part."
niveau = "expert"

[reglages."cluster.modes"]
role = "Modes suivis (CW, SSB, AM, FM, FREEDV) ; vide : tous. Jamais les modes numériques."
niveau = "courant"

[reglages."cluster.bands"]
role = "Bandes suivies ; vide : toutes."
niveau = "courant"

[reglages."cluster.continents"]
role = "Continent du SPOTTEUR (celui qui annonce) ; vide : tous."
niveau = "expert"

[reglages."cluster.blacklist"]
role = "Indicatifs ignorés ; <code>XX*</code> désigne un préfixe."
niveau = "expert"

[reglages."cluster.ttl_min"]
role = "Durée de vie des spots des clusters et des cibistes, en minutes."
niveau = "expert"

[reglages."cluster.rbn_ttl_min"]
role = "Durée de vie des spots du RBN, en minutes."
niveau = "expert"

[reglages."cluster.cty_update"]
role = "Mise à jour hebdomadaire de la liste des pays des indicatifs (cty.dat)."
niveau = "expert"

[reglages."cluster.source"]
role = "Les sources de spots : voir la section suivante."
niveau = "expert"

# ---------------------------------------------------------------- cluster.source

[reglages."cluster.source.name"]
role = "Nom de la source, affiché dans l'état des flux."
niveau = "expert"

[reglages."cluster.source.type"]
role = "<code>telnet</code> (cluster DX), <code>rbn</code> (Reverse Beacon Network), <code>web</code> (site, cibistes)."
niveau = "expert"

[reglages."cluster.source.host"]
role = "telnet, rbn : nom du serveur."
niveau = "expert"

[reglages."cluster.source.port"]
role = "telnet, rbn : port du serveur."
niveau = "expert"

[reglages."cluster.source.url"]
role = "web : adresse de la page (https seulement)."
niveau = "expert"

[reglages."cluster.source.call"]
role = "Indicatif propre à cette source ; vide : <code>[cluster] call</code>."
niveau = "expert"

[reglages."cluster.source.secret"]
role = "NOM d'un mot de passe rangé dans <code>secrets.toml</code> (jamais le mot de passe lui-même) ; vide : aucun."
niveau = "expert"

[reglages."cluster.source.priority"]
role = "Clusters telnet : 1 = principal, puis secours dans l'ordre."
niveau = "expert"

[reglages."cluster.source.enabled"]
role = "false : source ignorée."
niveau = "expert"

# ---------------------------------------------------------------- supervisor

[reglages."supervisor.tot_abs_s"]
role = "TOT absolu du superviseur : au-delà, il coupe l'émission lui-même, même si la passerelle ne le fait pas. Coupe aussi une émission faite au micro du poste."
niveau = "courant"
securite = "Doit rester strictement plus grand que <code>[safety] tot_ceiling_s</code>."

[reglages."supervisor.poll_interval_s"]
role = "Cadence de surveillance au repos (plus rapide pendant une émission)."
niveau = "expert"

[reglages."supervisor.max_reboots_per_hour"]
role = "Redémarrages de la machine permis par heure ; au-delà, mode sûr (réception, accès coupé)."
niveau = "expert"

[reglages."supervisor.notify_url"]
role = "Adresse de notification ntfy pour les alertes de la station (facultatif). Chaque alerte porte un code stable (par exemple « ORT-5024 TOT absolu dépassé »), la priorité ntfy de ce code, ce qu'il faut faire et le lien vers la page du code (<a href=\"https://bob56fr.github.io/openRemoteTRX/erreurs/\" target=\"_blank\" rel=\"noopener noreferrer\">liste des codes d’erreur</a>) ; un code sans alerte par défaut est seulement inscrit au journal."
niveau = "courant"
exemple = "<code>https://ntfy.sh/mon-sujet-secret</code>"
securite = "Choisissez un sujet difficile à deviner : quiconque le connaît lit vos alertes."

[reglages."supervisor.notify_lang"]
role = "Langue des alertes ntfy envoyées au téléphone : titre, message et marche à suivre du catalogue d'erreurs. Le journal de la station reste en français ; une valeur mesurée (détail) reste telle que la station l'écrit."
niveau = "courant"
bornes = "<code>fr</code> (défaut), <code>en</code>, <code>de</code> ou <code>es</code> : les langues du catalogue d'erreurs (allemand et espagnol depuis la version 0.241.0)."
exemple = "<code>en</code>"
depuis = "0.165.0"

[reglages."supervisor.status_path"]
role = "Fichier d'état écrit par la passerelle et lu par le superviseur, trx-monitor et TRX Console."
niveau = "expert"
defaut = "<code>/run/trx-remote/gateway-status.json</code> (Linux) ; <code>C:\\ProgramData\\trx-remote\\run\\gateway-status.json</code> (Windows)."

[reglages."supervisor.state_dir"]
role = "Dossier d'état de la station : mode sûr, mémoires, profils, mesures de TOS, identifiant de station."
niveau = "expert"
defaut = "<code>/var/lib/trx-remote</code> (Linux) ; <code>C:\\ProgramData\\trx-remote\\state</code> (Windows)."

[reglages."supervisor.service_mode"]
role = "<code>auto</code>, <code>systemd</code> (Linux : services du système) ou <code>managed</code> (le superviseur lance lui-même les processus, Windows)."
niveau = "expert"

[reglages."supervisor.instance_lock_port"]
role = "Port local réservé pour garantir qu'un seul superviseur tourne."
niveau = "expert"

[reglages."supervisor.stale_after_s"]
role = "Passerelle jugée muette si son fichier d'état ne change plus depuis ce délai."
niveau = "expert"

[reglages."supervisor.startup_grace_s"]
role = "Délai de grâce au démarrage, le temps que la passerelle et rigctld soient prêts."
niveau = "expert"

[reglages."supervisor.mismatch_grace_s"]
role = "Tolérance avant de juger une émission « inexpliquée » (poste en émission sans client)."
niveau = "expert"

[reglages."supervisor.rigctld_fail_s"]
role = "rigctld injoignable depuis ce délai : il est redémarré."
niveau = "expert"

[reglages."supervisor.recovery_wait_s"]
role = "Attente entre deux niveaux de l'échelle de reprise (relances, reset USB, mode sûr)."
niveau = "expert"

[reglages."supervisor.healthy_reset_s"]
role = "Durée sans problème avant de repartir du premier niveau de l'échelle de reprise."
niveau = "expert"

[reglages."supervisor.temp_alert_c"]
role = "Température de la machine au-delà de laquelle une alerte est envoyée (sans autre action)."
niveau = "expert"

[reglages."supervisor.mem_alert_pct"]
role = "Mémoire utilisée (en %) au-delà de laquelle une alerte <code>notify_url</code> est envoyée, si cela dure 60 s ; une alerte par heure au plus. Aucune autre action (ni redémarrage, ni mode sûr)."
niveau = "expert"
bornes = "0 (aucune alerte) ou 50 à 99."
depuis = "0.115.0"

[reglages."supervisor.disk_alert_pct"]
role = "Disque utilisé (en %) au-delà duquel une alerte est envoyée, mesuré sur le dossier d'état et sur la racine du système ; 60 s de suite, une alerte par heure au plus. Un disque plein empêche d'écrire l'état et les journaux."
niveau = "expert"
bornes = "0 (aucune alerte) ou 50 à 99."
depuis = "0.115.0"

[reglages."supervisor.alive_every_h"]
role = "Message « Station en service » envoyé par <code>notify_url</code> toutes les N heures (priorité minimale) ; 0 : aucun."
niveau = "courant"

[reglages."supervisor.allow_local_tx"]
role = "true (« station partagée ») : une émission faite au micro du poste n'est pas coupée à distance (seul le TOT absolu s'applique), et le PTT à distance est bloqué pendant l'émission locale puis 2 minutes."
niveau = "courant"
securite = "false : toute émission non demandée par la station est coupée. Un micro tenu enfoncé résiste alors à la coupure et mène au mode sûr en une minute environ : gardez true si quelqu'un se sert du poste sur place."

[reglages."supervisor.local_tx_max_s"]
role = "Station partagée : durée d'émission au micro du poste tolérée quand un opérateur est PRÉSENT, c'est-à-dire quand une action sur le poste (volume, fréquence, mode, sortie du mode DATA, préampli, NR...) a été vue dans les 2 minutes avant la prise ou pendant l'émission. Passé le TOT absolu, simple alerte ; à cette durée, coupure par le superviseur, puis échelle de reprise et mode sûr si l'émission résiste. Sans preuve de présence, le TOT absolu s'applique."
niveau = "expert"
bornes = "1 à 600 s ; jamais moins que <code>tot_abs_s</code> (le plus grand des deux s'applique)."
securite = "Un micro coincé juste après une action sur le poste émet jusqu'à cette durée avant d'être coupé."
depuis = "0.157.0"

[reglages."supervisor.gateway_unit"]
role = "Linux : nom du service systemd de la passerelle."
niveau = "expert"

[reglages."supervisor.rigctld_unit"]
role = "Linux : nom du service systemd de rigctld."
niveau = "expert"

# ---------------------------------------------------------------- modules

[reglages."modules.run"]
role = "Modules à faire tourner ; vide : aucun (pas de bus)."
niveau = "expert"
exemple = "[\"cluster\"]"

[reglages."modules.bus_port"]
role = "Port de l'API interne des modules, en local seulement."
niveau = "expert"

[reglages."modules.run_as"]
role = "Linux : compte sous lequel tournent les modules (jamais root)."
niveau = "expert"

[reglages."modules.extra_dir"]
role = "Dossier de modules supplémentaires ; vide : modules fournis seulement."
niveau = "expert"

# ---------------------------------------------------------------- update

[reglages."update.enabled"]
role = "Cherche une nouvelle version au démarrage puis toutes les 24 h ; la console l'annonce, rien n'est installé sans votre accord."
niveau = "courant"

[reglages."update.allow_prerelease"]
role = "true : propose aussi les pré-versions (versions d'essai)."
niveau = "expert"
