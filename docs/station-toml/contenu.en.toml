# ---------------------------------------------------------------- supervisor

[reglages."supervisor.tot_abs_s"]
role = "Absolute TOT of the supervisor: beyond it, it cuts the transmission itself, even if the gateway does not. Also cuts a transmission made with the transceiver microphone."
niveau = "courant"
securite = "Must stay strictly larger than <code>[safety] tot_ceiling_s</code>."

[reglages."supervisor.poll_interval_s"]
role = "Monitoring rate at rest (faster during a transmission)."
niveau = "expert"

[reglages."supervisor.max_reboots_per_hour"]
role = "Machine reboots allowed per hour; beyond that, safety lockout (receive, access cut)."
niveau = "expert"

[reglages."supervisor.notify_url"]
role = "ntfy notification address for the station alerts (optional). Each alert carries a stable code (for example “ORT-5024 Absolute TOT exceeded”), the ntfy priority of that code, what to do and the link to the code's page (<a href=\"https://bob56fr.github.io/openRemoteTRX/erreurs/\" target=\"_blank\" rel=\"noopener noreferrer\">list of error codes</a>); a code with no alert by default is only written to the log."
niveau = "courant"
exemple = "<code>https://ntfy.sh/mon-sujet-secret</code>"
securite = "Choose a topic that is hard to guess: anyone who knows it can read your alerts."

[reglages."supervisor.notify_lang"]
role = "Language of the ntfy alerts sent to the phone: title, message and steps to follow from the error catalogue. The station log stays in French; a measured value (detail) stays as the station writes it."
niveau = "courant"
bornes = "<code>fr</code> (default), <code>en</code>, <code>de</code> or <code>es</code>: the languages of the error catalogue (German and Spanish since version 0.241.0)."
exemple = "<code>en</code>"
depuis = "0.165.0"

[reglages."supervisor.status_path"]
role = "Status file written by the gateway and read by the supervisor, trx-monitor and openRemoteTRX Console."
niveau = "expert"
defaut = "<code>/run/trx-remote/gateway-status.json</code> (Linux); <code>C:\\ProgramData\\trx-remote\\run\\gateway-status.json</code> (Windows)."

[reglages."supervisor.state_dir"]
role = "Station state folder: safety lockout, memories, profiles, SWR measurements, station identifier."
niveau = "expert"
defaut = "<code>/var/lib/trx-remote</code> (Linux); <code>C:\\ProgramData\\trx-remote\\state</code> (Windows)."

[reglages."supervisor.service_mode"]
role = "<code>auto</code>, <code>systemd</code> (Linux: system services) or <code>managed</code> (the supervisor starts the processes itself, Windows)."
niveau = "expert"

[reglages."supervisor.instance_lock_port"]
role = "Local port reserved to make sure that only one supervisor runs."
niveau = "expert"

[reglages."supervisor.stale_after_s"]
role = "Gateway considered silent if its status file has not changed for this long."
niveau = "expert"

[reglages."supervisor.startup_grace_s"]
role = "Grace period at start-up, while the gateway and rigctld get ready."
niveau = "expert"

[reglages."supervisor.mismatch_grace_s"]
role = "Tolerance before judging a transmission “unexplained” (transceiver transmitting with no client)."
niveau = "expert"

[reglages."supervisor.rigctld_fail_s"]
role = "rigctld unreachable for this long: it is restarted."
niveau = "expert"

[reglages."supervisor.recovery_wait_s"]
role = "Wait between two levels of the recovery ladder (restarts, USB reset, safety lockout)."
niveau = "expert"

[reglages."supervisor.healthy_reset_s"]
role = "Time without problems before starting again from the first level of the recovery ladder."
niveau = "expert"

[reglages."supervisor.temp_alert_c"]
role = "Machine temperature beyond which an alert is sent (no other action)."
niveau = "expert"

[reglages."supervisor.mem_alert_pct"]
role = "Memory used (in %) beyond which a <code>notify_url</code> alert is sent, if it lasts 60 s; at most one alert per hour. No other action (no restart, no safety lockout)."
niveau = "expert"
bornes = "0 (no alert) or 50 to 99."
depuis = "0.115.0"

[reglages."supervisor.disk_alert_pct"]
role = "Disk used (in %) beyond which an alert is sent, measured on the state folder and on the system root; 60 s in a row, at most one alert per hour. A full disk prevents writing the state and the logs."
niveau = "expert"
bornes = "0 (no alert) or 50 to 99."
depuis = "0.115.0"

[reglages."supervisor.alive_every_h"]
role = "“Station in service” message sent through <code>notify_url</code> every N hours (minimum priority); 0: none."
niveau = "courant"

[reglages."supervisor.allow_local_tx"]
role = "true (“shared station”): a transmission made with the transceiver microphone is not cut remotely (only the absolute TOT applies), and remote PTT is blocked during the local transmission and for 2 minutes afterwards."
niveau = "courant"
securite = "false: any transmission not requested by the station is cut. A microphone held down then resists the cut and leads to a safety lockout in about one minute: keep true if someone uses the transceiver on site."

[reglages."supervisor.local_tx_max_s"]
role = "Shared station: transmit time with the transceiver microphone tolerated when an operator is PRESENT, that is when an action on the transceiver (volume, frequency, mode, leaving DATA mode, preamp, NR...) was seen in the 2 minutes before keying or during the transmission. Past the absolute TOT, a simple alert; at this duration, cut by the supervisor, then recovery ladder and safety lockout if the transmission resists. Without proof of presence, the absolute TOT applies."
niveau = "expert"
bornes = "1 to 600 s; never less than <code>tot_abs_s</code> (the larger of the two applies)."
securite = "A microphone stuck just after an action on the transceiver transmits up to this duration before being cut."
depuis = "0.157.0"

[reglages."supervisor.gateway_unit"]
role = "Linux: name of the gateway systemd service."
niveau = "expert"

[reglages."supervisor.rigctld_unit"]
role = "Linux: name of the rigctld systemd service."
niveau = "expert"

