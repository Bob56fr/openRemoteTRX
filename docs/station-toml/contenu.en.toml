# Guide to the station.toml settings (public page, dark theme, iframe on the rf-diy.com site).
# The LIST of settings and their default values come from the code (trxstation/config.py); the explanations from here.
# A setting without an explanation, or an explanation without a setting, stops scripts/build_station_toml_doc.py and the tests.
# Public content: generic examples only, never a real IP address, machine name, username or key.
#
# [reglages."section.cle"]: role (required), niveau = "courant" | "expert", and if needed: bornes, securite,
# exemple, defaut (replaces the value from the code when it depends on the system), depuis (version it appeared in).

[page]
titre = "Station settings: station.toml"
intro = """
<p><code>station.toml</code> is the station configuration file: the transceiver, the sound cards, the network, the
transmit safety rules, the accounts, the optional features. It is written by the openRemoteTRX Console wizard and is then changed
through openRemoteTRX Console (menu 8.1, and the dedicated menus given for each section). The station <strong>checks</strong> it
at every start: an inconsistent value is refused with a precise message, never silently ignored.</p>
"""
lecture = """
<p><strong>Beginner</strong>: only the <span class="courant">common</span> settings concern you; the wizard sets them
for you. The <span class="pro">expert</span> settings have safe default values: only touch them if you know what you
are doing. File location: <code>/etc/trx-remote/station.toml</code> (Debian, Raspberry Pi),
<code>C:\\ProgramData\\trx-remote\\station.toml</code> (Windows).</p>
"""

# ---------------------------------------------------------------- sections

[sections.racine]
titre = "File header"
intro = "<p>Two numbers managed by the station itself.</p>"
ou = "Nothing to do: written by the station."
relu = "redemarrage"

[sections.rig]
titre = "The transceiver [rig]"
intro = "<p>The transceiver controlled through Hamlib: model, CAT link, PTT control, modes and power.</p>"
ou = "Wizard (menu 2.1), transceiver profiles (menu 2.3), or menu 8.1."
relu = "redemarrage"

[sections.audio]
titre = "Audio [audio]"
intro = "<p>The two audio directions between the station and the transceiver (audio interface such as Digirig, SignaLink, or the transceiver's USB sound card).</p>"
ou = "Wizard (menu 2.1), transceiver profiles (menu 2.3), or menu 8.1."
relu = "redemarrage"

[sections.tools]
titre = "Tools [tools]"
intro = "<p>Where to find Hamlib when it is not in the system path.</p>"
ou = "Wizard (menu 2.1) or menu 8.1."
relu = "redemarrage"

[sections.network]
titre = "Network [network]"
intro = "<p>How the web page and the app reach the station. See also the remote access guide (VPN or exposed port with HTTPS).</p>"
ou = "Wizard (menu 2.1), phone pairing (menu 4.1), or menu 8.1."
relu = "redemarrage"

[sections.safety]
titre = "Transmit safety [safety]"
intro = "<p>The rules the station applies to EVERY transmission requested remotely, independently of the page and the app.</p>"
ou = "Menu 8.1; temperature thresholds: menu 3.1; replay: wizard (menu 2.1)."
relu = "redemarrage"

[sections.bands]
titre = "Allowed bands [[bands]]"
intro = """
<p>One entry per band where transmitting is allowed. <strong>Empty list = receive only.</strong> The bands offered
by the wizard (IARU Region 1) are a starting point: check them against your licence and your country.</p>
"""
ou = "Wizard (menu 2.1) or menu 8.1."
relu = "redemarrage"

[sections.clients]
titre = "Accounts [[clients]]"
intro = "<p>One entry per account that can connect: operators (full control) and visitors (listen only).</p>"
ou = "Wizard (menu 2.1), visitors (menu 4.2), command <code>trx-setup --add-client</code>."
relu = "chaud"

[sections.access]
titre = "Receive-only visitors [access]"
intro = "<p>Accounts that listen to the station and see the operator's screen, without any command to the transceiver.</p>"
ou = "Menu 4.2."
relu = "chaud"

[sections.swr]
titre = "SWR measurement [swr]"
intro = "<p>The antenna SWR curve, started from the page or the app: a short FM carrier per point. Last measurement: menu 5.4.</p>"
ou = "Menu 8.1."
relu = "redemarrage"

[sections.power]
titre = "Powering the transceiver on and off remotely [power]"
intro = "<p>Power the transceiver on when an operator connects and power it off from the page or the app (STOP held for 3 s). Off by default. Only for a transceiver that allows it over CAT (Hamlib: “set / get Power Stat”) and keeps its USB powered once switched off. The station never transmits to power the transceiver on or off.</p>"
ou = "openRemoteTRX Console, menu 2.8 (enabling with a power off / power on test); fine settings: menu 8.1."
relu = "redemarrage"

[sections.breizh]
titre = "Breizh Audio Box in the transmit path [breizh]"
intro = "<p>The microphone audio goes through Breizh Audio Box (voice processing) on another PC of the local network before reaching the transceiver. If Breizh stops answering, the station switches back to direct by itself. The microphone audio travels UNENCRYPTED on the local network: only on a trusted network.</p>"
ou = "Menu 8.1; the pairing key is created with openRemoteTRX Console (file <code>breizh.key</code> next to station.toml)."
relu = "redemarrage"

[sections.netprobe]
titre = "Network quality probe [netprobe]"
intro = "<p>The station continuously measures the link with each connected phone or browser (loss, round trip time, jitter, outages) and, after an outage, tells which part of the path probably failed. A small indicator shows it; the statistics of the last 30 days, clearing and export are in the page and the app. The probe only measures: it never acts on transmission.</p>"
ou = "Menu 8.1. The indicator thresholds chosen in the page or the app (statistics, “Thresholds” section) are stored separately and take precedence over the ones here."
relu = "redemarrage"

[sections.presence]
titre = "Group presence [presence]"
intro = "<p>A group of friends using openRemoteTRX sees who is active on their station and, if each one agrees, on which frequency and in which mode. A relay on the Internet carries ENCRYPTED states that it cannot read. The “presence” module has no right over the transceiver: it can neither transmit nor change frequency; a QSY to a friend only happens when the operator taps it, in receive.</p>"
ou = "Menu 8.1, and add “presence” to <code>[modules] run</code>. Groups, nickname and what is shared are set in the page, the app or openRemoteTRX Console (stored separately, not in station.toml)."
relu = "redemarrage"

[sections.monitor_link]
titre = "Station-to-station monitoring [monitor_link]"
intro = "<p>To HELP an operator in trouble, or TO BE HELPED, without a VPN or an open port: the helped operator's station sends, through the same relay as presence and end-to-end encrypted, what ITS operator has accepted (heartbeat, machine health, transceiver state without frequency or mode by default, error codes), always masked (passwords, addresses, serial numbers). The helping station can only read and ASK: no command to the helped station exists. The “monlink” module has no right over the transceiver.</p>"
ou = "Menu 8.1, and add “monlink” to <code>[modules] run</code>. Nickname, invitations, links and sending profiles are set in openRemoteTRX Console (stored separately, not in station.toml)."
relu = "redemarrage"

[sections.diffusion]
titre = "Live broadcast [diffusion]"
intro = "<p>Let a few Internet users who have NO account on the station hear the transceiver audio, like a live podcast: the station sends the audio to a broadcast server (Icecast), and listeners hear it on that server's page or in VLC. They never reach the station. Closed by default, private by default (listener username and password), 1 hour by default; the voice transmitted by the operator is only broadcast if they ask for it. The “diffusion” module has no right over the transceiver. No server is imposed: use the one given by the server administrator, with the source password and the metadata key (separate file, never in station.toml).</p>"
ou = "Menu 8.1, and add “diffusion” to <code>[modules] run</code>. Protocol: <code>docs/protocole-diffusion.md</code> in the repository."
relu = "redemarrage"

[sections.remote_console]
titre = "openRemoteTRX Console on the network [remote_console]"
intro = "<p>openRemoteTRX Console in the browser, from any PC, tablet or phone on the local network or the VPN, without SSH: <code>https://&lt;station&gt;:8444/</code>. You log in with an <strong>operator account marked as administrator</strong> (<code>admin = true</code> in <code>[[clients]]</code>); the session closes after 30 minutes without activity. The console runs under an ordinary Linux account, never root: the sudo password is still asked in the terminal, once per session. Never reachable from the Internet (public addresses refused).</p>"
ou = "Menu 4.6 of openRemoteTRX Console."
relu = "redemarrage"

[sections.dashboard]
titre = "Vital signs dashboard [dashboard]"
intro = "<p>A READ-ONLY page that shows the station state at a glance: transceiver, transmission, services, computer, network, alerts of the last 24 hours. It is made for a small screen plugged into the station (<code>http://127.0.0.1:8450/</code>) and for a phone over the local network or the VPN. No command, no password: nothing vital is shown on it. The terminal badges are the operator accounts of <code>[[clients]]</code> (visitors excluded), in the order of the file. Separate service (<code>trx-dashboard</code>): the screen stays on when the gateway goes down, and shows “station silent”.</p>"
ou = "Menu 8.1. Address shown in the openRemoteTRX Console header (“Web dashboard”)."
relu = "redemarrage"
depuis = "0.280.0"

[sections.spectrum]
titre = "Transceiver HF spectrum [spectrum]"
intro = "<p>The transceiver's HF spectrum and waterfall in the page and the app, through a second port of the transceiver (Icom) or through Hamlib.</p>"
ou = "Wizard (menu 2.1), transceiver profiles (menu 2.3), or menu 8.1."
relu = "redemarrage"

[sections.freedv]
titre = "FreeDV receive [freedv]"
intro = "<p>The station itself decodes FreeDV digital voice (RADE V1) with two programs from the FreeDV team, started only when the operator chooses FreeDV mode in the page: everyone connected, visitors included, then hears the decoded voice instead of the transceiver audio, with sync, SNR and received callsigns. Receive only: nothing is transmitted, and the transceiver is not touched.</p>"
ou = "Menu 8.1; FreeDV mode is chosen in the page (“FreeDV” section), it is not kept after a restart."
relu = "redemarrage"

[sections.sdr]
titre = "SDR receiver [sdr]"
intro = "<p>An SDR receiver alongside the transceiver, receive only: its waterfall is shown in the page (“SDR” section). The SDR is identified by its serial number. The manufacturer's API must be installed by hand BEFORE the station, which then compiles the sdr-core program, and “sdr” must be added to <code>[modules] run</code>.</p>"
ou = "Menu 8.1; centre, gain and rate are then set from the page."
relu = "redemarrage"

[sections.selcall]
titre = "SELCALL [selcall]"
intro = "<p>Digital squelch by group call: the received audio stays muted until your code is called.</p>"
ou = "Menu 8.1; the code and options are set from the page or the app."
relu = "redemarrage"

[sections.cluster]
titre = "DX Cluster [cluster]"
intro = "<p>Spots from DX clusters, the RBN and CB operators, shown on the spectrum and in a list.</p>"
ou = "Menu 8.1; source passwords: file <code>secrets.toml</code> (never here)."
relu = "redemarrage"

[sections."cluster.source"]
titre = "DX Cluster sources [[cluster.source]]"
intro = "<p>One entry per spot source (telnet cluster, RBN, website).</p>"
ou = "Menu 8.1."
relu = "redemarrage"

[sections.supervisor]
titre = "Supervisor [supervisor]"
intro = """
<p>The second safety layer, independent of the gateway: it watches transmission, rigctld and the machine, cuts
transmission when in doubt and restarts whatever stops responding.</p>
"""
ou = "Menu 8.1."
relu = "redemarrage"

[sections.modules]
titre = "Modules [modules]"
intro = "<p>Additional programs started alongside the station (DX Cluster…), connected through a local bus.</p>"
ou = "Menu 8.1."
relu = "redemarrage"

[sections.update]
titre = "Updates [update]"
intro = "<p>Search for newly published versions (nothing is installed without your consent).</p>"
ou = "Menu 8.1; installation: menu 7.1."
relu = "redemarrage"

# ---------------------------------------------------------------- racine

[reglages."racine.schema_version"]
role = "Version of the file format. The station updates it itself during a migration."
niveau = "expert"

[reglages."racine.config_revision"]
role = "Counter increased at every save by openRemoteTRX Console: tells which version of the file is in use."
niveau = "expert"

# ---------------------------------------------------------------- rig

[reglages."rig.model"]
role = "Transceiver model number in Hamlib (list: <code>rigctl -l</code>). 1 = dummy transceiver, to try without hardware."
niveau = "courant"
exemple = "IC-7300MK2: 3094 (Hamlib 4.7)."

[reglages."rig.port"]
role = "Serial port of the CAT link. Under Linux, prefer the stable name <code>/dev/serial/by-id/…</code> (it does not change from one restart to the next)."
niveau = "courant"
exemple = "Windows: <code>COM8</code>; Linux: <code>/dev/serial/by-id/usb-Silicon_Labs_…-if00-port0</code>."

[reglages."rig.speed"]
role = "Serial speed of the CAT link. Empty: Hamlib's default speed for this model. Must match the transceiver setting."
niveau = "courant"
exemple = "19200, 115200."

[reglages."rig.ptt_type"]
role = "How the station keys the transceiver: <code>RIG</code> (CAT command), <code>RTS</code> or <code>DTR</code> (line of a serial port), <code>GPIO</code> / <code>GPION</code> (Raspberry Pi pin), <code>NONE</code> (none: receive only)."
niveau = "courant"
securite = "The station reads the PTT state back after every command; with <code>NONE</code>, no transmission is possible."

[reglages."rig.ptt_port"]
role = "Port of the PTT control when it is not on the CAT port (RTS or DTR of another port). Empty: the CAT port."
niveau = "expert"

[reglages."rig.extra_conf"]
role = "Extra options passed to rigctld (<code>-C name=value</code>), for a transceiver that needs them."
niveau = "expert"
securite = "Forbidden here: the spectrum options (<code>async</code>, <code>multicast_…</code>, set by [spectrum]) and <code>cache_timeout</code>. The station always starts rigctld with <code>cache_timeout=0</code> (since 0.134.0): with a cache, after a cut rigctld returns the commanded value instead of the real state of the transceiver, and a transceiver still transmitting would look as if it had stopped."
exemple = "[\"civaddr=0x94\"]"

[reglages."rig.tx_modes"]
role = "Modes in which transmitting is allowed; empty = all. On Icom transceivers, audio from the USB sound card is only transmitted in data modes (USB-D, LSB-D, FM-D…): in another mode, the transceiver would modulate with its own microphone."
niveau = "courant"
securite = "A transmit request in a mode missing from the list is refused. The SWR measurement uses the first FM mode allowed here (FM, PKTFM or FM-D)."
exemple = "Icom: [\"PKTUSB\", \"PKTLSB\", \"FM-D\", \"AM-D\"]."

[reglages."rig.max_power_w"]
role = "Maximum power of the transceiver in watts. 0: unknown, the page and the app show percentages instead of watts."
niveau = "courant"
exemple = "100 for a 100 W transceiver."

[reglages."rig.tuner"]
role = "The transceiver's built-in antenna tuner is used. At each operator connection, the station then reads the transceiver's automatic tuning settings through the second CI-V port (IC-7300MK2: [TUNER] Switch = Auto, PTT Start = ON) and warns if they are wrong or cannot be checked. It never changes them."
niveau = "courant"
securite = "Remotely, without automatic tuning when keying, a new frequency may transmit into a high SWR. Outside the amateur bands, tuning on PTT is not guaranteed by the transceiver."
exemple = "true if the antenna goes through the transceiver's tuner; false (default) otherwise."
depuis = "0.210.0"

[reglages."rig.port_usb"]
role = "USB identity of the transceiver port (manufacturer, product, serial number, interface), recorded when remote power-on is enabled. Before each power-on, the station checks that the port in <code>port</code> is STILL the transceiver's; if it has changed (another USB socket under Windows), power-on is refused and the new port is named."
niveau = "expert"
securite = "The station only READS this identity; it never opens another port on its own initiative (a serial port opened by mistake can raise RTS or DTR, hence a PTT)."
exemple = "<code>10C4:EA70 SN=01D0F21E IF=00</code> (“Enhanced” port of the CP2105 of an FTDX10); empty = not recorded."
depuis = "0.222.0"

[reglages."rig.ptt_port_usb"]
role = "USB identity of the PTT port when it is separate from the transceiver port (PTT by RTS or DTR); same check as <code>port_usb</code>."
niveau = "expert"
exemple = "Empty (default): PTT over CAT, or port not recorded."
depuis = "0.222.0"

# ---------------------------------------------------------------- audio

[reglages."audio.capture_device"]
role = "Sound card that receives the audio from the transceiver (the audio heard remotely). Empty: the system default card."
niveau = "courant"
exemple = "Linux: <code>plughw:CARD=CODEC,DEV=0</code>; Windows: <code>Microphone (USB Audio CODEC)</code>."

[reglages."audio.playback_device"]
role = "Sound card that sends audio to the transceiver (your voice when transmitting). Empty: the system default card."
niveau = "courant"

[reglages."audio.sample_rate"]
role = "Sample rate. Only 48,000 is supported (Opus codec)."
niveau = "expert"
bornes = "48000 only."

[reglages."audio.rx_gain_db"]
role = "Gain applied to the received audio, in dB (negative = quieter), for all terminals, visitors and broadcast included. Set by openRemoteTRX Console, menu 2.9, which suggests a value based on the received level."
niveau = "courant"
bornes = "-40 to +20 dB."

[reglages."audio.rx_limiter"]
role = "Limiter of the received audio: peaks capped at -1 dBFS before the terminals, so that a high gain or a strong signal does not clip. <code>false</code> = gain applied without a cap (clipping possible), for troubleshooting only. openRemoteTRX Console, menu 2.9."
niveau = "courant"
depuis = "0.227.0"
exemple = "rx_limiter = true"

[reglages."audio.tx_gain_db"]
role = "Gain applied to the audio sent to the transceiver, in dB."
niveau = "courant"
securite = "Too much overdrives the transmitter: set it on a dummy load while watching the ALC."

# ---------------------------------------------------------------- tools

[reglages."tools.hamlib_dir"]
role = "Hamlib installation folder under Windows (the one that contains <code>bin\\rigctld.exe</code>). Empty: Hamlib must be in the PATH."
niveau = "courant"
exemple = "<code>C:\\Program Files\\hamlib-w64-4.7.2</code>"

# ---------------------------------------------------------------- network

[reglages."network.rigctld_host"]
role = "Listening address of rigctld, the Hamlib service that talks to the transceiver."
niveau = "expert"
securite = "rigctld has NO authentication: it must listen locally only (127.0.0.1). The station refuses any other value."

[reglages."network.rigctld_port"]
role = "Local port of rigctld."
niveau = "expert"

[reglages."network.gateway_bind"]
role = "Listening address of the station for the page and the app. <code>127.0.0.1</code>: this machine only; the machine's address on your VPN; or <code>0.0.0.0</code>: all its addresses."
niveau = "courant"
securite = "Outside the machine, HTTPS is required (<code>tls_cert</code>, <code>tls_key</code>), except with <code>allow_insecure_http</code> inside a VPN."

[reglages."network.gateway_port"]
role = "Station port for the web page and the app."
niveau = "courant"

[reglages."network.web_client"]
role = "Serves the web control page on the same port as the app. false: app only."
niveau = "expert"

[reglages."network.tls_cert"]
role = "HTTPS certificate of the station (PEM file). The wizard generates one; its fingerprint is used to pair the phone (menu 4.1)."
niveau = "courant"

[reglages."network.tls_key"]
role = "Private key of the HTTPS certificate."
niveau = "courant"
securite = "Secret file: it must be readable by the station only."

[reglages."network.allow_insecure_http"]
role = "Allows listening outside the machine WITHOUT HTTPS. Only accept this inside a VPN that already encrypts everything."
niveau = "expert"
securite = "On the Internet without a VPN, passwords and audio would travel unencrypted: leave false."

[reglages."network.trusted_proxies"]
role = "Addresses (or ranges) of the trusted relays in front of the station, whose X-Forwarded-For header is believed to know the client's real address."
niveau = "expert"

[reglages."network.ice_servers"]
role = "STUN/TURN servers to set up audio (WebRTC) across the Internet. []: local network or VPN only."
niveau = "expert"

# ---------------------------------------------------------------- safety

[reglages."safety.tot_s"]
role = "Maximum duration of a transmission (TOT) in seconds: beyond it, the station goes back to receive, with a warning beep beforehand."
niveau = "courant"
bornes = "Above 0 and at most <code>tot_ceiling_s</code>."
securite = "Also limits the length of a replayed recording (TOT minus 5 s)."

[reglages."safety.tot_ceiling_s"]
role = "TOT ceiling: the value of <code>tot_s</code> cannot exceed it."
niveau = "courant"
securite = "The supervisor cuts on its own side beyond <code>[supervisor] tot_abs_s</code>, which must stay larger."

[reglages."safety.enforce_bands"]
role = "true: the station refuses to transmit outside the <code>[[bands]]</code>. false: the transceiver forbids it (for example the “TX limit” of Icom transceivers); the responsibility is yours."
niveau = "courant"
securite = "With true and an empty band list, no transmission is possible (receive only)."

[reglages."safety.warn_before_s"]
role = "Seconds before the end of the TOT when the warning is given."
niveau = "expert"
bornes = "Between 0 and <code>tot_s</code>."

[reglages."safety.heartbeat_interval_ms"]
role = "Expected rate of heartbeats from the phone or the page during a transmission (proof that the client is still there)."
niveau = "expert"

[reglages."safety.heartbeat_timeout_ms"]
role = "With no heartbeat for this long, the station goes back to receive (client lost, network down)."
niveau = "expert"
securite = "Do not increase it without a reason: this is what cuts a transmission whose client has disappeared."

[reglages."safety.rig_temp_warn_c"]
role = "Transceiver temperature (if Hamlib provides it) from which a warning is shown and sent."
niveau = "courant"
bornes = "Between 20 and 90 °C, lower than <code>rig_temp_cut_c</code>."

[reglages."safety.rig_temp_cut_c"]
role = "Beyond it, remote transmission is cut and refused until the temperature is back below <code>rig_temp_warn_c</code>."
niveau = "courant"

[reglages."safety.swr_alert"]
role = "SWR above which the station warns the operator who is transmitting (red banner and beep in the page), if the SWR read stays above it for more than one second; one alert per transmission. 0: off."
niveau = "courant"
bornes = "0, or 1.2 to 10."
securite = "Alert ONLY: the station never cuts the transmission for a high SWR (the transceiver already reduces its power by itself)."
exemple = "2.0 (default)."
depuis = "0.212.0"

[reglages."safety.allow_replay"]
role = "Allows replaying a recording of the received audio (page and app): record a correspondent then send it back on transmit. Asked by the wizard when the transceiver is added; refused by default."
niveau = "courant"
securite = "Retransmitting a station's transmission to third parties is generally FORBIDDEN in the amateur service: only enable it knowingly, under your own responsibility."
depuis = "0.91.0"

[reglages."safety.rig_tot_warn"]
role = "Transceiver TOT (internal transmit timer) READ when an operator connects: if it is OFF, the page and the app say so, once a day per account. Only for a transceiver whose reading has been qualified (currently the Icom IC-7300MK2, PTT over CAT); for the others, the wizard reminds you to set it."
niveau = "courant"
securite = "READ only: the station never changes the transceiver TOT and does not prevent transmitting. An uncertain reading (silent transceiver, unexpected answer) never gives “OFF”: no notice."
exemple = "true (default)."
depuis = "0.245.0"

# ---------------------------------------------------------------- bands

[reglages."bands.name"]
role = "Band name, shown in messages."
niveau = "courant"
exemple = "\"40m\""

[reglages."bands.low_mhz"]
role = "Lower band edge, in MHz."
niveau = "courant"
exemple = "7.000"

[reglages."bands.high_mhz"]
role = "Upper band edge, in MHz."
niveau = "courant"
exemple = "7.200"

# ---------------------------------------------------------------- clients

[reglages."clients.id"]
role = "Login username of the account, typed in the page or the app. Since 0.247.0, case does not matter when logging in (“PC” opens the account “pc”): two accounts that differ only by case are refused."
niveau = "courant"
exemple = "\"telephone\", \"voiture\""

[reglages."clients.token"]
role = "Old plain-text secret (older versions). Still accepted, but to be replaced by a password (<code>password_hash</code>)."
niveau = "expert"
securite = "A plain-text secret in the file can be read by anyone who reads the file: replace it."

[reglages."clients.password_hash"]
role = "Password hash (scrypt); never the password itself. Written by the wizard, menu 4.2 or <code>trx-setup --set-password</code>."
niveau = "courant"

[reglages."clients.role"]
role = "<code>operator</code>: full control; <code>listener</code>: listen-only visitor, no command to the transceiver."
niveau = "courant"

[reglages."clients.pseudo"]
role = "Name shown to the other connected users instead of the username (several accounts can use the same one)."
niveau = "courant"

[reglages."clients.enabled"]
role = "false: connection refused, and a current connection is closed."
niveau = "courant"

[reglages."clients.expires"]
role = "End date of the account (YYYY-MM-DD, station time); empty: never."
niveau = "courant"

[reglages."clients.admin"]
role = "true: this operator account can also open openRemoteTRX Console over the network (<code>[remote_console]</code>, menu 4.6). Other operators control the transceiver but do not administer the station."
niveau = "courant"
bornes = "Operators only (never a visitor)."
securite = "The password of an administrator account opens the station configuration: do not lend it."
