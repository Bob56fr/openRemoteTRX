niveau = "courant"
securite = "Never the CAT port or the PTT port. On the IC-7300, set “USB SEND” and “USB Keying” to OFF for this port: otherwise it could key the transceiver."
exemple = "Windows: <code>COM7</code>; Linux: <code>/dev/serial/by-id/…-if02-port0</code>."

[reglages."spectrum.civ_address"]
