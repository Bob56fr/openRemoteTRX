ou = "Asistente (menú 2.1), emparejamiento de un teléfono (menú 4.1), o menú 8.1."
relu = "redemarrage"

[sections.safety]
titre = "Seguridades de transmisión [safety]"
intro = "<p>Las reglas que la estación aplica a TODA transmisión pedida a distancia, con independencia de la página y de la aplicación.</p>"
ou = "Menú 8.1; umbrales de temperatura: menú 3.1; repetición: asistente (menú 2.1)."
relu = "redemarrage"

[sections.bands]
