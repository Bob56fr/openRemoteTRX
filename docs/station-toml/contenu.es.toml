# ---------------------------------------------------------------- supervisor

[reglages."supervisor.tot_abs_s"]
role = "TOT absoluto del supervisor: pasado este tiempo, corta él mismo la transmisión, aunque la pasarela no lo haga. Corta también una transmisión hecha con el micrófono del transceptor."
niveau = "courant"
securite = "Debe seguir siendo estrictamente mayor que <code>[safety] tot_ceiling_s</code>."

[reglages."supervisor.poll_interval_s"]
role = "Cadencia de vigilancia en reposo (más rápida durante una transmisión)."
niveau = "expert"

[reglages."supervisor.max_reboots_per_hour"]
role = "Reinicios de la máquina permitidos por hora; por encima, bloqueo de seguridad (recepción, acceso cortado)."
niveau = "expert"

[reglages."supervisor.notify_url"]
role = "Dirección de notificación ntfy para las alertas de la estación (opcional). Cada alerta lleva un código estable (por ejemplo « ORT-5024 TOT absoluto superado »), la prioridad ntfy de ese código, lo que hay que hacer y el enlace a la página del código (<a href=\"https://bob56fr.github.io/openRemoteTRX/erreurs/\" target=\"_blank\" rel=\"noopener noreferrer\">lista de códigos de error</a>); un código sin alerta por defecto solo se anota en el registro."
niveau = "courant"
exemple = "<code>https://ntfy.sh/mon-sujet-secret</code>"
securite = "Elige un tema difícil de adivinar: cualquiera que lo conozca lee tus alertas."

[reglages."supervisor.notify_lang"]
role = "Idioma de las alertas ntfy enviadas al teléfono: título, mensaje y pasos a seguir del catálogo de errores. El registro de la estación sigue en francés; un valor medido (detalle) queda tal como lo escribe la estación."
niveau = "courant"
bornes = "<code>fr</code> (por defecto), <code>en</code>, <code>de</code> o <code>es</code>: los idiomas del catálogo de errores (alemán y español desde la versión 0.241.0)."
exemple = "<code>en</code>"
depuis = "0.165.0"

[reglages."supervisor.status_path"]
role = "Archivo de estado escrito por la pasarela y leído por el supervisor, trx-monitor y openRemoteTRX Console."
niveau = "expert"
defaut = "<code>/run/trx-remote/gateway-status.json</code> (Linux); <code>C:\\ProgramData\\trx-remote\\run\\gateway-status.json</code> (Windows)."

[reglages."supervisor.state_dir"]
role = "Carpeta de estado de la estación: bloqueo de seguridad, memorias, perfiles, medidas de ROE, identificador de estación."
niveau = "expert"
defaut = "<code>/var/lib/trx-remote</code> (Linux); <code>C:\\ProgramData\\trx-remote\\state</code> (Windows)."

[reglages."supervisor.service_mode"]
role = "<code>auto</code>, <code>systemd</code> (Linux: servicios del sistema) o <code>managed</code> (el supervisor lanza él mismo los procesos, Windows)."
niveau = "expert"

[reglages."supervisor.instance_lock_port"]
role = "Puerto local reservado para garantizar que solo funcione un supervisor."
niveau = "expert"

[reglages."supervisor.stale_after_s"]
role = "Pasarela considerada muda si su archivo de estado no cambia desde hace este plazo."
niveau = "expert"

[reglages."supervisor.startup_grace_s"]
role = "Plazo de gracia al arrancar, el tiempo que tardan la pasarela y rigctld en estar listos."
niveau = "expert"

[reglages."supervisor.mismatch_grace_s"]
role = "Tolerancia antes de considerar una transmisión « inexplicada » (transceptor transmitiendo sin cliente)."
niveau = "expert"

[reglages."supervisor.rigctld_fail_s"]
role = "rigctld inaccesible desde hace este plazo: se reinicia."
niveau = "expert"

[reglages."supervisor.recovery_wait_s"]
role = "Espera entre dos niveles de la escala de recuperación (relanzamientos, reset USB, bloqueo de seguridad)."
niveau = "expert"

[reglages."supervisor.healthy_reset_s"]
role = "Tiempo sin problemas antes de volver a empezar desde el primer nivel de la escala de recuperación."
niveau = "expert"

[reglages."supervisor.temp_alert_c"]
role = "Temperatura de la máquina por encima de la cual se envía una alerta (sin otra acción)."
niveau = "expert"

[reglages."supervisor.mem_alert_pct"]
role = "Memoria usada (en %) por encima de la cual se envía una alerta <code>notify_url</code>, si dura 60 s; una alerta por hora como máximo. Ninguna otra acción (ni reinicio, ni bloqueo de seguridad)."
niveau = "expert"
bornes = "0 (ninguna alerta) o 50 a 99."
depuis = "0.115.0"

[reglages."supervisor.disk_alert_pct"]
role = "Disco usado (en %) por encima del cual se envía una alerta, medido en la carpeta de estado y en la raíz del sistema; 60 s seguidos, una alerta por hora como máximo. Un disco lleno impide escribir el estado y los registros."
niveau = "expert"
bornes = "0 (ninguna alerta) o 50 a 99."
depuis = "0.115.0"

[reglages."supervisor.alive_every_h"]
role = "Mensaje « Estación en servicio » enviado por <code>notify_url</code> cada N horas (prioridad mínima); 0: ninguno."
niveau = "courant"

[reglages."supervisor.allow_local_tx"]
role = "true (« estación compartida »): una transmisión hecha con el micrófono del transceptor no se corta a distancia (solo se aplica el TOT absoluto), y el PTT a distancia queda bloqueado durante la transmisión local y luego 2 minutos."
niveau = "courant"
securite = "false: se corta toda transmisión no pedida por la estación. Un micrófono mantenido pulsado resiste entonces el corte y lleva al bloqueo de seguridad en un minuto aproximadamente: deja true si alguien usa el transceptor en el sitio."

[reglages."supervisor.local_tx_max_s"]
role = "Estación compartida: duración de transmisión con el micrófono del transceptor tolerada cuando un operador está PRESENTE, es decir, cuando se ha visto una acción sobre el transceptor (volumen, frecuencia, modo, salida del modo DATA, preamplificador, NR...) en los 2 minutos anteriores al paso a transmisión o durante la transmisión. Pasado el TOT absoluto, simple alerta; al llegar a esta duración, corte por el supervisor, y luego escala de recuperación y bloqueo de seguridad si la transmisión resiste. Sin prueba de presencia, se aplica el TOT absoluto."
niveau = "expert"
bornes = "1 a 600 s; nunca menos que <code>tot_abs_s</code> (se aplica el mayor de los dos)."
securite = "Un micrófono atascado justo después de una acción sobre el transceptor transmite hasta esta duración antes de cortarse."
depuis = "0.157.0"

