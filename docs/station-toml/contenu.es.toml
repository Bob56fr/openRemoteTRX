# Guía de los ajustes de station.toml (página pública, tema oscuro, iframe del sitio rf-diy.com).
# La LISTA de ajustes y sus valores por defecto vienen del código (trxstation/config.py); las explicaciones, de aquí.
# Un ajuste sin explicación, o una explicación sin ajuste, detiene scripts/build_station_toml_doc.py y las pruebas.
# Contenido público: solo ejemplos genéricos, nunca una dirección IP real, un nombre de máquina, un usuario ni una clave.
#
# [reglages."section.cle"]: role (obligatorio), niveau = "courant" | "expert", y si hace falta: bornes, securite,
# exemple, defaut (sustituye el valor del código cuando depende del sistema), depuis (versión de aparición).

[page]
titre = "Ajustes de la estación: station.toml"
intro = """
<p><code>station.toml</code> es el archivo de configuración de la estación: el transceptor, las tarjetas de sonido, la red, las
seguridades de transmisión, las cuentas, las funciones opcionales. Lo escribe el asistente de openRemoteTRX Console y se modifica
después con openRemoteTRX Console (menú 8.1, y los menús específicos citados en cada sección). La estación lo <strong>comprueba</strong>
en cada arranque: un valor incoherente se rechaza con un mensaje preciso, nunca se ignora en silencio.</p>
"""
lecture = """
<p><strong>Principiante</strong>: solo te conciernen los ajustes <span class="courant">courant</span>; el asistente los configura
por ti. Los ajustes <span class="pro">expert</span> tienen valores por defecto seguros: tócalos solo con conocimiento
de causa. Ubicación del archivo: <code>/etc/trx-remote/station.toml</code> (Debian, Raspberry Pi),
<code>C:\\ProgramData\\trx-remote\\station.toml</code> (Windows).</p>
"""

