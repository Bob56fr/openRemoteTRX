[reglages."spectrum.data_port"]
role = "Fuente rigctld: puerto UDP local de la difusión del espectro."
niveau = "expert"

[reglages."spectrum.max_fps"]
role = "Cadencia máxima del espectro enviado a los clientes (imágenes por segundo)."
niveau = "expert"

[reglages."spectrum.port"]
role = "Fuente civ_port: segundo puerto serie del transceptor."
niveau = "courant"
securite = "Nunca el puerto CAT ni el puerto PTT. En el IC-7300, ajusta « USB SEND » y « USB Keying » en OFF para este puerto: si no, podría poner el transceptor en transmisión."
