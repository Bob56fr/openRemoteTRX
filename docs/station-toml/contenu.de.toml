# Erläuterung der Einstellungen von station.toml (öffentliche Seite, dunkles Design, iframe der Website rf-diy.com).
# Die LISTE der Einstellungen und ihre Standardwerte stammen aus dem Code (trxstation/config.py); die Erklärungen von hier.
# Eine Einstellung ohne Erklärung oder eine Erklärung ohne Einstellung stoppt scripts/build_station_toml_doc.py und die Tests.
# Öffentlicher Inhalt: nur allgemeine Beispiele, niemals eine echte IP-Adresse, ein Rechnername, ein Benutzername oder ein Schlüssel.
#
# [reglages."section.cle"]: role (Pflicht), niveau = "courant" | "expert", und bei Bedarf: bornes, securite,
# exemple, defaut (ersetzt den Wert aus dem Code, wenn er vom System abhängt), depuis (Version, seit der es sie gibt).

[page]
titre = "Einstellungen der Station: station.toml"
intro = """
<p><code>station.toml</code> ist die Konfigurationsdatei der Station: Transceiver, Soundkarten, Netzwerk,
Sendesicherheit, Konten, optionale Funktionen. Sie wird vom Assistenten der openRemoteTRX Console geschrieben und danach
über die openRemoteTRX Console geändert (Menü 8.1 und die bei jedem Abschnitt genannten Fachmenüs). Die Station <strong>prüft</strong>
sie bei jedem Start: Ein widersprüchlicher Wert wird mit einer genauen Meldung abgelehnt, niemals stillschweigend ignoriert.</p>
"""
lecture = """
<p><strong>Einsteiger</strong>: Für Sie sind nur die Einstellungen <span class="courant">courant</span> von Belang; der Assistent
nimmt sie für Sie vor. Die Einstellungen <span class="pro">expert</span> haben sichere Standardwerte: Ändern Sie sie nur, wenn Sie
genau wissen, was Sie tun. Speicherort der Datei: <code>/etc/trx-remote/station.toml</code> (Debian, Raspberry Pi),
<code>C:\\ProgramData\\trx-remote\\station.toml</code> (Windows).</p>
"""

# ---------------------------------------------------------------- sections

[sections.racine]
titre = "Dateikopf"
intro = "<p>Zwei Nummern, die die Station selbst verwaltet.</p>"
ou = "Nichts zu tun: von der Station geschrieben."
relu = "redemarrage"

[sections.rig]
titre = "Der Transceiver [rig]"
intro = "<p>Der von Hamlib gesteuerte Transceiver: Modell, CAT-Verbindung, PTT-Steuerung, Betriebsarten und Leistung.</p>"
ou = "Assistent (Menü 2.1), Transceiver-Profile (Menü 2.3) oder Menü 8.1."
relu = "redemarrage"

[sections.audio]
titre = "Der Ton [audio]"
intro = "<p>Die beiden Audiorichtungen zwischen Station und Transceiver (Audio-Interface wie Digirig, SignaLink oder die USB-Soundkarte des Transceivers).</p>"
ou = "Assistent (Menü 2.1), Transceiver-Profile (Menü 2.3) oder Menü 8.1."
relu = "redemarrage"

[sections.tools]
titre = "Werkzeuge [tools]"
intro = "<p>Wo Hamlib zu finden ist, wenn es nicht im Suchpfad des Systems liegt.</p>"
ou = "Assistent (Menü 2.1) oder Menü 8.1."
relu = "redemarrage"

[sections.network]
titre = "Netzwerk [network]"
intro = "<p>Wie die Webseite und die App die Station erreichen. Siehe auch die Anleitung zum Fernzugriff (VPN oder freigegebener Port mit HTTPS).</p>"
ou = "Assistent (Menü 2.1), Kopplung eines Telefons (Menü 4.1) oder Menü 8.1."
relu = "redemarrage"

[sections.safety]
titre = "Sendesicherheit [safety]"
intro = "<p>Die Regeln, die die Station auf JEDES aus der Ferne angeforderte Senden anwendet, unabhängig von Webseite und App.</p>"
ou = "Menü 8.1; Temperaturschwellen: Menü 3.1; Wiedergabe: Assistent (Menü 2.1)."
relu = "redemarrage"

[sections.bands]
titre = "Erlaubte Bänder [[bands]]"
intro = """
<p>Ein Eintrag pro Band, auf dem Senden erlaubt ist. <strong>Leere Liste = nur Empfang.</strong> Die vom Assistenten
vorgeschlagenen Bänder (IARU Region 1) sind ein Ausgangspunkt: Prüfen Sie sie für Ihre Lizenz und Ihr Land.</p>
"""
ou = "Assistent (Menü 2.1) oder Menü 8.1."
relu = "redemarrage"

[sections.clients]
titre = "Konten [[clients]]"
intro = "<p>Ein Eintrag pro Konto, das sich verbinden darf: Operatoren (volle Kontrolle) und Besucher (nur Mithören).</p>"
ou = "Assistent (Menü 2.1), Besucher (Menü 4.2), Befehl <code>trx-setup --add-client</code>."
relu = "chaud"

[sections.access]
titre = "Besucher nur mit Empfang [access]"
intro = "<p>Konten, die die Station mithören und den Bildschirm des Operators sehen, ohne jeden Befehl an den Transceiver.</p>"
ou = "Menü 4.2."
relu = "chaud"

[sections.swr]
titre = "SWR-Messung [swr]"
intro = "<p>Die SWR-Kurve der Antenne, gestartet von der Webseite oder der App: ein kurzer FM-Träger pro Messpunkt. Letzte Messung: Menü 5.4.</p>"
ou = "Menü 8.1."
relu = "redemarrage"

[sections.power]
titre = "Transceiver aus der Ferne ein- und ausschalten [power]"
intro = "<p>Den Transceiver beim Verbinden eines Operators einschalten und ihn von der Webseite oder der App aus ausschalten (STOP 3 s gedrückt halten). Standardmäßig außer Betrieb. Nur für einen Transceiver, der dies über CAT erlaubt (Hamlib: „set / get Power Stat“) und dessen USB im ausgeschalteten Zustand versorgt bleibt. Die Station sendet niemals, um den Transceiver ein- oder auszuschalten.</p>"
ou = "openRemoteTRX Console, Menü 2.8 (Inbetriebnahme mit einem Test Ausschalten / Wiedereinschalten); Feineinstellungen: Menü 8.1."
relu = "redemarrage"

[sections.breizh]
titre = "Breizh Audio Box beim Senden [breizh]"
intro = "<p>Der Mikrofonton läuft über Breizh Audio Box (Sprachbearbeitung) auf einem anderen PC im lokalen Netzwerk, bevor er zum Transceiver geht. Antwortet Breizh nicht mehr, schaltet die Station selbstständig auf direkt zurück. Der Mikrofonton läuft UNVERSCHLÜSSELT über das lokale Netzwerk: nur in einem vertrauenswürdigen Netzwerk.</p>"
ou = "Menü 8.1; der Kopplungsschlüssel wird mit der openRemoteTRX Console erstellt (Datei <code>breizh.key</code> neben station.toml)."
relu = "redemarrage"

[sections.netprobe]
titre = "Sonde für die Netzwerkqualität [netprobe]"
intro = "<p>Die Station misst laufend die Verbindung zu jedem verbundenen Telefon oder Browser (Verluste, Umlaufzeit, Jitter, Ausfälle) und gibt nach einem Ausfall an, welcher Abschnitt wahrscheinlich versagt hat. Eine kleine Anzeige zeigt dies an; die Statistiken der letzten 30 Tage, das Löschen und der Export befinden sich in der Webseite und der App. Die Sonde misst nur: Sie greift niemals in das Senden ein.</p>"
ou = "Menü 8.1. Die in der Webseite oder der App gewählten Schwellen der Anzeige (Statistiken, Rubrik „Schwellen“) werden getrennt gespeichert und haben Vorrang vor denen hier."
relu = "redemarrage"

[sections.presence]
titre = "Gruppen-Anwesenheit [presence]"
intro = "<p>Eine Gruppe von Freunden mit openRemoteTRX sieht, wer an seiner Station aktiv ist und, wenn jeder es möchte, auf welcher Frequenz und in welcher Betriebsart. Ein Relais im Internet überträgt VERSCHLÜSSELTE Zustände, die es nicht lesen kann. Das Modul „presence“ hat keinerlei Rechte am Transceiver: Es kann weder senden noch die Frequenz ändern; ein QSY zu einem Freund erfolgt nur durch einen Tastendruck des Operators, im Empfang.</p>"
ou = "Menü 8.1, und „presence“ zu <code>[modules] run</code> hinzufügen. Gruppen, Anzeigename und das, was geteilt wird, werden in der Webseite, der App oder der openRemoteTRX Console eingestellt (getrennt gespeichert, nicht in station.toml)."
relu = "redemarrage"

[sections.monitor_link]
titre = "Überwachung zwischen Stationen [monitor_link]"
intro = "<p>Um einem Operator in Schwierigkeiten zu HELFEN oder um HILFE zu BEKOMMEN, ohne VPN und ohne offenen Port: Die Station des unterstützten Operators sendet über dasselbe Relais wie die Anwesenheit und Ende-zu-Ende-verschlüsselt das, was IHR Operator erlaubt hat (Heartbeat, Zustand des Rechners, Zustand des Transceivers standardmäßig ohne Frequenz und Betriebsart, Fehlercodes), stets maskiert (Passwörter, Adressen, Seriennummern). Die helfende Station kann nur lesen und ANFRAGEN: Es gibt keinerlei Befehl an die unterstützte Station. Das Modul „monlink“ hat keinerlei Rechte am Transceiver.</p>"
ou = "Menü 8.1, und „monlink“ zu <code>[modules] run</code> hinzufügen. Anzeigename, Einladungen, Verknüpfungen und Sendeprofile werden in der openRemoteTRX Console eingestellt (getrennt gespeichert, nicht in station.toml)."
relu = "redemarrage"

[sections.diffusion]
titre = "Live-Übertragung [diffusion]"
intro = "<p>Den Ton des TRX einigen Internetnutzern hörbar machen, die KEIN Konto auf der Station haben, wie ein Live-Podcast: Die Station sendet den Ton an einen Übertragungsserver (Icecast), und die Hörer hören ihn auf der Seite dieses Servers oder in VLC. Sie erreichen die Station nie. Standardmäßig geschlossen, standardmäßig privat (Benutzername und Passwort für Hörer), standardmäßig 1 Stunde; die vom Operator gesendete Sprache wird nur übertragen, wenn er es verlangt. Das Modul „diffusion“ hat keinerlei Rechte am Transceiver. Kein Server ist vorgegeben: der, den der Administrator des Servers nennt, mit dem Quell-Passwort und dem Schlüssel der Metadaten (eigene Datei, niemals in station.toml).</p>"
ou = "Menü 8.1, und „diffusion“ zu <code>[modules] run</code> hinzufügen. Protokoll: <code>docs/protocole-diffusion.md</code> im Repository."
relu = "redemarrage"

[sections.remote_console]
titre = "openRemoteTRX Console im Netzwerk [remote_console]"
intro = "<p>Die openRemoteTRX Console im Browser, von jedem PC, Tablet oder Telefon im lokalen Netzwerk oder im VPN, ohne SSH: <code>https://&lt;station&gt;:8444/</code>. Man meldet sich mit einem <strong>als Administrator markierten Operatorkonto</strong> an (<code>admin = true</code> in <code>[[clients]]</code>); die Sitzung wird nach 30 Minuten ohne Aktion geschlossen. Die Konsole läuft unter einem gewöhnlichen Linux-Konto, niemals root: Das sudo-Passwort wird weiterhin im Terminal abgefragt, einmal pro Sitzung. Niemals aus dem Internet erreichbar (öffentliche Adressen werden abgelehnt).</p>"
ou = "Menü 4.6 der openRemoteTRX Console."
relu = "redemarrage"

[sections.dashboard]
titre = "Dashboard der Vitalwerte [dashboard]"
intro = "<p>Eine Seite NUR ZUM LESEN, die den Zustand der Station auf einen Blick zeigt: Transceiver, Senden, Dienste, Computer, Netzwerk, Warnungen der letzten 24 Stunden. Sie ist für einen kleinen Bildschirm an der Station gedacht (<code>http://127.0.0.1:8450/</code>) und für ein Telefon über das lokale Netzwerk oder das VPN. Kein Befehl, kein Passwort: Nichts Lebenswichtiges wird dort gezeigt. Die Punkte der Endgeräte sind die Operatorkonten aus <code>[[clients]]</code> (ohne Besucher), in der Reihenfolge der Datei. Eigener Dienst (<code>trx-dashboard</code>): Der Bildschirm bleibt an, wenn der Gateway ausfällt, und zeigt „Station stumm“.</p>"
ou = "Menü 8.1. Adresse in der Kopfzeile der openRemoteTRX Console angezeigt („Web-Dashboard“)."
relu = "redemarrage"
depuis = "0.280.0"

[sections.spectrum]
titre = "HF-Spektrum des Transceivers [spectrum]"
intro = "<p>Das HF-Spektrum und der Wasserfall des Transceivers in der Webseite und der App, über einen zweiten Port des Transceivers (Icom) oder über Hamlib.</p>"
ou = "Assistent (Menü 2.1), Transceiver-Profile (Menü 2.3) oder Menü 8.1."
relu = "redemarrage"

[sections.freedv]
titre = "FreeDV im Empfang [freedv]"
intro = "<p>Die Station dekodiert die digitale FreeDV-Sprache (RADE V1) selbst, mit zwei Programmen des FreeDV-Teams, die nur gestartet werden, wenn der Operator in der Webseite die Betriebsart FreeDV wählt: Alle Verbundenen, Besucher eingeschlossen, hören dann die dekodierte Sprache anstelle des Tons des Transceivers, mit Synchronisation, SNR und empfangenen Rufzeichen. Nur Empfang: Es wird nichts gesendet, und der Transceiver wird nicht verändert.</p>"
ou = "Menü 8.1; die Betriebsart FreeDV wird in der Webseite gewählt (Rubrik „FreeDV“), sie bleibt nach einem Neustart nicht erhalten."
relu = "redemarrage"

[sections.sdr]
titre = "SDR-Empfänger [sdr]"
intro = "<p>Ein SDR-Empfänger parallel zum TRX, nur im Empfang: Sein Wasserfall wird in der Webseite angezeigt (Rubrik „SDR“). Der SDR wird über seine Seriennummer bestimmt. Die API des Herstellers muss VOR der Station von Hand installiert werden; die Station kompiliert dann das Programm sdr-core. Außerdem „sdr“ zu <code>[modules] run</code> hinzufügen.</p>"
ou = "Menü 8.1; Mitte, Verstärkung und Bildrate werden danach in der Webseite eingestellt."
relu = "redemarrage"

[sections.selcall]
titre = "SELCALL [selcall]"
intro = "<p>Digitaler Squelch per Gruppenruf: Der Empfangston bleibt stumm, bis Ihr Code gerufen wird.</p>"
ou = "Menü 8.1; Code und Optionen werden in der Webseite oder der App eingestellt."
relu = "redemarrage"

[sections.cluster]
titre = "DX-Cluster [cluster]"
intro = "<p>Die Spots der DX-Cluster, des RBN und der CB-Funker, angezeigt auf dem Spektrum und als Liste.</p>"
ou = "Menü 8.1; Passwörter der Quellen: Datei <code>secrets.toml</code> (niemals hier)."
relu = "redemarrage"

[sections."cluster.source"]
titre = "Quellen des DX-Clusters [[cluster.source]]"
intro = "<p>Ein Eintrag pro Spot-Quelle (Telnet-Cluster, RBN, Website).</p>"
ou = "Menü 8.1."
relu = "redemarrage"

[sections.supervisor]
titre = "Supervisor [supervisor]"
intro = """
<p>Die zweite Sicherheitsebene, unabhängig vom Gateway: Sie überwacht das Senden, rigctld und den Rechner, schaltet
das Senden im Zweifel ab und startet neu, was nicht mehr antwortet.</p>
"""
ou = "Menü 8.1."
relu = "redemarrage"

[sections.modules]
titre = "Module [modules]"
intro = "<p>Zusatzprogramme, die neben der Station laufen (DX-Cluster …), verbunden über einen lokalen Bus.</p>"
ou = "Menü 8.1."
relu = "redemarrage"

[sections.update]
titre = "Updates [update]"
intro = "<p>Suche nach neu veröffentlichten Versionen (ohne Ihre Zustimmung wird nichts installiert).</p>"
ou = "Menü 8.1; Installation: Menü 7.1."
relu = "redemarrage"

# ---------------------------------------------------------------- racine

[reglages."racine.schema_version"]
role = "Version des Dateiformats. Die Station aktualisiert sie bei einer Migration selbst."
niveau = "expert"

[reglages."racine.config_revision"]
role = "Zähler, der bei jedem Speichern durch die openRemoteTRX Console erhöht wird: zeigt, welche Version der Datei in Betrieb ist."
niveau = "expert"

# ---------------------------------------------------------------- rig

[reglages."rig.model"]
role = "Modellnummer des Transceivers in Hamlib (Liste: <code>rigctl -l</code>). 1 = Dummy-Transceiver, zum Ausprobieren ohne Hardware."
niveau = "courant"
exemple = "IC-7300MK2: 3094 (Hamlib 4.7)."

[reglages."rig.port"]
role = "Serieller Port der CAT-Verbindung. Unter Linux ist der stabile Name <code>/dev/serial/by-id/…</code> vorzuziehen (er ändert sich nicht von einem Neustart zum nächsten)."
niveau = "courant"
exemple = "Windows: <code>COM8</code>; Linux: <code>/dev/serial/by-id/usb-Silicon_Labs_…-if00-port0</code>."

[reglages."rig.speed"]
role = "Baudrate der CAT-Verbindung. Leer: die Standard-Baudrate von Hamlib für dieses Modell. Muss mit der Einstellung des Transceivers übereinstimmen."
niveau = "courant"
exemple = "19200, 115200."

[reglages."rig.ptt_type"]
role = "Wie die Station den Transceiver auf Senden schaltet: <code>RIG</code> (CAT-Befehl), <code>RTS</code> oder <code>DTR</code> (Leitung eines seriellen Ports), <code>GPIO</code> / <code>GPION</code> (Pin des Raspberry Pi), <code>NONE</code> (keine: nur Empfang)."
niveau = "courant"
securite = "Die Station liest den PTT-Zustand nach jedem Befehl zurück; mit <code>NONE</code> ist kein Senden möglich."

[reglages."rig.ptt_port"]
role = "Port der PTT-Steuerung, wenn sie nicht auf dem CAT-Port liegt (RTS oder DTR eines anderen Ports). Leer: der CAT-Port."
niveau = "expert"

[reglages."rig.extra_conf"]
role = "Zusätzliche Optionen für rigctld (<code>-C name=wert</code>), für einen Transceiver, der sie braucht."
niveau = "expert"
securite = "Hier verboten: die Optionen des Spektrums (<code>async</code>, <code>multicast_…</code>, eingestellt über [spectrum]) und <code>cache_timeout</code>. Die Station startet rigctld immer mit <code>cache_timeout=0</code> (seit 0.134.0): Mit einem Cache liefert rigctld nach einer Abschaltung den befohlenen Wert statt des tatsächlichen Zustands des Transceivers, und ein noch sendender Transceiver würde abgeschaltet erscheinen."
exemple = "[\"civaddr=0x94\"]"

[reglages."rig.tx_modes"]
role = "Betriebsarten, in denen Senden erlaubt ist; leer = alle. Bei Icom wird das Audio der USB-Soundkarte nur in den Datenbetriebsarten (USB-D, LSB-D, FM-D …) gesendet: in einer anderen Betriebsart würde der Transceiver mit seinem eigenen Mikrofon modulieren."
niveau = "courant"
securite = "Eine Sendeanforderung in einer Betriebsart, die nicht in der Liste steht, wird abgelehnt. Die SWR-Messung verwendet die erste hier erlaubte FM-Betriebsart (FM, PKTFM oder FM-D)."
exemple = "Icom: [\"PKTUSB\", \"PKTLSB\", \"FM-D\", \"AM-D\"]."

[reglages."rig.max_power_w"]
role = "Höchstleistung des Transceivers in Watt. 0: unbekannt, Webseite und App zeigen Prozentwerte statt Watt an."
niveau = "courant"
exemple = "100 für einen 100-W-Transceiver."

[reglages."rig.tuner"]
role = "Der eingebaute Antennentuner des Transceivers wird verwendet. Bei jeder Verbindung eines Operators liest die Station dann die Einstellungen der automatischen Abstimmung über den zweiten CI-V-Port (IC-7300MK2: [TUNER] Switch = Auto, PTT Start = ON) und warnt, wenn sie falsch sind oder nicht geprüft werden können. Sie ändert sie niemals."
niveau = "courant"
securite = "Aus der Ferne kann eine neue Frequenz ohne automatische Abstimmung beim Tasten mit hohem SWR senden. Außerhalb der Amateurfunkbänder garantiert der Transceiver die Abstimmung beim PTT nicht."
exemple = "true, wenn die Antenne über den Tuner des Transceivers läuft; sonst false (Standard)."
depuis = "0.210.0"

[reglages."rig.port_usb"]
role = "USB-Kennung des Transceiver-Ports (Hersteller, Produkt, Seriennummer, Schnittstelle), erfasst bei der Inbetriebnahme des Einschaltens aus der Ferne. Vor jedem Einschalten prüft die Station, dass der Port aus <code>port</code> IMMER NOCH der des Transceivers ist; hat er sich geändert (andere USB-Buchse unter Windows), wird das Einschalten abgelehnt und der neue Port genannt."
niveau = "expert"
securite = "Die Station LIEST diese Kennung nur; sie öffnet niemals von sich aus einen anderen Port (ein versehentlich geöffneter serieller Port kann RTS oder DTR setzen, also einen PTT auslösen)."
exemple = "<code>10C4:EA70 SN=01D0F21E IF=00</code> (Port „Enhanced“ des CP2105 eines FTDX10); leer = nicht erfasst."
depuis = "0.222.0"

[reglages."rig.ptt_port_usb"]
role = "USB-Kennung des PTT-Ports, wenn er vom Port des Transceivers getrennt ist (PTT über RTS oder DTR); gleiche Prüfung wie bei <code>port_usb</code>."
niveau = "expert"
exemple = "Leer (Standard): PTT über CAT oder Port nicht erfasst."
depuis = "0.222.0"

# ---------------------------------------------------------------- audio

[reglages."audio.capture_device"]
role = "Soundkarte, die das Audio des Transceivers empfängt (den aus der Ferne gehörten Ton). Leer: die Standardkarte des Systems."
niveau = "courant"
exemple = "Linux: <code>plughw:CARD=CODEC,DEV=0</code>; Windows: <code>Microphone (USB Audio CODEC)</code>."

[reglages."audio.playback_device"]
role = "Soundkarte, die das Audio zum Transceiver schickt (Ihre Stimme beim Senden). Leer: die Standardkarte des Systems."
niveau = "courant"

[reglages."audio.sample_rate"]
role = "Abtastrate. Nur der Wert 48 000 wird unterstützt (Opus-Codec)."
niveau = "expert"
bornes = "Nur 48000."

[reglages."audio.rx_gain_db"]
role = "Verstärkung des Empfangstons in dB (negativ = leiser), für alle Endgeräte, Besucher und Übertragung eingeschlossen. Eingestellt über die openRemoteTRX Console, Menü 2.9, das einen Wert anhand des Empfangspegels vorschlägt."
niveau = "courant"
bornes = "-40 bis +20 dB."

[reglages."audio.rx_limiter"]
role = "Begrenzer des Empfangstons: Spitzen auf -1 dBFS begrenzt, bevor der Ton die Endgeräte erreicht, damit eine hohe Verstärkung oder ein starkes Signal nicht übersteuert. <code>false</code> = Verstärkung ohne Begrenzung (Übersteuerung möglich), nur zur Diagnose. openRemoteTRX Console, Menü 2.9."
niveau = "courant"
depuis = "0.227.0"
exemple = "rx_limiter = true"

[reglages."audio.tx_gain_db"]
role = "Verstärkung des zum Transceiver geschickten Tons in dB."
niveau = "courant"
securite = "Zu viel übersteuert den Sender: Stellen Sie sie an einer Dummy-Load ein und beobachten Sie dabei die ALC."

# ---------------------------------------------------------------- tools

[reglages."tools.hamlib_dir"]
role = "Installationsordner von Hamlib unter Windows (der Ordner, der <code>bin\\rigctld.exe</code> enthält). Leer: Hamlib muss im PATH liegen."
niveau = "courant"
exemple = "<code>C:\\Program Files\\hamlib-w64-4.7.2</code>"

# ---------------------------------------------------------------- network

[reglages."network.rigctld_host"]
role = "Abhöradresse von rigctld, dem Hamlib-Dienst, der mit dem Transceiver spricht."
niveau = "expert"
securite = "rigctld hat KEINERLEI Authentifizierung: Es darf nur lokal lauschen (127.0.0.1). Die Station lehnt jeden anderen Wert ab."

[reglages."network.rigctld_port"]
role = "Lokaler Port von rigctld."
niveau = "expert"

[reglages."network.gateway_bind"]
role = "Abhöradresse der Station für Webseite und App. <code>127.0.0.1</code>: nur dieser Rechner; die Adresse des Rechners in Ihrem VPN; oder <code>0.0.0.0</code>: alle seine Adressen."
niveau = "courant"
securite = "Außerhalb des Rechners ist HTTPS Pflicht (<code>tls_cert</code>, <code>tls_key</code>), außer mit <code>allow_insecure_http</code> in einem VPN."

[reglages."network.gateway_port"]
role = "Port der Station für die Webseite und die App."
niveau = "courant"

[reglages."network.web_client"]
role = "Liefert die Steuer-Webseite auf demselben Port wie die App aus. false: nur die App."
niveau = "expert"

[reglages."network.tls_cert"]
role = "HTTPS-Zertifikat der Station (PEM-Datei). Der Assistent erzeugt eines; sein Fingerabdruck dient der Kopplung des Telefons (Menü 4.1)."
niveau = "courant"

[reglages."network.tls_key"]
role = "Privater Schlüssel des HTTPS-Zertifikats."
niveau = "courant"
securite = "Geheime Datei: Sie darf nur für die Station lesbar sein."

[reglages."network.allow_insecure_http"]
role = "Erlaubt das Lauschen außerhalb des Rechners OHNE HTTPS. Nur in einem VPN zulassen, das bereits alles verschlüsselt."
niveau = "expert"
securite = "Im Internet ohne VPN würden Passwörter und Audio unverschlüsselt übertragen: Lassen Sie false."

[reglages."network.trusted_proxies"]
role = "Adressen (oder Bereiche) der vertrauenswürdigen Proxys vor der Station, deren Header X-Forwarded-For geglaubt wird, um die tatsächliche Adresse des Clients zu kennen."
niveau = "expert"

[reglages."network.ice_servers"]
role = "STUN/TURN-Server, um das Audio (WebRTC) über das Internet aufzubauen. []: nur lokales Netzwerk oder VPN."
niveau = "expert"

# ---------------------------------------------------------------- safety

[reglages."safety.tot_s"]
role = "Maximale Dauer eines Sendevorgangs (TOT) in Sekunden: Danach schaltet die Station auf Empfang zurück, vorher ertönt ein Warnton."
niveau = "courant"
bornes = "Über 0 und höchstens <code>tot_ceiling_s</code>."
securite = "Begrenzt auch die Dauer einer wiedergegebenen Aufnahme (TOT minus 5 s)."

[reglages."safety.tot_ceiling_s"]
role = "Obergrenze des TOT: Der Wert von <code>tot_s</code> kann sie nicht überschreiten."
niveau = "courant"
securite = "Der Supervisor schaltet seinerseits nach <code>[supervisor] tot_abs_s</code> ab, das größer bleiben muss."

[reglages."safety.enforce_bands"]
role = "true: Die Station verweigert das Senden außerhalb der <code>[[bands]]</code>. false: Der Transceiver verhindert es (zum Beispiel das „TX limit“ der Icom); die Verantwortung liegt bei Ihnen."
niveau = "courant"
securite = "Mit true und einer leeren Bandliste ist kein Senden möglich (nur Empfang)."

[reglages."safety.warn_before_s"]
role = "Sekunden vor dem Ende des TOT, zu denen die Warnung gegeben wird."
niveau = "expert"
bornes = "Zwischen 0 und <code>tot_s</code>."

[reglages."safety.heartbeat_interval_ms"]
role = "Erwarteter Takt der Heartbeats von Telefon oder Webseite während eines Sendevorgangs (Beweis, dass der Client noch da ist)."
niveau = "expert"

[reglages."safety.heartbeat_timeout_ms"]
role = "Ohne Heartbeat seit dieser Zeit schaltet die Station auf Empfang zurück (Client verloren, Netzwerk unterbrochen)."
niveau = "expert"
securite = "Erhöhen Sie ihn nicht ohne Grund: Er schaltet einen Sendevorgang ab, dessen Client verschwunden ist."

[reglages."safety.rig_temp_warn_c"]
role = "Temperatur des Transceivers (falls Hamlib sie liefert), ab der eine Warnung angezeigt und gesendet wird."
niveau = "courant"
bornes = "Zwischen 20 und 90 °C, kleiner als <code>rig_temp_cut_c</code>."

[reglages."safety.rig_temp_cut_c"]
role = "Darüber wird das Senden aus der Ferne abgeschaltet und verweigert, bis die Temperatur wieder unter <code>rig_temp_warn_c</code> liegt."
niveau = "courant"

[reglages."safety.swr_alert"]
role = "SWR, oberhalb dessen die Station den sendenden Operator warnt (rotes Banner und Ton in der Webseite), wenn das gelesene SWR länger als eine Sekunde darüber bleibt; eine Warnung pro Sendevorgang. 0: aus."
niveau = "courant"
bornes = "0, oder 1,2 bis 10."
securite = "NUR eine Warnung: Die Station schaltet das Senden wegen eines hohen SWR niemals ab (der Transceiver reduziert seine Leistung bereits von selbst)."
exemple = "2.0 (Standard)."
depuis = "0.212.0"

[reglages."safety.allow_replay"]
role = "Erlaubt die Wiedergabe einer Aufnahme des Empfangstons (Webseite und App): eine Gegenstation aufnehmen und dann wieder aussenden. Wird vom Assistenten beim Hinzufügen des Transceivers abgefragt; standardmäßig abgelehnt."
niveau = "courant"
securite = "Die Aussendung einer Station an Dritte weiterzusenden ist im Amateurfunkdienst in der Regel VERBOTEN: Aktivieren Sie dies nur, wenn Sie genau wissen, was Sie tun, und auf eigene Verantwortung."
depuis = "0.91.0"

[reglages."safety.rig_tot_warn"]
role = "TOT des Transceivers (interne Sendezeitbegrenzung), GELESEN beim Verbinden eines Operators: Steht er auf OFF, weisen Webseite und App darauf hin, einmal pro Tag und pro Konto. Nur für einen Transceiver, dessen Auslesen qualifiziert wurde (derzeit das Icom IC-7300MK2, PTT über CAT); bei den anderen erinnert der Assistent daran, ihn einzustellen."
niveau = "courant"
securite = "NUR LESEN: Die Station ändert den TOT des Transceivers niemals und verhindert das Senden nicht. Ein unsicherer Lesewert (Transceiver stumm, unerwartete Antwort) ergibt niemals „OFF“: kein Hinweis."
exemple = "true (Standard)."
depuis = "0.245.0"

# ---------------------------------------------------------------- bands

[reglages."bands.name"]
role = "Name des Bandes, in den Meldungen angezeigt."
niveau = "courant"
exemple = "\"40m\""

[reglages."bands.low_mhz"]
role = "Untere Grenze des Bandes, in MHz."
niveau = "courant"
exemple = "7.000"

[reglages."bands.high_mhz"]
role = "Obere Grenze des Bandes, in MHz."
niveau = "courant"
exemple = "7.200"

# ---------------------------------------------------------------- clients

[reglages."clients.id"]
role = "Benutzername des Kontos, eingegeben in der Webseite oder der App. Seit 0.247.0 spielt die Groß-/Kleinschreibung bei der Anmeldung keine Rolle („PC“ öffnet das Konto „pc“): Zwei Konten, die sich nur in der Groß-/Kleinschreibung unterscheiden, werden abgelehnt."
niveau = "courant"
exemple = "\"telephone\", \"voiture\""

[reglages."clients.token"]
role = "Altes Geheimnis im Klartext (ältere Versionen). Wird weiterhin akzeptiert, sollte aber durch ein Passwort ersetzt werden (<code>password_hash</code>)."
niveau = "expert"
securite = "Ein Geheimnis im Klartext in der Datei kann jeder lesen, der die Datei liest: Ersetzen Sie es."

[reglages."clients.password_hash"]
role = "Hash des Passworts (scrypt); niemals das Passwort selbst. Geschrieben vom Assistenten, von Menü 4.2 oder von <code>trx-setup --set-password</code>."
niveau = "courant"

[reglages."clients.role"]
role = "<code>operator</code>: volle Kontrolle; <code>listener</code>: Besucher, der nur mithört, ohne jeden Befehl an den Transceiver."
niveau = "courant"

[reglages."clients.pseudo"]
role = "Name, der den anderen Verbundenen anstelle des Benutzernamens angezeigt wird (mehrere Konten können denselben tragen)."
niveau = "courant"

[reglages."clients.enabled"]
role = "false: Verbindung abgelehnt, und eine laufende Verbindung wird geschlossen."
niveau = "courant"

[reglages."clients.expires"]
role = "Ablaufdatum des Kontos (JJJJ-MM-TT, Uhrzeit der Station); leer: nie."
niveau = "courant"

[reglages."clients.admin"]
role = "true: Dieses Operatorkonto kann auch die openRemoteTRX Console im Netzwerk öffnen (<code>[remote_console]</code>, Menü 4.6). Die anderen Operatoren steuern den Transceiver, verwalten aber nicht die Station."
niveau = "courant"
bornes = "Nur Operatoren (niemals ein Besucher)."
securite = "Das Passwort eines Administratorkontos öffnet die Konfiguration der Station: nicht weitergeben."
depuis = "0.178.0"

# ---------------------------------------------------------------- access

[reglages."access.max_listeners"]
role = "Anzahl gleichzeitig verbundener Besucher; 0: Mithören für Besucher auf der Station geschlossen. Andernfalls öffnet oder schließt der Operator das Mithören von seiner Webseite oder der App aus."
niveau = "courant"
bornes = "0 bis 20."

[reglages."access.max_operators"]
role = "Anzahl gleichzeitiger Operatorverbindungen (eigenes Kontingent: Ein Besucher nimmt niemals den Platz eines Operators ein)."
niveau = "expert"
bornes = "1 bis 8."

[reglages."access.listeners_need_operator"]
role = "true: Besucher werden nur zugelassen, wenn ein Operator aus der Ferne verbunden ist."
niveau = "courant"

[reglages."access.operator_grace_s"]
role = "Wartezeit nach dem Verlust des letzten Operators, bevor die Besucher getrennt werden."
niveau = "expert"
bornes = "0 bis 600 s."

[reglages."access.listeners_outside_bands"]
role = "false: Stille für die Besucher, wenn der Empfang die Bänder der Station verlässt."
niveau = "courant"

[reglages."access.listener_spectrum_fps"]
role = "Höchste Bildrate des HF-Spektrums für Besucher (Bilder pro Sekunde); der Operator behält seine eigene."
niveau = "expert"
bornes = "1 bis 20."

[reglages."access.overload_temp_c"]
role = "Schutz der Station: Prozessortemperatur, oberhalb der (10 s lang) die Besucher getrennt werden."
niveau = "expert"
bornes = "50 bis 105 °C."

[reglages."access.overload_cpu_pct"]
role = "Gleicher Schutz: Prozessorlast (alle Kerne) in %."
niveau = "expert"
bornes = "50 bis 100 %."

[reglages."access.overload_lag_ms"]
role = "Gleicher Schutz: Verzögerung der Ereignisschleife der Station, in Millisekunden."
niveau = "expert"
bornes = "20 bis 2000 ms."

[reglages."access.overload_mem_pct"]
role = "Gleicher Schutz: minimaler freier Arbeitsspeicher, in %."
niveau = "expert"
bornes = "1 bis 50 %."

# ---------------------------------------------------------------- swr

[reglages."power.enabled"]
role = "true: Einschalten des Transceivers beim Verbinden eines Operators und Ausschalten von der Webseite oder der App aus. false (Standard): weder Ein- noch Ausschalten aus der Ferne."
niveau = "courant"
securite = "Ausschalten wird während jedes Sendevorgangs und bei Nutzung des Transceivers vor Ort abgelehnt; nach dem Einschalten liest die Station den PTT zurück und schaltet den Transceiver auf Empfang, falls er sendend eingeschaltet wurde."
exemple = "In Betrieb nehmen über Menü 2.8 der openRemoteTRX Console, das zuerst versucht, den Transceiver aus- und wieder einzuschalten."
depuis = "0.222.0"

[reglages."power.on_timeout_s"]
role = "Wartezeit auf die Antwort des Transceivers nach dem Einschaltbefehl. Danach gilt das Einschalten mit einer klaren Meldung als fehlgeschlagen."
niveau = "expert"
bornes = "5 bis 120 s (Standard 30; ein FTDX10 antwortet nach etwa 8 s)."
depuis = "0.222.0"

[reglages."power.idle_off"]
role = "Automatisches Ausschalten des Transceivers, wenn seit <code>idle_off_hours</code> Stunden niemand mehr verbunden ist (weder Operator noch Besucher), ohne laufende Übertragung und ohne Bedienung am Transceiver. Während eines Sendevorgangs um 10 min verschoben, niemals erzwungen."
niveau = "courant"
exemple = "false (Standard)."
depuis = "0.222.0"

[reglages."power.idle_off_hours"]
role = "Zeit ohne jede Verbindung bis zum automatischen Ausschalten."
niveau = "courant"
bornes = "1 bis 168 h (Standard 4)."
depuis = "0.222.0"

[reglages."power.notify"]
role = "ntfy-Benachrichtigung bei jedem Einschalten, Ausschalten oder Fehlschlag (wer, wie). Ein SENDEND eingeschalteter Transceiver löst immer eine Warnung aus, auch ohne diese Einstellung."
niveau = "courant"
exemple = "false (Standard); erfordert <code>[supervisor] notify_url</code>."
depuis = "0.222.0"

[reglages."swr.enabled"]
role = "false: Die SWR-Messung wird nicht angeboten."
niveau = "courant"
depuis = "0.90.0"

[reglages."swr.max_power_pct"]
role = "Leistungsobergrenze der Messung, in % der Leistung des Transceivers. Der Operator wählt die Leistung (standardmäßig 15 %) unterhalb dieser Grenze."
niveau = "courant"
bornes = "5 bis 50 %."
securite = "Niemals über 50 %: Einige Watt genügen zum Messen."
depuis = "0.90.0"

[reglages."swr.max_points"]
role = "Höchstzahl der Messpunkte einer Messung."
niveau = "expert"
bornes = "2 bis 200."
depuis = "0.90.0"

[reglages."swr.point_tx_max_s"]
role = "Maximale Sendedauer eines Messpunkts. Die tatsächliche Zeit wird bei der ersten Verwendung für jedes Transceiver-Modell kalibriert, ohne diesen Wert zu überschreiten."
niveau = "expert"
bornes = "0,5 bis 3 s."
depuis = "0.90.0"

# ---------------------------------------------------------------- freedv

[reglages."freedv.enabled"]
role = "true: FreeDV wird in der Webseite angeboten (Rubrik und Anzeige „FDV“); die Decoder laufen nur, solange der Operator die Betriebsart FreeDV gewählt hat."
niveau = "courant"
securite = "Nur Empfang: Die Betriebsart FreeDV ändert weder Frequenz noch Betriebsart des Transceivers und wird während eines Sendevorgangs abgelehnt. Ein Ausfall der Decoder stoppt niemals die Station: Nach 5 Neustarts in 10 Minuten kommt der Ton des Transceivers zurück."
depuis = "0.122.0"

[reglages."freedv.ka9q_path"]
role = "Programm, das Sprache und Rufzeichen dekodiert (freedv-ka9q, aus freedv-integrations). Ein Name allein wird im PATH gesucht, dann unter den mit der Station gelieferten Decodern (Windows-Paket). Debian und Raspberry Pi: <code>sudo bash compiler-freedv.sh</code> (Ordner des Pakets) kompiliert sie und legt sie in den PATH; danach ist nichts einzustellen."
niveau = "expert"
bornes = "Pfad einer Datei oder Name allein; niemals leer. Nicht gefunden: Die Betriebsart FreeDV wird mit dem Namen des fehlenden Programms abgelehnt."
exemple = "<code>freedv-ka9q</code> (Standard, Debian und Windows) oder der vollständige Pfad eines separat kompilierten Programms."
depuis = "0.122.0"

[reglages."freedv.locator"]
role = "Maidenhead-Locator der Station. Dient der Liste „FreeDV-Aktivität“ (Modul <code>freedv_activity</code> in <code>[modules] run</code>): Entfernung jeder Station und Bewertung der Empfangschance. Er wird nirgendwohin gesendet: FreeDV Reporter wird nur als Beobachter gelesen."
niveau = "courant"
bornes = "4 oder 6 Zeichen (JN18 oder JN18du), oder leer (Liste ohne Entfernung, ungenauere Bewertung)."
exemple = "<code>JN18du</code>"
depuis = "0.125.0"

[reglages."freedv.radae_rx_path"]
role = "Programm, das Synchronisation, SNR und Frequenzversatz liefert (radae_rx, aus rade_c). Ein Name allein wird im PATH gesucht, dann unter den mit der Station gelieferten Decodern (Windows-Paket), wie freedv-ka9q."
niveau = "expert"
bornes = "Pfad einer Datei oder Name allein; niemals leer."
exemple = "<code>radae_rx</code>"
depuis = "0.122.0"

# ---------------------------------------------------------------- sdr

[reglages."sdr.enabled"]
role = "true: Die Rubrik „SDR“ (Wasserfall eines SDR-Empfängers parallel zum TRX) wird den Operatoren angeboten. Außerdem nötig: „sdr“ in <code>[modules] run</code> und die Seriennummer des SDR in <code>serial</code>."
niveau = "courant"
securite = "Nur Empfang: Das SDR-Modul hat keinerlei Rechte am Transceiver; „QSY des TRX“ läuft über den üblichen Frequenzbefehl, der während eines Sendevorgangs abgelehnt wird. Ein Ausfall des SDR stoppt niemals die Station. Der Schutz des SDR-Eingangs vor der vom TRX gesendeten Leistung (getrennte Antenne, Sequenzer) liegt in der Verantwortung des Operators."
depuis = "0.140.0"

[reglages."sdr.driver"]
role = "SDR-Typ. <code>sdrplay</code>: RSP von SDRplay, dessen API (Software des Herstellers) VOR der Installation der Station von Hand installiert wird. <code>rtlsdr</code> (Station 0.149.0+): RTL-SDR-Stick (darunter der RTL-SDR Blog V4), Treiber von der Station selbst installiert; der TV-Treiber des Kernels wird ausgeschlossen. Wird in Menü 2.4 der openRemoteTRX Console zusammen mit dem SDR gewählt."
niveau = "expert"
bornes = "<code>sdrplay</code> oder <code>rtlsdr</code>."
depuis = "0.140.0"

[reglages."sdr.serial"]
role = "Seriennummer des SDR dieser Station. Der SDR wird immer über diese Nummer bestimmt, niemals über seinen USB-Port: Auf einem Rechner mit mehreren SDR bedient jeder die richtige Anwendung. <code>trx-sdr --list</code> zeigt die freien SDR und die bereits von einer anderen Anwendung belegten."
niveau = "courant"
bornes = "Buchstaben und Ziffern, 4 bis 32; Pflicht bei <code>enabled = true</code>. Nummer beim Start nicht vorhanden: Das Modul wartet (neuer Versuch alle 30 s) und öffnet niemals einen anderen SDR."
securite = "Niemals die Nummer eines SDR eintragen, den eine andere Anwendung des Rechners verwendet."
exemple = "<code>1234567ABC</code>"
depuis = "0.140.0"

[reglages."sdr.core_path"]
role = "Programm sdr-core (nativer Kern des SDR-Moduls). Leer: das von der Installation kompilierte (neben der Station), sonst der PATH."
niveau = "expert"
bornes = "Pfad einer Datei oder leer."
depuis = "0.140.0"

[reglages."sdr.sample_rate_hz"]
role = "Vom Wasserfall des SDR abgedeckte Breite (Abtastrate). 2 MHz decken ein ganzes HF-Band oder das 2-m-Band ab und belasten den Rechner wenig; 6 und 8 MHz erfordern deutlich mehr Rechenleistung."
niveau = "courant"
bornes = "SDRplay: 2000000, 6000000 oder 8000000; RTL-SDR-Stick: 1024000, 2048000 oder 2400000 (Hz)."
exemple = "<code>2000000</code>"
depuis = "0.140.0"

[reglages."sdr.center_hz"]
role = "Mittenfrequenz des SDR beim ersten Start. Danach wird die zuletzt in der Webseite gewählte übernommen (auf der Station gespeichert, nicht in dieser Datei)."
niveau = "courant"
bornes = "1 000 bis 2 000 000 000 Hz."
exemple = "<code>7100000</code>"
depuis = "0.140.0"

[reglages."sdr.antenna"]
role = "Antenneneingang des SDR (RSP2: A oder B; ohne Wirkung bei einem RTL-SDR-Stick, der nur einen hat)."
niveau = "courant"
bornes = "A oder B."
depuis = "0.140.0"

[reglages."sdr.lna_state"]
role = "Zustand des Vorverstärkers (LNA) beim ersten Start: 0 = maximale Verstärkung. Wird danach in der Webseite eingestellt, wo er richtig herum dargestellt ist (Schieberegler „HF-Verstärkung“: 8 = maximale Verstärkung)."
niveau = "expert"
bornes = "0 bis 8."
depuis = "0.140.0"

[reglages."sdr.gain_reduction_db"]
role = "Verstärkungsreduzierung der ZF beim ersten Start, verwendet, wenn die AGC der ZF aus ist (<code>agc = false</code>). Wird danach in der Webseite eingestellt; bei gemeldeter Übersteuerung erhöhen."
niveau = "expert"
bornes = "20 bis 59 dB."
depuis = "0.140.0"

[reglages."sdr.agc"]
role = "Hardware-AGC der ZF: Der SDR stellt die ZF-Verstärkungsreduzierung selbst ein, um das Signal auf dem richtigen Pegel zu halten; die Webseite bietet dann nur den Schieberegler „HF-Verstärkung“. false: Die Verstärkungsreduzierung wird von Hand eingestellt (Schieberegler „ZF-Verstärkung“). Kann danach in der Webseite geändert werden."
niveau = "courant"
bornes = "true oder false."
depuis = "0.141.0"

[reglages."sdr.audio_port"]
role = "UDP-Port, über den das SDR-Modul den demodulierten Ton an den Gateway schickt. Er lauscht nur auf 127.0.0.1 (niemals im Netzwerk) und nimmt nur Pakete mit dem Token des Moduls an."
niveau = "expert"
bornes = "1024 bis 65535, verschieden von <code>[modules] bus_port</code>. Port bereits belegt: nur Wasserfall (Code ORT-6003)."
exemple = "<code>47821</code>"
depuis = "0.142.0"

[reglages."sdr.fft_size"]
role = "Anzahl der FFT-Punkte des Wasserfalls: Je größer, desto feiner das Detail."
niveau = "expert"
bornes = "Zweierpotenz von 512 bis 16 384."
depuis = "0.140.0"

[reglages."sdr.bins"]
role = "Anzahl der Felder einer an die Clients gesendeten Zeile (jedes Feld behält das Maximum der abgedeckten Punkte). Weniger Felder = weniger mobile Daten."
niveau = "expert"
bornes = "Zweierpotenz von 128 bis fft_size."
depuis = "0.140.0"

[reglages."sdr.lines_per_s"]
role = "Wasserfallzeilen pro Sekunde beim ersten Start; werden danach in der Webseite eingestellt."
niveau = "expert"
bornes = "1 bis 15."
depuis = "0.140.0"

[reglages."sdr.max_cpu_pct"]
role = "Prozessor-Obergrenze des SDR-Moduls (sdr-core und Modul zusammen), in Prozent EINES Kerns. Wird sie 10 s lang überschritten, drosselt sich das Modul stufenweise selbst (Wasserfall verlangsamt, dann 1 Zeile/s, dann Abtastung auf 2 MHz); eine Stufe wird nach 5 Minuten deutlich unter der Grenze zurückgegeben. Der Gateway drosselt das Modul ebenfalls, wenn ER selbst überlastet ist, unabhängig von dieser Einstellung."
niveau = "expert"
bornes = "20 bis 800 (150 = anderthalb Kerne)."
exemple = "<code>150</code>"
depuis = "0.144.0"

[reglages."sdr.max_mem_mb"]
role = "Speicher-Obergrenze des SDR-Moduls (sdr-core und Modul zusammen), in MB. Wird sie 10 s lang überschritten, drosselt sich das Modul selbst wie bei <code>max_cpu_pct</code>."
niveau = "expert"
bornes = "50 bis 4000."
exemple = "<code>400</code>"
depuis = "0.144.0"

# ---------------------------------------------------------------- presence

[reglages."presence.enabled"]
role = "true: Die Station meldet sich beim Relais an und tauscht die Anwesenheit mit den Gruppen aus, denen sie angehört („presence“ muss auch in <code>[modules] run</code> stehen)."
niveau = "courant"
securite = "Die Anwesenheit zeigt nur an: Keine vom Relais empfangenen Daten können den Transceiver steuern."
depuis = "0.117.0"

[reglages."presence.relay_url"]
role = "Adresse des Anwesenheits-Relais."
niveau = "expert"
bornes = "https:// Pflicht; http:// nur zu 127.0.0.1 oder localhost (Tests mit einem Relais auf demselben Rechner)."
exemple = "Standard-Relais: <code>https://relay.rf-diy.com</code> (seit 0.257.0; vorher: <code>https://rf-diy.com/orx-relay/public</code>, nach der Migration entfernt: eine station.toml, die es noch enthält, muss korrigiert werden); lokaler Test: <code>http://127.0.0.1:8099</code>."
depuis = "0.117.0"

[reglages."presence.key_file"]
role = "Schlüsseldatei der Station für die Anwesenheit (Signatur und Empfang der Gruppenschlüssel). Leer: <code>presence.key</code> im Zustandsordner, vom Modul beim ersten Start erstellt. Relativ: neben station.toml."
niveau = "expert"
securite = "Diese Datei identifiziert die Station gegenüber dem Relais und den Gruppen: niemals auf eine andere Station kopieren."
depuis = "0.117.0"

# ---------------------------------------------------------------- monitor_link

[reglages."monitor_link.enabled"]
role = "true: Die Station meldet sich beim Relais der Überwachung an, holt die Nachrichten ihrer Verknüpfungen ab und sendet, was jedes Profil erlaubt („monlink“ muss auch in <code>[modules] run</code> stehen). Ohne bestätigte Verknüpfung wird nichts gesendet."
niveau = "courant"
securite = "Die Überwachung liest und zeigt nur an: Keine empfangene Nachricht kann den Transceiver oder die Station steuern."
depuis = "0.159.0"

[reglages."monitor_link.relay_url"]
role = "Adresse des Relais der Überwachung (dasselbe wie für die Anwesenheit)."
niveau = "expert"
bornes = "https:// Pflicht; http:// nur zu 127.0.0.1 oder localhost (Tests mit einem Relais auf demselben Rechner)."
exemple = "Standard-Relais: <code>https://relay.rf-diy.com</code> (seit 0.257.0; vorher: <code>https://rf-diy.com/orx-relay/public</code>, nach der Migration entfernt: eine station.toml, die es noch enthält, muss korrigiert werden); lokaler Test: <code>http://127.0.0.1:8099</code>."
depuis = "0.159.0"

[reglages."monitor_link.key_file"]
role = "Schlüsseldatei der Station für die Überwachung (Signatur, Verschlüsselung der Verknüpfungen). Leer: <code>monlink.key</code> im Zustandsordner (Unterordner <code>monlink</code>), vom Modul beim ersten Start erstellt. Relativ: neben station.toml. Verschieden von den Schlüsseln der Anwesenheit: Die beiden Dienste können nicht miteinander in Verbindung gebracht werden."
niveau = "expert"
securite = "Diese Datei identifiziert die Station gegenüber ihren Überwachungspartnern: niemals auf eine andere Station kopieren."
depuis = "0.159.0"

# ---------------------------------------------------------------- diffusion

[reglages."diffusion.enabled"]
role = "true: Das Modul „diffusion“ erlaubt einem Operator, eine Übertragung zu starten. Keine Übertragung startet von selbst, weder beim Start noch nach einem Neustart des Gateways oder einer Sicherheitsabschaltung."
niveau = "courant"
securite = "Die Weiterverbreitung des eigenen TRX zu aktivieren liegt in der Verantwortung des Operators (die Station filtert die Bänder nicht)."
depuis = "0.188.0"

[reglages."diffusion.server"]
role = "Name des Übertragungsservers, vom Administrator des Servers genannt. Leer: keine Übertragung möglich (kein Server vorgegeben)."
niveau = "courant"
exemple = "server = \"diffusion.example.org\""
depuis = "0.188.0"

[reglages."diffusion.station"]
role = "Name der Station auf diesem Server (2 bis 32 Zeichen a-z, 0-9 und -), vom Administrator des Servers genannt: Er bildet die Adresse der Hörerseite (<code>https://&lt;serveur&gt;/ecoute/&lt;station&gt;</code>) und der Streams."
niveau = "courant"
exemple = "station = \"f4xyz\""
depuis = "0.188.0"

[reglages."diffusion.source_port"]
role = "TLS-Port, an den die Station den Ton direkt an den Icecast-Server sendet (nicht Port 443: ein HTTP-Proxy kann eine Quelle nicht weiterleiten)."
niveau = "expert"
bornes = "1 bis 65535"
depuis = "0.188.0"

[reglages."diffusion.api_port"]
role = "HTTPS-Port der Metadaten (Anzeigename, Frequenz …) und der Hörerzahl."
niveau = "expert"
bornes = "1 bis 65535"
depuis = "0.188.0"

[reglages."diffusion.codec"]
role = "<code>opus</code> (32 kb/s, am sparsamsten, Standard) oder <code>mp3</code> (64 kb/s: ältere iPhones, Radio-Apps)."
niveau = "courant"
depuis = "0.188.0"

[reglages."diffusion.audio_port"]
role = "UDP-Port, über den der Gateway dem Modul den Ton übergibt, nur auf 127.0.0.1 (mit einem Token signierte Pakete). Nur ändern, wenn ein anderes Programm ihn belegt."
niveau = "expert"
bornes = "1024 bis 65535, verschieden von [modules] bus_port und von [sdr] audio_port"
depuis = "0.188.0"

[reglages."diffusion.key_file"]
role = "Datei mit den Geheimnissen der Übertragung (Quell-Passwort, Schlüssel der Metadaten, Benutzername und Passwort der Hörer). Leer: <code>diffusion.key</code> im Zustandsordner (Unterordner <code>diffusion</code>). Relativ: neben station.toml."
niveau = "expert"
securite = "Rechte 0600 unter Linux Pflicht: Eine für andere Konten lesbare Datei wird abgelehnt. Niemals einer Nachricht anhängen."
depuis = "0.188.0"

[reglages."diffusion.outside_bands"]
role = "false (Standard): Stille für die Hörer, wenn der Empfang die erlaubten Bänder (<code>[[bands]]</code>) verlässt oder die Frequenz unbekannt ist, ohne die Übertragung zu beenden: Der Ton kommt zurück, sobald der Transceiver wieder in einem Band ist. true: Alles wird übertragen, unabhängig von der Frequenz. Unabhängig von <code>[access] listeners_outside_bands</code> (Besucher)."
niveau = "courant"
securite = "Was übertragen wird, liegt in der Verantwortung des Operators (Entscheidung des Benutzers vom 2026-11-17)."
depuis = "0.189.0"

[reglages."diffusion.tls"]
role = "true: verschlüsselte Verbindungen und geprüftes Serverzertifikat. false nur zu 127.0.0.1 (Test-Attrappe eines Servers, <code>python -m trxstation.devtools.fake_icecast</code>)."
niveau = "expert"
securite = "Zu jedem anderen Server abgelehnt: Das Quell-Passwort würde unverschlüsselt übertragen."
depuis = "0.188.0"

[reglages."remote_console.enabled"]
role = "true: Die Station stellt die openRemoteTRX Console per HTTPS im Netzwerk bereit (Dienst <code>trx-console-web@compte</code> unter Debian, Prozess des Supervisors unter Windows)."
niveau = "courant"
securite = "Ein Administratorkonto ist fast so viel wert wie ein SSH-Zugang zur Station: starkes Passwort, nur lokales Netzwerk oder VPN. 5 Fehlversuche sperren die Adresse 15 Minuten lang; jede Anmeldung sendet eine ntfy-Benachrichtigung."
depuis = "0.178.0"

[reglages."remote_console.account"]
role = "Linux-Konto, unter dem die Konsole läuft (das des administrierenden Operators: Es muss sudo verwenden können und zur Gruppe <code>trx</code> gehören). Leer unter Windows."
niveau = "courant"
bornes = "Linux-Kontoname: Kleinbuchstaben, Ziffern, _ . - (höchstens 32 Zeichen). Niemals root."
exemple = "<code>account = \"pi\"</code>"
depuis = "0.178.0"

[reglages."remote_console.port"]
role = "HTTPS-Port der Konsole. Die Abhöradresse ist die der Steuerseite (<code>[network] gateway_bind</code>), mit demselben Zertifikat."
niveau = "expert"
bornes = "1024 bis 65535, verschieden vom Port der Steuerseite und von rigctld."
depuis = "0.178.0"

[reglages."remote_console.idle_min"]
role = "Zeit ohne Aktion (Menü geöffnet, Taste gedrückt), nach der die Sitzung geschlossen wird: Man muss sich erneut anmelden."
niveau = "expert"
bornes = "5 bis 240 Minuten."
depuis = "0.178.0"

# ---------------------------------------------------------------- dashboard

[reglages."dashboard.enabled"]
role = "true: Die Station stellt das Dashboard der Vitalwerte bereit (Dienst <code>trx-dashboard</code>). false: Dienst gestoppt."
niveau = "courant"
depuis = "0.280.0"

[reglages."dashboard.port"]
role = "Port des Dashboards."
niveau = "expert"
bornes = "1024 bis 65535, verschieden vom Port der Steuerseite, von rigctld und von der openRemoteTRX Console."
depuis = "0.280.0"

[reglages."dashboard.listen"]
role = "Abgehörte Adressen. LEER (Standard seit 0.281.0): automatisch, wie die Steuerseite: <code>127.0.0.1</code> (Bildschirm der Station), dazu die Adresse der Seite (<code>[network] gateway_bind</code>) oder, wenn diese auf allen Adressen lauscht, die privaten Adressen der Station (lokales Netzwerk, VPN), per HTTPS mit dem Zertifikat aus <code>[network]</code>; eine nach dem Start hinzugekommene Adresse (VPN, DHCP) wird innerhalb einer Minute übernommen. Ausgefüllt: nur diese Adressen (zum Beispiel <code>[\"127.0.0.1\"]</code> nur für den Bildschirm der Station)."
niveau = "expert"
bornes = "Leere Liste oder genaue IP-Adressen; niemals 0.0.0.0 oder ::. Eine Netzwerkadresse erfordert <code>[network] tls_cert</code> und <code>tls_key</code>, oder <code>allow_insecure_http = true</code> in einem VPN (automatisch, ohne sie: nur 127.0.0.1)."
securite = "Kein Passwort: Jeder, der diese Adressen erreicht, sieht den Zustand der Station (kein Befehl möglich). Niemals eine Internetadresse, auch nicht automatisch."
exemple = "<code>listen = []</code> (automatisch) oder <code>listen = [\"127.0.0.1\"]</code>"
depuis = "0.280.0"

[reglages."dashboard.rig_name"]
role = "Im Dashboard angezeigter Name des Transceivers (die Station kennt nur seine Hamlib-Nummer). Leer: kein Name angezeigt."
niveau = "courant"
bornes = "Höchstens 40 Zeichen."
exemple = "<code>rig_name = \"IC-7300MK2\"</code>"
depuis = "0.280.0"

# ---------------------------------------------------------------- breizh

[reglages."breizh.enabled"]
role = "true: Der Mikrofonton des Operators läuft während des Sendens über Breizh Audio Box, wenn Breizh antwortet."
niveau = "courant"
securite = "Breizh kann niemals einen Sendevorgang auslösen oder verlängern: Die Station behält PTT, Audio-Sendetor und ihren Begrenzer."
depuis = "0.99.0"

[reglages."breizh.host"]
role = "IP-Adresse des PCs, auf dem Breizh Audio Box läuft (127.0.0.1, wenn es derselbe PC ist)."
niveau = "courant"
bornes = "Nur private IP-Adresse (RFC 1918: 10/8, 172.16/12, 192.168/16; Link-Local 169.254/16; lokal 127/8; IPv6 fd00::/8, fe80::/10). Weder Hostname noch öffentliche Adresse."
securite = "Der Mikrofonton ist nicht verschlüsselt: Eine öffentliche Adresse wird abgelehnt."
depuis = "0.99.0"

[reglages."breizh.port"]
role = "UDP-Port, auf dem Breizh die Station erwartet (derselbe wie im Reiter „OpenRemoteTRX“ von Breizh)."
niveau = "expert"
bornes = "1024 bis 65535."
depuis = "0.99.0"

[reglages."breizh.key_file"]
role = "Datei des mit Breizh geteilten Kopplungsschlüssels. Leer: <code>breizh.key</code> neben station.toml. Der Schlüssel wird niemals in station.toml geschrieben."
niveau = "expert"
securite = "Datei wird abgelehnt, wenn sie für alle Konten lesbar ist."
depuis = "0.99.0"

[reglages."breizh.block_timeout_ms"]
role = "Zeit, nach der ein Tonblock (10 ms), der nicht von Breizh zurückgekommen ist, unbearbeitet mit reduzierter Verstärkung gesendet wird."
niveau = "expert"
bornes = "15 bis 100 ms."
depuis = "0.99.0"

[reglages."breizh.lost_ms"]
role = "Ohne jede Rückmeldung von Breizh während dieser Zeit wird der Sendevorgang bis zu seinem Ende direkt fortgesetzt (Rückfall)."
niveau = "expert"
bornes = "50 bis 500 ms, größer als block_timeout_ms."
depuis = "0.99.0"

[reglages."breizh.fallback_gain_db"]
role = "Verstärkung des direkten Tons während eines Rückfalls (Breizh verloren), um einen für die Bearbeitung vorgesehenen Ton nicht zu übermodulieren."
niveau = "expert"
bornes = "-20 bis 0 dB."
depuis = "0.99.0"

[reglages."breizh.reactivate_after_s"]
role = "Nach einem Rückfall: Zeit, während der Breizh fehlerfrei antworten muss, bevor es automatisch wieder übernommen wird (niemals während eines Sendevorgangs). 0: nur auf Anforderung des Operators."
niveau = "expert"
bornes = "0, oder 30 bis 3600 s."
depuis = "0.99.0"

# ---------------------------------------------------------------- netprobe

[reglages."netprobe.enabled"]
role = "true: Die Station misst die Qualität der Verbindung zu jedem Client (Netzwerk-Heartbeat von einer Sekunde in beide Richtungen, einige Dutzend Bytes)."
niveau = "courant"
securite = "Die Sonde misst und zeigt nur an: Sie schaltet niemals einen Sendevorgang ab und löst nie einen aus."
depuis = "0.106.0"

[reglages."netprobe.heartbeat_interval_s"]
role = "Periode des Netzwerk-Heartbeats zwischen der Station und jedem Client."
niveau = "expert"
bornes = "0,5 bis 10 s."
depuis = "0.106.0"

[reglages."netprobe.outage_missed_beats"]
role = "Anzahl der Heartbeats ohne Echo, nach der ein Ausfall festgestellt wird."
niveau = "expert"
bornes = "2 bis 20."
depuis = "0.106.0"

[reglages."netprobe.lan_target"]
role = "Router (Gateway des lokalen Netzwerks), den die Station abfragt, um festzustellen, ob ein Ausfall aus ihrem eigenen Netzwerk kommt. auto: das Standard-Gateway des Rechners."
niveau = "expert"
depuis = "0.106.0"

[reglages."netprobe.internet_target"]
role = "Adresse im Internet, die die Station abfragt, um festzustellen, ob ein Ausfall von der Internetverbindung des Routers kommt. Leer: keine Internet-Sonde."
niveau = "expert"
depuis = "0.106.0"

[reglages."netprobe.loss_warn_pct"]
role = "Heartbeat-Verlust über 60 s, ab dem die Anzeige auf Orange wechselt (Startwert)."
niveau = "expert"
bornes = "0,1 bis 100 %, kleiner als loss_alert_pct."
depuis = "0.106.0"

[reglages."netprobe.loss_alert_pct"]
role = "Heartbeat-Verlust über 60 s, ab dem die Anzeige auf Rot wechselt (Startwert)."
niveau = "expert"
bornes = "0,1 bis 100 %."
depuis = "0.106.0"

[reglages."netprobe.rtt_warn_ms"]
role = "Umlaufzeit (p95 über 60 s), ab der die Anzeige auf Orange wechselt. Startwert: Die Rubrik „Schwellen“ der Statistiken schlägt Werte anhand Ihrer Messungen vor."
niveau = "expert"
bornes = "20 bis 5 000 ms, kleiner als rtt_alert_ms."
depuis = "0.106.0"

[reglages."netprobe.rtt_alert_ms"]
role = "Umlaufzeit (p95 über 60 s), ab der die Anzeige auf Rot wechselt (Startwert)."
niveau = "expert"
bornes = "20 bis 5 000 ms."
depuis = "0.106.0"

[reglages."netprobe.alert_outage_s"]
role = "Ein längerer Ausfall sendet eine Benachrichtigung über die Benachrichtigungsadresse aus [supervisor] (notify_url). 0: keine Ausfallbenachrichtigung."
niveau = "courant"
bornes = "0 bis 3 600 s."
depuis = "0.106.0"

[reglages."netprobe.alert_cooldown_s"]
role = "Mindestabstand zwischen zwei Benachrichtigungen der Sonde (Ausfall, Verlust)."
niveau = "expert"
bornes = "30 bis 86 400 s."
depuis = "0.106.0"

[reglages."netprobe.log_retention_days"]
role = "Aufbewahrungsdauer der detaillierten Messungen (Zusammenfassungen über 10 s)."
niveau = "expert"
bornes = "1 bis 30 Tage."
depuis = "0.106.0"

[reglages."netprobe.stats_retention_days"]
role = "Aufbewahrungsdauer der Ausfälle und der stündlichen Statistiken (Ansicht der letzten 30 Tage)."
niveau = "expert"
bornes = "7 bis 90 Tage."
depuis = "0.106.0"

[reglages."netprobe.vpn_shared_warn"]
role = "true: warnt, wenn zwei Geräte anscheinend dasselbe VPN-Profil teilen (gleiche private Adresse oder sehr regelmäßige Ausfälle), bekannte Ursache von Ausfällen alle 15 bis 30 s."
niveau = "courant"
depuis = "0.106.0"

[reglages."netprobe.rsrp_warn_dbm"]
role = "Von der App gemessenes 4G/5G-Signal (RSRP), unterhalb dessen die Anzeige auf Orange wechselt."
niveau = "expert"
bornes = "-140 bis -40 dBm, oberhalb von rsrp_alert_dbm."
depuis = "0.106.0"

[reglages."netprobe.rsrp_alert_dbm"]
role = "4G/5G-Signal (RSRP), unterhalb dessen die Anzeige auf Rot wechselt."
niveau = "expert"
bornes = "-140 bis -40 dBm."
depuis = "0.106.0"

[reglages."netprobe.sinr_warn_db"]
role = "Von der App gemessener 4G/5G-Signal-Rausch-Abstand, unterhalb dessen die Anzeige auf Orange wechselt."
niveau = "expert"
bornes = "-20 bis 30 dB, oberhalb von sinr_alert_db."
depuis = "0.106.0"

[reglages."netprobe.sinr_alert_db"]
role = "4G/5G-Signal-Rausch-Abstand, unterhalb dessen die Anzeige auf Rot wechselt."
niveau = "expert"
bornes = "-20 bis 30 dB."
depuis = "0.106.0"

# ---------------------------------------------------------------- spectrum

[reglages."spectrum.enabled"]
role = "HF-Spektrum und Wasserfall des Transceivers in der Webseite und der App. false: kein HF-Spektrum (nur ein Port zum Transceiver)."
niveau = "courant"

[reglages."spectrum.source"]
role = "<code>civ_port</code>: zweiter serieller Port des Transceivers, auf CI-V eingestellt (Icom, empfohlen); <code>rigctld</code>: Datenstrom von Hamlib 4.6+ (unter Windows nicht empfohlen)."
niveau = "courant"

[reglages."spectrum.data_port"]
role = "Quelle rigctld: lokaler UDP-Port, über den das Spektrum verteilt wird."
niveau = "expert"

[reglages."spectrum.max_fps"]
role = "Höchste Bildrate des an die Clients gesendeten Spektrums (Bilder pro Sekunde)."
niveau = "expert"

[reglages."spectrum.port"]
role = "Quelle civ_port: zweiter serieller Port des Transceivers."
niveau = "courant"
securite = "Niemals der CAT-Port oder der PTT-Port. Beim IC-7300 „USB SEND“ und „USB Keying“ für diesen Port auf OFF stellen: sonst könnte er den Transceiver auf Senden schalten."
exemple = "Windows: <code>COM7</code>; Linux: <code>/dev/serial/by-id/…-if02-port0</code>."

[reglages."spectrum.civ_address"]
role = "Quelle civ_port: CI-V-Adresse des Transceivers, hexadezimal (bei jedem Öffnen erneut geprüft)."
niveau = "courant"
exemple = "IC-7300MK2: B6."

[reglages."spectrum.baud"]
role = "Quelle civ_port: Baudrate des zweiten Ports (gleich der Einstellung des Transceivers)."
niveau = "courant"
bornes = "9600, 19200, 38400, 57600 oder 115200."

# ---------------------------------------------------------------- selcall

[reglages."selcall.enabled"]
role = "SELCALL-Funktion auf dieser Station verfügbar."
niveau = "courant"

[reglages."selcall.send_on_tx_end"]
role = "SELCALL-Rahmen am Ende des Sendevorgangs gesendet, anstelle des Roger-Pieps (nur wenn die verbleibende Sendezeit dafür reicht)."
niveau = "courant"

[reglages."selcall.manual_repeat"]
role = "Manueller Ruf: Anzahl der Aussendungen des Rahmens."
niveau = "expert"
bornes = "1 bis 5."

[reglages."selcall.manual_gap_ms"]
role = "Manueller Ruf: Pause zwischen zwei Rahmen, in Millisekunden."
niveau = "expert"

[reglages."selcall.filter_mode"]
role = "Was mit den SELCALL-Tönen im Empfangston geschieht: <code>mute</code> (stummgeschaltet), <code>attenuate</code> (abgeschwächt), <code>chime</code> (durch einen Gong ersetzt)."
niveau = "expert"

[reglages."selcall.attenuation_db"]
role = "Modus attenuate: Abschwächung der Töne, in dB."
niveau = "expert"

[reglages."selcall.audio_delay_ms"]
role = "Verzögerung des Empfangstons, damit die Töne gefiltert werden, bevor sie zu hören sind."
niveau = "expert"
bornes = "250 bis 1000 ms."

[reglages."selcall.tx_level_dbfs"]
role = "Pegel des gesendeten Rahmens, unterhalb der ALC-Schwelle (automatisch einstellbar in der Webseite oder der App)."
niveau = "expert"

[reglages."selcall.notify_on_call"]
role = "ntfy-Benachrichtigung (URL `notify_url` des Supervisors), vom Gateway gesendet, wenn ein Ruf den Squelch öffnet, höchstens eine pro Minute. Der SELCALL-Code steht niemals darin (ein öffentliches ntfy-Thema lässt sich erraten)."
niveau = "courant"

[reglages."selcall.history_size"]
role = "Anzahl der gespeicherten letzten Codes."
niveau = "expert"

# ---------------------------------------------------------------- cluster

[reglages."cluster.enabled"]
role = "Modul DX-Cluster (Spots der Cluster, des RBN und der CB-Funker)."
niveau = "courant"

[reglages."cluster.call"]
role = "IHR Amateurfunk-Rufzeichen, als einziges an die Cluster und das RBN gesendet. Leer: Das Modul verweigert den Start."
niveau = "courant"

[reglages."cluster.cb_call"]
role = "Ihr CB-Rufzeichen (CB-Quellen); derzeit nirgendwohin gesendet."
niveau = "expert"

[reglages."cluster.modes"]
role = "Verfolgte Betriebsarten (CW, SSB, AM, FM, FREEDV); leer: alle. Niemals die digitalen Betriebsarten."
niveau = "courant"

[reglages."cluster.bands"]
role = "Verfolgte Bänder; leer: alle."
niveau = "courant"

[reglages."cluster.continents"]
role = "Kontinent des SPOTTERS (dessen, der meldet); leer: alle."
niveau = "expert"

[reglages."cluster.blacklist"]
role = "Ignorierte Rufzeichen; <code>XX*</code> steht für ein Präfix."
niveau = "expert"

[reglages."cluster.ttl_min"]
role = "Lebensdauer der Spots der Cluster und der CB-Funker, in Minuten."
niveau = "expert"

[reglages."cluster.rbn_ttl_min"]
role = "Lebensdauer der RBN-Spots, in Minuten."
niveau = "expert"

[reglages."cluster.cty_update"]
role = "Wöchentliche Aktualisierung der Länderliste der Rufzeichen (cty.dat)."
niveau = "expert"

[reglages."cluster.source"]
role = "Die Spot-Quellen: siehe nächster Abschnitt."
niveau = "expert"

# ---------------------------------------------------------------- cluster.source

[reglages."cluster.source.name"]
role = "Name der Quelle, im Zustand der Datenströme angezeigt."
niveau = "expert"

[reglages."cluster.source.type"]
role = "<code>telnet</code> (DX-Cluster), <code>rbn</code> (Reverse Beacon Network), <code>web</code> (Website, CB-Funker)."
niveau = "expert"

[reglages."cluster.source.host"]
role = "telnet, rbn: Name des Servers."
niveau = "expert"

[reglages."cluster.source.port"]
role = "telnet, rbn: Port des Servers."
niveau = "expert"

[reglages."cluster.source.url"]
role = "web: Adresse der Seite (nur https)."
niveau = "expert"

[reglages."cluster.source.call"]
role = "Eigenes Rufzeichen für diese Quelle; leer: <code>[cluster] call</code>."
niveau = "expert"

[reglages."cluster.source.secret"]
role = "NAME eines in <code>secrets.toml</code> abgelegten Passworts (niemals das Passwort selbst); leer: keines."
niveau = "expert"

[reglages."cluster.source.priority"]
role = "Telnet-Cluster: 1 = Haupt-Cluster, dann Ersatz in dieser Reihenfolge."
niveau = "expert"

[reglages."cluster.source.enabled"]
role = "false: Quelle ignoriert."
niveau = "expert"

# ---------------------------------------------------------------- supervisor

[reglages."supervisor.tot_abs_s"]
role = "Absoluter TOT des Supervisors: Danach schaltet er das Senden selbst ab, auch wenn der Gateway es nicht tut. Schaltet auch einen Sendevorgang über das Mikrofon des Transceivers ab."
niveau = "courant"
securite = "Muss streng größer bleiben als <code>[safety] tot_ceiling_s</code>."

[reglages."supervisor.poll_interval_s"]
role = "Überwachungstakt im Ruhezustand (schneller während eines Sendevorgangs)."
niveau = "expert"

[reglages."supervisor.max_reboots_per_hour"]
role = "Erlaubte Neustarts des Rechners pro Stunde; darüber Sicherheitsabschaltung (Empfang, Zugang gesperrt)."
niveau = "expert"

[reglages."supervisor.notify_url"]
role = "ntfy-Benachrichtigungsadresse für die Warnungen der Station (optional). Jede Warnung trägt einen stabilen Code (zum Beispiel „ORT-5024 Absoluter TOT überschritten“), die ntfy-Priorität dieses Codes, was zu tun ist, und den Link zur Seite des Codes (<a href=\"https://bob56fr.github.io/openRemoteTRX/erreurs/\" target=\"_blank\" rel=\"noopener noreferrer\">Liste der Fehlercodes</a>); ein Code ohne Standard-Benachrichtigung wird nur ins Protokoll geschrieben."
niveau = "courant"
exemple = "<code>https://ntfy.sh/mon-sujet-secret</code>"
securite = "Wählen Sie ein schwer zu erratendes Thema: Wer es kennt, liest Ihre Warnungen."

[reglages."supervisor.notify_lang"]
role = "Sprache der ntfy-Benachrichtigungen ans Telefon: Titel, Meldung und Vorgehensweise aus dem Fehlerkatalog. Das Protokoll der Station bleibt auf Französisch; ein gemessener Wert (Detail) bleibt so, wie die Station ihn schreibt."
niveau = "courant"
bornes = "<code>fr</code> (Standard), <code>en</code>, <code>de</code> oder <code>es</code>: die Sprachen des Fehlerkatalogs (Deutsch und Spanisch seit Version 0.241.0)."
exemple = "<code>en</code>"
depuis = "0.165.0"

[reglages."supervisor.status_path"]
role = "Zustandsdatei, vom Gateway geschrieben und vom Supervisor, trx-monitor und der openRemoteTRX Console gelesen."
niveau = "expert"
defaut = "<code>/run/trx-remote/gateway-status.json</code> (Linux); <code>C:\\ProgramData\\trx-remote\\run\\gateway-status.json</code> (Windows)."

[reglages."supervisor.state_dir"]
role = "Zustandsordner der Station: Sicherheitsabschaltung, Speicher, Profile, SWR-Messungen, Kennung der Station."
niveau = "expert"
defaut = "<code>/var/lib/trx-remote</code> (Linux); <code>C:\\ProgramData\\trx-remote\\state</code> (Windows)."

[reglages."supervisor.service_mode"]
role = "<code>auto</code>, <code>systemd</code> (Linux: Systemdienste) oder <code>managed</code> (der Supervisor startet die Prozesse selbst, Windows)."
niveau = "expert"

[reglages."supervisor.instance_lock_port"]
role = "Reservierter lokaler Port, der garantiert, dass nur ein Supervisor läuft."
niveau = "expert"

[reglages."supervisor.stale_after_s"]
role = "Gateway gilt als stumm, wenn sich seine Zustandsdatei seit dieser Zeit nicht mehr ändert."
niveau = "expert"

[reglages."supervisor.startup_grace_s"]
role = "Schonfrist beim Start, bis Gateway und rigctld bereit sind."
niveau = "expert"

[reglages."supervisor.mismatch_grace_s"]
role = "Toleranz, bevor ein Sendevorgang als „unerklärlich“ gilt (Transceiver sendet ohne Client)."
niveau = "expert"

[reglages."supervisor.rigctld_fail_s"]
role = "rigctld seit dieser Zeit nicht erreichbar: Er wird neu gestartet."
niveau = "expert"

[reglages."supervisor.recovery_wait_s"]
role = "Wartezeit zwischen zwei Stufen der Wiederherstellungsleiter (Neustarts, USB-Reset, Sicherheitsabschaltung)."
niveau = "expert"

[reglages."supervisor.healthy_reset_s"]
role = "Problemfreie Zeit, bevor die Wiederherstellungsleiter wieder bei der ersten Stufe beginnt."
niveau = "expert"

[reglages."supervisor.temp_alert_c"]
role = "Temperatur des Rechners, oberhalb der eine Warnung gesendet wird (ohne weitere Maßnahme)."
niveau = "expert"

[reglages."supervisor.mem_alert_pct"]
role = "Belegter Arbeitsspeicher (in %), oberhalb dessen eine Warnung über <code>notify_url</code> gesendet wird, wenn dies 60 s andauert; höchstens eine Warnung pro Stunde. Keine weitere Maßnahme (weder Neustart noch Sicherheitsabschaltung)."
niveau = "expert"
bornes = "0 (keine Warnung) oder 50 bis 99."
depuis = "0.115.0"

[reglages."supervisor.disk_alert_pct"]
role = "Belegter Speicherplatz (in %), oberhalb dessen eine Warnung gesendet wird, gemessen am Zustandsordner und an der Wurzel des Systems; 60 s am Stück, höchstens eine Warnung pro Stunde. Eine volle Festplatte verhindert das Schreiben von Zustand und Protokollen."
niveau = "expert"
bornes = "0 (keine Warnung) oder 50 bis 99."
depuis = "0.115.0"

[reglages."supervisor.alive_every_h"]
role = "Meldung „Station in Betrieb“, alle N Stunden über <code>notify_url</code> gesendet (niedrigste Priorität); 0: keine."
niveau = "courant"

[reglages."supervisor.allow_local_tx"]
role = "true („gemeinsam genutzte Station“): Ein Sendevorgang über das Mikrofon des Transceivers wird nicht aus der Ferne abgeschaltet (nur der absolute TOT gilt), und der PTT aus der Ferne ist während des lokalen Sendens und danach 2 Minuten lang gesperrt."
niveau = "courant"
securite = "false: Jeder nicht von der Station angeforderte Sendevorgang wird abgeschaltet. Ein gedrückt gehaltenes Mikrofon widersteht dann der Abschaltung und führt in etwa einer Minute zur Sicherheitsabschaltung: Lassen Sie true, wenn jemand den Transceiver vor Ort benutzt."

[reglages."supervisor.local_tx_max_s"]
role = "Gemeinsam genutzte Station: tolerierte Sendedauer über das Mikrofon des Transceivers, wenn ein Operator ANWESEND ist, das heißt, wenn eine Bedienung am Transceiver (Lautstärke, Frequenz, Betriebsart, Verlassen der Betriebsart DATA, Vorverstärker, NR ...) in den 2 Minuten vor dem Tasten oder während des Sendens festgestellt wurde. Nach dem absoluten TOT nur eine Warnung; bei dieser Dauer Abschaltung durch den Supervisor, dann Wiederherstellungsleiter und Sicherheitsabschaltung, falls das Senden widersteht. Ohne Nachweis der Anwesenheit gilt der absolute TOT."
niveau = "expert"
bornes = "1 bis 600 s; niemals weniger als <code>tot_abs_s</code> (der größere der beiden Werte gilt)."
securite = "Ein klemmendes Mikrofon direkt nach einer Bedienung am Transceiver sendet bis zu dieser Dauer, bevor es abgeschaltet wird."
depuis = "0.157.0"

[reglages."supervisor.gateway_unit"]
role = "Linux: Name des systemd-Dienstes des Gateways."
niveau = "expert"

[reglages."supervisor.rigctld_unit"]
role = "Linux: Name des systemd-Dienstes von rigctld."
niveau = "expert"

# ---------------------------------------------------------------- modules

[reglages."modules.run"]
role = "Auszuführende Module; leer: keine (kein Bus)."
niveau = "expert"
exemple = "[\"cluster\"]"

[reglages."modules.bus_port"]
role = "Port der internen API der Module, nur lokal."
niveau = "expert"

[reglages."modules.run_as"]
role = "Linux: Konto, unter dem die Module laufen (niemals root)."
niveau = "expert"

[reglages."modules.extra_dir"]
role = "Ordner mit zusätzlichen Modulen; leer: nur die mitgelieferten Module."
niveau = "expert"

# ---------------------------------------------------------------- update

[reglages."update.enabled"]
role = "Sucht beim Start und dann alle 24 h nach einer neuen Version; die Konsole kündigt sie an, ohne Ihre Zustimmung wird nichts installiert."
niveau = "courant"

[reglages."update.allow_prerelease"]
role = "true: bietet auch Vorabversionen (Testversionen) an."
niveau = "expert"
