# Publie docs/site/ (mode d'emploi de TRX Console, guide de l'opérateur…) sur GitHub Pages à chaque push sur main qui
# le modifie. Le PDF du guide n'est pas dans le dépôt : il est imprimé ici, à côté de la page, juste avant la mise en ligne.
# Réglage à faire une fois sur GitHub : Settings > Pages > Build and deployment > Source = « GitHub Actions ».
name: Documentation (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["docs/site/**", ".github/workflows/pages.yml", "scripts/build_user_guide_pdf.py"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PDF du guide de l'opérateur
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
          python scripts/build_user_guide_pdf.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
      - id: deployment
        uses: actions/deploy-pages@v4
