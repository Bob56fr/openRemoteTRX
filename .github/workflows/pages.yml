# Publie docs/site/ (mode d'emploi d'openRemoteTRX Console, guide de l'opérateur…) et la page d'openRemoteTRX-Autotest (autotest/web/) sur GitHub Pages à chaque push sur main qui
# le modifie. Le PDF du guide n'est pas dans le dépôt : il est imprimé ici, à côté de la page, juste avant la mise en ligne.
# Réglage à faire une fois sur GitHub : Settings > Pages > Build and deployment > Source = « GitHub Actions ».
name: Documentation (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["docs/site/**", "autotest/web/**", ".github/workflows/pages.yml", "scripts/build_user_guide_pdf.py"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Deux tâches, comme le modèle de GitHub : la page est envoyée par « build », déployée par « deploy » quand l'envoi
  # est terminé. Dans une seule tâche, deploy-pages ne trouvait parfois pas l'envoi qui venait de réussir (« No
  # artifacts named github-pages », trois fois le 2026-11-23) et la page restait à l'ancienne version.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PDF du guide de l'opérateur
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
          python scripts/build_user_guide_pdf.py
      - name: Page d'openRemoteTRX-Autotest (préqualification depuis Chrome, lot PQ6)
        run: cp -r autotest/web docs/site/autotest
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
