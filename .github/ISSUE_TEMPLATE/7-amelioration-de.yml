name: "🇩🇪 Verbesserung vorschlagen"
description: "Eine Idee für eine Funktion oder Verbesserung der Station, der Webseite oder der App."
title: "[Idee] "
labels: ["enhancement", "lang:de"]
body:
  - type: markdown
    attributes:
      value: |
        Danke für Ihre Idee. Bitte suchen Sie zuerst in den [vorhandenen Tickets](https://github.com/Bob56fr/openRemoteTRX/issues?q=is%3Aissue): Vielleicht wurde sie schon vorgeschlagen.
        Die Sicherheitsregeln beim Senden (PTT nur als Umschalter, automatische Abschaltung, standardmäßig Empfang) sind nicht verhandelbar: Eine Idee, die sie schwächt, wird abgelehnt.
  - type: dropdown
    id: partie
    attributes:
      label: Betroffener Teil
      multiple: true
      options:
        - Station (Gateway, Supervisor)
        - Webseite
        - Android-App
        - Android Auto
        - openRemoteTRX Console
        - Installation (Windows, Debian, Raspberry Pi)
        - Dokumentation
        - Sonstiges
    validations:
      required: true
  - type: textarea
    id: besoin
    attributes:
      label: Der Bedarf
      description: "Was Ihnen heute fehlt oder Sie stört, und in welcher Situation."
    validations:
      required: true
  - type: textarea
    id: proposition
    attributes:
      label: Der Vorschlag
      description: "Was Sie sich wünschen, so konkret wie möglich."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Erwogene Alternativen
      description: "Optional."
  - type: dropdown
    id: trx
    attributes:
      label: Funkgerät (Modell)
      description: "Falls die Idee vom Gerät abhängt (optional)."
      options:
        - "Icom IC-705 (Hamlib 3085)"
        - "Icom IC-905 (Hamlib 3090)"
        - "Icom IC-7100 (Hamlib 3070)"
        - "Icom IC-7200 (Hamlib 3061)"
        - "Icom IC-7300 (Hamlib 3073)"
        - "Icom IC-7300MK2 (Hamlib 3094)"
        - "Icom IC-7410 (Hamlib 3067)"
        - "Icom IC-7600 (Hamlib 3063)"
        - "Icom IC-7610 (Hamlib 3078)"
        - "Icom IC-7760 (Hamlib 3092)"
        - "Icom IC-7850 / IC-7851 (Hamlib 3075)"
        - "Icom IC-9100 (Hamlib 3068)"
        - "Icom IC-9700 (Hamlib 3081)"
        - "Icom IC-R8600 (Hamlib 3079)"
        - "Yaesu FT-710 (Hamlib 1049)"
        - "Yaesu FT-991 / FT-991A (Hamlib 1035)"
        - "Yaesu FTDX10 (Hamlib 1042)"
        - "Yaesu FTDX101D (Hamlib 1040)"
        - "Yaesu FTDX101MP (Hamlib 1044)"
        - "Yaesu FTX-1 (Hamlib 1051)"
        - "Kenwood TS-590S (Hamlib 2031)"
        - "Kenwood TS-590SG (Hamlib 2037)"
        - "Kenwood TS-890S (Hamlib 2041)"
        - "Kenwood TS-990S (Hamlib 2039)"
        - "Elecraft K3 (Hamlib 2029)"
        - "Elecraft K3S (Hamlib 2043)"
        - "Elecraft K4 (Hamlib 2047)"
        - "Xiegu X6100 (Hamlib 3087)"
        - "Xiegu X6200 (Hamlib 3091)"
        - "QRP Labs QMX (Hamlib 2057)"
        - "Anderes Funkgerät (in der Beschreibung angeben)"
        - "Unabhängig vom Funkgerät"
    validations:
      required: false
