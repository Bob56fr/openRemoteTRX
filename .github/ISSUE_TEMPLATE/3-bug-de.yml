name: "🇩🇪 Fehler melden"
description: "Ein unerwartetes Verhalten der Station, der Webseite oder der Android-App."
title: "[Bug] "
labels: ["bug", "lang:de"]
body:
  - type: markdown
    attributes:
      value: |
        Danke, dass Sie sich die Zeit nehmen, dieses Problem zu melden.
        - Bitte suchen Sie zuerst in den [vorhandenen Tickets](https://github.com/Bob56fr/openRemoteTRX/issues?q=is%3Aissue): Vielleicht ist es schon bekannt.
        - Wird ein Fehlercode `ORT-NNNN` angezeigt? Er wird auf der [Seite der Fehlercodes](https://bob56fr.github.io/openRemoteTRX/erreurs/) erklärt.
        - **Dieses Ticket ist öffentlich**: Fügen Sie keine Passwörter, Schlüssel, öffentlichen IP-Adressen oder persönlichen Domainnamen ein.
  - type: input
    id: version
    attributes:
      label: Version
      description: "Station: Kopfzeile von openRemoteTRX Console. App: Anmeldebildschirm."
      placeholder: "Station 0.134.0 / App 0.63.0"
    validations:
      required: true
  - type: dropdown
    id: systeme
    attributes:
      label: System
      description: "Wo das Problem auftritt (Mehrfachauswahl möglich)."
      multiple: true
      options:
        - Windows
        - Linux (Debian, Ubuntu…)
        - Raspberry Pi
        - Android (App)
        - Android Auto
    validations:
      required: true
  - type: dropdown
    id: trx
    attributes:
      label: Funkgerät (Modell)
      description: "Wählen Sie Ihr Funkgerät. Nicht in der Liste: „Anderes Funkgerät“, und geben Sie Hersteller, Modell und Hamlib-Nummer in der Beschreibung an."
      options:
        - "Icom IC-705 (Hamlib 3085)"
        - "Icom IC-905 (Hamlib 3090)"
        - "Icom IC-7100 (Hamlib 3070)"
        - "Icom IC-7200 (Hamlib 3061)"
        - "Icom IC-7300 (Hamlib 3073)"
        - "Icom IC-7300MK2 (Hamlib 3094)"
        - "Icom IC-7410 (Hamlib 3067)"
        - "Icom IC-7600 (Hamlib 3063)"
        - "Icom IC-7610 (Hamlib 3078)"
        - "Icom IC-7760 (Hamlib 3092)"
        - "Icom IC-7850 / IC-7851 (Hamlib 3075)"
        - "Icom IC-9100 (Hamlib 3068)"
        - "Icom IC-9700 (Hamlib 3081)"
        - "Icom IC-R8600 (Hamlib 3079)"
        - "Yaesu FT-710 (Hamlib 1049)"
        - "Yaesu FT-991 / FT-991A (Hamlib 1035)"
        - "Yaesu FTDX10 (Hamlib 1042)"
        - "Yaesu FTDX101D (Hamlib 1040)"
        - "Yaesu FTDX101MP (Hamlib 1044)"
        - "Yaesu FTX-1 (Hamlib 1051)"
        - "Kenwood TS-590S (Hamlib 2031)"
        - "Kenwood TS-590SG (Hamlib 2037)"
        - "Kenwood TS-890S (Hamlib 2041)"
        - "Kenwood TS-990S (Hamlib 2039)"
        - "Elecraft K3 (Hamlib 2029)"
        - "Elecraft K3S (Hamlib 2043)"
        - "Elecraft K4 (Hamlib 2047)"
        - "Xiegu X6100 (Hamlib 3087)"
        - "Xiegu X6200 (Hamlib 3091)"
        - "QRP Labs QMX (Hamlib 2057)"
        - "Anderes Funkgerät (in der Beschreibung angeben)"
    validations:
      required: true
  - type: input
    id: interface
    attributes:
      label: CAT- und Audio-Schnittstelle
      description: "USB-Kabel des Geräts, Digirig, SignaLink… (optional)."
      placeholder: "USB des Geräts"
  - type: dropdown
    id: liaison
    attributes:
      label: Verbindung
      description: "Wie der Client die Station erreicht (Mehrfachauswahl möglich)."
      multiple: true
      options:
        - Lokales Netz (WLAN oder Kabel)
        - VPN (WireGuard, OpenVPN, Tailscale…)
        - Offener Port mit TLS
        - Mobilfunk 4G / 5G
        - Weiß ich nicht
    validations:
      required: true
  - type: checkboxes
    id: emission
    attributes:
      label: Senden
      options:
        - label: "Das Problem betrifft das Senden (PTT, TOT, Rückkehr auf Empfang, Audio-Sperre)."
  - type: textarea
    id: description
    attributes:
      label: Was passiert
      description: "Was Sie beobachtet haben und was Sie stattdessen erwartet hätten."
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Schritte zum Nachstellen
      placeholder: |
        1. Seite der Station öffnen
        2. Band 40 m wählen
        3. …
    validations:
      required: true
  - type: input
    id: code
    attributes:
      label: Fehlercode
      description: "Falls ein Code ORT-NNNN angezeigt wird (optional)."
      placeholder: "ORT-2104"
  - type: textarea
    id: journaux
    attributes:
      label: Protokolle
      description: |
        Nützliche Auszüge aus dem Protokoll (openRemoteTRX Console, Menü 6.2). Der Fehlerbericht (Menü 6.3) ist ein Zip ohne Passwörter: Ziehen Sie ihn in das Feld „Was passiert“ oben. Android-App: Réglages > „Signaler un problème“ (die App ist auf Französisch).
      render: text
  - type: checkboxes
    id: confidentialite
    attributes:
      label: Datenschutz
      options:
        - label: "Ich habe Passwörter, Schlüssel, öffentliche IP-Adressen und persönliche Domainnamen entfernt."
          required: true
