name: "🇪🇸 Informar de un error"
description: "Un comportamiento anómalo de la estación, la página web o la aplicación Android."
title: "[Bug] "
labels: ["bug", "lang:es"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por tomarse el tiempo de informar de este problema.
        - Busque primero entre las [incidencias existentes](https://github.com/Bob56fr/openRemoteTRX/issues?q=is%3Aissue): quizá ya se conozca.
        - ¿Aparece un código de error `ORT-NNNN`? Se explica en la [página de códigos de error](https://bob56fr.github.io/openRemoteTRX/erreurs/).
        - **Esta incidencia es pública**: no pegue contraseñas, claves, direcciones IP públicas ni nombres de dominio personales.
  - type: input
    id: version
    attributes:
      label: Versión
      description: "Estación: cabecera de openRemoteTRX Console. Aplicación: pantalla de conexión."
      placeholder: "estación 0.134.0 / aplicación 0.63.0"
    validations:
      required: true
  - type: dropdown
    id: systeme
    attributes:
      label: Sistema
      description: "Dónde ocurre el problema (se admiten varias opciones)."
      multiple: true
      options:
        - Windows
        - Linux (Debian, Ubuntu…)
        - Raspberry Pi
        - Android (aplicación)
        - Android Auto
    validations:
      required: true
  - type: dropdown
    id: trx
    attributes:
      label: Modelo de transceptor
      description: "Elija su transceptor. Si no está en la lista: «Otro transceptor», e indique marca, modelo y número Hamlib en la descripción."
      options:
        - "Icom IC-705 (Hamlib 3085)"
        - "Icom IC-905 (Hamlib 3090)"
        - "Icom IC-7100 (Hamlib 3070)"
        - "Icom IC-7200 (Hamlib 3061)"
        - "Icom IC-7300 (Hamlib 3073)"
        - "Icom IC-7300MK2 (Hamlib 3094)"
        - "Icom IC-7410 (Hamlib 3067)"
        - "Icom IC-7600 (Hamlib 3063)"
        - "Icom IC-7610 (Hamlib 3078)"
        - "Icom IC-7760 (Hamlib 3092)"
        - "Icom IC-7850 / IC-7851 (Hamlib 3075)"
        - "Icom IC-9100 (Hamlib 3068)"
        - "Icom IC-9700 (Hamlib 3081)"
        - "Icom IC-R8600 (Hamlib 3079)"
        - "Yaesu FT-710 (Hamlib 1049)"
        - "Yaesu FT-991 / FT-991A (Hamlib 1035)"
        - "Yaesu FTDX10 (Hamlib 1042)"
        - "Yaesu FTDX101D (Hamlib 1040)"
        - "Yaesu FTDX101MP (Hamlib 1044)"
        - "Yaesu FTX-1 (Hamlib 1051)"
        - "Kenwood TS-590S (Hamlib 2031)"
        - "Kenwood TS-590SG (Hamlib 2037)"
        - "Kenwood TS-890S (Hamlib 2041)"
        - "Kenwood TS-990S (Hamlib 2039)"
        - "Elecraft K3 (Hamlib 2029)"
        - "Elecraft K3S (Hamlib 2043)"
        - "Elecraft K4 (Hamlib 2047)"
        - "Xiegu X6100 (Hamlib 3087)"
        - "Xiegu X6200 (Hamlib 3091)"
        - "QRP Labs QMX (Hamlib 2057)"
        - "Otro transceptor (indicarlo en la descripción)"
    validations:
      required: true
  - type: input
    id: interface
    attributes:
      label: Interfaz CAT y audio
      description: "Cable USB del equipo, Digirig, SignaLink… (opcional)."
      placeholder: "USB del equipo"
  - type: dropdown
    id: liaison
    attributes:
      label: Conexión
      description: "Cómo llega el cliente a la estación (se admiten varias opciones)."
      multiple: true
      options:
        - Red local (Wi-Fi o cable)
        - VPN (WireGuard, OpenVPN, Tailscale…)
        - Puerto expuesto con TLS
        - Red móvil 4G / 5G
        - No lo sé
    validations:
      required: true
  - type: checkboxes
    id: emission
    attributes:
      label: Transmisión
      options:
        - label: "El problema afecta a la transmisión (PTT, TOT, vuelta a recepción, puerta de audio)."
  - type: textarea
    id: description
    attributes:
      label: Qué ocurre
      description: "Lo que ha observado y lo que esperaba en su lugar."
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abrir la página de la estación
        2. Elegir la banda de 40 m
        3. …
    validations:
      required: true
  - type: input
    id: code
    attributes:
      label: Código de error
      description: "Si aparece un código ORT-NNNN (opcional)."
      placeholder: "ORT-2104"
  - type: textarea
    id: journaux
    attributes:
      label: Registros
      description: |
        Extractos útiles del registro (openRemoteTRX Console, menú 6.2). El informe de diagnóstico (menú 6.3) es un zip sin contraseñas: arrástrelo al campo «Qué ocurre» de arriba. Aplicación Android: Réglages > «Signaler un problème» (la aplicación está en francés).
      render: text
  - type: checkboxes
    id: confidentialite
    attributes:
      label: Privacidad
      options:
        - label: "He quitado contraseñas, claves, direcciones IP públicas y nombres de dominio personales."
          required: true
