name: "🇪🇸 Proponer una mejora"
description: "Una idea de función o de mejora de la estación, la página web o la aplicación."
title: "[Idea] "
labels: ["enhancement", "lang:es"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por su idea. Busque primero entre las [incidencias existentes](https://github.com/Bob56fr/openRemoteTRX/issues?q=is%3Aissue): quizá ya se haya propuesto.
        Las reglas de seguridad de transmisión (PTT solo en conmutación, corte automático, recepción por defecto) no son negociables: una idea que las debilite será rechazada.
  - type: dropdown
    id: partie
    attributes:
      label: Parte afectada
      multiple: true
      options:
        - Estación (pasarela, supervisor)
        - Página web
        - Aplicación Android
        - Android Auto
        - openRemoteTRX Console
        - Instalación (Windows, Debian, Raspberry Pi)
        - Documentación
        - Otra
    validations:
      required: true
  - type: textarea
    id: besoin
    attributes:
      label: La necesidad
      description: "Qué le falta o le molesta hoy, y en qué situación."
    validations:
      required: true
  - type: textarea
    id: proposition
    attributes:
      label: La propuesta
      description: "Lo que le gustaría ver, de la forma más concreta posible."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Otras soluciones consideradas
      description: "Opcional."
  - type: dropdown
    id: trx
    attributes:
      label: Modelo de transceptor
      description: "Si la idea depende del equipo (opcional)."
      options:
        - "Icom IC-705 (Hamlib 3085)"
        - "Icom IC-905 (Hamlib 3090)"
        - "Icom IC-7100 (Hamlib 3070)"
        - "Icom IC-7200 (Hamlib 3061)"
        - "Icom IC-7300 (Hamlib 3073)"
        - "Icom IC-7300MK2 (Hamlib 3094)"
        - "Icom IC-7410 (Hamlib 3067)"
        - "Icom IC-7600 (Hamlib 3063)"
        - "Icom IC-7610 (Hamlib 3078)"
        - "Icom IC-7760 (Hamlib 3092)"
        - "Icom IC-7850 / IC-7851 (Hamlib 3075)"
        - "Icom IC-9100 (Hamlib 3068)"
        - "Icom IC-9700 (Hamlib 3081)"
        - "Icom IC-R8600 (Hamlib 3079)"
        - "Yaesu FT-710 (Hamlib 1049)"
        - "Yaesu FT-991 / FT-991A (Hamlib 1035)"
        - "Yaesu FTDX10 (Hamlib 1042)"
        - "Yaesu FTDX101D (Hamlib 1040)"
        - "Yaesu FTDX101MP (Hamlib 1044)"
        - "Yaesu FTX-1 (Hamlib 1051)"
        - "Kenwood TS-590S (Hamlib 2031)"
        - "Kenwood TS-590SG (Hamlib 2037)"
        - "Kenwood TS-890S (Hamlib 2041)"
        - "Kenwood TS-990S (Hamlib 2039)"
        - "Elecraft K3 (Hamlib 2029)"
        - "Elecraft K3S (Hamlib 2043)"
        - "Elecraft K4 (Hamlib 2047)"
        - "Xiegu X6100 (Hamlib 3087)"
        - "Xiegu X6200 (Hamlib 3091)"
        - "QRP Labs QMX (Hamlib 2057)"
        - "Otro transceptor (indicarlo en la descripción)"
        - "Sin relación con un transceptor"
    validations:
      required: false
