<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 820" width="640" height="820" role="img" aria-labelledby="b-titre b-desc" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <title id="b-titre">Los bloques de una estación openRemoteTRX</title>
  <desc id="b-desc">De arriba abajo: el usuario (navegador o aplicación Android) llega por la red local o la VPN a la pasarela del PC de la estación; la pasarela controla el transceptor mediante rigctld (Hamlib) e intercambia el audio con su tarjeta de sonido; el supervisor lo vigila todo, solo puede cortar la transmisión (T 0) y envía las alertas ntfy; openRemoteTRX Console y los paneles leen el estado; station.toml contiene la configuración; el transceptor se conecta por un cable USB.</desc>
  <defs>
    <marker id="b-fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7a8f"/></marker>
    <marker id="b-flr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8402f"/></marker>
  </defs>
  <rect width="640" height="820" rx="14" fill="#ffffff"/>

  <text x="20" y="32" fill="#2c5d8f" font-size="14" font-weight="700" letter-spacing=".6">LADO DEL USUARIO</text>
  <rect x="20" y="44" width="285" height="88" rx="10" fill="#fff" stroke="#2f74c0" stroke-width="2"/>
  <text x="162" y="78" fill="#1d2733" font-size="18" font-weight="700" text-anchor="middle">Navegador</text>
  <text x="162" y="104" fill="#55657a" font-size="14" text-anchor="middle">PC, tableta, teléfono</text>
  <rect x="335" y="44" width="285" height="88" rx="10" fill="#fff" stroke="#2f74c0" stroke-width="2"/>
  <text x="477" y="78" fill="#1d2733" font-size="18" font-weight="700" text-anchor="middle">Aplicación Android</text>
  <text x="477" y="104" fill="#55657a" font-size="14" text-anchor="middle">+ Android Auto en el coche</text>

  <line x1="162" y1="134" x2="162" y2="166" stroke="#6b7a8f" stroke-width="2" marker-start="url(#b-fl)" marker-end="url(#b-fl)"/>
  <line x1="477" y1="134" x2="477" y2="166" stroke="#6b7a8f" stroke-width="2" marker-start="url(#b-fl)" marker-end="url(#b-fl)"/>
  <rect x="95" y="168" width="450" height="58" rx="29" fill="#f7f8fa" stroke="#8795a8" stroke-width="2"/>
  <text x="320" y="193" fill="#1d2733" font-size="16" font-weight="700" text-anchor="middle">Red local o VPN (esquema anterior)</text>
  <text x="320" y="213" fill="#55657a" font-size="13" text-anchor="middle">HTTPS puerto 8443 (órdenes) + WebRTC (audio)</text>
  <line x1="162" y1="228" x2="162" y2="306" stroke="#6b7a8f" stroke-width="2" marker-start="url(#b-fl)" marker-end="url(#b-fl)"/>
  <line x1="477" y1="228" x2="477" y2="306" stroke="#6b7a8f" stroke-width="2" marker-start="url(#b-fl)" marker-end="url(#b-fl)"/>

  <!-- Cadre du PC de la station : fond ambre -->
  <rect x="20" y="246" width="600" height="420" rx="14" fill="#fff1d6" stroke="#d99a2b" stroke-width="2.5"/>
  <text x="36" y="272" fill="#8a5a0a" font-size="14" font-weight="700" letter-spacing=".6">PC DE LA ESTACIÓN</text>
  <text x="36" y="292" fill="#8a5a0a" font-size="13">Debian, Raspberry Pi o Windows</text>

  <rect x="40" y="308" width="560" height="92" rx="10" fill="#fff" stroke="#2f74c0" stroke-width="2.5"/>
  <text x="320" y="338" fill="#1d2733" font-size="18" font-weight="700" text-anchor="middle">Pasarela · trx-gateway</text>
  <text x="320" y="362" fill="#55657a" font-size="14" text-anchor="middle">sirve la página, comprueba las cuentas, lleva el audio, decide</text>
  <text x="320" y="382" fill="#55657a" font-size="14" text-anchor="middle">la transmisión: PTT alterno, TOT, bandas, vuelta a recepción</text>

  <line x1="160" y1="402" x2="160" y2="444" stroke="#6b7a8f" stroke-width="2" marker-end="url(#b-fl)"/>
  <text x="170" y="428" fill="#55657a" font-size="13">órdenes</text>
  <rect x="40" y="446" width="250" height="84" rx="10" fill="#fff" stroke="#2f74c0" stroke-width="2"/>
  <text x="165" y="476" fill="#1d2733" font-size="17" font-weight="700" text-anchor="middle">rigctld (Hamlib)</text>
  <text x="165" y="498" fill="#55657a" font-size="13" text-anchor="middle">habla con el transceptor; solo</text>
  <text x="165" y="516" fill="#55657a" font-size="13" text-anchor="middle">escucha en esta máquina</text>

  <rect x="350" y="446" width="250" height="84" rx="10" fill="#fff" stroke="#c8402f" stroke-width="2"/>
  <text x="475" y="476" fill="#1d2733" font-size="17" font-weight="700" text-anchor="middle">Supervisor</text>
  <text x="475" y="498" fill="#55657a" font-size="13" text-anchor="middle">lo vigila todo, solo puede</text>
  <text x="475" y="516" fill="#55657a" font-size="13" text-anchor="middle">CORTAR la transmisión</text>
  <line x1="520" y1="444" x2="520" y2="404" stroke="#c8402f" stroke-width="2" marker-end="url(#b-flr)"/>
  <text x="510" y="428" fill="#c8402f" font-size="13" text-anchor="end">vigila, reinicia</text>
  <line x1="348" y1="500" x2="294" y2="500" stroke="#c8402f" stroke-width="2" marker-end="url(#b-flr)"/>
  <text x="321" y="490" fill="#c8402f" font-size="12" font-weight="700" text-anchor="middle">T 0</text>

  <rect x="40" y="556" width="250" height="90" rx="10" fill="#fff" stroke="#2e8b57" stroke-width="2"/>
  <text x="165" y="592" fill="#1d2733" font-size="17" font-weight="700" text-anchor="middle">station.toml</text>
  <text x="165" y="616" fill="#55657a" font-size="13" text-anchor="middle">la configuración</text>
  <rect x="350" y="556" width="250" height="90" rx="10" fill="#fff" stroke="#2e8b57" stroke-width="2"/>
  <text x="475" y="584" fill="#1d2733" font-size="17" font-weight="700" text-anchor="middle">Herramientas</text>
  <text x="475" y="606" fill="#55657a" font-size="13" text-anchor="middle">openRemoteTRX Console, paneles:</text>
  <text x="475" y="624" fill="#55657a" font-size="13" text-anchor="middle">leen el estado;</text>
  <text x="475" y="642" fill="#55657a" font-size="13" text-anchor="middle">única acción: STOP TX</text>

  <line x1="60" y1="532" x2="60" y2="700" stroke="#1d2733" stroke-width="2" marker-end="url(#b-fl)"/>
  <text x="22" y="684" fill="#1d2733" font-size="13" font-weight="600">CAT</text>
  <line x1="320" y1="402" x2="320" y2="700" stroke="#1d2733" stroke-width="2" marker-start="url(#b-fl)" marker-end="url(#b-fl)"/>
  <text x="327" y="686" fill="#1d2733" font-size="13" font-weight="600">audio</text>

  <rect x="20" y="702" width="380" height="100" rx="12" fill="#fff" stroke="#1d2733" stroke-width="2.5"/>
  <text x="210" y="738" fill="#1d2733" font-size="18" font-weight="700" text-anchor="middle">Transceptor (TRX)</text>
  <text x="210" y="762" fill="#55657a" font-size="14" text-anchor="middle">un solo cable USB en la mayoría de equipos:</text>
  <text x="210" y="782" fill="#55657a" font-size="14" text-anchor="middle">control (CAT) + tarjeta de sonido del equipo</text>
  <path d="M602,488 H628 V690 H520 V700" fill="none" stroke="#c8402f" stroke-width="2" marker-end="url(#b-flr)"/>
  <rect x="420" y="702" width="200" height="100" rx="12" fill="#fff" stroke="#c8402f" stroke-width="2"/>
  <text x="520" y="738" fill="#1d2733" font-size="17" font-weight="700" text-anchor="middle">Alertas ntfy</text>
  <text x="520" y="762" fill="#55657a" font-size="13" text-anchor="middle">en tu teléfono: corte,</text>
  <text x="520" y="782" fill="#55657a" font-size="13" text-anchor="middle">avería, bloqueo de seguridad</text>
</svg>
