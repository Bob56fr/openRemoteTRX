[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trx-station"
version = "0.227.0"
description = "Passerelle de pilotage à distance d'un TRX radioamateur (côté Raspberry Pi)"
requires-python = ">=3.11"
# Cœur en stdlib ; les modules de l'audio, du web et de l'interface sont dans les extras ci-dessous.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3.5", "cryptography>=41", "segno>=1.5", "pyyaml>=6"]   # cryptography : signature des paquets (build_debian_zip.py) ; pyyaml : catalogue d'erreurs (trxstation/errors/)
monitor = ["textual>=0.50"]
audio = ["aiortc>=1.9", "aiohttp>=3.9", "sounddevice>=0.4", "pyserial>=3.5", "numpy>=1.24"]   # pyserial : spectre HF par le second port du poste ; numpy : SELCALL
tls = ["cryptography>=41"]
# Indicateur près de l'horloge (Windows seulement, trxstation/tray/) : installé par windows/installer.ps1.
tray = ["pystray>=0.19; sys_platform == 'win32'", "pillow>=10; sys_platform == 'win32'"]
# Station complète (installation Debian) : tout ce qu'il faut pour la passerelle, la page web et TRX Console.
# pywinpty : terminal intégré de la console web sous Windows (même écran que sous Debian, décision du 2026-11-17).
station = ["aiortc>=1.9", "aiohttp>=3.9", "sounddevice>=0.4", "textual>=0.50", "cryptography>=41", "pyserial>=3.5", "segno>=1.5", "numpy>=1.24", "pywinpty>=2.0; sys_platform == 'win32'"]

[project.scripts]
trx-setup = "trxstation.setup_wizard:main"
trx-supervisor = "trxstation.supervisor.main:main"
trx-rigctld = "trxstation.run_rigctld:main"
trx-monitor = "trxstation.monitor.main:main"
trx-gateway = "trxstation.gateway.main:main"
trx-hwtest = "trxstation.devtools.hwtest:main"
trx-console = "trxstation.console:main"
trx-qualif = "trxstation.qualif.main:main"
trx-journal-android = "trxstation.devtools.androidlog:main"
trx-netreport = "trxstation.netprobe.netreport:main"
trx-sdr = "trxstation.sdr.devices:main"

[tool.setuptools.package-data]
"trxstation.gateway.api" = ["static/*"]
"trxstation.modules" = ["builtin/*/manifest.toml"]
"trxstation" = ["console_help.json"]
"trxstation.console_web" = ["static/*", "static/vendor/*"]   # console web (étape 229) : page, xterm.js livré avec la station   # aide de la touche « h » de TRX Console (scripts/build_console_doc.py)
"trxstation.i18n" = ["*.json"]   # catalogues de langue de TRX Console (fr, en, de, es)
"trxstation.errors" = ["*.yaml", "*.json"]   # catalogue d'erreurs et registre des préfixes (cahier du monitoring, § 7) ; catalog.json : scripts/build_errors.py
"trxstation.qualif.page" = ["*.json", "static/*"]   # page de la valise de qualification (étape 280)

[tool.setuptools.packages.find]
include = ["trxstation*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
