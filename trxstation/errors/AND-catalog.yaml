# Catalogue d'erreurs de l'application Android (préfixe AND, registre modules.yaml).
# Même structure que catalog.yaml (cahier du monitoring inter-stations, docs/cdc-monitoring.md § 7) ;
# codes AND-NNNN STABLES. Relevés aujourd'hui par trx-journal-android dans les journaux des bêta-testeurs.
# Plages conseillées : 0xxx démarrage et configuration, 1xxx traitement, 2xxx interface avec la station, 9xxx divers.

AND-1001:
  gravite: erreur
  titre: 'Application Android : plantage'
  message: '{type} de l''application : {exception}.'
  causes:
  - Exception non rattrapée dans l'application (Kotlin)
  - 'Plantage natif (WebRTC, audio) : signal du code natif'
  preconisation: Envoyer le rapport HTML (sans données personnelles) avec la version de l'application.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - plantage
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/AND-1001/
  depuis_version: 0.126.0
  en:
    titre: 'Android app: crash'
    message: 'App {type}: {exception}.'
    causes:
    - Uncaught exception in the app (Kotlin)
    - 'Native crash (WebRTC, audio): signal from native code'
    preconisation: Send the HTML report (no personal data) with the app version.
  de:
    titre: 'Android-App: Absturz'
    message: '{type} der App: {exception}.'
    causes:
    - Nicht abgefangene Ausnahme in der App (Kotlin)
    - 'Nativer Absturz (WebRTC, Audio): Signal des nativen Codes'
    preconisation: Senden Sie den HTML-Bericht (ohne persönliche Daten) mit der Version der App.
  es:
    titre: 'Aplicación Android: fallo'
    message: '{type} de la aplicación: {exception}.'
    causes:
    - Excepción no capturada en la aplicación (Kotlin)
    - 'Fallo nativo (WebRTC, audio): señal del código nativo'
    preconisation: Envía el informe HTML (sin datos personales) con la versión de la aplicación.

AND-1002:
  gravite: erreur
  titre: Application Android bloquée (ANR)
  message: 'Application bloquée (ANR) : {detail}.'
  causes:
  - Fil principal de l'application bloqué (réseau, audio, disque)
  preconisation: Envoyer le rapport HTML avec ce qui était fait au moment du blocage.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - blocage
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/AND-1002/
  depuis_version: 0.126.0
  en:
    titre: Android app not responding (ANR)
    message: 'App not responding (ANR): {detail}.'
    causes:
    - App main thread blocked (network, audio, disk)
    preconisation: Send the HTML report with what was being done when it froze.
  de:
    titre: Android-App blockiert (ANR)
    message: 'App blockiert (ANR): {detail}.'
    causes:
    - Hauptthread der App blockiert (Netzwerk, Audio, Datenträger)
    preconisation: Senden Sie den HTML-Bericht mit dem, was zum Zeitpunkt der Blockade gemacht wurde.
  es:
    titre: Aplicación Android bloqueada (ANR)
    message: 'Aplicación bloqueada (ANR): {detail}.'
    causes:
    - Hilo principal de la aplicación bloqueado (red, audio, disco)
    preconisation: Envía el informe HTML con lo que se estaba haciendo en el momento del bloqueo.

AND-1003:
  gravite: avertissement
  titre: 'Application Android : installation en échec'
  message: 'Installation (Play Store) : {detail}.'
  causes:
  - Version debug installée qui bloque celle du Store (autre signature)
  - Fichier APK abîmé
  - Erreur du Play Store (DF-…)
  preconisation: Désinstaller l'ancienne version (debug) puis réinstaller depuis le Store.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - installation
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/AND-1003/
  depuis_version: 0.126.0
  en:
    titre: 'Android app: install failed'
    message: 'Install (Play Store): {detail}.'
    causes:
    - Debug build installed, blocking the Store build (different signature)
    - Damaged APK
    - Play Store error (DF-…)
    preconisation: Uninstall the old (debug) version then reinstall from the Store.
  de:
    titre: 'Android-App: Installation gescheitert'
    message: 'Installation (Play Store): {detail}.'
    causes:
    - Installierte Debug-Version blockiert die Version aus dem Store (andere Signatur)
    - APK-Datei beschädigt
    - Fehler des Play Store (DF-…)
    preconisation: Deinstallieren Sie die alte (Debug-)Version und installieren Sie dann neu aus dem Store.
  es:
    titre: 'Aplicación Android: instalación fallida'
    message: 'Instalación (Play Store): {detail}.'
    causes:
    - Versión debug instalada que bloquea la de la Store (otra firma)
    - Archivo APK dañado
    - Error de Play Store (DF-…)
    preconisation: Desinstala la versión anterior (debug) y vuelve a instalar desde la Store.

AND-1004:
  gravite: avertissement
  titre: Application Android arrêtée par Android
  message: 'Application arrêtée par Android : {detail}.'
  causes:
  - Manque de mémoire du téléphone (lowmemorykiller)
  - Économiseur de batterie qui tue le service
  preconisation: Exclure l'application de l'optimisation de batterie ; fermer les applications gourmandes.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - arret
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/AND-1004/
  depuis_version: 0.126.0
  en:
    titre: Android app killed by Android
    message: 'App stopped by Android: {detail}.'
    causes:
    - Phone low on memory (lowmemorykiller)
    - Battery saver killing the service
    preconisation: Exclude the app from battery optimisation; close heavy apps.
  de:
    titre: Android-App von Android beendet
    message: 'App von Android beendet: {detail}.'
    causes:
    - Zu wenig Speicher im Telefon (lowmemorykiller)
    - Energiesparfunktion beendet den Dienst
    preconisation: Nehmen Sie die App von der Akku-Optimierung aus; schließen Sie ressourcenhungrige Apps.
  es:
    titre: Aplicación Android detenida por Android
    message: 'Aplicación detenida por Android: {detail}.'
    causes:
    - Falta de memoria del teléfono (lowmemorykiller)
    - Ahorro de batería que mata el servicio
    preconisation: Excluye la aplicación de la optimización de batería; cierra las aplicaciones que consumen mucho.

AND-1005:
  gravite: info
  titre: Erreurs écrites par l'application Android
  message: 'Erreurs écrites par l''application : {tag} : {message} ({nombre} fois).'
  causes:
  - Erreurs journalisées par l'application ou par WebRTC dans son processus
  preconisation: Lire les plus fréquentes dans le rapport HTML ; à joindre à un rapport de problème.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - erreur
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/AND-1005/
  depuis_version: 0.126.0
  en:
    titre: Errors logged by the Android app
    message: 'Errors logged by the app: {tag}: {message} ({nombre} times).'
    causes:
    - Errors logged by the app or by WebRTC in its process
    preconisation: Read the most frequent ones in the HTML report; attach them to a problem report.
  de:
    titre: Von der Android-App geschriebene Fehler
    message: 'Von der App geschriebene Fehler: {tag}: {message} ({nombre}-mal).'
    causes:
    - Von der App oder von WebRTC in ihrem Prozess protokollierte Fehler
    preconisation: Lesen Sie die häufigsten im HTML-Bericht; einem Problembericht beilegen.
  es:
    titre: Errores escritos por la aplicación Android
    message: 'Errores escritos por la aplicación: {tag}: {message} ({nombre} veces).'
    causes:
    - Errores registrados por la aplicación o por WebRTC en su proceso
    preconisation: Lee los más frecuentes en el informe HTML; adjúntalos a un informe de problema.

