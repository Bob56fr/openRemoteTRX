# Catalogue d'erreurs d'openRemoteTRX : référence unique (cahier du monitoring inter-stations, § 7).
# Codes ORT-NNNN STABLES : jamais réutilisés ni renumérotés ; une erreur abandonnée passe en `deprecated: true`
# (avec `remplace_par`).
# Gravité : info | avertissement | erreur | critique. Textes en français, bloc `en` obligatoire.
# `action_auto` décrit ce que la station FAIT aujourd'hui ; `codes_machine` = codes déjà émis par le code
# (refus renvoyés aux clients, raisons de coupure, types d'alerte). `prevu: true` = pas encore produit par le code.
# Cahier : docs/cdc-monitoring.md § 7. Origines dans le code et cas à trancher : docs/errors/inventaire.md. Validé par tests/test_error_catalog.py.
# Après toute modification : python scripts/build_errors.py (codes.py et catalog.json).


# ====================================================================================================
# 1000–1999 : Système
# ====================================================================================================

ORT-1001:
  gravite: avertissement
  titre: Disque presque plein
  message: 'Disque presque plein : {disques} (seuil {seuil} %).'
  causes:
  - Journaux ou enregistrements accumulés
  - Anciennes versions installées
  - Sonde réseau (state_dir/netprobe) non purgée
  preconisation: Purger journaux et enregistrements, retirer les anciennes versions, vérifier la rétention.
  action_auto: aucune
  ntfy_defaut: true
  priorite_ntfy: 3
  codes_machine:
  - disk_high
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-1001/
  depuis_version: 0.123.0
  en:
    titre: Disk almost full
    message: 'Disk almost full: {disques} (threshold {seuil} %).'
    causes:
    - Accumulated logs or recordings
    - Old installed versions
    - Network probe data (state_dir/netprobe) not purged
    preconisation: Purge logs and recordings, remove old versions, check retention.

ORT-1002:
  gravite: avertissement
  titre: Mémoire de la station presque pleine
  message: Mémoire utilisée à {pct} % (seuil {seuil} %) depuis plus d'une minute.
  causes:
  - Trop de visiteurs ou de modules
  - Fuite de mémoire d'un processus
  - Machine trop petite (Pi 3)
  preconisation: Réduire les visiteurs et modules, redémarrer la station si la mémoire ne redescend pas, signaler
    le problème.
  action_auto: aucune
  ntfy_defaut: true
  priorite_ntfy: 3
  codes_machine:
  - memory_high
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-1002/
  depuis_version: 0.123.0
  en:
    titre: Station memory almost full
    message: Memory used at {pct} % (threshold {seuil} %) for more than a minute.
    causes:
    - Too many listeners or modules
    - Memory leak in a process
    - Machine too small (Pi 3)
    preconisation: Reduce listeners and modules, restart the station if memory does not drop, report the problem.

ORT-1003:
  gravite: avertissement
  titre: Raspberry Pi ralenti
  message: 'Raspberry Pi ralenti en ce moment : {etat} (alimentation ? refroidissement ?).'
  causes:
  - Sous-tension (alimentation trop faible, câble USB-C trop fin)
  - Limite de température atteinte
  - Fréquence bridée
  preconisation: Utiliser l'alimentation officielle du Pi et un refroidissement suffisant.
  action_auto: aucune
  ntfy_defaut: true
  priorite_ntfy: 3
  codes_machine:
  - pi_throttled
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-1003/
  depuis_version: 0.123.0
  en:
    titre: Raspberry Pi throttled
    message: 'Raspberry Pi throttled right now: {etat} (power supply? cooling?).'
    causes:
    - Under-voltage (weak power supply, thin USB-C cable)
    - Temperature limit reached
    - Frequency capped
    preconisation: Use the official Pi power supply and adequate cooling.

ORT-1004:
  gravite: avertissement
  titre: Identifiant de station indisponible
  message: 'Identifiant de station indisponible : {detail}.'
  causes:
  - Dossier d'état non inscriptible
  - Disque plein
  preconisation: Vérifier les droits et l'espace du dossier d'état ; les rapports de problème partent sans identifiant.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-1004/
  depuis_version: 0.123.0
  en:
    titre: Station identifier unavailable
    message: 'Station identifier unavailable: {detail}.'
    causes:
    - State folder not writable
    - Disk full
    preconisation: Check permissions and space in the state folder; problem reports are sent without an identifier.

ORT-1005:
  gravite: erreur
  titre: Fichier d'état de la passerelle non écrit
  message: 'Écriture de l''état impossible depuis {n} essais : {detail} (le superviseur jugera la passerelle muette).'
  causes:
  - Disque plein
  - Droits sur le dossier d'état
  - Fichier tenu ouvert (Windows)
  preconisation: Libérer de l'espace disque et vérifier les droits du dossier d'état.
  action_auto: nouvel_essai
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-1005/
  depuis_version: 0.123.0
  en:
    titre: Gateway status file not written
    message: 'Status write failing for {n} attempts: {detail} (the supervisor will consider the gateway silent).'
    causes:
    - Disk full
    - Permissions on the state folder
    - File held open (Windows)
    preconisation: Free disk space and check the state folder permissions.

ORT-1006:
  gravite: avertissement
  titre: Machine de la station chargée
  message: 'Machine de la station {niveau} : {mesure} à {valeur}.'
  causes:
  - Processeur > 75 % (rouge 90 %)
  - Mémoire > 80 % (rouge 90 %)
  - Disque > 85 % (rouge 95 %)
  - Température > 75 °C (rouge 85 °C)
  - Raspberry Pi ralenti (alimentation)
  preconisation: Voir la synthèse du matériel (bargraph de l'onglet Station ou Réglages) et réduire la charge.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - warn
  - bad
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-1006/
  depuis_version: 0.123.0
  en:
    titre: Station machine under load
    message: 'Station machine {niveau}: {mesure} at {valeur}.'
    causes:
    - CPU > 75 % (red 90 %)
    - Memory > 80 % (red 90 %)
    - Disk > 85 % (red 95 %)
    - Temperature > 75 °C (red 85 °C)
    - Raspberry Pi throttled (power supply)
    preconisation: See the hardware summary (bar graph on the Station tab or in Settings) and reduce the load.

ORT-1007:
  gravite: avertissement
  titre: État de la mesure de TOS non enregistré ou illisible
  message: 'Mesure de TOS : état {cas} ({detail}).'
  causes:
  - Disque plein ou droits sur le dossier d'état
  - Fichier swr.json abîmé
  preconisation: Vérifier l'espace et les droits du dossier d'état ; les choix reviennent aux valeurs par défaut.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-1007/
  depuis_version: 0.123.0
  en:
    titre: SWR sweep state not saved or unreadable
    message: 'SWR sweep: state {cas} ({detail}).'
    causes:
    - Disk full or permissions on the state folder
    - Damaged swr.json file
    preconisation: Check space and permissions of the state folder; choices fall back to defaults.

ORT-1008:
  gravite: erreur
  titre: Réglage non enregistré sur la station
  message: '{fonction} : enregistrement impossible ({erreur}) : réglage {effet}.'
  causes:
  - Disque plein
  - Dossier d'état ([supervisor] state_dir) non accessible en écriture par le compte de la station
  - Fichier verrouillé par un autre programme (Windows, antivirus)
  preconisation: 'Libérer de la place, vérifier les droits du dossier d''état (installation Debian : compte trx)
    puis refaire le réglage.'
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - storage_error
  - layout_storage_error
  - beeps_storage_error
  - breizh_storage_error
  - voice_profiles_storage_error
  - report_storage_error
  - freedv_storage_error
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-1008/
  depuis_version: 0.123.0
  en:
    titre: Setting not saved on the station
    message: '{fonction}: cannot save ({erreur}): setting {effet}.'
    causes:
    - Disk full
    - State folder ([supervisor] state_dir) not writable by the station account
    - File locked by another program (Windows, antivirus)
    preconisation: 'Free some space, check the state folder permissions (Debian install: trx account) and redo the
      setting.'

ORT-1009:
  gravite: avertissement
  titre: Journal de la station non écrit
  message: 'Journal {journal} non écrit ({erreur}) : la station continue sans lui.'
  causes:
  - Disque plein
  - Dossier d'état non accessible en écriture
  - Fichier verrouillé (Windows)
  preconisation: Libérer de la place sur le disque et vérifier les droits du dossier d'état.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-1009/
  depuis_version: 0.123.0
  en:
    titre: Station log not written
    message: 'Log {journal} not written ({erreur}): the station carries on without it.'
    causes:
    - Disk full
    - State folder not writable
    - File locked (Windows)
    preconisation: Free disk space and check the state folder permissions.

ORT-1010:
  gravite: avertissement
  titre: Température du processeur élevée
  message: Processeur de la station à {temp_c} °C (seuil {seuil_c} °C).
  causes:
  - Ventilation insuffisante ou boîtier fermé
  - Charge élevée (visiteurs, spectre, modules, FreeDV)
  - Pâte thermique ou ventilateur défaillant
  preconisation: Vérifier la ventilation et la charge des modules.
  action_auto: aucune
  ntfy_defaut: true
  priorite_ntfy: 3
  codes_machine:
  - cpu_hot
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-1010/
  depuis_version: 0.123.0
  en:
    titre: CPU temperature high
    message: Station CPU at {temp_c} °C (threshold {seuil_c} °C).
    causes:
    - Poor ventilation or closed case
    - High load (listeners, spectrum, modules, FreeDV)
    - Failing thermal paste or fan
    preconisation: Check ventilation and module load.

ORT-1011:
  gravite: erreur
  titre: Système d'exploitation non pris en charge
  message: '{systeme} : {exigence}.'
  causes:
  - Distribution autre que Debian / Raspberry Pi OS
  - Debian trop ancien (avant 12)
  - Windows 32 bits ou antérieur à Windows 10
  preconisation: Installer Debian 12 ou 13 (ou Raspberry Pi OS récent), ou Windows 10/11 64 bits.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-1011/
  depuis_version: 0.123.0
  en:
    titre: Operating system not supported
    message: '{systeme}: {exigence}.'
    causes:
    - Distribution other than Debian / Raspberry Pi OS
    - Debian too old (before 12)
    - 32-bit Windows or older than Windows 10
    preconisation: Install Debian 12 or 13 (or a recent Raspberry Pi OS), or 64-bit Windows 10/11.

ORT-1012:
  gravite: erreur
  titre: Espace disque insuffisant
  message: 'Espace disque : {libre} libres ({minimum} nécessaires).'
  causes:
  - Disque plein (journaux, téléchargements, anciennes versions)
  - Carte SD trop petite (Raspberry Pi)
  preconisation: Libérer de la place (corbeille, Téléchargements, journaux), puis recommencer.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-1012/
  depuis_version: 0.123.0
  en:
    titre: Not enough disk space
    message: 'Disk space: {libre} free ({minimum} required).'
    causes:
    - Disk full (logs, downloads, old versions)
    - SD card too small (Raspberry Pi)
    preconisation: Free some space (trash, Downloads, logs), then try again.

ORT-1013:
  gravite: info
  titre: Température du processeur illisible
  message: 'Température du processeur illisible sur ce PC (machine virtuelle ?) : affichée « inconnue ».'
  causes:
  - Machine virtuelle
  - Pilote coretemp / k10temp absent
  preconisation: Aucune action nécessaire ; la supervision de la température est alors inopérante.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-1013/
  depuis_version: 0.123.0
  en:
    titre: CPU temperature unreadable
    message: 'CPU temperature unreadable on this PC (virtual machine?): shown as "unknown".'
    causes:
    - Virtual machine
    - coretemp / k10temp driver missing
    preconisation: No action needed; temperature supervision is then inoperative.

ORT-1014:
  gravite: avertissement
  titre: Matériel en dessous du minimum conseillé
  message: '{materiel} : {detail}.'
  causes:
  - Raspberry Pi antérieur au Pi 4
  - Moins de 2 Go de mémoire
  - Architecture sans modules précompilés (installation très longue)
  preconisation: Utiliser au moins un Raspberry Pi 4 (2 Go) ou un PC ; mesurer la charge avec devtools/station_load.py.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-1014/
  depuis_version: 0.123.0
  en:
    titre: Hardware below the recommended minimum
    message: '{materiel}: {detail}.'
    causes:
    - Raspberry Pi older than Pi 4
    - Less than 2 GB of memory
    - Architecture without prebuilt modules (very long installation)
    preconisation: Use at least a Raspberry Pi 4 (2 GB) or a PC; measure the load with devtools/station_load.py.

ORT-1015:
  gravite: avertissement
  titre: Alimentation du Raspberry Pi trop faible
  message: 'Alimentation trop faible détectée (get_throttled = {valeur}) : bloc officiel 5,1 V 3 A conseillé.'
  causes:
  - Bloc d'alimentation insuffisant
  - Câble USB-C trop fin ou trop long
  - Périphériques USB gourmands
  preconisation: Utiliser le bloc officiel 5,1 V 3 A et un câble court ; alimenter à part les périphériques gourmands.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-1015/
  depuis_version: 0.123.0
  en:
    titre: Raspberry Pi power supply too weak
    message: 'Under-voltage detected (get_throttled = {valeur}): official 5.1 V 3 A supply recommended.'
    causes:
    - Insufficient power supply
    - USB-C cable too thin or too long
    - Power-hungry USB devices
    preconisation: Use the official 5.1 V 3 A supply and a short cable; power hungry devices separately.

ORT-1016:
  gravite: erreur
  titre: 'Erreur inattendue dans un écouteur de la passerelle'
  message: 'Erreur inattendue dans un écouteur ({partie}) : {erreur} ; la passerelle continue.'
  causes:
  - 'Défaut du programme (cas non prévu)'
  preconisation: 'Signaler le problème avec le rapport de dépannage (menu 2.3 de TRX Console).'
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-1016/
  depuis_version: 0.136.0
  en:
    titre: 'Unexpected error in a gateway listener'
    message: 'Unexpected error in a listener ({partie}): {erreur}; the gateway carries on.'
    causes:
    - 'Program defect (unforeseen case)'
    preconisation: 'Report the problem with the troubleshooting report (TRX Console menu 2.3).'

ORT-1017:
  gravite: avertissement
  titre: 'Écriture du fichier d''état refusée'
  message: 'Écriture du fichier d''état refusée ({detail}) : nouvel essai ; ORT-1005 suit si cela dure.'
  causes:
  - 'Fichier tenu ouvert un instant par un autre programme (antivirus, indexation, trx-monitor)'
  - 'Disque plein ou droits du dossier d''état'
  preconisation: 'Rien à faire si c''est passager ; sinon voir ORT-1005.'
  action_auto: nouvel_essai
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-1017/
  depuis_version: 0.136.0
  en:
    titre: 'Status file write refused'
    message: 'Status file write refused ({detail}): retrying; ORT-1005 follows if it lasts.'
    causes:
    - 'File held open for a moment by another program (antivirus, indexing, trx-monitor)'
    - 'Disk full or state folder permissions'
    preconisation: 'Nothing to do if transient; otherwise see ORT-1005.'

ORT-1020:
  gravite: erreur
  titre: Horloge de la station refusée par le relais
  message: 'Présence de groupe : le relais refuse l''heure de la station (horloge décalée).'
  causes:
  - Horloge de la station fausse (NTP absent ou bloqué)
  preconisation: Activer la synchronisation de l'heure (NTP) sur la station.
  action_auto: nouvel_essai
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - clock
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-1020/
  depuis_version: 0.123.0
  en:
    titre: Station clock refused by the relay
    message: 'Group presence: the relay refuses the station time (clock offset).'
    causes:
    - Station clock wrong (NTP missing or blocked)
    preconisation: Enable time synchronisation (NTP) on the station.

ORT-1501:
  gravite: avertissement
  titre: Recherche de mise à jour impossible
  message: 'Recherche de mise à jour impossible : {detail}.'
  causes:
  - Pas d'accès Internet ou GitHub injoignable
  - Limite de requêtes de GitHub atteinte
  - Réponse de GitHub inattendue ou trop grande
  - Adresse non https://
  preconisation: Vérifier la connexion Internet ; nouvel essai automatique dans 24 h (ou menu 10, « Chercher maintenant
    »).
  action_auto: nouvel_essai
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-1501/
  depuis_version: 0.123.0
  en:
    titre: Update check failed
    message: 'Update check failed: {detail}.'
    causes:
    - No Internet access or GitHub unreachable
    - GitHub rate limit reached
    - Unexpected or oversized GitHub answer
    - Non-https address
    preconisation: Check the Internet connection; automatic retry in 24 h (or menu 10, "Check now").

ORT-1502:
  gravite: avertissement
  titre: Dernière recherche de mise à jour trop ancienne
  message: Dernière recherche de mise à jour il y a {jours} jours.
  causes:
  - Minuterie trx-update-check arrêtée
  - État de mise à jour impossible à écrire
  preconisation: systemctl status trx-update-check.timer ; vérifier les droits du dossier d'état.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-1502/
  depuis_version: 0.123.0
  en:
    titre: Last update check too old
    message: Last update check {jours} days ago.
    causes:
    - trx-update-check timer stopped
    - Update state cannot be written
    preconisation: systemctl status trx-update-check.timer; check the state folder permissions.

ORT-1503:
  gravite: info
  titre: Nouvelle version disponible
  message: 'Nouvelle version disponible : {version} (installée : {installee}).'
  causes:
  - Une version plus récente a été publiée
  preconisation: 'TRX Console, menu 10 : lire les changements puis installer.'
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-1503/
  depuis_version: 0.123.0
  en:
    titre: New version available
    message: 'New version available: {version} (installed: {installee}).'
    causes:
    - A newer version has been published
    preconisation: 'TRX Console, menu 10: read the changes then install.'

ORT-1504:
  gravite: avertissement
  titre: Aucune clé de signature connue
  message: 'Aucune clé publique de confiance : mise à jour automatique impossible.'
  causes:
  - Version installée à partir des sources (sans clé publique)
  preconisation: Installer une version publiée (sudo bash install.sh depuis un paquet signé).
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-1504/
  depuis_version: 0.123.0
  en:
    titre: No known signing key
    message: 'No trusted public key: automatic update impossible.'
    causes:
    - Version installed from sources (no public key)
    preconisation: Install a published version (sudo bash install.sh from a signed package).

ORT-1505:
  gravite: erreur
  titre: 'Mise à jour refusée : émission en cours ou état inconnu'
  message: 'Mise à jour refusée : {raison}. Rien n''a été installé.'
  causes:
  - Émission en cours (passerelle ou micro du poste)
  - 'Passerelle muette : état d''émission inconnu'
  - 'rigctld ne répond pas : poste non relisible'
  - État du PTT illisible
  preconisation: Couper l'émission, ou arrêter la station (menu « Arrêter »), puis recommencer. Dans le doute, la
    station refuse.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - EXIT_TX
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-1505/
  depuis_version: 0.123.0
  en:
    titre: 'Update refused: transmitting or unknown state'
    message: 'Update refused: {raison}. Nothing was installed.'
    causes:
    - Transmission in progress (gateway or radio mic)
    - 'Gateway silent: transmit state unknown'
    - 'rigctld not answering: radio cannot be read'
    - PTT state unreadable
    preconisation: Stop transmitting, or stop the station ("Stop" menu), then try again. When in doubt, the station
      refuses.

ORT-1506:
  gravite: critique
  titre: Signature du paquet refusée
  message: 'SIGNATURE REFUSÉE : {detail}. Rien n''a été installé.'
  causes:
  - Paquet modifié ou incomplet
  - Paquet signé par une clé inconnue
  - Fichier .sig abîmé, d'un autre paquet ou d'une autre version
  - Clé publique illisible
  preconisation: Ne pas installer ce paquet ; le retélécharger depuis la page officielle des versions. Jamais de
    repli « sans signature ».
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - EXIT_REFUSED
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-1506/
  depuis_version: 0.123.0
  en:
    titre: Package signature refused
    message: 'SIGNATURE REFUSED: {detail}. Nothing was installed.'
    causes:
    - Package modified or incomplete
    - Package signed by an unknown key
    - Damaged .sig file, or one for another package or version
    - Unreadable public key
    preconisation: Do not install this package; download it again from the official releases page. Never fall back
      to "unsigned".

ORT-1507:
  gravite: critique
  titre: Contenu du paquet refusé
  message: 'Paquet refusé : {detail}. Rien n''a été installé.'
  causes:
  - Chemin dangereux, lien ou fichier spécial dans le zip
  - Paquet chiffré, vide, démesuré ou trop gros une fois décompressé
  - Fichier en double, paquet incomplet
  - Version du paquet différente de celle annoncée
  preconisation: Ne pas installer ce paquet ; utiliser un paquet officiel (trx-remote-debian-X.Y.Z.zip et son .sig).
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - EXIT_REFUSED
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-1507/
  depuis_version: 0.123.0
  en:
    titre: Package content refused
    message: 'Package refused: {detail}. Nothing was installed.'
    causes:
    - Dangerous path, link or special file in the zip
    - Encrypted, empty, oversized package, or too large once unpacked
    - Duplicate file, incomplete package
    - Package version differs from the announced one
    preconisation: Do not install this package; use an official package (trx-remote-debian-X.Y.Z.zip and its .sig).

ORT-1508:
  gravite: erreur
  titre: Téléchargement de la mise à jour impossible
  message: 'Mise à jour refusée : {detail}. Rien n''a été installé.'
  causes:
  - Coupure Internet pendant le téléchargement
  - Taille reçue différente de celle annoncée
  - Version retirée ou remplacée sur GitHub entre-temps
  preconisation: Recommencer plus tard depuis le menu 10.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - EXIT_REFUSED
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-1508/
  depuis_version: 0.123.0
  en:
    titre: Update download failed
    message: 'Update refused: {detail}. Nothing was installed.'
    causes:
    - Internet cut during the download
    - Received size differs from the announced one
    - Version withdrawn or replaced on GitHub meanwhile
    preconisation: Try again later from menu 10.

ORT-1509:
  gravite: avertissement
  titre: Paquet déposé refusé ou à confirmer
  message: 'Paquet {fichier} : {detail}.'
  causes:
  - Nom de fichier différent de trx-remote-debian-X.Y.Z.zip
  - Paquet introuvable, lien ou démesuré
  - Paquet NON signé (pas de .sig) refusé sans accord explicite
  - Paquet plus ancien que la version installée
  - Aucun paquet trouvé sur le Bureau, dans Téléchargements ou le dossier personnel
  preconisation: Copier le zip officiel ET son .sig sur le Bureau ; un paquet non signé ne s'installe qu'en tapant
    OUI, s'il vient d'une source sûre. Pour revenir en arrière, le menu 11 suffit.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - EXIT_REFUSED
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-1509/
  depuis_version: 0.123.0
  en:
    titre: Dropped package refused or to be confirmed
    message: 'Package {fichier}: {detail}.'
    causes:
    - File name differs from trx-remote-debian-X.Y.Z.zip
    - Package not found, a link, or oversized
    - UNSIGNED package (no .sig) refused without explicit consent
    - Package older than the installed version
    - No package found on the Desktop, in Downloads or the home folder
    preconisation: Copy the official zip AND its .sig to the Desktop; an unsigned package installs only after typing
      OUI, if it comes from a safe source. To roll back, menu 11 is enough.

ORT-1510:
  gravite: erreur
  titre: Installation de la nouvelle version échouée
  message: 'L''installation a échoué (code {code}) : la version {version_active} reste active. Détails : {journal}.'
  causes:
  - Échec du script d'installation (modules Python, Internet, disque)
  - Arrêt de la station impossible
  - Retour à la version précédente échoué ou aucune version précédente
  preconisation: Lire le compte-rendu d'installation, corriger la cause, puis recommencer ; la version active n'a
    pas changé.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - EXIT_FAILED
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-1510/
  depuis_version: 0.123.0
  en:
    titre: Installing the new version failed
    message: 'Installation failed (code {code}): version {version_active} stays active. Details: {journal}.'
    causes:
    - Install script failure (Python modules, Internet, disk)
    - Station could not be stopped
    - Rollback failed or no previous version
    preconisation: Read the installation log, fix the cause, then try again; the active version did not change.

ORT-1511:
  gravite: erreur
  titre: Clé de signature des versions inutilisable (développement)
  message: 'Clé de signature : {detail}.'
  causes:
  - Phrase de passe fausse ou fichier abîmé
  - Clé privée placée dans le dépôt
  - Clé déjà existante (jamais d'écrasement)
  - Ligne PUBLIC_KEYS introuvable
  preconisation: 'Réservé à l''équipe qui publie : vérifier la phrase de passe et l''emplacement de la clé (hors
    du dépôt).'
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-1511/
  depuis_version: 0.123.0
  en:
    titre: Release signing key unusable (development)
    message: 'Signing key: {detail}.'
    causes:
    - Wrong passphrase or damaged file
    - Private key placed inside the repository
    - Key already exists (never overwritten)
    - PUBLIC_KEYS line not found
    preconisation: 'Publishing team only: check the passphrase and the key location (outside the repository).'


# ====================================================================================================
# 2000–2999 : CAT, Hamlib, rigctld, port série
# ====================================================================================================

ORT-2001:
  gravite: critique
  titre: Port série du poste introuvable
  message: '{port} absent : poste éteint ou débranché.'
  causes:
  - Poste éteint
  - Câble USB débranché ou câble de charge seule
  - Pilote série (CP210x, FTDI) absent
  - Nom du port changé (préférer /dev/serial/by-id)
  preconisation: Allumer le poste, vérifier le câble USB et le pilote, puis relancer le diagnostic (menu 1).
  action_auto: aucune
  ntfy_defaut: true
  priorite_ntfy: 3
  codes_machine:
  - usb_missing
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2001/
  depuis_version: 0.123.0
  en:
    titre: Radio serial port not found
    message: '{port} missing: radio off or unplugged.'
    causes:
    - Radio switched off
    - USB cable unplugged, or charge-only cable
    - Serial driver (CP210x, FTDI) missing
    - Port name changed (prefer /dev/serial/by-id)
    preconisation: Switch the radio on, check the USB cable and driver, then rerun the diagnostic (menu 1).

ORT-2002:
  gravite: erreur
  titre: rigctld ne démarre pas
  message: 'rigctld n''a pas démarré en 5 s : modèle Hamlib {modele}, port {port} ou débit {debit} incorrects, ou
    poste éteint.'
  causes:
  - Numéro de modèle Hamlib faux
  - Port série faux ou pris par un autre logiciel
  - Débit différent du réglage CI-V / CAT RATE du poste
  - Poste éteint ou câble USB débranché
  preconisation: Vérifier le modèle, le port et le débit dans station.toml (ou relancer trx-setup), fermer tout
    autre logiciel de contrôle, allumer le poste.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2002/
  depuis_version: 0.123.0
  en:
    titre: rigctld does not start
    message: 'rigctld did not start within 5 s: Hamlib model {modele}, port {port} or baud rate {debit} wrong, or
      rig switched off.'
    causes:
    - Wrong Hamlib model number
    - Wrong serial port or port held by another program
    - Baud rate differs from the rig's CI-V / CAT RATE setting
    - Rig switched off or USB cable unplugged
    preconisation: Check model, port and baud rate in station.toml (or run trx-setup again), close any other control
      software, power the rig on.

ORT-2003:
  gravite: erreur
  titre: Hamlib introuvable (rigctld ou rigctl)
  message: '{outil} introuvable : Hamlib n''est pas installé ou [tools] hamlib_dir ne pointe pas vers lui.'
  causes:
  - Hamlib non installé
  - Hamlib installé dans un dossier inhabituel non renseigné dans [tools] hamlib_dir
  - PATH du compte de service sans le dossier de Hamlib
  preconisation: Installer Hamlib (paquet, compiler-hamlib.sh ou installateur Windows) ou renseigner [tools] hamlib_dir
    dans station.toml.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2003/
  depuis_version: 0.123.0
  en:
    titre: Hamlib not found (rigctld or rigctl)
    message: '{outil} not found: Hamlib is not installed or [tools] hamlib_dir does not point to it.'
    causes:
    - Hamlib not installed
    - Hamlib installed in an unusual folder not set in [tools] hamlib_dir
    - Service account PATH lacks the Hamlib folder
    preconisation: Install Hamlib (package, compiler-hamlib.sh or Windows installer) or set [tools] hamlib_dir in
      station.toml.

ORT-2004:
  gravite: info
  titre: rigctld non lancé (outil en --no-spawn)
  message: 'rigctld ne répond pas sur {hote}:{port} : lance-le (trx-rigctld) ou retire --no-spawn.'
  causes:
  - Option --no-spawn alors que rigctld n'est pas lancé
  - Station arrêtée
  preconisation: Lancer rigctld (trx-rigctld ou la station), ou relancer l'outil sans --no-spawn.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2004/
  depuis_version: 0.123.0
  en:
    titre: rigctld not running (tool in --no-spawn)
    message: 'rigctld is not answering on {hote}:{port}: start it (trx-rigctld) or drop --no-spawn.'
    causes:
    - --no-spawn given while rigctld is not running
    - Station stopped
    preconisation: Start rigctld (trx-rigctld or the station), or run the tool again without --no-spawn.

ORT-2005:
  gravite: erreur
  titre: rigctld injoignable
  message: 'Connexion à rigctld impossible ({detail}) : la station ne voit plus le poste.'
  causes:
  - Service rigctld arrêté ou en cours de redémarrage
  - rigctld planté après une perte du port série
  - Port [network] rigctld_port différent de celui de rigctld
  preconisation: La passerelle réessaie seule (0,5 s à 5 s). Si cela dure, le superviseur relance rigctld ; sinon
    vérifier le service rigctld et ses journaux.
  action_auto: nouvel_essai
  ntfy_defaut: true
  priorite_ntfy: 3
  codes_machine:
  - rigctld_down
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2005/
  depuis_version: 0.123.0
  en:
    titre: rigctld unreachable
    message: 'Cannot connect to rigctld ({detail}): the station no longer sees the rig.'
    causes:
    - rigctld service stopped or restarting
    - rigctld crashed after the serial port was lost
    - '[network] rigctld_port differs from rigctld''s port'
    preconisation: The gateway retries on its own (0.5 s to 5 s). If it persists the supervisor restarts rigctld;
      otherwise check the rigctld service and its logs.

ORT-2006:
  gravite: avertissement
  titre: Connexion fermée par rigctld
  message: 'rigctld a refermé la connexion pendant la commande {commande} : nouvel essai.'
  causes:
  - rigctld 5.0 referme parfois une connexion (ConnectionResetError) sans panne réelle
  - rigctld redémarré par le superviseur ou à la main
  - rigctld planté
  preconisation: Rien à faire si c'est rare. Si cela se répète, vérifier la version de Hamlib et les journaux de
    rigctld.
  action_auto: nouvel_essai
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2006/
  depuis_version: 0.123.0
  en:
    titre: Connection closed by rigctld
    message: 'rigctld closed the connection during {commande}: retrying.'
    causes:
    - rigctld 5.0 sometimes drops a connection (ConnectionResetError) without a real fault
    - rigctld restarted by the supervisor or by hand
    - rigctld crashed
    preconisation: Nothing to do if rare. If it keeps happening, check the Hamlib version and the rigctld logs.

ORT-2007:
  gravite: erreur
  titre: Réponse de rigctld désynchronisée
  message: 'Réponse de rigctld illisible ({detail}) : flux désynchronisé, connexion refermée.'
  causes:
  - Version de Hamlib au format de réponse inattendu
  - Deux programmes parlent au même rigctld en même temps
  - Réponse trop longue (plus de 64 lignes)
  preconisation: Vérifier la version de Hamlib ; ne laisser qu'un seul logiciel parler à rigctld en 127.0.0.1:4532
    ; signaler le cas avec la trace de trx-qualif.
  action_auto: nouvel_essai
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2007/
  depuis_version: 0.123.0
  en:
    titre: rigctld response out of sync
    message: 'Unreadable rigctld response ({detail}): stream out of sync, connection closed.'
    causes:
    - Hamlib version with an unexpected response format
    - Two programs talking to the same rigctld at once
    - Response too long (more than 64 lines)
    preconisation: Check the Hamlib version; let only one program talk to rigctld on 127.0.0.1:4532; report it with
      the trx-qualif trace.

ORT-2008:
  gravite: avertissement
  titre: Réponse du poste illisible
  message: 'Réponse inattendue à {commande} : {reponse}. Valeur ignorée (inconnue).'
  causes:
  - Format de réponse différent selon la version de Hamlib
  - Poste ou backend Hamlib qui renvoie une valeur hors format
  preconisation: Noter la version de Hamlib et le modèle, lancer trx-qualif pour relever la trace et la signaler.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2008/
  depuis_version: 0.123.0
  en:
    titre: Unreadable rig response
    message: 'Unexpected response to {commande}: {reponse}. Value ignored (unknown).'
    causes:
    - Response format differs between Hamlib versions
    - Rig or Hamlib backend returning an off-format value
    preconisation: Note the Hamlib version and rig model, run trx-qualif to capture the trace and report it.

ORT-2009:
  gravite: info
  titre: Lecture facultative abandonnée pour ce poste
  message: Lecture de {nom} ({type}) abandonnée pour ce poste ({raison}).
  causes:
  - Le poste ou son backend Hamlib ne gère pas cette lecture (RPRT -4, -11…)
  - Réponse illisible à cette lecture
  - 5 échecs de suite
  preconisation: 'Rien à faire : la fonction n''est plus affichée. Si le poste la possède, vérifier la version de
    Hamlib.'
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2009/
  depuis_version: 0.123.0
  en:
    titre: Optional reading dropped for this rig
    message: Reading of {nom} ({type}) dropped for this rig ({raison}).
    causes:
    - The rig or its Hamlib backend does not support this reading (RPRT -4, -11…)
    - Unreadable response to this reading
    - 5 failures in a row
    preconisation: 'Nothing to do: the function is no longer shown. If the rig has it, check the Hamlib version.'

ORT-2010:
  gravite: erreur
  titre: Le poste ne répond pas (rigctld répond)
  message: 'rigctld répond mais pas le poste ({detail}) : fréquence et mode inconnus.'
  causes:
  - Poste éteint
  - Câble CAT débranché ou port série changé
  - Débit ou adresse CI-V modifiés sur le poste
  - Mauvais numéro de modèle Hamlib
  preconisation: Vérifier que le poste est allumé, le câble USB, le débit et l'adresse CI-V ; relancer trx-setup
    si le modèle ou le port ont changé.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2010/
  depuis_version: 0.123.0
  en:
    titre: Rig not answering (rigctld is)
    message: 'rigctld answers but the rig does not ({detail}): frequency and mode unknown.'
    causes:
    - Rig switched off
    - CAT cable unplugged or serial port changed
    - Baud rate or CI-V address changed on the rig
    - Wrong Hamlib model number
    preconisation: Check the rig is on, the USB cable, baud rate and CI-V address; run trx-setup again if model
      or port changed.

ORT-2011:
  gravite: avertissement
  titre: Commande refusée par le poste (RPRT)
  message: 'rigctld a refusé « {commande} » : RPRT {code} ({signification}).'
  causes:
  - Fonction ou valeur que le poste n'accepte pas dans son état actuel (mode, bande)
  - Backend Hamlib incomplet pour ce poste
  - Poste occupé ou en émission
  preconisation: Réessayer dans un autre mode ou une autre bande ; si le refus persiste, lancer trx-qualif pour
    vérifier ce que Hamlib sait faire avec ce poste.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - rig_error
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2011/
  depuis_version: 0.123.0
  en:
    titre: Command rejected by the rig (RPRT)
    message: 'rigctld rejected "{commande}": RPRT {code} ({signification}).'
    causes:
    - Function or value the rig does not accept in its current state (mode, band)
    - Incomplete Hamlib backend for this rig
    - Rig busy or transmitting
    preconisation: Try another mode or band; if it keeps failing, run trx-qualif to check what Hamlib can do with
      this rig.

ORT-2012:
  gravite: info
  titre: Mode ou fonction non géré par ce poste
  message: '{nom} n''est pas géré par ce poste (d''après Hamlib) : commande refusée.'
  causes:
  - Mode ou fonction absent du descripteur de capacités du poste (dump_caps)
  - Client plus récent que la station ou que Hamlib
  preconisation: Choisir un mode ou une fonction proposés par la page ou l'application ; mettre Hamlib à jour si
    le poste les possède.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - invalid
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2012/
  depuis_version: 0.123.0
  en:
    titre: Mode or function not supported by this rig
    message: '{nom} is not supported by this rig (according to Hamlib): command refused.'
    causes:
    - Mode or function missing from the rig capability descriptor (dump_caps)
    - Client newer than the station or Hamlib
    preconisation: Pick a mode or function offered by the page or app; update Hamlib if the rig does have it.

ORT-2013:
  gravite: info
  titre: Valeur hors de la plage du poste
  message: '{nom} : {valeur} hors de la plage du poste ({min} à {max}).'
  causes:
  - Réglage au-delà de la plage déclarée par le poste (« Set level », Max RIT/XIT)
  - RIT limité à ±500 Hz par décision de l'utilisateur
  - Largeur de filtre au-delà de 20 kHz
  preconisation: Choisir une valeur dans la plage affichée.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - invalid
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2013/
  depuis_version: 0.123.0
  en:
    titre: Value outside the rig's range
    message: '{nom}: {valeur} outside the rig''s range ({min} to {max}).'
    causes:
    - Setting beyond the range declared by the rig ("Set level", Max RIT/XIT)
    - RIT limited to ±500 Hz by user decision
    - Filter width beyond 20 kHz
    preconisation: Pick a value within the displayed range.

ORT-2014:
  gravite: avertissement
  titre: Capacités du poste indisponibles (dump_caps)
  message: 'Capacités du poste indisponibles ({detail}) : la station utilise un jeu minimal (USB, LSB, FM, AM).'
  causes:
  - '`rigctl -u` introuvable, en échec ou trop lent (15 s)'
  - Numéro de modèle inconnu de cette version de Hamlib
  preconisation: Vérifier l'installation de Hamlib et le numéro de modèle (rigctl -l) ; relancer la station ensuite.
  action_auto: repli_jeu_minimal
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2014/
  depuis_version: 0.123.0
  en:
    titre: Rig capabilities unavailable (dump_caps)
    message: 'Rig capabilities unavailable ({detail}): the station uses a minimal set (USB, LSB, FM, AM).'
    causes:
    - '`rigctl -u` missing, failing or too slow (15 s)'
    - Model number unknown to this Hamlib version
    preconisation: Check the Hamlib install and the model number (rigctl -l); restart the station afterwards.

ORT-2015:
  gravite: avertissement
  titre: Poste éteint ou débranché
  message: 'Poste éteint ou débranché ({port} absent) : la station attend son retour, sans relancer.'
  causes:
  - Poste éteint
  - Câble USB débranché
  - Numéro de port changé (Windows) ou nom by-id changé
  preconisation: Allumer le poste ou rebrancher le câble ; si le port a changé, relancer trx-setup.
  action_auto: aucune
  ntfy_defaut: true
  priorite_ntfy: 3
  codes_machine:
  - rig_absent
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2015/
  depuis_version: 0.123.0
  en:
    titre: Rig off or unplugged
    message: 'Rig off or unplugged ({port} missing): the station waits for it, without restarting anything.'
    causes:
    - Rig switched off
    - USB cable unplugged
    - Port number changed (Windows) or by-id name changed
    preconisation: Power the rig on or plug the cable back; if the port changed, run trx-setup again.

ORT-2016:
  gravite: avertissement
  titre: Port du poste du profil absent
  message: 'Attention : le port du poste {port} est absent pour l''instant (poste éteint ou pas encore branché ?).'
  causes:
  - Poste éteint ou débranché
  - Profil d'un autre poste ou d'un autre PC
  preconisation: Brancher et allumer le poste avant de démarrer la station.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2016/
  depuis_version: 0.123.0
  en:
    titre: Profile radio port missing
    message: 'Warning: radio port {port} is missing for now (radio off or not plugged in yet?).'
    causes:
    - Radio off or unplugged
    - Profile from another radio or PC
    preconisation: Plug in and switch on the radio before starting the station.

ORT-2017:
  gravite: erreur
  titre: Le poste répond mal au test de liaison
  message: 'Commande « {commande} » en erreur (RPRT {code}) : vérifie modèle, port et débit.'
  causes:
  - Débit série différent de celui du menu du poste (CI-V, CAT)
  - Modèle Hamlib voisin mais pas le bon
  - Poste éteint, câble défectueux
  preconisation: Régler le même débit dans l'assistant et dans le menu du poste, vérifier le modèle, puis relancer
    le test.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2017/
  depuis_version: 0.123.0
  en:
    titre: Radio answers badly to the link test
    message: 'Command "{commande}" failed (RPRT {code}): check model, port and speed.'
    causes:
    - Serial speed different from the radio menu (CI-V, CAT)
    - Close but wrong Hamlib model
    - Radio off, faulty cable
    preconisation: Set the same speed in the wizard and in the radio menu, check the model, then rerun the test.

ORT-2018:
  gravite: erreur
  titre: Modèle du poste inconnu de ce Hamlib
  message: Modèle {modele} inconnu de ce Hamlib.
  causes:
  - Poste plus récent que la version de Hamlib installée
  - Numéro de modèle faux dans station.toml
  preconisation: Choisir un modèle proche dans l'assistant, ou installer un Hamlib plus récent (compiler-hamlib.sh).
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2018/
  depuis_version: 0.123.0
  en:
    titre: Radio model unknown to this Hamlib
    message: Model {modele} unknown to this Hamlib.
    causes:
    - Radio newer than the installed Hamlib
    - Wrong model number in station.toml
    preconisation: Pick a close model in the wizard, or install a newer Hamlib (compiler-hamlib.sh).

ORT-2019:
  gravite: avertissement
  titre: Service système qui perturbe le port série
  message: '{service} : {detail}.'
  causes:
  - ModemManager qui « teste » le port du poste
  - brltty qui s'approprie certains adaptateurs USB série (CP210x, CH340)
  preconisation: Relancer l'installation (elle fait ignorer les ports série à ModemManager) et répondre non à la
    question sur l'afficheur braille.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2019/
  depuis_version: 0.123.0
  en:
    titre: System service disturbing the serial port
    message: '{service}: {detail}.'
    causes:
    - ModemManager probing the radio port
    - brltty grabbing some USB serial adapters (CP210x, CH340)
    preconisation: Rerun the installation (it makes ModemManager ignore serial ports) and answer no to the braille
      display question.

ORT-2020:
  gravite: avertissement
  titre: Tension d'alimentation du poste basse
  message: 'Alimentation du poste : {tension} V (moins de 12 V).'
  causes:
  - Alimentation 13,8 V défaillante ou mal réglée
  - Chute de tension dans les câbles en émission
  - Batterie déchargée
  preconisation: Vérifier l'alimentation et la section des câbles ; une tension basse dégrade l'émission.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2020/
  depuis_version: 0.123.0
  en:
    titre: Low radio supply voltage
    message: 'Radio supply: {tension} V (below 12 V).'
    causes:
    - Faulty or misadjusted 13.8 V supply
    - Voltage drop in the cables while transmitting
    - Discharged battery
    preconisation: Check the power supply and cable gauge; low voltage degrades the transmitted signal.

ORT-2021:
  gravite: erreur
  titre: Compilation de Hamlib impossible
  message: 'Compilation de Hamlib {version} : {detail}.'
  causes:
  - Téléchargement impossible (Internet)
  - 'Empreinte SHA-256 incorrecte : archive refusée'
  - configure, make ou make install en échec
  - rigctld compilé qui ne répond pas comme prévu
  preconisation: Vérifier Internet et l'espace disque ; une empreinte incorrecte est un signal de sécurité (archive
    refusée, rien n'est installé). Lire les 30 dernières lignes affichées.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2021/
  depuis_version: 0.123.0
  en:
    titre: Hamlib build failed
    message: 'Hamlib {version} build: {detail}.'
    causes:
    - Download impossible (Internet)
    - 'Wrong SHA-256 hash: archive refused'
    - configure, make or make install failed
    - Built rigctld not answering as expected
    preconisation: Check Internet and free disk space; a wrong hash is a security signal (archive refused, nothing
      installed). Read the last 30 lines shown.

ORT-2022:
  gravite: avertissement
  titre: Un autre rigctld passe avant celui compilé
  message: Le PATH trouve d'abord {chemin}.
  causes:
  - Hamlib de Debian encore installé et placé avant /usr/local/bin dans le PATH
  preconisation: Vérifier `command -v rigctld` ; retirer libhamlib-utils ou corriger le PATH.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2022/
  depuis_version: 0.123.0
  en:
    titre: Another rigctld comes first
    message: PATH finds {chemin} first.
    causes:
    - Debian Hamlib still installed and before /usr/local/bin in PATH
    preconisation: Check `command -v rigctld`; remove libhamlib-utils or fix PATH.

ORT-2023:
  gravite: avertissement
  titre: 'Cache de rigctld non réglable'
  message: 'Cache de rigctld : {detail} ; la relecture du PTT est peut-être périmée.'
  causes:
  - 'rigctld trop ancien (commande « \set_cache » absente)'
  - 'rigctld lancé hors de la station avec d''autres options'
  preconisation: 'Lancer rigctld par la station (option -C cache_timeout=0) ou mettre Hamlib à jour.'
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2023/
  depuis_version: 0.136.0
  en:
    titre: 'rigctld cache cannot be set'
    message: 'rigctld cache: {detail}; the PTT read-back may be stale.'
    causes:
    - 'rigctld too old (no « \set_cache » command)'
    - 'rigctld started outside the station with other options'
    preconisation: 'Let the station start rigctld (option -C cache_timeout=0) or update Hamlib.'

ORT-2024:
  gravite: erreur
  titre: 'Cache de rigctld actif : émission refusée'
  message: 'Cache de rigctld toujours actif ({ms} ms) : la relecture du PTT n''est pas fiable, émission refusée.'
  causes:
  - 'rigctld lancé hors de la station sans « -C cache_timeout=0 »'
  - 'Hamlib qui ignore le réglage du cache'
  preconisation: 'Relancer la station pour qu''elle lance rigctld elle-même, ou ajouter « -C cache_timeout=0 » à rigctld.'
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2024/
  depuis_version: 0.136.0
  en:
    titre: 'rigctld cache active: transmit refused'
    message: 'rigctld cache still active ({ms} ms): the PTT read-back is unreliable, transmit refused.'
    causes:
    - 'rigctld started outside the station without « -C cache_timeout=0 »'
    - 'Hamlib ignoring the cache setting'
    preconisation: 'Restart the station so it starts rigctld itself, or add « -C cache_timeout=0 » to rigctld.'

ORT-2104:
  gravite: erreur
  titre: Délai de réponse CAT dépassé
  message: 'rigctld n''a pas répondu à {commande} en {delai_s} s : connexion refermée, nouvel essai.'
  causes:
  - Câble USB défectueux ou mal branché
  - Débit série différent de celui réglé dans le poste
  - Port pris par un autre logiciel
  - Poste occupé (menu, accord) ou bus CI-V saturé
  preconisation: Vérifier le câble USB et la vitesse CI-V / CAT RATE du poste, fermer tout autre logiciel de contrôle,
    puis lancer trx-hwtest --reception-seule.
  action_auto: nouvel_essai
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2104/
  depuis_version: 0.123.0
  en:
    titre: CAT response timeout
    message: 'rigctld did not answer {commande} within {delai_s} s: connection closed, retrying.'
    causes:
    - Faulty or loose USB cable
    - Serial baud rate differs from the rig setting
    - Port held by another program
    - Rig busy (menu, tuning) or CI-V bus overloaded
    preconisation: Check the USB cable and the rig's CI-V / CAT RATE speed, close any other control software, then
      run trx-hwtest --reception-seule.

ORT-2200:
  gravite: avertissement
  titre: Version de Hamlib plus ancienne que la version qualifiée
  message: Hamlib {version} plus ancien que la version minimale qualifiée ({version_min}).
  causes:
  - 'Paquet Hamlib de la distribution trop ancien (Debian trixie : 4.6.2, sans IC-7300MK2)'
  preconisation: Mettre Hamlib à jour (trixie-backports, compiler-hamlib.sh ou installateur Windows récent).
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2200/
  depuis_version: 0.123.0
  en:
    titre: Hamlib older than the qualified version
    message: Hamlib {version} is older than the minimum qualified version ({version_min}).
    causes:
    - 'Distribution Hamlib package too old (Debian trixie: 4.6.2, no IC-7300MK2)'
    preconisation: Update Hamlib (trixie-backports, compiler-hamlib.sh or a recent Windows installer).

ORT-2301:
  gravite: avertissement
  titre: Second port du poste impossible à ouvrir (spectre HF)
  message: 'Port {port} impossible à ouvrir ({detail}) : poste éteint, câble débranché, numéro de port changé, ou
    port tenu par un autre programme. Mode normal : un seul port, sans waterfall HF.'
  causes:
  - Poste éteint ou câble débranché
  - Numéro du port B changé
  - Port tenu par un autre programme
  preconisation: 'Vérifier le câble et [spectrum] port dans station.toml (Linux : …-if02 pour un IC-7300MK2) ; fermer
    l''autre programme. Nouvel essai toutes les 60 s.'
  action_auto: repli_mode_normal
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - open_failed
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2301/
  depuis_version: 0.123.0
  en:
    titre: Rig second port cannot be opened (HF spectrum)
    message: 'Port {port} cannot be opened ({detail}): rig off, cable unplugged, port number changed, or port held
      by another program. Normal mode: one port, no HF waterfall.'
    causes:
    - Rig off or cable unplugged
    - Port B number changed
    - Port held by another program
    preconisation: 'Check the cable and [spectrum] port in station.toml (Linux: …-if02 for an IC-7300MK2); close
      the other program. Retried every 60 s.'

ORT-2302:
  gravite: avertissement
  titre: Aucune réponse CI-V sur le second port
  message: 'Aucune réponse CI-V sur {port} : le second port n''est pas (ou plus) réglé en CI-V dans le menu du poste,
    ou son débit a changé. Mode normal : sans waterfall HF.'
  causes:
  - Fonction du second port du poste autre que CI-V
  - Débit du port B changé
  - Poste qui ne répond plus à son adresse pendant la lecture
  preconisation: Régler le second port en CI-V (MENU > SET > Connecteurs), vérifier le débit, ou relancer trx-setup
    --spectre.
  action_auto: repli_mode_normal
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - no_answer
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2302/
  depuis_version: 0.123.0
  en:
    titre: No CI-V answer on the second port
    message: 'No CI-V answer on {port}: the second port is not (or no longer) set to CI-V in the rig menu, or its
      baud rate changed. Normal mode: no HF waterfall.'
    causes:
    - Rig second port function other than CI-V
    - Port B baud rate changed
    - Rig stops answering at its address while streaming
    preconisation: Set the second port to CI-V (MENU > SET > Connectors), check the baud rate, or run trx-setup
      --spectre again.

ORT-2303:
  gravite: avertissement
  titre: Adresse CI-V du poste changée (second port)
  message: 'Le poste répond sur {port} à l''adresse {detail} au lieu de {attendue} : adresse CI-V changée dans le
    menu du poste.'
  causes:
  - Adresse CI-V modifiée sur le poste
  - '[spectrum] civ_address faux dans station.toml'
  preconisation: Remettre l'adresse sur le poste, ou relancer trx-setup --spectre {port}.
  action_auto: repli_mode_normal
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - wrong_address
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2303/
  depuis_version: 0.123.0
  en:
    titre: Rig CI-V address changed (second port)
    message: 'The rig answers on {port} at address {detail} instead of {attendue}: CI-V address changed in the rig
      menu.'
    causes:
    - CI-V address changed on the rig
    - Wrong [spectrum] civ_address in station.toml
    preconisation: Set the address back on the rig, or run trx-setup --spectre {port} again.

ORT-2304:
  gravite: avertissement
  titre: Le poste ne fournit pas le spectre par le CI-V
  message: 'Le poste refuse les réglages du spectre sur {port} : ce poste ne fournit pas le spectre par le CI-V.'
  causes:
  - Poste sans sortie du spectre par CI-V
  - Microprogramme trop ancien
  preconisation: Désactiver [spectrum] dans station.toml (spectre audio seul) ou mettre à jour le microprogramme
    du poste.
  action_auto: repli_mode_normal
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - no_scope
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2304/
  depuis_version: 0.123.0
  en:
    titre: Rig does not provide the spectrum over CI-V
    message: 'The rig rejects the spectrum settings on {port}: this rig does not provide the spectrum over CI-V.'
    causes:
    - Rig without CI-V scope output
    - Firmware too old
    preconisation: Disable [spectrum] in station.toml (audio spectrum only) or update the rig firmware.

ORT-2305:
  gravite: erreur
  titre: Le second port n'est pas celui du même poste
  message: '{port} n''affiche pas la même fréquence que le port CAT ({detail}) : ce n''est pas le même poste.'
  causes:
  - Port B qui appartient à un autre appareil
  - Deux postes branchés et ports inversés
  preconisation: Vérifier [spectrum] port dans station.toml ou relancer trx-setup --spectre.
  action_auto: repli_mode_normal
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - other_rig
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2305/
  depuis_version: 0.123.0
  en:
    titre: Second port belongs to another rig
    message: '{port} does not show the same frequency as the CAT port ({detail}): it is not the same rig.'
    causes:
    - Port B belongs to another device
    - Two rigs connected and ports swapped
    preconisation: Check [spectrum] port in station.toml or run trx-setup --spectre again.

ORT-2306:
  gravite: avertissement
  titre: État d'émission illisible après l'ouverture du second port
  message: 'État d''émission illisible juste après l''ouverture de {port} : par prudence, port refermé.'
  causes:
  - Liaison CAT perdue au même moment
  - Poste qui ne dit pas son état PTT
  preconisation: Vérifier la liaison CAT ; nouvel essai automatique dans 60 s.
  action_auto: repli_mode_normal
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - ptt_unknown
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2306/
  depuis_version: 0.123.0
  en:
    titre: Transmit state unreadable after opening the second port
    message: 'Transmit state unreadable right after opening {port}: port closed as a precaution.'
    causes:
    - CAT link lost at the same moment
    - Rig that does not report its PTT state
    preconisation: Check the CAT link; automatic retry in 60 s.

ORT-2307:
  gravite: avertissement
  titre: Plus aucune donnée du spectre HF
  message: Plus aucune donnée du spectre sur {port} depuis {duree_s} s (écran du poste sur un menu ou un autre écran
    que le spectre, spectre éteint, réglage modifié ou câble).
  causes:
  - Écran du poste sur un menu
  - Spectre éteint sur le poste
  - Réglage du port B modifié
  - Câble
  preconisation: Remettre l'écran du poste sur le spectre ; nouvel essai automatique (60 s, plus tôt à l'ouverture
    de la vue HF).
  action_auto: repli_mode_normal
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - silent
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2307/
  depuis_version: 0.123.0
  en:
    titre: No more HF spectrum data
    message: No more spectrum data on {port} for {duree_s} s (rig screen on a menu or a screen other than the scope,
      scope off, setting changed or cable).
    causes:
    - Rig screen on a menu
    - Scope switched off on the rig
    - Port B setting changed
    - Cable
    preconisation: Put the rig screen back on the scope; automatic retry (60 s, sooner when the HF view opens).

ORT-2308:
  gravite: avertissement
  titre: Second port du poste perdu
  message: Port {port} perdu ({detail}).
  causes:
  - Câble débranché
  - Poste éteint
  - Pilote USB
  preconisation: Vérifier le câble et l'alimentation du poste ; nouvel essai automatique.
  action_auto: repli_mode_normal
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - port_lost
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2308/
  depuis_version: 0.123.0
  en:
    titre: Rig second port lost
    message: Port {port} lost ({detail}).
    causes:
    - Cable unplugged
    - Rig off
    - USB driver
    preconisation: Check the cable and rig power; automatic retry.

ORT-2309:
  gravite: erreur
  titre: Erreur interne du spectre HF
  message: 'Erreur interne du spectre ({detail}). Mode normal : sans waterfall HF.'
  causes:
  - Défaut du logiciel dans le fil du spectre
  preconisation: Envoyer un rapport de problème avec le journal de la passerelle.
  action_auto: repli_mode_normal
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - internal
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2309/
  depuis_version: 0.123.0
  en:
    titre: HF spectrum internal error
    message: 'HF spectrum internal error ({detail}). Normal mode: no HF waterfall.'
    causes:
    - Software fault in the spectrum thread
    preconisation: Send a problem report with the gateway log.

ORT-2310:
  gravite: info
  titre: Réglage du spectre ou du filtre FIL refusé
  message: 'Réglage du spectre {nom} = {valeur} refusé : {raison}.'
  causes:
  - Le poste refuse ce réglage (en mode fixe, la largeur ne se règle pas)
  - Le poste n'a pas confirmé à temps (3 s)
  - Réglage déjà en cours
  - Spectre HF indisponible pour le moment
  - Valeur hors de la liste permise
  preconisation: Réessayer ; vérifier le mode du spectre sur le poste (centré ou fixe).
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - spectrum_refused
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2310/
  depuis_version: 0.123.0
  en:
    titre: Spectrum or FIL filter setting refused
    message: 'Spectrum setting {nom} = {valeur} refused: {raison}.'
    causes:
    - The rig rejects this setting (in fixed mode the span cannot be set)
    - The rig did not confirm in time (3 s)
    - A setting is already in progress
    - HF spectrum unavailable for now
    - Value not in the allowed list
    preconisation: Try again; check the scope mode on the rig (centre or fixed).

ORT-2311:
  gravite: erreur
  titre: Réglage du spectre HF incompatible avec le poste
  message: '[spectrum] {probleme}.'
  causes:
  - Spectre par second port CI-V demandé pour un poste non Icom
  - Second port non renseigné
  - Débit CAT trop bas pour le spectre par rigctld (il retarderait les ordres du PTT)
  preconisation: 'Pour un Icom : renseigner le second port et l''adresse CI-V (trx-setup --spectre PORT) ; sinon
    [spectrum] enabled = false. Par rigctld : [rig] speed = {debit_min} et le même débit dans le menu du poste.'
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2311/
  depuis_version: 0.123.0
  en:
    titre: HF spectrum setting incompatible with the radio
    message: '[spectrum] {probleme}.'
    causes:
    - Spectrum by second CI-V port requested for a non-Icom radio
    - Second port not set
    - CAT speed too low for spectrum through rigctld (it would delay PTT commands)
    preconisation: 'On an Icom: set the second port and CI-V address (trx-setup --spectre PORT); otherwise [spectrum]
      enabled = false. Through rigctld: [rig] speed = {debit_min} and the same speed in the radio menu.'

ORT-2312:
  gravite: erreur
  titre: Vérification du second port CI-V impossible
  message: 'Spectre NON activé : {detail}.'
  causes:
  - Station en marche (rigctld tient le port CAT)
  - Poste pas en réception confirmée
  - Port impossible à ouvrir ou poste muet sur ce port
  - Module pyserial absent
  preconisation: 'Arrêter la station (TRX Console), vérifier le second port et son réglage CI-V (débit, adresse,
    CI-V USB Echo Back), puis : trx-setup --spectre PORT.'
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2312/
  depuis_version: 0.123.0
  en:
    titre: Second CI-V port check failed
    message: 'Spectrum NOT enabled: {detail}.'
    causes:
    - Station running (rigctld holds the CAT port)
    - Radio not confirmed in receive
    - Port cannot be opened or radio silent on it
    - pyserial module missing
    preconisation: 'Stop the station (TRX Console), check the second port and its CI-V setting (speed, address,
      echo), then: trx-setup --spectre PORT.'

ORT-2313:
  gravite: erreur
  titre: Spectre HF en panne (affichage)
  message: 'Spectre HF : PROBLÈME DE CONFIGURATION : {message}.'
  causes:
  - Second port mal réglé (débit, adresse CI-V)
  - Port pris par un autre logiciel
  - Module pyserial absent
  preconisation: 'Corriger le réglage du poste, puis, station arrêtée : trx-setup --spectre PORT ; ou trx-setup
    --spectre off.'
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2313/
  depuis_version: 0.123.0
  en:
    titre: HF spectrum failed (display)
    message: 'HF spectrum: CONFIGURATION PROBLEM: {message}.'
    causes:
    - Second port badly set (speed, CI-V address)
    - Port held by another program
    - pyserial module missing
    preconisation: 'Fix the radio setting, then with the station stopped: trx-setup --spectre PORT; or trx-setup
      --spectre off.'

ORT-2601:
  gravite: erreur
  titre: 'Essai : fréquence non suivie par le poste'
  message: 'Essai « {essai} » : la fréquence relue ne correspond pas à la commande ({detail}).'
  causes:
  - Fréquence hors de la couverture du poste
  - Résolution du poste supérieure à 10 Hz
  - Liaison CAT lente ou instable
  preconisation: Lire le détail de l'essai ; vérifier la couverture du poste et la liaison CAT, puis recommencer.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - freq_rw
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2601/
  depuis_version: 0.123.0
  en:
    titre: 'Test: rig does not follow frequency'
    message: 'Test "{essai}": the frequency read back does not match the command ({detail}).'
    causes:
    - Frequency outside the rig's coverage
    - Rig resolution coarser than 10 Hz
    - Slow or unstable CAT link
    preconisation: Read the test detail; check rig coverage and the CAT link, then try again.

ORT-2602:
  gravite: erreur
  titre: 'Essai : mode non suivi par le poste'
  message: 'Essai « {essai} » : mode {mode} refusé ou relu différemment ({detail}).'
  causes:
  - Mode inexistant sur ce poste malgré Hamlib
  - Nom de mode différent selon la version de Hamlib (FM-D / PKTFM)
  preconisation: Lire le détail ; vérifier la version de Hamlib et signaler l'écart.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - mode_rw
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2602/
  depuis_version: 0.123.0
  en:
    titre: 'Test: rig does not follow mode'
    message: 'Test "{essai}": mode {mode} refused or read back differently ({detail}).'
    causes:
    - Mode missing on this rig despite Hamlib
    - Mode name differs between Hamlib versions (FM-D / PKTFM)
    preconisation: Read the detail; check the Hamlib version and report the mismatch.

ORT-2603:
  gravite: avertissement
  titre: 'Essai : largeurs de filtre non suivies'
  message: 'Essai des filtres : {detail}.'
  causes:
  - Largeurs demandées qui ne sélectionnent pas des filtres distincts
  - Mode ou largeur illisible après la commande
  - Commande refusée par le poste
  preconisation: Lire le détail ; sur un Icom, les largeurs relues sont celles des réglages FIL1/2/3 du poste.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - filters
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2603/
  depuis_version: 0.123.0
  en:
    titre: 'Test: filter widths not followed'
    message: 'Filter test: {detail}.'
    causes:
    - Requested widths do not select distinct filters
    - Mode or width unreadable after the command
    - Command rejected by the rig
    preconisation: Read the detail; on an Icom the widths read back are the rig's FIL1/2/3 settings.

ORT-2604:
  gravite: avertissement
  titre: 'Essai : fonction ou niveau du poste en échec'
  message: 'Essai « {essai} » : {detail}.'
  causes:
  - Fonction ou niveau déclaré par Hamlib mais refusé par le poste
  - Valeur relue qui ne suit pas la commande
  - 'État initial illisible : écriture non tentée'
  preconisation: La fonction sera marquée indisponible dans la fiche ; signaler l'écart de Hamlib si le poste la
    possède.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2604/
  depuis_version: 0.123.0
  en:
    titre: 'Test: rig function or level failed'
    message: 'Test "{essai}": {detail}.'
    causes:
    - Function or level declared by Hamlib but rejected by the rig
    - Value read back does not follow the command
    - 'Initial state unreadable: write not attempted'
    preconisation: The function will be marked unavailable in the sheet; report the Hamlib mismatch if the rig has
      it.

ORT-2605:
  gravite: erreur
  titre: 'Essai : endurance de la liaison CAT en échec'
  message: 'Endurance de la liaison CAT : {reussies}/{total} lectures réussies, {erreurs} erreur(s) (1re : {premiere}).'
  causes:
  - Câble USB ou port série instable
  - Débit trop élevé pour le câble
  - Logiciel concurrent sur le port
  - Perturbations HF
  preconisation: Changer de câble ou de port USB, baisser le débit (poste et station.toml), fermer les autres logiciels,
    puis recommencer.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - cat_endurance
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2605/
  depuis_version: 0.123.0
  en:
    titre: 'Test: CAT link endurance failed'
    message: 'CAT link endurance: {reussies}/{total} reads succeeded, {erreurs} error(s) (first: {premiere}).'
    causes:
    - Unstable USB cable or serial port
    - Baud rate too high for the cable
    - Competing software on the port
    - RF interference
    preconisation: Change the cable or USB port, lower the baud rate (rig and station.toml), close other software,
      then try again.

ORT-2606:
  gravite: avertissement
  titre: 'Essai : pas de reprise après débranchement USB'
  message: 'Reprise après débranchement USB : {detail}.'
  causes:
  - rigctld ne rouvre pas le port après rebranchement
  - Port renuméroté au rebranchement (Windows)
  - Aucune perte détectée
  preconisation: En service normal le superviseur relance rigctld ; vérifier que le port garde le même nom (by-id
    sous Linux).
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - usb_replug
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2606/
  depuis_version: 0.123.0
  en:
    titre: 'Test: no recovery after USB unplug'
    message: 'Recovery after USB unplug: {detail}.'
    causes:
    - rigctld does not reopen the port after replugging
    - Port renumbered on replug (Windows)
    - No loss detected
    preconisation: In normal service the supervisor restarts rigctld; check the port keeps the same name (by-id
      on Linux).

ORT-2607:
  gravite: avertissement
  titre: 'Essai : état d''origine du poste non rétabli'
  message: 'État d''origine NON rétabli pour : {reglages} : vérifie le poste.'
  causes:
  - Commande de remise refusée par le poste
  - Liaison CAT perdue en fin d'essai
  - Poste resté en émission (remise refusée hors réception)
  preconisation: 'Remettre à la main sur le poste les réglages cités (RIT / ΔTX compris : sur l''IC-7300 ils partagent
    le même décalage).'
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2607/
  depuis_version: 0.123.0
  en:
    titre: 'Test: rig original state not restored'
    message: 'Original state NOT restored for: {reglages}: check the rig.'
    causes:
    - Restore command rejected by the rig
    - CAT link lost at the end of the test
    - Rig still transmitting (restore refused outside receive)
    preconisation: 'Set the listed settings back by hand on the rig (including RIT / XIT: on the IC-7300 they share
      one offset).'

ORT-2608:
  gravite: erreur
  titre: 'Essai : coupure faite sur le poste non vue par la station'
  message: 'PAS VUE : le TOT de l''essai a coupé. La relecture du PTT renvoie un état ancien : NE PAS activer le
    spectre.'
  causes:
  - rigctld relit le PTT dans son cache (async=1, Hamlib 4.7.2 sous Windows)
  - Fréquence ou mode touchés pendant l'essai
  preconisation: Laisser le spectre par le second port désactivé tant que l'essai n'est pas réussi ; mettre Hamlib
    à jour.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2608/
  depuis_version: 0.123.0
  en:
    titre: 'Test: unkey made on the rig not seen by the station'
    message: 'NOT SEEN: the test TOT cut the transmission. PTT readback returns a stale state: DO NOT enable the
      spectrum.'
    causes:
    - rigctld reads PTT back from its cache (async=1, Hamlib 4.7.2 on Windows)
    - Frequency or mode touched during the test
    preconisation: Keep the second-port spectrum disabled until the test passes; update Hamlib.

ORT-2701:
  gravite: avertissement
  titre: 'Qualification : socle en échec, poste refusé'
  message: 'Verdict proposé : refusé — socle en échec : {essais}.'
  causes:
  - Un des essais du socle (CAT, fréquence, mode, PTT, audio, perte de liaison CAT) a échoué
  preconisation: Corriger la cause de l'essai en échec (voir son entrée) puis relancer trx-qualif ; la fiche brouillon
    est marquée refusée.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2701/
  depuis_version: 0.123.0
  en:
    titre: 'Qualification: core failed, rig refused'
    message: 'Proposed verdict: refused — core failed: {essais}.'
    causes:
    - One of the core tests (CAT, frequency, mode, PTT, audio, CAT loss) failed
    preconisation: Fix the cause of the failed test (see its entry) then run trx-qualif again; the draft sheet is
      marked refused.

ORT-2702:
  gravite: info
  titre: Qualification incomplète
  message: 'Qualification incomplète : {raisons}.'
  causes:
  - Essai du socle non fait ou ignoré
  - Échec dû à l'installation (configuration, câble, carte son) et non au poste
  - 'Liaison CAT impossible : arrêt avant toute émission'
  preconisation: Corriger la configuration (« à corriger avant de conclure ») puis relancer trx-qualif.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2702/
  depuis_version: 0.123.0
  en:
    titre: Qualification incomplete
    message: 'Qualification incomplete: {raisons}.'
    causes:
    - Core test not run or skipped
    - Failure due to the installation (configuration, cable, sound card) not the rig
    - 'CAT link impossible: stopped before any transmission'
    preconisation: Fix the configuration ("to fix before concluding") then run trx-qualif again.

ORT-2703:
  gravite: info
  titre: 'Qualification : afficheur ou son non confirmés par l''opérateur'
  message: 'Vérification visuelle « {essai} » : réponse « non » ({detail}).'
  causes:
  - Afficheur du poste différent de la fréquence ou de la fonction commandée
  - Son non entendu dans le fichier enregistré
  preconisation: Vérifier le modèle Hamlib et la carte son ; ces réponses déclaratives figurent dans le rapport.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2703/
  depuis_version: 0.123.0
  en:
    titre: 'Qualification: display or audio not confirmed by the operator'
    message: 'Visual check "{essai}": answer "no" ({detail}).'
    causes:
    - Rig display differs from the commanded frequency or function
    - Audio not heard in the recorded file
    preconisation: Check the Hamlib model and sound card; these declared answers appear in the report.

ORT-2704:
  gravite: info
  titre: Poste ou firmware non qualifié
  message: '{detail} : poste non qualifié dans le catalogue.'
  causes:
  - Modèle absent du catalogue
  - Firmware différent de ceux qualifiés
  - Poste encore en validation
  preconisation: Le poste peut fonctionner ; lancer trx-qualif et envoyer le rapport pour l'ajouter au catalogue.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-2704/
  depuis_version: 0.123.0
  en:
    titre: Rig or firmware not qualified
    message: '{detail}: rig not qualified in the catalogue.'
    causes:
    - Model missing from the catalogue
    - Firmware differs from the qualified ones
    - Rig still in validation
    preconisation: The rig may work; run trx-qualif and send the report to add it to the catalogue.


# ====================================================================================================
# 3000–3999 : Audio
# ====================================================================================================

ORT-3001:
  gravite: critique
  titre: Périphérique audio du poste absent
  message: 'Aucun périphérique audio « {peripherique} » ({sens}) : la passerelle s''arrête.'
  causes:
  - Interface audio du poste (carte son USB du TRX, Digirig, SignaLink) débranchée ou poste éteint
  - Nom du périphérique changé (autre port USB, mise à jour du pilote) ou mal recopié dans station.toml
  - Pilote audio absent
  preconisation: Vérifier le câble USB et l'alimentation du poste, puis relancer trx-setup pour choisir le périphérique
    dans la liste ([audio] capture_device / playback_device).
  action_auto: arreter_passerelle
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-3001/
  depuis_version: 0.123.0
  en:
    titre: Rig audio device missing
    message: 'No audio device "{peripherique}" ({sens}): the gateway stops.'
    causes:
    - Rig USB sound card (TRX codec, Digirig, SignaLink) unplugged or rig switched off
    - Device name changed (other USB port, driver update) or mistyped in station.toml
    - Audio driver missing
    preconisation: Check the USB cable and rig power, then run trx-setup again and pick the device from the list
      ([audio] capture_device / playback_device).

ORT-3002:
  gravite: avertissement
  titre: 'Essai : son reçu absent, muet ou saturé'
  message: 'Essai du son reçu : {detail}.'
  causes:
  - Mauvais périphérique de capture
  - Sortie USB du poste coupée ou volume nul
  - Niveau de sortie USB trop fort (saturation)
  preconisation: Vérifier [audio] input dans station.toml, le niveau de sortie USB du poste et rx_gain_db.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - audio_rx
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-3002/
  depuis_version: 0.123.0
  en:
    titre: 'Test: received audio missing, silent or clipping'
    message: 'Received audio test: {detail}.'
    causes:
    - Wrong capture device
    - Rig USB output off or volume zero
    - Rig USB output level too high (clipping)
    preconisation: Check [audio] input in station.toml, the rig's USB output level and rx_gain_db.

ORT-3003:
  gravite: erreur
  titre: 'Essai : audio d''émission non transmis ou ROS élevé'
  message: 'Essai de l''audio d''émission : {detail}.'
  causes:
  - Porte audio d'émission restée fermée
  - 'ROS > 2 : charge fictive ou antenne en défaut'
  preconisation: Vérifier la charge ou l'antenne avant tout nouvel essai ; vérifier [audio] output et le mode données
    du poste.
  action_auto: retour_rx
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - audio_tx
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-3003/
  depuis_version: 0.123.0
  en:
    titre: 'Test: transmit audio not sent or high SWR'
    message: 'Transmit audio test: {detail}.'
    causes:
    - Transmit audio gate stayed closed
    - 'SWR > 2: dummy load or antenna fault'
    preconisation: Check the load or antenna before any new test; check [audio] output and the rig's data mode.

ORT-3004:
  gravite: critique
  titre: Ouverture du périphérique audio impossible
  message: 'Ouverture de la {sens} « {peripherique} » impossible : {erreur}.'
  causes:
  - Carte son occupée par un autre logiciel (WSJT-X, fldigi, Breizh Audio Box en WASAPI exclusif, PipeWire)
  - Format refusé par le pilote (48 000 Hz, 16 bits, mono)
  - Carte débranchée entre la recherche et l'ouverture
  preconisation: Fermer les autres logiciels qui utilisent la carte son du poste, vérifier qu'elle accepte 48 kHz,
    débrancher puis rebrancher l'interface audio et relancer la station.
  action_auto: arreter_passerelle
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-3004/
  depuis_version: 0.123.0
  en:
    titre: Cannot open the audio device
    message: 'Cannot open {sens} "{peripherique}": {erreur}.'
    causes:
    - Sound card held by another program (WSJT-X, fldigi, Breizh Audio Box in exclusive WASAPI, PipeWire)
    - Format refused by the driver (48 kHz, 16-bit, mono)
    - Device unplugged between lookup and opening
    preconisation: Close other programs using the rig sound card, check it accepts 48 kHz, unplug and replug the
      audio interface, then restart the station.

ORT-3005:
  gravite: avertissement
  titre: Son d'émission en retard ou haché
  message: 'Émission de {client} : {trous} trous et {jetes} blocs jetés (son arrivé trop tard) pendant {duree_s}
    s.'
  causes:
  - Gigue du réseau du client plus grande que la réserve de 60 ms (Wi-Fi, 4G, VPN)
  - 'Retard accumulé au-delà de 200 ms : la station jette le plus ancien plutôt que d''émettre en retard'
  - Téléphone ou PC du client trop chargé
  preconisation: Voir la sonde de qualité réseau du client (rubrique « Qualité du réseau ») ; préférer le Wi-Fi
    ou une meilleure couverture, un profil VPN par appareil.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-3005/
  depuis_version: 0.123.0
  en:
    titre: Late or choppy transmit audio
    message: 'Transmission by {client}: {trous} gaps and {jetes} blocks dropped (audio arrived too late) over {duree_s}
      s.'
    causes:
    - Client network jitter larger than the 60 ms buffer (Wi-Fi, 4G, VPN)
    - 'Delay over 200 ms: the station drops the oldest audio rather than transmit late'
    - Client phone or PC overloaded
    preconisation: Check the client's network quality probe ("Network quality"); prefer Wi-Fi or better coverage,
      one VPN profile per device.

ORT-3006:
  gravite: info
  titre: Client trop lent pour le son reçu
  message: '{perdues} trames du son reçu jetées pour un client trop lent.'
  causes:
  - Connexion WebRTC d'un client engorgée
  - Boucle de la passerelle en retard
  preconisation: Rien à faire si c'est rare ; sinon voir la qualité du réseau du client et la charge de la station.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-3006/
  depuis_version: 0.123.0
  en:
    titre: Client too slow for receive audio
    message: '{perdues} receive audio frames dropped for a slow client.'
    causes:
    - Client WebRTC connection congested
    - Gateway loop running late
    preconisation: Nothing to do if rare; otherwise check the client's network quality and the station load.

ORT-3007:
  gravite: erreur
  titre: Traitement du son reçu en erreur
  message: 'Traitement du son reçu en erreur : le son passe sans traitement ({erreur}).'
  causes:
  - Erreur inattendue du squelch SELCALL ou du traitement du son reçu
  - 'Conséquence : le squelch SELCALL ne filtre plus le son (les visiteurs et clients entendent tout)'
  preconisation: Envoyer un rapport de problème avec le journal de la passerelle ; redémarrer la passerelle pour
    retrouver le traitement.
  action_auto: repli_son_brut
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-3007/
  depuis_version: 0.123.0
  en:
    titre: Receive audio processing failed
    message: 'Receive audio processing failed: audio passes unprocessed ({erreur}).'
    causes:
    - Unexpected error in the SELCALL squelch or receive audio processing
    - 'Consequence: the SELCALL squelch no longer mutes the audio (listeners and clients hear everything)'
    preconisation: Send a problem report with the gateway log; restart the gateway to get processing back.

ORT-3008:
  gravite: erreur
  titre: Vidage du tampon d'émission impossible à la coupure
  message: 'Coupure d''un bip ou d''une trame SELCALL : vidage du tampon de lecture impossible ({erreur}).'
  causes:
  - Erreur du pilote audio pendant la coupure
  - Jusqu'à 200 ms de son déjà en tampon peuvent encore partir vers le poste
  preconisation: Envoyer un rapport de problème avec le journal ; vérifier la carte son du poste.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-3008/
  depuis_version: 0.123.0
  en:
    titre: Cannot flush transmit audio buffer on cut
    message: 'Cutting a beep or SELCALL burst: playback buffer flush failed ({erreur}).'
    causes:
    - Audio driver error during the cut
    - Up to 200 ms of already buffered audio may still reach the rig
    preconisation: Send a problem report with the log; check the rig sound card.

ORT-3009:
  gravite: avertissement
  titre: Cartes son de la station non choisies
  message: 'Périphériques audio non définis : pas d''audio tant qu''ils ne sont pas renseignés.'
  causes:
  - Assistant terminé sans choisir la capture et la lecture
  - Configuration importée d'un autre PC (cartes propres à la machine)
  preconisation: Relancer l'assistant (menu 2) et choisir la carte son du poste pour la capture et la lecture.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-3009/
  depuis_version: 0.123.0
  en:
    titre: Station sound devices not selected
    message: 'Audio devices not defined: no audio until they are set.'
    causes:
    - Wizard finished without choosing capture and playback
    - Configuration imported from another PC (devices are machine-specific)
    preconisation: Run the wizard again (menu 2) and choose the radio's sound card for capture and playback.

ORT-3010:
  gravite: avertissement
  titre: Sous-débits audio fréquents (xruns)
  message: '{xruns} décrochages de la carte son du poste et {perdues} trames perdues en {duree_min} min.'
  causes:
  - Machine de la station trop chargée (modules, FreeDV, visiteurs)
  - Gestion d'énergie USB ou concentrateur USB
  - Pilote audio instable
  preconisation: Réduire la charge de la station (modules, visiteurs), brancher l'interface audio directement sur
    le PC, désactiver la mise en veille USB.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-3010/
  depuis_version: 0.123.0
  en:
    titre: Frequent audio xruns
    message: '{xruns} rig sound card glitches and {perdues} frames lost in {duree_min} min.'
    causes:
    - Station computer overloaded (modules, FreeDV, listeners)
    - USB power management or USB hub
    - Unstable audio driver
    preconisation: Lower the station load (modules, listeners), plug the audio interface straight into the PC, disable
      USB suspend.

ORT-3011:
  gravite: avertissement
  titre: Carte son du poste occupée par le son du bureau
  message: '{carte} : branchée ({numero}) mais occupée par un autre programme, sans doute le son du bureau (PipeWire).'
  causes:
  - PipeWire a choisi la carte du poste comme sortie ou entrée par défaut
  - Autre logiciel audio ouvert
  preconisation: Choisir une autre sortie et entrée par défaut dans les réglages du son du bureau, puis relancer
    le diagnostic.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-3011/
  depuis_version: 0.123.0
  en:
    titre: Radio sound card held by the desktop audio
    message: '{carte}: plugged in ({numero}) but held by another program, probably the desktop audio (PipeWire).'
    causes:
    - PipeWire chose the radio's card as default output or input
    - Other audio software open
    preconisation: Pick another default output and input in the desktop sound settings, then rerun the diagnostic.


# ====================================================================================================
# 4000–4999 : Réseau, accès, clients
# ====================================================================================================

ORT-4001:
  gravite: avertissement
  titre: Pertes réseau d'un client élevées
  message: Perte de {perte_pct} % des battements sur 60 s ({appareil}).
  causes:
  - Wi-Fi saturé ou trop loin
  - Couverture 4G/5G faible
  - VPN surchargé ou profil partagé
  preconisation: Voir la sonde de qualité réseau (maillon faible) ; changer de réseau ou de place.
  action_auto: aucune
  ntfy_defaut: true
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4001/
  depuis_version: 0.123.0
  en:
    titre: High client packet loss
    message: '{perte_pct} % of heartbeats lost over 60 s ({appareil}).'
    causes:
    - Saturated or distant Wi-Fi
    - Weak 4G/5G coverage
    - Overloaded VPN or shared profile
    preconisation: Check the network quality probe (weak link); change network or location.

ORT-4002:
  gravite: avertissement
  titre: Demande de déconnexion d'un visiteur ignorée
  message: 'Demande de déconnexion ignorée : {raison}.'
  causes:
  - Fichier visitor-kick.json illisible, mal formé ou impossible à effacer
  - Demande de plus de 10 s (horloge, console lente)
  - Identifiant qui n'est pas un visiteur connecté
  preconisation: Refaire la demande depuis TRX Console menu 20 ; vérifier les droits du dossier d'état.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4002/
  depuis_version: 0.123.0
  en:
    titre: Listener disconnect request ignored
    message: 'Disconnect request ignored: {raison}.'
    causes:
    - visitor-kick.json unreadable, malformed or cannot be deleted
    - Request older than 10 s (clock, slow console)
    - Identifier is not a connected listener
    preconisation: Repeat the request from TRX Console menu 20; check the state folder permissions.

ORT-4003:
  gravite: info
  titre: Demande de connexion mal formée
  message: 'Demande de connexion refusée : requête mal formée (400).'
  causes:
  - Client incompatible ou modifié
  - Proxy inverse qui altère le corps de la requête
  - Robot qui sonde le port
  preconisation: Mettre à jour la page ou l'application ; vérifier le proxy inverse s'il y en a un.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - bad_request
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4003/
  depuis_version: 0.123.0
  en:
    titre: Malformed connection request
    message: 'Connection request refused: malformed request (400).'
    causes:
    - Incompatible or modified client
    - Reverse proxy altering the request body
    - Bot probing the port
    preconisation: Update the page or app; check the reverse proxy if any.

ORT-4004:
  gravite: avertissement
  titre: 'Connexion refusée : identifiant ou mot de passe'
  message: Connexion refusée pour « {compte} » depuis {source} (401).
  causes:
  - Mot de passe faux ou compte inconnu
  - 'Freinage des essais : 5 échecs en 60 s depuis la même adresse, ou 30 en 15 min sur le même compte'
  - 'Proxy inverse non déclaré dans [network] trusted_proxies : tous les clients semblent venir de la même adresse
    et se verrouillent ensemble'
  - Tentative d'intrusion
  preconisation: 'Vérifier l''identifiant et le mot de passe (TRX Console) ; attendre une minute après plusieurs
    échecs ; derrière un proxy, le déclarer dans trusted_proxies. Des refus répétés d''adresses inconnues = port
    exposé sondé : préférer un VPN.'
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - unauthorized
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4004/
  depuis_version: 0.123.0
  en:
    titre: 'Connection refused: login or password'
    message: Connection refused for "{compte}" from {source} (401).
    causes:
    - Wrong password or unknown account
    - 'Rate limiting: 5 failures in 60 s from one address, or 30 in 15 min on one account'
    - 'Reverse proxy not listed in [network] trusted_proxies: all clients seem to share one address and get locked
      together'
    - Intrusion attempt
    preconisation: 'Check login and password (TRX Console); wait a minute after several failures; behind a proxy,
      list it in trusted_proxies. Repeated refusals from unknown addresses = exposed port being probed: prefer a
      VPN.'

ORT-4005:
  gravite: avertissement
  titre: 'Station occupée : trop de connexions'
  message: 'Connexion refusée : {max} connexions simultanées au maximum.'
  causes:
  - Nombre maximal d'opérateurs connectés atteint ([access] max_operators, ou 4 sans [access])
  - Ancienne connexion pas encore fermée après une coupure du réseau
  preconisation: Fermer une autre connexion (autre téléphone, onglet oublié) ou attendre 20 s ; augmenter [access]
    max_operators si besoin.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - busy
  - operators_full
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4005/
  depuis_version: 0.123.0
  en:
    titre: 'Station busy: too many connections'
    message: 'Connection refused: at most {max} simultaneous connections.'
    causes:
    - Maximum number of operators reached ([access] max_operators, or 4 without [access])
    - Previous connection not yet closed after a network drop
    preconisation: Close another connection (other phone, forgotten tab) or wait 20 s; raise [access] max_operators
      if needed.

ORT-4006:
  gravite: erreur
  titre: Erreur de la station pendant la connexion
  message: 'Offre de connexion de {compte} en erreur (500) : {erreur}.'
  causes:
  - Description WebRTC (SDP) refusée par aiortc
  - Erreur inattendue de la passerelle à l'ouverture de la connexion
  preconisation: Réessayer ; si cela se répète, envoyer un rapport de problème avec le journal de la passerelle
    et la version du client.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - server_error
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4006/
  depuis_version: 0.123.0
  en:
    titre: Station error during connection
    message: 'Connection offer from {compte} failed (500): {erreur}.'
    causes:
    - WebRTC description (SDP) rejected by aiortc
    - Unexpected gateway error while opening the connection
    preconisation: Retry; if it repeats, send a problem report with the gateway log and the client version.

ORT-4007:
  gravite: avertissement
  titre: Compte désactivé ou expiré
  message: 'Compte « {compte} » {etat} sur la station : connexion refusée ou fermée.'
  causes:
  - Compte désactivé par l'administrateur de la station (TRX Console menu 20)
  - Date d'expiration du compte dépassée
  preconisation: Demander à l'administrateur de la station de réactiver ou prolonger le compte.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - account_disabled
  - account_expired
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4007/
  depuis_version: 0.123.0
  en:
    titre: Account disabled or expired
    message: 'Account "{compte}" {etat} on the station: connection refused or closed.'
    causes:
    - Account disabled by the station administrator (TRX Console menu 20)
    - Account expiry date passed
    preconisation: Ask the station administrator to re-enable or extend the account.

ORT-4008:
  gravite: info
  titre: 'Compte modifié : reconnexion demandée'
  message: 'Compte « {compte} » modifié sur la station (mot de passe ou rôle) : reconnecte-toi.'
  causes:
  - Mot de passe ou rôle changé dans station.toml pendant la connexion
  - Compte supprimé
  preconisation: Se reconnecter avec le nouveau mot de passe.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - account_changed
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4008/
  depuis_version: 0.123.0
  en:
    titre: 'Account changed: please reconnect'
    message: 'Account "{compte}" changed on the station (password or role): please reconnect.'
    causes:
    - Password or role changed in station.toml while connected
    - Account removed
    preconisation: Reconnect with the new password.

ORT-4009:
  gravite: avertissement
  titre: Connexion WebRTC jamais établie
  message: 'Connexion de {compte} jamais établie en {delai_s} s : abandon.'
  causes:
  - Flux UDP bloqué (pare-feu, réseau d'entreprise, 4G avec NAT strict)
  - Aucun serveur STUN/TURN ([network] ice_servers vide) hors réseau local ou VPN
  - VPN coupé pendant la négociation
  preconisation: Passer par un VPN, ouvrir l'UDP ou renseigner ice_servers (docs/acces-distant.md).
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4009/
  depuis_version: 0.123.0
  en:
    titre: WebRTC connection never established
    message: 'Connection from {compte} not established within {delai_s} s: given up.'
    causes:
    - UDP blocked (firewall, corporate network, 4G with strict NAT)
    - No STUN/TURN server ([network] ice_servers empty) outside the LAN or VPN
    - VPN dropped during negotiation
    preconisation: Use a VPN, open UDP or set ice_servers (docs/acces-distant.md).

ORT-4010:
  gravite: info
  titre: Message du client illisible
  message: 'Message du client {compte} refusé : {code} ({detail}).'
  causes:
  - Message JSON mal formé ou trop long (2 048 octets, plus pour quelques commandes)
  - Client incompatible ou modifié
  preconisation: Mettre à jour la page ou l'application ; signaler le problème s'il se répète.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - too_large
  - bad_json
  - bad_message
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4010/
  depuis_version: 0.123.0
  en:
    titre: Unreadable client message
    message: 'Message from client {compte} refused: {code} ({detail}).'
    causes:
    - Malformed or oversized JSON message (2,048 bytes, more for a few commands)
    - Incompatible or modified client
    preconisation: Update the page or app; report the problem if it repeats.

ORT-4011:
  gravite: info
  titre: Commande inconnue de la station
  message: Commande « {commande} » inconnue de cette station (version {version}).
  causes:
  - Client plus récent que la station
  - Client qui n'a pas vérifié hello.features avant d'afficher une fonction
  preconisation: Mettre à jour la station (TRX Console menu 10) ou utiliser une version du client compatible.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - unknown_command
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4011/
  depuis_version: 0.123.0
  en:
    titre: Command unknown to the station
    message: Command "{commande}" unknown to this station (version {version}).
    causes:
    - Client newer than the station
    - Client did not check hello.features before showing a feature
    preconisation: Update the station (TRX Console menu 10) or use a compatible client version.

ORT-4012:
  gravite: info
  titre: Paramètres de commande refusés
  message: 'Commande « {commande} » refusée : {detail}.'
  causes:
  - Valeur hors bornes ou de mauvais type (fréquence, niveau, puissance, code SELCALL…)
  - Réglage refusé par la station (profil de voix en trop, mise en page invalide, morceau d'export inexistant)
  - Client incompatible
  preconisation: Corriger la valeur saisie ; si le message vient d'un bouton, mettre à jour le client et signaler
    le problème.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - invalid_params
  - invalid
  - voice_profile_refused
  - layout_invalid
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4012/
  depuis_version: 0.123.0
  en:
    titre: Command parameters refused
    message: 'Command "{commande}" refused: {detail}.'
    causes:
    - Value out of range or wrong type (frequency, level, power, SELCALL code…)
    - Setting refused by the station (too many voice profiles, invalid layout, export part out of range)
    - Incompatible client
    preconisation: Fix the entered value; if it came from a button, update the client and report the problem.

ORT-4013:
  gravite: avertissement
  titre: 'Client trop bavard : messages ignorés'
  message: 'Plus de {max} messages par seconde de {compte} : message ignoré.'
  causes:
  - Client en boucle (défaut de la page ou de l'application)
  - Client modifié
  preconisation: Recharger la page ou relancer l'application ; signaler le problème avec la version du client.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - rate_limited
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4013/
  depuis_version: 0.123.0
  en:
    titre: 'Client flooding: messages ignored'
    message: 'More than {max} messages per second from {compte}: message ignored.'
    causes:
    - Client stuck in a loop (page or app defect)
    - Modified client
    preconisation: Reload the page or restart the app; report the problem with the client version.

ORT-4014:
  gravite: info
  titre: Fonction absente de cette station
  message: Fonction « {fonction} » non disponible sur cette station.
  causes:
  - Fonction désactivée dans station.toml (Breizh, FreeDV, SELCALL, sonde réseau, mesure de TOS, visiteurs…)
  - Matériel absent (spectre HF sans second port CI-V)
  - Module non lancé (présence de groupe)
  - Client qui n'a pas vérifié hello.features
  preconisation: Activer la fonction sur la station si elle est voulue ; sinon mettre à jour le client (il ne devrait
    pas proposer le bouton).
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - '*_unavailable'
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4014/
  depuis_version: 0.123.0
  en:
    titre: Feature not available on this station
    message: Feature "{fonction}" is not available on this station.
    causes:
    - Feature disabled in station.toml (Breizh, FreeDV, SELCALL, network probe, SWR sweep, listeners…)
    - Hardware missing (HF spectrum without the second CI-V port)
    - Module not running (group presence)
    - Client did not check hello.features
    preconisation: Enable the feature on the station if wanted; otherwise update the client (it should not offer
      the button).

ORT-4015:
  gravite: info
  titre: Élément demandé inconnu
  message: '{element} « {nom} » inconnu sur la station.'
  causes:
  - Mémoire effacée depuis un autre client
  - Visiteur déjà déconnecté
  preconisation: Rafraîchir la liste (elle se met à jour toute seule) et réessayer.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - unknown_memory
  - unknown_listener
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4015/
  depuis_version: 0.123.0
  en:
    titre: Requested item unknown
    message: '{element} "{nom}" unknown on the station.'
    causes:
    - Memory deleted from another client
    - Listener already disconnected
    preconisation: Refresh the list (it updates by itself) and retry.

ORT-4016:
  gravite: info
  titre: Rapport de problème refusé
  message: 'Rapport de problème refusé : {motif} {detail}.'
  causes:
  - Texte vide
  - Moins d'une minute depuis le rapport précédent du même compte
  preconisation: Écrire une description, ou attendre le délai indiqué avant de renvoyer.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - report_empty
  - report_too_soon
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4016/
  depuis_version: 0.123.0
  en:
    titre: Problem report refused
    message: 'Problem report refused: {motif} {detail}.'
    causes:
    - Empty text
    - Less than a minute since the same account's previous report
    preconisation: Write a description, or wait the stated delay before sending again.

ORT-4017:
  gravite: info
  titre: Demande de TRX Console ignorée
  message: 'Demande de {demande} de TRX Console {motif} : ignorée.'
  causes:
  - Fichier de demande illisible ou mal formé
  - Demande de plus de 10 s (passerelle arrêtée au moment de la demande)
  - Visiteur déjà parti
  preconisation: Refaire la demande depuis TRX Console pendant que la passerelle tourne.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4017/
  depuis_version: 0.123.0
  en:
    titre: TRX Console request ignored
    message: '{demande} request from TRX Console {motif}: ignored.'
    causes:
    - Request file unreadable or malformed
    - Request older than 10 s (gateway stopped at the time)
    - Listener already gone
    preconisation: Repeat the request from TRX Console while the gateway is running.

ORT-4018:
  gravite: erreur
  titre: 'Erreur inattendue : session d''un client'
  message: 'Session d''un client : erreur inattendue ({erreur}) ; la station continue.'
  causes:
  - Défaut du programme (cas non prévu)
  preconisation: Signaler le problème avec le journal de la station (menu 8 de TRX Console).
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4018/
  depuis_version: 0.126.0
  en:
    titre: 'Unexpected error: client session'
    message: 'Client session: unexpected error ({erreur}); the station carries on.'
    causes:
    - Program defect (unforeseen case)
    preconisation: Report the problem with the station log (TRX Console menu 8).

ORT-4019:
  gravite: info
  titre: 'Action d''un opérateur'
  message: '{compte} : {action}.'
  causes:
  - 'Action volontaire d''un opérateur (mesure de TOS, appel SELCALL, écoute des visiteurs, Breizh…)'
  preconisation: 'Rien à faire : trace des actions qui comptent, pour savoir qui a fait quoi et quand.'
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4019/
  depuis_version: 0.137.0
  en:
    titre: 'Operator action'
    message: '{compte}: {action}.'
    causes:
    - 'Deliberate operator action (SWR measurement, SELCALL call, visitor listening, Breizh…)'
    preconisation: 'Nothing to do: trace of the actions that matter, to know who did what and when.'

ORT-4020:
  gravite: info
  titre: 'Connexion d''un client fermée par la station'
  message: 'Connexion de {compte} ({role}) fermée par la station : {raison}.'
  causes:
  - 'Visiteur déconnecté par l''opérateur ou par la protection contre la surcharge'
  - 'Compte modifié, désactivé ou expiré'
  - 'Opérateur parti : visiteurs déconnectés après l''attente'
  preconisation: 'Rien à faire en général ; la cause précise porte son propre code (champ code_cause).'
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4020/
  depuis_version: 0.137.0
  en:
    titre: 'Client connection closed by the station'
    message: 'Connection of {compte} ({role}) closed by the station: {raison}.'
    causes:
    - 'Visitor disconnected by the operator or by the overload protection'
    - 'Account changed, disabled or expired'
    - 'Operator gone: visitors disconnected after the wait'
    preconisation: 'Usually nothing to do; the precise cause carries its own code (code_cause field).'

ORT-4021:
  gravite: info
  titre: 'Connexion refusée par les règles d''accès'
  message: 'Connexion de « {compte} » depuis {source} refusée : {detail}.'
  causes:
  - 'Écoute des visiteurs fermée ou pleine, opérateur absent'
  - 'Trop d''opérateurs connectés'
  - 'Compte désactivé ou expiré, station surchargée'
  preconisation: 'Rien à faire si la règle est voulue ; la cause précise porte son propre code (champ code_cause).'
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4021/
  depuis_version: 0.137.0
  en:
    titre: 'Connection refused by the access rules'
    message: 'Connection of « {compte} » from {source} refused: {detail}.'
    causes:
    - 'Visitor listening closed or full, operator absent'
    - 'Too many operators connected'
    - 'Account disabled or expired, station overloaded'
    preconisation: 'Nothing to do if the rule is intended; the precise cause carries its own code (code_cause field).'

ORT-4101:
  gravite: erreur
  titre: 'Certificat TLS inutilisable : API non démarrée'
  message: 'API non démarrée (réception seule) : certificat TLS inutilisable ({erreur}).'
  causes:
  - Fichier tls_cert ou tls_key absent ou illisible par le compte de la station
  - Clé qui ne correspond pas au certificat
  - Fichier qui ne contient pas de certificat PEM
  preconisation: Vérifier [network] tls_cert / tls_key et leurs droits, ou régénérer le certificat auto-signé avec
    trx-setup ; refaire l'appairage du téléphone si l'empreinte change.
  action_auto: repli_reception_seule
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4101/
  depuis_version: 0.123.0
  en:
    titre: 'TLS certificate unusable: API not started'
    message: 'API not started (receive only): TLS certificate unusable ({erreur}).'
    causes:
    - tls_cert or tls_key file missing or unreadable by the station account
    - Key does not match the certificate
    - File contains no PEM certificate
    preconisation: Check [network] tls_cert / tls_key and their permissions, or regenerate the self-signed certificate
      with trx-setup; pair the phone again if the fingerprint changes.

ORT-4102:
  gravite: erreur
  titre: Port de la passerelle impossible à ouvrir
  message: 'API non démarrée (réception seule) : écoute impossible sur {adresse}:{port} ({erreur}). {conseil}'
  causes:
  - Port déjà pris (autre passerelle encore active, autre programme)
  - Adresse d'écoute qui n'existe plus sur cette machine (réseau ou box changés)
  preconisation: Arrêter l'autre programme ou changer [network] gateway_port ; si l'adresse a changé, relancer l'assistant
    (étape Accès) ou corriger gateway_bind.
  action_auto: repli_reception_seule
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4102/
  depuis_version: 0.123.0
  en:
    titre: Gateway port cannot be opened
    message: 'API not started (receive only): cannot listen on {adresse}:{port} ({erreur}). {conseil}'
    causes:
    - Port already in use (another gateway still running, other program)
    - Listen address no longer exists on this machine (network or router changed)
    preconisation: Stop the other program or change [network] gateway_port; if the address changed, rerun the wizard
      (Access step) or fix gateway_bind.

ORT-4103:
  gravite: erreur
  titre: Compte d'accès mal défini
  message: '[[clients]] {compte} : {probleme}.'
  causes:
  - Identifiant invalide ou en double
  - Aucun secret, ou mot de passe haché ET jeton à la fois
  - Empreinte de mot de passe abîmée, jeton trop court
  - Rôle inconnu (une faute de frappe ne donne jamais un compte opérateur)
  - Pseudo invalide ou égal à l'identifiant d'un compte
  - Date d'expiration mal écrite
  preconisation: Corriger le compte par TRX Console (menus 14 et 20) ou par trx-setup --set-password / --add-client.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4103/
  depuis_version: 0.123.0
  en:
    titre: Access account badly defined
    message: '[[clients]] {compte}: {probleme}.'
    causes:
    - Invalid or duplicate login
    - No secret, or both password hash AND token
    - Corrupted password hash, token too short
    - Unknown role (a typo never grants an operator account)
    - Invalid nickname, or nickname equal to an account login
    - Badly written expiry date
    preconisation: Fix the account with TRX Console (menus 14 and 20) or with trx-setup --set-password / --add-client.

ORT-4104:
  gravite: avertissement
  titre: Compte avec un jeton en clair
  message: 'Des clients utilisent encore un jeton en clair : remplace-le par un mot de passe haché.'
  causes:
  - Compte créé par une ancienne version (jeton dans station.toml)
  preconisation: Lancer trx-setup --set-password NOM pour chaque compte concerné.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4104/
  depuis_version: 0.123.0
  en:
    titre: Account with a clear-text token
    message: 'Some clients still use a clear-text token: replace it with a hashed password.'
    causes:
    - Account created by an old version (token stored in station.toml)
    preconisation: Run trx-setup --set-password NAME for each affected account.

ORT-4105:
  gravite: avertissement
  titre: Mot de passe trop faible refusé
  message: 'Mot de passe refusé : {raison}.'
  causes:
  - Moins de {longueur_min} caractères
  - Trop répétitif
  - Contient l'identifiant
  - Espace au début ou à la fin
  preconisation: Choisir une phrase de passe longue, ou laisser la station en générer une (Entrée).
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4105/
  depuis_version: 0.123.0
  en:
    titre: Weak password refused
    message: 'Password refused: {raison}.'
    causes:
    - Fewer than {longueur_min} characters
    - Too repetitive
    - Contains the login
    - Leading or trailing space
    preconisation: Choose a long passphrase, or let the station generate one (press Enter).

ORT-4106:
  gravite: avertissement
  titre: 'Certificat HTTPS impossible : accès limité à ce PC'
  message: 'Module « cryptography » absent : certificat impossible. Accès limité à cette machine.'
  causes:
  - Installation incomplète (module Python cryptography manquant)
  preconisation: Relancer l'installation pour ajouter le module, puis l'étape Accès de l'assistant.
  action_auto: repli_acces_local
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4106/
  depuis_version: 0.123.0
  en:
    titre: 'HTTPS certificate impossible: access limited to this PC'
    message: '"cryptography" module missing: no certificate. Access limited to this machine.'
    causes:
    - Incomplete installation (Python module cryptography missing)
    preconisation: Rerun the installation to add the module, then the wizard's Access step.

ORT-4107:
  gravite: avertissement
  titre: Aucune adresse réseau sur ce PC
  message: 'Adresses de ce PC : aucune.'
  causes:
  - Câble réseau débranché ou Wi-Fi coupé
  - Carte réseau désactivée
  preconisation: Vérifier la connexion réseau (câble ou Wi-Fi).
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4107/
  depuis_version: 0.123.0
  en:
    titre: No network address on this PC
    message: 'Addresses of this PC: none.'
    causes:
    - Network cable unplugged or Wi-Fi off
    - Network adapter disabled
    preconisation: Check the network connection (cable or Wi-Fi).

ORT-4108:
  gravite: avertissement
  titre: Port de la station fermé ou bloqué
  message: 'Port {port} : {detail}.'
  causes:
  - Passerelle arrêtée ou API refusée (voir le journal)
  - Pare-feu ufw actif sans règle pour le port
  - 'Windows : réseau en profil PUBLIC, page non joignable'
  preconisation: Voir le journal (menu 7) ; ouvrir le port (sudo ufw allow {port}/tcp) ; sous Windows, passer le
    réseau en profil privé.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4108/
  depuis_version: 0.123.0
  en:
    titre: Station port closed or blocked
    message: 'Port {port}: {detail}.'
    causes:
    - Gateway stopped or API refused (see the log)
    - ufw firewall active without a rule for the port
    - 'Windows: network in PUBLIC profile, page unreachable'
    preconisation: Read the log (menu 7); open the port (sudo ufw allow {port}/tcp); on Windows switch the network
      to the private profile.

ORT-4301:
  gravite: info
  titre: Écoute des visiteurs coupée sur la station
  message: L'écoute des visiteurs n'est pas ouverte sur cette station.
  causes:
  - '[access] max_listeners = 0 dans station.toml'
  - Fonction coupée pendant que des visiteurs écoutaient (déconnectés)
  preconisation: 'Administrateur : régler max_listeners (TRX Console menu 20) si l''écoute des visiteurs est voulue.'
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - listeners_off
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4301/
  depuis_version: 0.123.0
  en:
    titre: Listener access disabled on the station
    message: Listener access is not open on this station.
    causes:
    - '[access] max_listeners = 0 in station.toml'
    - Feature turned off while listeners were connected (disconnected)
    preconisation: 'Administrator: set max_listeners (TRX Console menu 20) if listener access is wanted.'

ORT-4302:
  gravite: info
  titre: Écoute des visiteurs fermée par l'opérateur
  message: L'opérateur a fermé l'écoute des visiteurs.
  causes:
  - Commutateur « Écoute des visiteurs » fermé (fermé par défaut, et après un fichier listeners.json illisible)
  preconisation: Demander à l'opérateur d'ouvrir l'écoute des visiteurs (page ou application).
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - listeners_closed
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4302/
  depuis_version: 0.123.0
  en:
    titre: Listener access closed by the operator
    message: The operator has closed listener access.
    causes:
    - '"Listener access" switch closed (closed by default, and when listeners.json is unreadable)'
    preconisation: Ask the operator to open listener access (page or app).

ORT-4303:
  gravite: info
  titre: Nombre maximal de visiteurs atteint
  message: Nombre maximal de visiteurs atteint ({max}).
  causes:
  - Tous les emplacements de visiteurs sont pris ([access] max_listeners)
  preconisation: Réessayer plus tard ; l'administrateur peut augmenter max_listeners si la machine le permet.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - listeners_full
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4303/
  depuis_version: 0.123.0
  en:
    titre: Maximum number of listeners reached
    message: Maximum number of listeners reached ({max}).
    causes:
    - All listener slots taken ([access] max_listeners)
    preconisation: Try again later; the administrator can raise max_listeners if the computer allows it.

ORT-4304:
  gravite: info
  titre: 'Opérateur absent : écoute des visiteurs impossible'
  message: 'L''opérateur n''est pas connecté à la station : l''écoute des visiteurs n''est possible qu''en sa présence.'
  causes:
  - Aucun opérateur connecté ([access] listeners_need_operator)
  - 'Dernier opérateur parti : visiteurs déconnectés après operator_grace_s (60 s) s''il ne revient pas'
  preconisation: Attendre que l'opérateur se connecte.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - operator_absent
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4304/
  depuis_version: 0.123.0
  en:
    titre: 'Operator absent: listening not possible'
    message: 'The operator is not connected to the station: listeners can only listen while the operator is present.'
    causes:
    - No operator connected ([access] listeners_need_operator)
    - 'Last operator left: listeners disconnected after operator_grace_s (60 s) unless the operator returns'
    preconisation: Wait for the operator to connect.

ORT-4305:
  gravite: info
  titre: Visiteur déconnecté par l'opérateur
  message: Visiteur {visiteur} déconnecté par {par}.
  causes:
  - Opérateur qui a touché « Déconnecter » (page, application)
  - Déconnexion demandée par TRX Console (menu 20)
  preconisation: Aucune.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - kicked
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4305/
  depuis_version: 0.123.0
  en:
    titre: Listener disconnected by the operator
    message: Listener {visiteur} disconnected by {par}.
    causes:
    - Operator pressed "Disconnect" (page, app)
    - Disconnection requested from TRX Console (menu 20)
    preconisation: None.

ORT-4306:
  gravite: info
  titre: Commande refusée à un visiteur
  message: 'Visiteur {visiteur} : commande « {commande} » refusée (réception seule).'
  causes:
  - Client visiteur qui envoie une commande hors de sa liste blanche (défaut du client ou client modifié)
  preconisation: Mettre à jour la page ou l'application du visiteur.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - forbidden
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4306/
  depuis_version: 0.123.0
  en:
    titre: Command refused to a listener
    message: 'Listener {visiteur}: command "{commande}" refused (receive only).'
    causes:
    - Listener client sending a command outside its allow list (client defect or modified client)
    preconisation: Update the listener's page or app.

ORT-4307:
  gravite: avertissement
  titre: 'Visiteur déconnecté : trop de commandes refusées'
  message: 'Le visiteur {visiteur} a envoyé plus de {max} commandes refusées en une minute (client modifié ?) :
    connexion fermée.'
  causes:
  - Client visiteur modifié qui essaie de commander le poste
  - Client défectueux en boucle
  preconisation: Vérifier le compte visiteur concerné ; le désactiver (TRX Console menu 20) si c'est une tentative
    d'abus.
  action_auto: refus
  ntfy_defaut: true
  priorite_ntfy: 3
  codes_machine:
  - too_many_forbidden
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4307/
  depuis_version: 0.123.0
  en:
    titre: 'Listener disconnected: too many refused commands'
    message: 'Listener {visiteur} sent more than {max} refused commands in one minute (modified client?): connection
      closed.'
    causes:
    - Modified listener client trying to control the rig
    - Faulty client in a loop
    preconisation: Check the listener account; disable it (TRX Console menu 20) if it is an abuse attempt.

ORT-4308:
  gravite: erreur
  titre: 'Station surchargée : visiteurs déconnectés'
  message: 'Station surchargée ({depassement}) : écoute des visiteurs suspendue pour protéger la station ({n} visiteur(s)
    déconnecté(s)).'
  causes:
  - Processeur à {temp_c} °C ou plus pendant 10 s ([access] overload_temp_c, 85 °C)
  - Processeur occupé à 90 % ou plus (overload_cpu_pct)
  - Boucle de la passerelle en retard de plus de 100 ms (overload_lag_ms)
  - Mémoire libre sous 10 % (overload_mem_pct)
  - Trop de visiteurs pour la machine (Pi 3, petit PC)
  preconisation: Réduire max_listeners, vérifier la ventilation et la charge (modules, FreeDV) ; l'écoute rouvre
    seule après 5 min nettement sous les seuils.
  action_auto: arreter_ecoute_visiteurs
  ntfy_defaut: true
  priorite_ntfy: 3
  codes_machine:
  - station_overload
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4308/
  depuis_version: 0.123.0
  en:
    titre: 'Station overloaded: listeners disconnected'
    message: 'Station overloaded ({depassement}): listener access suspended to protect the station ({n} listener(s)
      disconnected).'
    causes:
    - CPU at {temp_c} °C or more for 10 s ([access] overload_temp_c, 85 °C)
    - CPU busy at 90 % or more (overload_cpu_pct)
    - Gateway loop late by more than 100 ms (overload_lag_ms)
    - Free memory under 10 % (overload_mem_pct)
    - Too many listeners for the computer (Pi 3, small PC)
    preconisation: Lower max_listeners, check cooling and load (modules, FreeDV); access reopens by itself after
      5 min well below the limits.

ORT-4309:
  gravite: avertissement
  titre: Écoute des visiteurs verrouillée après des surcharges répétées
  message: 'Trop de coupures en une heure ({n}) : l''opérateur doit rouvrir l''écoute des visiteurs.'
  causes:
  - 3 coupures pour surcharge en une heure ayant déconnecté des visiteurs
  preconisation: Corriger la cause de la surcharge puis rouvrir à la main (page de l'opérateur ou TRX Console menu
    20), acceptée seulement au vert.
  action_auto: arreter_ecoute_visiteurs
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - station_overload (locked)
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4309/
  depuis_version: 0.123.0
  en:
    titre: Listener access locked after repeated overloads
    message: 'Too many cuts within one hour ({n}): the operator must reopen listener access.'
    causes:
    - 3 overload cuts within one hour that disconnected listeners
    preconisation: Fix the overload cause then reopen by hand (operator page or TRX Console menu 20), accepted only
      when back to normal.

ORT-4310:
  gravite: info
  titre: Réouverture de l'écoute des visiteurs refusée
  message: 'Refusé : la station n''est pas encore revenue à la normale ({depassement}).'
  causes:
  - Mesures encore au-dessus des seuils de retour (température - 10 °C, 70 %, retard / 2, mémoire + 5 points)
  preconisation: Attendre que la station refroidisse ou se décharge, puis réessayer.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - still_overloaded
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4310/
  depuis_version: 0.123.0
  en:
    titre: Reopening listener access refused
    message: 'Refused: the station is not back to normal yet ({depassement}).'
    causes:
    - Measurements still above the return thresholds (temperature - 10 °C, 70 %, lag / 2, memory + 5 points)
    preconisation: Wait for the station to cool down or settle, then retry.

ORT-4501:
  gravite: avertissement
  titre: Coupure réseau d'un client
  message: 'Coupure de {duree_s} s ({appareil}). Tronçon probable : {troncon}.'
  causes:
  - Téléphone, réseau mobile ou tunnel (mode avion, zone blanche)
  - Radio du téléphone faible ou changement de cellule
  - Réseau local ou machine de la station
  - Connexion Internet de la box
  - WebRTC ou passerelle
  - Profil VPN partagé par un autre appareil
  preconisation: Lire le diagnostic dans la rubrique « Qualité du réseau » (page, application, TRX Console menu
    23) et agir sur le tronçon indiqué.
  action_auto: aucune
  ntfy_defaut: true
  priorite_ntfy: 3
  codes_machine:
  - net_event outage
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4501/
  depuis_version: 0.123.0
  en:
    titre: Client network outage
    message: 'Outage of {duree_s} s ({appareil}). Likely segment: {troncon}.'
    causes:
    - Phone, mobile network or tunnel (airplane mode, dead zone)
    - Weak phone radio or cell change
    - Local network or station computer
    - Router Internet connection
    - WebRTC or gateway
    - VPN profile shared with another device
    preconisation: Read the diagnosis under "Network quality" (page, app, TRX Console menu 23) and act on the indicated
      segment.

ORT-4502:
  gravite: avertissement
  titre: Aller-retour réseau élevé
  message: Aller-retour de {rtt_ms} ms (p95 sur 60 s) pour {appareil}.
  causes:
  - Réseau mobile chargé
  - VPN lointain
  - Wi-Fi saturé
  preconisation: Voir la sonde de qualité réseau ; un aller-retour élevé retarde le son et les commandes.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4502/
  depuis_version: 0.123.0
  en:
    titre: High network round-trip time
    message: Round trip {rtt_ms} ms (p95 over 60 s) for {appareil}.
    causes:
    - Busy mobile network
    - Distant VPN
    - Saturated Wi-Fi
    preconisation: Check the network quality probe; a high round trip delays audio and commands.

ORT-4503:
  gravite: avertissement
  titre: Profil VPN probablement partagé
  message: 'Deux appareils ({appareils}) arrivent par la même adresse {adresse} : ils partagent probablement le
    même profil VPN.'
  causes:
  - Même profil WireGuard sur le PC et le téléphone
  - Coupures très régulières (toutes les 15 à 30 s) sur un appareil au signal correct
  preconisation: Créer un profil VPN par appareil ; ou « Ignorer » cette adresse si c'est voulu.
  action_auto: aucune
  ntfy_defaut: true
  priorite_ntfy: 3
  codes_machine:
  - net_event vpn_shared
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4503/
  depuis_version: 0.123.0
  en:
    titre: VPN profile probably shared
    message: 'Two devices ({appareils}) arrive through the same address {adresse}: they probably share one VPN profile.'
    causes:
    - Same WireGuard profile on the PC and the phone
    - Very regular drops (every 15 to 30 s) on a device with good signal
    preconisation: Create one VPN profile per device; or "Ignore" this address if intended.

ORT-4504:
  gravite: info
  titre: Horloge du client décalée
  message: Horloge de l'appareil {appareil} décalée de {decalage_ms} ms par rapport à la station.
  causes:
  - Heure du téléphone ou du PC client non synchronisée
  - Heure de la station non synchronisée
  preconisation: Activer l'heure automatique sur le client et NTP sur la station.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4504/
  depuis_version: 0.123.0
  en:
    titre: Client clock offset
    message: Device {appareil} clock off by {decalage_ms} ms from the station.
    causes:
    - Client phone or PC time not synchronized
    - Station time not synchronized
    preconisation: Enable automatic time on the client and NTP on the station.

ORT-4505:
  gravite: avertissement
  titre: Sonde de la station vers la box ou Internet abandonnée
  message: 'Sonde {sonde} : pas d''adresse IPv4 utilisable ({cible}) : sonde abandonnée.'
  causes:
  - Passerelle par défaut introuvable (pas de réseau au démarrage)
  - Cible IPv6 ou nom au lieu d'une adresse IPv4 ([netprobe] lan_target / internet_target)
  preconisation: Mettre une adresse IPv4 dans lan_target / internet_target, ou « auto » pour la box ; redémarrer
    la passerelle une fois le réseau présent.
  action_auto: repli_tcp
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4505/
  depuis_version: 0.123.0
  en:
    titre: Station probe to router or Internet dropped
    message: 'Probe {sonde}: no usable IPv4 address ({cible}): probe dropped.'
    causes:
    - Default gateway not found (no network at startup)
    - IPv6 target or name instead of an IPv4 address ([netprobe] lan_target / internet_target)
    preconisation: Put an IPv4 address in lan_target / internet_target, or "auto" for the router; restart the gateway
      once the network is up.

ORT-4506:
  gravite: info
  titre: Historique de la sonde réseau effacé
  message: Historique de la sonde réseau effacé par {par}.
  causes:
  - « Tout effacer » demandé par un opérateur ou TRX Console (menu 23)
  preconisation: Aucune.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4506/
  depuis_version: 0.123.0
  en:
    titre: Network probe history cleared
    message: Network probe history cleared by {par}.
    causes:
    - '"Clear all" requested by an operator or TRX Console (menu 23)'
    preconisation: None.

ORT-4507:
  gravite: info
  titre: 'trx-netreport : aucune mesure'
  message: 'Aucune mesure : {dossier} n''existe pas.'
  causes:
  - Sonde réseau arrêtée ([netprobe] enabled = false)
  - Aucun client connecté depuis l'installation de la version 0.106.0
  - 'station.toml illisible : dossier d''état par défaut utilisé'
  preconisation: Activer la sonde réseau et connecter un client, ou indiquer la bonne configuration (--config).
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4507/
  depuis_version: 0.123.0
  en:
    titre: 'trx-netreport: no measurements'
    message: 'No measurements: {dossier} does not exist.'
    causes:
    - Network probe disabled ([netprobe] enabled = false)
    - No client connected since version 0.106.0 was installed
    - 'station.toml unreadable: default state folder used'
    preconisation: Enable the network probe and connect a client, or point to the right configuration (--config).

ORT-4508:
  gravite: erreur
  titre: Export ou effacement de l'historique réseau impossible
  message: '{action} impossible : {detail}.'
  causes:
  - Bureau non accessible en écriture
  - Droits du dossier d'état (opération faite par l'administrateur)
  preconisation: Vérifier l'espace disque et les droits, puis recommencer (menu 23).
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4508/
  depuis_version: 0.123.0
  en:
    titre: Network history export or erase failed
    message: '{action} failed: {detail}.'
    causes:
    - Desktop not writable
    - State folder permissions (operation run as administrator)
    preconisation: Check disk space and permissions, then try again (menu 23).

ORT-4509:
  gravite: erreur
  titre: 'Erreur inattendue : sonde de qualité réseau'
  message: 'Sonde de qualité réseau : erreur inattendue ({erreur}) ; la station continue.'
  causes:
  - Défaut du programme (cas non prévu)
  preconisation: Signaler le problème avec le journal de la station (menu 8 de TRX Console).
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - netprobe_error
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-4509/
  depuis_version: 0.126.0
  en:
    titre: 'Unexpected error: network quality probe'
    message: 'Network quality probe: unexpected error ({erreur}); the station carries on.'
    causes:
    - Program defect (unforeseen case)
    preconisation: Report the problem with the station log (TRX Console menu 8).


# ====================================================================================================
# 5000–5999 : PTT et sécurité d'émission
# ====================================================================================================

ORT-5001:
  gravite: avertissement
  titre: Durée maximale d'émission (TOT) atteinte
  message: Émission coupée par le TOT après {tot_s} s.
  causes:
  - Émission plus longue que le TOT réglé
  - PTT oublié en émission (toggle)
  - Client qui n'a pas relâché
  preconisation: Relâcher plus tôt ; le TOT se règle depuis le téléphone sous le plafond de la station.
  action_auto: retour_rx
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - tot
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5001/
  depuis_version: 0.123.0
  en:
    titre: Transmit time-out (TOT) reached
    message: Transmission cut by the TOT after {tot_s} s.
    causes:
    - Transmission longer than the configured TOT
    - PTT left on (toggle)
    - Client did not release
    preconisation: Release earlier; the TOT can be set from the phone below the station ceiling.

ORT-5002:
  gravite: erreur
  titre: 'Retour forcé en réception : terminal perdu'
  message: 'Émission coupée : {cause} du terminal {client}.'
  causes:
  - Battement du client absent plus de {delai_s} s (réseau mobile, tunnel, Wi-Fi)
  - Connexion du client fermée (application quittée, téléphone en veille, perte réseau)
  - Profil VPN partagé par deux appareils
  preconisation: Vérifier la stabilité réseau du terminal (voir la sonde de qualité réseau) et ne pas partager un
    profil VPN entre deux appareils.
  action_auto: retour_rx
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - heartbeat
  - client_disconnected
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5002/
  depuis_version: 0.123.0
  en:
    titre: 'Forced back to receive: client lost'
    message: 'Transmission cut: {cause} from client {client}.'
    causes:
    - Client heartbeat missing for more than {delai_s} s (mobile network, tunnel, Wi-Fi)
    - Client connection closed (app quit, phone asleep, network loss)
    - VPN profile shared by two devices
    preconisation: Check the client's network stability (see the network quality probe) and do not share one VPN
      profile between two devices.

ORT-5003:
  gravite: critique
  titre: L'ouverture du second port met le poste en émission
  message: 'L''ouverture de {port} a mis le poste en ÉMISSION : un réglage « USB SEND » ou « USB Keying » du poste
    utilise ce port. Coupure faite ; spectre désactivé jusqu''au redémarrage de la station.'
  causes:
  - « USB SEND », « USB Keying (CW) » ou « USB Keying (RTTY) » affecté à une ligne RTS/DTR du port B
  preconisation: Sur le poste (MENU > SET > Connecteurs), mettre USB SEND et USB Keying sur OFF ou sur le port CAT
    seulement, puis redémarrer la station.
  action_auto: retour_rx
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - spectrum_port_keyed
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5003/
  depuis_version: 0.123.0
  en:
    titre: Opening the second port keys the rig
    message: 'Opening {port} put the rig into TRANSMIT: a "USB SEND" or "USB Keying" rig setting uses this port.
      Unkeyed; spectrum disabled until the station restarts.'
    causes:
    - '"USB SEND", "USB Keying (CW)" or "USB Keying (RTTY)" mapped to an RTS/DTR line of port B'
    preconisation: On the rig (MENU > SET > Connectors), set USB SEND and USB Keying to OFF or to the CAT port only,
      then restart the station.

ORT-5004:
  gravite: info
  titre: Émission pendant l'ouverture du second port (autre cause)
  message: 'Le poste est passé en émission juste après l''ouverture de {port}, sans que ce port en soit la cause
    (micro du poste ?) : émission laissée à l''opérateur, nouvel essai du spectre plus tard.'
  causes:
  - Opérateur sur place au micro du poste
  - VOX du poste
  preconisation: 'Aucune action : le spectre revient seul après l''émission faite sur le poste.'
  action_auto: nouvel_essai
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - ptt_busy
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5004/
  depuis_version: 0.123.0
  en:
    titre: Transmission while opening the second port (other cause)
    message: 'The rig went to transmit right after {port} was opened, but not because of that port (rig microphone?):
      transmission left to the operator, spectrum retried later.'
    causes:
    - Local operator on the rig microphone
    - Rig VOX
    preconisation: 'Nothing to do: the spectrum comes back by itself after the transmission made on the rig.'

ORT-5005:
  gravite: info
  titre: 'Poste utilisé sur place : PTT à distance bloqué'
  message: 'Poste utilisé sur place ({motif}) : PTT à distance bloqué encore {secondes} s. « Reprendre la main »
    pour le débloquer.'
  causes:
  - Émission au micro du poste, pédale ou VOX
  - Fréquence ou mode changés sur le poste sans commande de la station
  - Autre logiciel CAT qui change la fréquence
  preconisation: Se coordonner avec l'opérateur sur place ; « Reprendre la main » est possible dès que le poste
    n'émet plus localement.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - local_active
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5005/
  depuis_version: 0.123.0
  en:
    titre: 'Rig in local use: remote PTT blocked'
    message: 'Rig in local use ({motif}): remote PTT blocked for another {secondes} s. Use "Take control" to unblock.'
    causes:
    - Transmission on the rig microphone, footswitch or VOX
    - Frequency or mode changed on the rig without a station command
    - Another CAT program changing the frequency
    preconisation: Coordinate with the local operator; "Take control" is possible as soon as the rig is no longer
      transmitting locally.

ORT-5006:
  gravite: info
  titre: 'Reprise de la main impossible : le poste émet sur place'
  message: 'Le poste émet en ce moment depuis son micro : impossible de reprendre la main.'
  causes:
  - Émission locale en cours (micro, pédale, VOX)
  preconisation: Attendre la fin de l'émission locale, puis « Reprendre la main ».
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - local_tx
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5006/
  depuis_version: 0.123.0
  en:
    titre: 'Cannot take control: rig transmitting locally'
    message: 'The rig is transmitting from its own microphone right now: cannot take control.'
    causes:
    - Local transmission in progress (microphone, footswitch, VOX)
    preconisation: Wait for the local transmission to end, then use "Take control".

ORT-5007:
  gravite: info
  titre: Main reprise à distance
  message: 'Poste utilisé sur place : main reprise à distance par {client}.'
  causes:
  - Un opérateur a utilisé « Reprendre la main » avant la fin de l'attente de 2 minutes
  preconisation: Aucune ; s'assurer que personne n'utilise le poste sur place.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - local_released
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5007/
  depuis_version: 0.123.0
  en:
    titre: Control taken back remotely
    message: 'Rig in local use: control taken back remotely by {client}.'
    causes:
    - An operator used "Take control" before the 2-minute hold ended
    preconisation: None; make sure nobody is using the rig locally.

ORT-5008:
  gravite: erreur
  titre: 'Poste trop chaud : émission à distance coupée'
  message: 'Poste à {temp_c} °C (seuil {seuil_c} °C) : émission à distance coupée et refusée jusqu''au retour sous
    {reprise_c} °C.'
  causes:
  - Émissions longues ou rapprochées à forte puissance
  - Ventilation du poste obstruée
  - TOS élevé
  preconisation: Laisser refroidir le poste, réduire la puissance ou le rapport émission/réception, vérifier la
    ventilation et le TOS.
  action_auto: retour_rx
  ntfy_defaut: true
  priorite_ntfy: 3
  codes_machine:
  - rig_overheat
  - rig_hot
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5008/
  depuis_version: 0.123.0
  en:
    titre: 'Rig too hot: remote transmit cut'
    message: 'Rig at {temp_c} °C (limit {seuil_c} °C): remote transmit cut and refused until it drops below {reprise_c}
      °C.'
    causes:
    - Long or frequent high-power transmissions
    - Rig ventilation blocked
    - High SWR
    preconisation: Let the rig cool down, reduce power or duty cycle, check ventilation and SWR.

ORT-5009:
  gravite: avertissement
  titre: Poste chaud
  message: Poste à {temp_c} °C (seuil d'avertissement {seuil_c} °C).
  causes:
  - Émissions longues à forte puissance
  - Ventilation insuffisante
  preconisation: Espacer les émissions, réduire la puissance ; au second seuil l'émission à distance sera coupée.
  action_auto: aucune
  ntfy_defaut: true
  priorite_ntfy: 3
  codes_machine:
  - rig_warm
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5009/
  depuis_version: 0.123.0
  en:
    titre: Rig warm
    message: Rig at {temp_c} °C (warning threshold {seuil_c} °C).
    causes:
    - Long high-power transmissions
    - Insufficient ventilation
    preconisation: Space out transmissions, reduce power; at the second threshold remote transmit will be cut.

ORT-5010:
  gravite: critique
  titre: PTT actif sans session cliente
  message: 'Poste en émission alors que la passerelle est en {etat_passerelle} : « T 0 » envoyé par le superviseur.'
  causes:
  - Émission locale (micro, pédale, VOX) avec allow_local_tx = false
  - Propriétaire de l'émission qui n'est plus connecté
  - Autre logiciel qui commande le PTT
  - Port B du spectre mal réglé
  preconisation: Contrôler le poste immédiatement ; vérifier VOX, pédale, autres logiciels CAT et réglages USB SEND/Keying.
  action_auto: retour_rx
  ntfy_defaut: true
  priorite_ntfy: 3
  codes_machine:
  - ptt_mismatch
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5010/
  depuis_version: 0.123.0
  en:
    titre: PTT active without a client session
    message: 'Rig transmitting while the gateway is in {etat_passerelle}: "T 0" sent by the supervisor.'
    causes:
    - Local transmission (microphone, footswitch, VOX) with allow_local_tx = false
    - Transmission owner no longer connected
    - Another program keying the PTT
    - Spectrum port B misconfigured
    preconisation: Check the rig immediately; check VOX, footswitch, other CAT software and USB SEND/Keying settings.

ORT-5011:
  gravite: info
  titre: Prise d'émission annulée par une coupure
  message: 'Prise d''émission annulée : une coupure a eu lieu pendant la préparation.'
  causes:
  - STOP, coupure d'un autre client ou de la sécurité pendant la prise d'émission
  preconisation: Vérifier la raison de la coupure affichée, puis recommencer si besoin.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - cancelled
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5011/
  depuis_version: 0.123.0
  en:
    titre: Keying cancelled by a cut
    message: 'Keying cancelled: a cut happened while preparing to transmit.'
    causes:
    - STOP, another client or the safety layer cut during keying
    preconisation: Check the displayed cut reason, then try again if needed.

ORT-5012:
  gravite: erreur
  titre: L'ordre d'émission a échoué
  message: L'ordre d'émission a échoué ({detail}) ; retour en réception par précaution.
  causes:
  - Commande CAT « T 1 » en erreur ou hors délai
  - Liaison CAT coupée à l'instant de la prise
  preconisation: Réessayer ; si cela se répète, vérifier la liaison CAT et la méthode PTT.
  action_auto: retour_rx
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - ptt_write_failed
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5012/
  depuis_version: 0.123.0
  en:
    titre: Keying command failed
    message: The transmit command failed ({detail}); returning to receive as a precaution.
    causes:
    - CAT "T 1" command in error or timed out
    - CAT link dropped at keying time
    preconisation: Try again; if it repeats, check the CAT link and the PTT method.

ORT-5013:
  gravite: erreur
  titre: Le poste n'est pas passé en émission
  message: Le poste n'a pas confirmé le passage en émission ; retour en réception.
  causes:
  - Poste qui refuse d'émettre (hors bande amateur, verrouillage, mode)
  - Méthode PTT mal choisie
  - Relecture du PTT fausse ou en retard
  preconisation: Vérifier sur le poste qu'il peut émettre sur cette fréquence et dans ce mode, et la méthode PTT
    de l'assistant.
  action_auto: retour_rx
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - rig_did_not_key
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5013/
  depuis_version: 0.123.0
  en:
    titre: Rig did not key up
    message: The rig did not confirm transmit; returning to receive.
    causes:
    - Rig refusing to transmit (out of ham band, lock, mode)
    - Wrong PTT method
    - Wrong or late PTT readback
    preconisation: Check on the rig that it can transmit on this frequency and mode, and the PTT method in the setup
      wizard.

ORT-5014:
  gravite: info
  titre: Fin d'émission proche (TOT)
  message: Coupure par le TOT dans {secondes} s.
  causes:
  - Émission qui approche du TOT
  preconisation: Conclure et relâcher le PTT.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - tot_warning
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5014/
  depuis_version: 0.123.0
  en:
    titre: Transmit time-out approaching
    message: TOT cut in {secondes} s.
    causes:
    - Transmission approaching the TOT
    preconisation: Wrap up and release the PTT.

ORT-5015:
  gravite: info
  titre: Émission coupée par STOP
  message: Émission coupée par le bouton STOP ({client}).
  causes:
  - Un client a appuyé sur STOP
  preconisation: Aucune.
  action_auto: retour_rx
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - stop
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5015/
  depuis_version: 0.123.0
  en:
    titre: Transmission cut by STOP
    message: Transmission cut by the STOP button ({client}).
    causes:
    - A client pressed STOP
    preconisation: None.

ORT-5016:
  gravite: info
  titre: Émission coupée par un autre client
  message: Émission coupée à la demande de {client}.
  causes:
  - Un autre client a appuyé sur le PTT pendant l'émission (couper est toujours permis)
  preconisation: Se coordonner entre opérateurs de la station.
  action_auto: retour_rx
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - toggle
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5016/
  depuis_version: 0.123.0
  en:
    titre: Transmission cut by another client
    message: Transmission cut at the request of {client}.
    causes:
    - Another client pressed PTT during the transmission (cutting is always allowed)
    preconisation: Coordinate between the station's operators.

ORT-5017:
  gravite: avertissement
  titre: Réglage modifié sur le poste pendant l'émission
  message: 'Émission coupée : {reglage} modifié sur le poste pendant l''émission.'
  causes:
  - Bouton d'accord, touche de mode, split ou ΔTX touchés sur le poste
  - Autre logiciel CAT qui change la fréquence
  - Mémoire rappelée sur le poste
  preconisation: Ne pas toucher au poste pendant une émission à distance ; vérifier qu'aucun autre logiciel ne le
    commande.
  action_auto: retour_rx
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - frequency_changed
  - mode_changed
  - split_changed
  - xit_changed
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5017/
  depuis_version: 0.123.0
  en:
    titre: Rig setting changed during transmission
    message: 'Transmission cut: {reglage} changed on the rig during the transmission.'
    causes:
    - Tuning knob, mode key, split or XIT touched on the rig
    - Another CAT program changing the frequency
    - Memory recalled on the rig
    preconisation: Do not touch the rig during a remote transmission; make sure no other software controls it.

ORT-5018:
  gravite: avertissement
  titre: Le poste est repassé seul en réception
  message: 'Le poste est repassé en réception pendant l''émission : fin d''émission.'
  causes:
  - TOT ou protection interne du poste
  - PTT relâché sur le poste ou par un autre logiciel
  - Alimentation insuffisante
  preconisation: Vérifier le TOT interne du poste, son alimentation et qu'aucun autre logiciel ne commande le PTT.
  action_auto: retour_rx
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - rig_reported_rx
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5018/
  depuis_version: 0.123.0
  en:
    titre: Rig went back to receive on its own
    message: 'The rig went back to receive during the transmission: transmission ended.'
    causes:
    - Rig's own TOT or protection
    - PTT released on the rig or by another program
    - Insufficient power supply
    preconisation: Check the rig's internal TOT, its power supply and that no other software controls the PTT.

ORT-5019:
  gravite: erreur
  titre: Liaison avec le poste perdue pendant l'émission
  message: 'Émission coupée : {cause} pendant l''émission.'
  causes:
  - rigctld arrêté ou bloqué
  - Câble USB débranché, retour HF sur le câble
  - Poste qui ne répond plus (fréquence illisible)
  preconisation: Vérifier le câble USB (ferrites, retour HF), rigctld et le poste ; le superviseur envoie aussi
    « T 0 » s'il voit encore l'émission.
  action_auto: retour_rx
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - cat_down
  - rig_silent
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5019/
  depuis_version: 0.123.0
  en:
    titre: Link to the rig lost during transmission
    message: 'Transmission cut: {cause} during the transmission.'
    causes:
    - rigctld stopped or stuck
    - USB cable unplugged, RF feedback on the cable
    - Rig no longer answering (frequency unreadable)
    preconisation: Check the USB cable (ferrites, RF feedback), rigctld and the rig; the supervisor also sends "T
      0" if it still sees the transmission.

ORT-5020:
  gravite: critique
  titre: Retour en réception impossible
  message: 'Le poste reste en émission malgré « PTT off » depuis {delai_s} s : défaut verrouillé, le superviseur
    prend le relais.'
  causes:
  - Poste qui ignore la commande CAT de fin d'émission
  - rigctld bloqué ou liaison CAT coupée pendant l'émission
  - PTT tenu par un autre moyen (pédale, RTS/DTR, autre logiciel)
  preconisation: Contrôler le poste IMMÉDIATEMENT (le couper à la main au besoin), puis vérifier la liaison CAT
    et la méthode PTT ; effacer le défaut sur la station.
  action_auto: redemarrer_passerelle
  ntfy_defaut: true
  priorite_ntfy: 5
  codes_machine:
  - unkey_failed
  - gateway_cannot_unkey
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5020/
  depuis_version: 0.123.0
  en:
    titre: Unable to return to receive
    message: 'The rig is still transmitting despite "PTT off" for {delai_s} s: fault latched, the supervisor takes
      over.'
    causes:
    - Rig ignoring the CAT unkey command
    - rigctld stuck or CAT link lost during the transmission
    - PTT held by other means (footswitch, RTS/DTR, other software)
    preconisation: Check the rig IMMEDIATELY (switch it off by hand if needed), then check the CAT link and the
      PTT method; clear the fault on the station.

ORT-5021:
  gravite: avertissement
  titre: Bip de fin d'émission impossible
  message: 'Bip de fin {type} impossible ({detail}) : coupure sans bip.'
  causes:
  - Réglages des bips illisibles (beeps.json)
  - Lecture audio en erreur
  - Bip plus long que l'attente permise (1,2 s ; trame SELCALL 4,5 s)
  preconisation: Vérifier les réglages des bips (page ou application) et les journaux de la passerelle.
  action_auto: retour_rx
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5021/
  depuis_version: 0.123.0
  en:
    titre: End-of-transmission tone failed
    message: 'End-of-transmission {type} tone failed ({detail}): unkeyed without tone.'
    causes:
    - Tone settings unreadable (beeps.json)
    - Audio playback error
    - Tone longer than the allowed wait (1.2 s; SELCALL burst 4.5 s)
    preconisation: Check the tone settings (web page or app) and the gateway logs.

ORT-5022:
  gravite: info
  titre: Bip de fin interrompu par une coupure
  message: Bip {type} interrompu par une coupure ({raison}).
  causes:
  - STOP, TOT ou autre client pendant le bip de fin
  preconisation: 'Aucune : toute coupure prime sur le bip.'
  action_auto: retour_rx
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5022/
  depuis_version: 0.123.0
  en:
    titre: End tone interrupted by a cut
    message: '{type} tone interrupted by a cut ({raison}).'
    causes:
    - STOP, TOT or another client during the end tone
    preconisation: 'None: any cut takes precedence over the tone.'

ORT-5023:
  gravite: info
  titre: Émission coupée par l'arrêt de la station
  message: 'Émission coupée : arrêt de la passerelle.'
  causes:
  - Arrêt ou mise à jour de la station
  - Redémarrage de la passerelle par le superviseur
  preconisation: Attendre le redémarrage de la station.
  action_auto: retour_rx
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - shutdown
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5023/
  depuis_version: 0.123.0
  en:
    titre: Transmission cut by station shutdown
    message: 'Transmission cut: gateway shutting down.'
    causes:
    - Station shutdown or update
    - Gateway restarted by the supervisor
    preconisation: Wait for the station to restart.

ORT-5024:
  gravite: critique
  titre: 'TOT absolu dépassé : coupure par le superviseur'
  message: 'Le poste émet depuis {duree_s} s (TOT absolu {tot_abs_s} s) : « T 0 » envoyé par le superviseur.'
  causes:
  - Émission de la passerelle qui a échappé à son TOT (passerelle défaillante)
  - Émission locale au micro du poste trop longue
  - PTT bloqué sur le poste
  preconisation: Contrôler le poste ; si l'émission venait de la passerelle, consulter ses journaux (l'échelle de
    reprise est lancée).
  action_auto: retour_rx
  ntfy_defaut: true
  priorite_ntfy: 5
  codes_machine:
  - tot_absolu
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5024/
  depuis_version: 0.123.0
  en:
    titre: 'Absolute TOT exceeded: supervisor cut'
    message: 'The rig has been transmitting for {duree_s} s (absolute TOT {tot_abs_s} s): "T 0" sent by the supervisor.'
    causes:
    - Gateway transmission that escaped its TOT (gateway failure)
    - Local transmission on the rig microphone too long
    - PTT stuck on the rig
    preconisation: Check the rig; if the transmission came from the gateway, read its logs (recovery ladder started).

ORT-5025:
  gravite: critique
  titre: Passerelle muette pendant une émission
  message: 'Le poste émet et la passerelle ne publie plus son état depuis {age_s} s : « T 0 » envoyé, passerelle
    relancée.'
  causes:
  - Passerelle gelée ou plantée pendant une émission
  - 'Disque plein : fichier d''état non écrit'
  - Machine surchargée
  preconisation: Consulter les journaux de la passerelle (blocage, py-spy dump) ; vérifier l'espace disque et la
    charge.
  action_auto: redemarrer_passerelle
  ntfy_defaut: true
  priorite_ntfy: 5
  codes_machine:
  - gateway_silent_tx
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5025/
  depuis_version: 0.123.0
  en:
    titre: Gateway silent during transmission
    message: 'The rig is transmitting and the gateway has not published its state for {age_s} s: "T 0" sent, gateway
      restarted.'
    causes:
    - Gateway frozen or crashed during a transmission
    - 'Disk full: status file not written'
    - Machine overloaded
    preconisation: Read the gateway logs (hang, py-spy dump); check disk space and load.

ORT-5026:
  gravite: critique
  titre: rigctld injoignable pendant une émission
  message: 'rigctld ne répond plus depuis {delai_s} s alors que le poste émettait ({detail}) : « T 0 » tenté, rigctld
    relancé.'
  causes:
  - rigctld planté ou bloqué
  - Retour HF sur le câble USB pendant l'émission
  - Câble USB débranché
  preconisation: Contrôler le poste immédiatement ; vérifier le câble USB (ferrites), puis les journaux de rigctld.
  action_auto: redemarrer_rigctld
  ntfy_defaut: true
  priorite_ntfy: 5
  codes_machine:
  - rigctld_down_during_tx
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5026/
  depuis_version: 0.123.0
  en:
    titre: rigctld unreachable during transmission
    message: 'rigctld has not answered for {delai_s} s while the rig was transmitting ({detail}): "T 0" attempted,
      rigctld restarted.'
    causes:
    - rigctld crashed or stuck
    - RF feedback on the USB cable during transmit
    - USB cable unplugged
    preconisation: Check the rig immediately; check the USB cable (ferrites), then the rigctld logs.

ORT-5027:
  gravite: critique
  titre: « T 0 » du superviseur non confirmé
  message: Le superviseur a envoyé « T 0 » mais le poste n'est pas confirmé en réception.
  causes:
  - rigctld injoignable
  - Poste qui ignore la commande
  - PTT tenu par un autre moyen
  preconisation: Contrôler le poste immédiatement et le couper à la main si besoin.
  action_auto: nouvel_essai
  ntfy_defaut: false
  priorite_ntfy: 5
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5027/
  depuis_version: 0.123.0
  en:
    titre: Supervisor "T 0" not confirmed
    message: The supervisor sent "T 0" but the rig is not confirmed on receive.
    causes:
    - rigctld unreachable
    - Rig ignoring the command
    - PTT held by other means
    preconisation: Check the rig immediately and switch it off by hand if needed.

ORT-5028:
  gravite: erreur
  titre: 'Erreur inattendue : bips de fin d''émission'
  message: 'Bips de fin d''émission : erreur inattendue ({erreur}) ; la station continue.'
  causes:
  - Défaut du programme (cas non prévu)
  preconisation: Signaler le problème avec le journal de la station (menu 8 de TRX Console).
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5028/
  depuis_version: 0.126.0
  en:
    titre: 'Unexpected error: end-of-transmission beeps'
    message: 'End-of-transmission beeps: unexpected error ({erreur}); the station carries on.'
    causes:
    - Program defect (unforeseen case)
    preconisation: Report the problem with the station log (TRX Console menu 8).

ORT-5029:
  gravite: erreur
  titre: 'Erreur inattendue : contrôle du PTT'
  message: 'Contrôle du PTT : erreur inattendue dans {partie} ({erreur}) ; la sécurité d''émission continue.'
  causes:
  - 'Défaut du programme (cas non prévu)'
  preconisation: 'Signaler le problème avec le rapport de dépannage (menu 2.3 de TRX Console).'
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5029/
  depuis_version: 0.135.0
  en:
    titre: 'Unexpected error: PTT control'
    message: 'PTT control: unexpected error in {partie} ({erreur}); transmit safety carries on.'
    causes:
    - 'Program defect (unforeseen case)'
    preconisation: 'Report the problem with the troubleshooting report (TRX Console menu 2.3).'

ORT-5030:
  gravite: avertissement
  titre: 'Retour en réception non confirmé : nouvel essai'
  message: 'Retour en réception non confirmé ({detail}) : nouvel essai de « PTT off ».'
  causes:
  - 'Le poste a relu « émission » juste après l''ordre (lenteur, cache de rigctld)'
  - 'Liaison CAT perturbée pendant l''ordre'
  preconisation: 'Rien à faire si le retour en réception aboutit ; sinon ORT-5020 suit (défaut verrouillé).'
  action_auto: nouvel_essai
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5030/
  depuis_version: 0.135.0
  en:
    titre: 'Return to receive not confirmed: retrying'
    message: 'Return to receive not confirmed ({detail}): retrying « PTT off ».'
    causes:
    - 'The radio read back « transmit » right after the order (slowness, rigctld cache)'
    - 'CAT link disturbed during the order'
    preconisation: 'Nothing to do if the return to receive succeeds; otherwise ORT-5020 follows (latched fault).'

ORT-5031:
  gravite: info
  titre: 'Coupure du PTT'
  message: 'Coupure du PTT : {raison} (demandée par {par}).'
  causes:
  - 'Fin d''émission normale (relâché, STOP, TOT)'
  - 'Sécurité de la station (terminal perdu, poste, température)'
  preconisation: 'Rien à faire : trace de chaque coupure ; la cause précise porte son propre code (champ code_cause).'
  action_auto: retour_rx
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5031/
  depuis_version: 0.135.0
  en:
    titre: 'PTT cut'
    message: 'PTT cut: {raison} (requested by {par}).'
    causes:
    - 'Normal end of transmission (released, STOP, TOT)'
    - 'Station safety (terminal lost, radio, temperature)'
    preconisation: 'Nothing to do: trace of every cut; the precise cause carries its own code (code_cause field).'

ORT-5101:
  gravite: erreur
  titre: 'Émission refusée : défaut verrouillé'
  message: 'Émission refusée : un défaut de sécurité est verrouillé sur la station ({defaut}).'
  causes:
  - Un retour en réception a échoué au-delà du délai (défaut « unkey_failed »)
  - Le défaut n'a pas encore été effacé sur la station
  preconisation: Vérifier que le poste est bien en réception, puis effacer le défaut sur la station (action locale,
    jamais depuis le téléphone).
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - fault_latched
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5101/
  depuis_version: 0.123.0
  en:
    titre: 'Transmit refused: latched fault'
    message: 'Transmit refused: a safety fault is latched on the station ({defaut}).'
    causes:
    - A return to receive failed beyond the deadline ("unkey_failed" fault)
    - The fault has not been cleared on the station yet
    preconisation: Check that the rig is really on receive, then clear the fault on the station itself (local action
      only, never from the phone).

ORT-5102:
  gravite: info
  titre: 'Émission refusée : station en démarrage'
  message: 'La station démarre : le retour en réception n''est pas encore confirmé, réessayez dans un instant.'
  causes:
  - Passerelle tout juste lancée
  - Liaison CAT pas encore établie (rigctld pas prêt, poste éteint)
  preconisation: Attendre quelques secondes ; si cela dure, vérifier rigctld et la liaison avec le poste.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - starting
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5102/
  depuis_version: 0.123.0
  en:
    titre: 'Transmit refused: station starting'
    message: 'The station is starting: return to receive not confirmed yet, try again in a moment.'
    causes:
    - Gateway just started
    - CAT link not established yet (rigctld not ready, rig off)
    preconisation: Wait a few seconds; if it persists, check rigctld and the link to the rig.

ORT-5103:
  gravite: info
  titre: 'Émission refusée : coupure ou émission en cours'
  message: 'Une coupure ou une émission est déjà en cours : demande refusée.'
  causes:
  - Une émission ou un retour en réception est en cours
  - Double appui rapide
  preconisation: Attendre le retour en réception confirmé puis recommencer.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - not_idle
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5103/
  depuis_version: 0.123.0
  en:
    titre: 'Transmit refused: cut or transmission in progress'
    message: 'A cut or a transmission is already in progress: request refused.'
    causes:
    - A transmission or a return to receive is in progress
    - Quick double press
    preconisation: Wait for confirmed receive, then try again.

ORT-5104:
  gravite: avertissement
  titre: 'Émission refusée : client non reconnu'
  message: 'Le client {client} n''est pas enregistré auprès de la sécurité d''émission : demande refusée.'
  causes:
  - Connexion en cours de fermeture ou d'ouverture
  - Session restée ouverte après une déconnexion
  preconisation: Se déconnecter puis se reconnecter à la station.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - unknown_client
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5104/
  depuis_version: 0.123.0
  en:
    titre: 'Transmit refused: unknown client'
    message: 'Client {client} is not registered with the transmit safety layer: request refused.'
    causes:
    - Connection being closed or opened
    - Session left open after a disconnection
    preconisation: Disconnect and reconnect to the station.

ORT-5105:
  gravite: info
  titre: 'Émission refusée : mesure de TOS en cours'
  message: 'Une mesure de TOS est en cours ({client}) : seul son auteur peut émettre ; STOP l''arrête.'
  causes:
  - Un opérateur a lancé une mesure de TOS
  - Une seconde mesure a été demandée
  preconisation: Attendre la fin de la mesure, ou l'arrêter par STOP.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - swr_busy
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5105/
  depuis_version: 0.123.0
  en:
    titre: 'Transmit refused: SWR sweep in progress'
    message: 'An SWR sweep is in progress ({client}): only its owner can transmit; STOP ends it.'
    causes:
    - An operator started an SWR sweep
    - A second sweep was requested
    preconisation: Wait for the sweep to finish, or stop it with STOP.

ORT-5106:
  gravite: avertissement
  titre: 'Émission refusée : aucune bande autorisée'
  message: 'Aucune bande d''émission n''est autorisée dans station.toml : la station est en réception seule.'
  causes:
  - Liste [[bands]] vide alors que enforce_bands est actif
  - Configuration incomplète après l'assistant
  preconisation: Ajouter les bandes autorisées par votre licence dans station.toml (assistant ou TRX Console), sur
    la station.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - tx_disabled
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5106/
  depuis_version: 0.123.0
  en:
    titre: 'Transmit refused: no band allowed'
    message: 'No transmit band is allowed in station.toml: the station is receive-only.'
    causes:
    - Empty [[bands]] list while enforce_bands is on
    - Configuration left incomplete after the setup wizard
    preconisation: Add the bands your licence allows to station.toml (setup wizard or TRX Console), on the station.

ORT-5107:
  gravite: avertissement
  titre: 'Émission refusée : hors des bandes autorisées'
  message: 'Émission refusée : {frequence_mhz} MHz est hors des bandes autorisées{precision}.'
  causes:
  - Fréquence d'émission hors des [[bands]] de station.toml
  - 'Split actif : l''autre VFO est hors bande'
  - ΔTX (XIT) qui pousse la fréquence d'émission hors bande
  preconisation: Revenir dans une bande autorisée, vérifier split et ΔTX ; ou compléter [[bands]] sur la station
    si la licence le permet.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - out_of_band
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5107/
  depuis_version: 0.123.0
  en:
    titre: 'Transmit refused: out of allowed bands'
    message: 'Transmit refused: {frequence_mhz} MHz is outside the allowed bands{precision}.'
    causes:
    - Transmit frequency outside the station.toml [[bands]]
    - 'Split on: the other VFO is out of band'
    - XIT pushing the transmit frequency out of band
    preconisation: Move back into an allowed band, check split and XIT; or extend [[bands]] on the station if your
      licence allows it.

ORT-5108:
  gravite: erreur
  titre: 'Émission refusée : split illisible'
  message: 'Le poste déclare un split mais sa fréquence d''émission ne se relit pas ({detail}) : émission refusée
    par sécurité.'
  causes:
  - Poste ou version de Hamlib qui ne relit pas la fréquence de l'autre VFO
  - Réponse CAT inattendue
  - Liaison CAT perturbée
  preconisation: Couper le split sur le poste ; si le défaut persiste hors split, vérifier la version de Hamlib
    et le signaler.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - split_unreadable
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5108/
  depuis_version: 0.123.0
  en:
    titre: 'Transmit refused: split unreadable'
    message: 'The rig reports split but its transmit frequency cannot be read back ({detail}): transmit refused
      for safety.'
    causes:
    - Rig or Hamlib version unable to read the other VFO frequency
    - Unexpected CAT reply
    - Disturbed CAT link
    preconisation: Turn split off on the rig; if it persists without split, check the Hamlib version and report
      it.

ORT-5109:
  gravite: erreur
  titre: 'Émission refusée : ΔTX (XIT) illisible'
  message: 'Le poste déclare un ΔTX (XIT) qui ne se relit pas ({detail}) : émission refusée par sécurité.'
  causes:
  - Poste ou version de Hamlib qui ne relit pas le décalage XIT
  - Réponse CAT inattendue
  preconisation: Couper le ΔTX sur le poste ; si le défaut persiste, vérifier la version de Hamlib et le signaler.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - xit_unreadable
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5109/
  depuis_version: 0.123.0
  en:
    titre: 'Transmit refused: XIT unreadable'
    message: 'The rig reports an XIT that cannot be read back ({detail}): transmit refused for safety.'
    causes:
    - Rig or Hamlib version unable to read the XIT offset
    - Unexpected CAT reply
    preconisation: Turn XIT off on the rig; if it persists, check the Hamlib version and report it.

ORT-5110:
  gravite: erreur
  titre: 'Émission refusée : liaison avec le poste perdue'
  message: 'Liaison CAT avec le poste perdue : émission et réglages refusés.'
  causes:
  - rigctld arrêté ou injoignable
  - Poste éteint ou câble USB débranché
  preconisation: Vérifier que le poste est allumé et relié, et que rigctld tourne (le superviseur le relance) ;
    voir aussi l'alerte rigctld.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - cat_down
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5110/
  depuis_version: 0.123.0
  en:
    titre: 'Transmit refused: link to the rig lost'
    message: 'CAT link to the rig lost: transmit and settings refused.'
    causes:
    - rigctld stopped or unreachable
    - Rig off or USB cable unplugged
    preconisation: Check that the rig is on and connected and that rigctld is running (the supervisor restarts it);
      see also the rigctld alert.

ORT-5111:
  gravite: erreur
  titre: 'Émission refusée : le poste répond mal'
  message: 'Le poste n''a pas répondu correctement à la relecture avant émission ({detail}) : émission refusée.'
  causes:
  - Réponse CAT en erreur ou hors délai (fréquence, PTT, mode, split)
  - Poste occupé par un autre logiciel CAT
  - Liaison série instable
  preconisation: Réessayer ; si cela se répète, vérifier le câble, la vitesse CI-V et fermer tout autre logiciel
    de contrôle.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - cat_error
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5111/
  depuis_version: 0.123.0
  en:
    titre: 'Transmit refused: rig not answering properly'
    message: 'The rig did not answer properly to the pre-transmit check ({detail}): transmit refused.'
    causes:
    - CAT reply in error or timed out (frequency, PTT, mode, split)
    - Rig used by another CAT program
    - Unstable serial link
    preconisation: Try again; if it repeats, check the cable, the CI-V baud rate and close any other control software.

ORT-5112:
  gravite: erreur
  titre: 'Émission refusée : état du PTT illisible'
  message: 'L''état du PTT n''est pas lisible sur ce poste ({detail}) : émission refusée par sécurité.'
  causes:
  - Poste ou pilote Hamlib qui ne relit pas le PTT
  - Méthode PTT (RTS/DTR) sans relecture
  preconisation: Vérifier la méthode PTT choisie dans l'assistant ; une méthode relisible (CAT) est exigée pour
    émettre à distance.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - ptt_unreadable
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5112/
  depuis_version: 0.123.0
  en:
    titre: 'Transmit refused: PTT state unreadable'
    message: 'The PTT state cannot be read on this rig ({detail}): transmit refused for safety.'
    causes:
    - Rig or Hamlib backend unable to read PTT back
    - PTT method (RTS/DTR) without readback
    preconisation: Check the PTT method chosen in the setup wizard; a method with readback (CAT) is required for
      remote transmit.

ORT-5113:
  gravite: avertissement
  titre: 'Émission refusée : le poste émet déjà'
  message: 'Le poste est déjà en émission (micro du poste, pédale, VOX ou autre logiciel) : émission à distance
    refusée.'
  causes:
  - Opérateur sur place au micro
  - VOX ou pédale
  - Autre logiciel qui commande le PTT
  - Port B du spectre mal réglé (USB SEND/Keying)
  preconisation: Attendre la fin de l'émission locale ; si personne n'émet sur place, vérifier VOX, pédale et réglages
    USB SEND / USB Keying du poste.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - rig_already_tx
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5113/
  depuis_version: 0.123.0
  en:
    titre: 'Transmit refused: rig already transmitting'
    message: 'The rig is already transmitting (rig microphone, footswitch, VOX or other software): remote transmit
      refused.'
    causes:
    - Local operator on the microphone
    - VOX or footswitch
    - Another program keying the PTT
    - Spectrum port B misconfigured (USB SEND/Keying)
    preconisation: Wait for the local transmission to end; if nobody is transmitting locally, check VOX, footswitch
      and the rig's USB SEND / USB Keying settings.

ORT-5114:
  gravite: avertissement
  titre: Émission refusée dans ce mode
  message: 'Émission refusée en {mode} : modes permis {modes_permis}.'
  causes:
  - 'Le poste ne module par l''USB qu''en modes données (ex. Icom : USB-D, PKTUSB)'
  - Liste tx_modes de station.toml
  preconisation: Passer dans un mode permis (mode données, par exemple USB-D) ou ajuster tx_modes sur la station.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - mode_not_allowed
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5114/
  depuis_version: 0.123.0
  en:
    titre: Transmit refused in this mode
    message: 'Transmit refused in {mode}: allowed modes {modes_permis}.'
    causes:
    - 'The rig only takes USB audio in data modes (e.g. Icom: USB-D, PKTUSB)'
    - tx_modes list in station.toml
    preconisation: Switch to an allowed mode (data mode, e.g. USB-D) or adjust tx_modes on the station.

ORT-5115:
  gravite: info
  titre: 'Émission refusée : trop rapprochée'
  message: 'Trop rapproché de la dernière coupure : attendez une seconde avant de réémettre.'
  causes:
  - Nouvel appui moins d'une seconde après une fin d'émission (protection des relais)
  preconisation: Attendre une seconde puis recommencer.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - cooldown
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5115/
  depuis_version: 0.123.0
  en:
    titre: 'Transmit refused: too soon'
    message: 'Too soon after the last unkey: wait a second before transmitting again.'
    causes:
    - New press less than one second after the end of a transmission (relay protection)
    preconisation: Wait one second and try again.

ORT-5116:
  gravite: info
  titre: Réglage refusé pendant l'émission
  message: 'Impossible pendant l''émission : fréquence, mode et réglages du poste sont verrouillés jusqu''au retour
    en réception confirmé.'
  causes:
  - Changement de fréquence, mode, RIT/ΔTX, fonction, niveau, puissance ou filtre demandé pendant une émission ou
    une coupure
  - Mesure de TOS demandée hors réception
  preconisation: Repasser en réception puis refaire le réglage.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - tx_active
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5116/
  depuis_version: 0.123.0
  en:
    titre: Setting refused while transmitting
    message: 'Not possible while transmitting: frequency, mode and rig settings are locked until receive is confirmed.'
    causes:
    - Frequency, mode, RIT/XIT, function, level, power or filter change requested during a transmission or a cut
    - SWR sweep requested while not on receive
    preconisation: Go back to receive, then change the setting.

ORT-5501:
  gravite: info
  titre: Mesure de TOS non disponible
  message: La mesure de TOS n'est pas en service sur cette station.
  causes:
  - '[swr] enabled = false dans station.toml'
  preconisation: Activer [swr] sur la station si vous voulez l'utiliser.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - swr_unavailable
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5501/
  depuis_version: 0.123.0
  en:
    titre: SWR sweep unavailable
    message: The SWR sweep is not enabled on this station.
    causes:
    - '[swr] enabled = false in station.toml'
    preconisation: Enable [swr] on the station if you want to use it.

ORT-5502:
  gravite: info
  titre: Plage de mesure de TOS invalide
  message: 'Plage de mesure refusée : {detail}.'
  causes:
  - Fréquence centrale ou largeur nulle
  - Moins de 2 points ou plus que le maximum
  - FreqHaute inférieure à FreqBasse
  - Plage trop étroite pour le pas
  preconisation: Corriger la fréquence centrale, la largeur ou le nombre de points.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - swr_bad_range
  - swr_too_many_points
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5502/
  depuis_version: 0.123.0
  en:
    titre: Invalid SWR sweep range
    message: 'Sweep range refused: {detail}.'
    causes:
    - Zero centre frequency or width
    - Fewer than 2 points or more than the maximum
    - High frequency below low frequency
    - Range too narrow for the step
    preconisation: Fix the centre frequency, the width or the number of points.

ORT-5503:
  gravite: avertissement
  titre: 'Mesure de TOS : aucun point dans les bandes'
  message: 'Mesure de TOS refusée : aucun point dans les bandes autorisées de la station.'
  causes:
  - Plage choisie entièrement hors des [[bands]] de station.toml
  preconisation: Choisir une plage dans une bande autorisée, ou ajouter la bande (CB, 45 m, marine) sur la station
    si vous y avez droit.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - swr_out_of_band
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5503/
  depuis_version: 0.123.0
  en:
    titre: 'SWR sweep: no point within allowed bands'
    message: 'SWR sweep refused: no point within the station''s allowed bands.'
    causes:
    - Chosen range entirely outside the station.toml [[bands]]
    preconisation: Pick a range within an allowed band, or add the band (CB, 45 m, marine) on the station if you
      are entitled to it.

ORT-5504:
  gravite: avertissement
  titre: 'Mesure de TOS : aucun mode FM permis'
  message: 'Aucun mode FM permis (tx_modes) : mesure de TOS impossible.'
  causes:
  - tx_modes ne contient ni FM, ni PKTFM, ni FM-D
  - Poste sans mode FM annoncé par Hamlib
  preconisation: Ajouter FM-D (par exemple) à tx_modes sur la station.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - swr_no_fm_mode
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5504/
  depuis_version: 0.123.0
  en:
    titre: 'SWR sweep: no FM mode allowed'
    message: 'No FM mode allowed (tx_modes): SWR sweep not possible.'
    causes:
    - tx_modes contains neither FM, PKTFM nor FM-D
    - Rig without an FM mode reported by Hamlib
    preconisation: Add FM-D (for example) to tx_modes on the station.

ORT-5505:
  gravite: erreur
  titre: 'Mesure de TOS arrêtée : poste illisible'
  message: 'Mesure de TOS arrêtée : {detail}.'
  causes:
  - Fréquence, mode ou coupleur du poste illisibles
  - Mode ou puissance non relus après réglage
  preconisation: Vérifier la liaison CAT ; régler le poste à la main si la remise en état signale un écart.
  action_auto: retour_rx
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - swr_unreadable
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5505/
  depuis_version: 0.123.0
  en:
    titre: 'SWR sweep stopped: rig unreadable'
    message: 'SWR sweep stopped: {detail}.'
    causes:
    - Rig frequency, mode or tuner unreadable
    - Mode or power not read back after setting
    preconisation: Check the CAT link; set the rig by hand if the restore step reports a difference.

ORT-5506:
  gravite: info
  titre: Mesure de TOS interrompue par une coupure
  message: 'Mesure de TOS interrompue : {raison}.'
  causes:
  - STOP ou annulation par l'opérateur
  - TOT, battement perdu, déconnexion
  - Coupure de sécurité (poste sur place, liaison CAT...)
  preconisation: Vérifier la raison affichée puis relancer la mesure si besoin.
  action_auto: retour_rx
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - cut
  - swr_cancel
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5506/
  depuis_version: 0.123.0
  en:
    titre: SWR sweep interrupted by a cut
    message: 'SWR sweep interrupted: {raison}.'
    causes:
    - STOP or cancel by the operator
    - TOT, lost heartbeat, disconnection
    - Safety cut (local use of the rig, CAT link...)
    preconisation: Check the displayed reason, then restart the sweep if needed.

ORT-5507:
  gravite: avertissement
  titre: 'Mesure de TOS arrêtée : émission refusée'
  message: 'Mesure de TOS arrêtée : {raison} ({detail}).'
  causes:
  - Une prise d'émission d'un point a été refusée (poste sur place, hors bande, mode, liaison CAT, anti-rebond...)
  - Un réglage du poste a été refusé
  preconisation: Lire la raison du refus (mêmes codes que le PTT) et corriger avant de relancer.
  action_auto: retour_rx
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5507/
  depuis_version: 0.123.0
  en:
    titre: 'SWR sweep stopped: transmit refused'
    message: 'SWR sweep stopped: {raison} ({detail}).'
    causes:
    - Keying for a point was refused (local use, out of band, mode, CAT link, cooldown...)
    - A rig setting was refused
    preconisation: Read the refusal reason (same codes as PTT) and fix it before restarting.

ORT-5508:
  gravite: erreur
  titre: Mesure de TOS en erreur
  message: 'Mesure de TOS en erreur : {detail}.'
  causes:
  - Défaut interne de la mesure
  preconisation: Consulter le journal de la passerelle et signaler le problème ; vérifier l'état du poste.
  action_auto: retour_rx
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - swr_failed
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5508/
  depuis_version: 0.123.0
  en:
    titre: SWR sweep error
    message: 'SWR sweep error: {detail}.'
    causes:
    - Internal sweep fault
    preconisation: Read the gateway log and report the problem; check the rig state.

ORT-5509:
  gravite: avertissement
  titre: Lecture du TOS instable sur ce poste
  message: 'Mesure de TOS : lecture instable sur ce poste, {secondes} s par point.'
  causes:
  - TOS-mètre du poste lent ou fluctuant
  - Antenne ou coupleur instables
  - Puissance trop faible pour une lecture stable
  preconisation: Vérifier l'antenne et les connecteurs ; la mesure utilise la durée maximale par point.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - swr_unstable
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5509/
  depuis_version: 0.123.0
  en:
    titre: Unstable SWR reading on this rig
    message: 'SWR sweep: unstable reading on this rig, {secondes} s per point.'
    causes:
    - Slow or fluctuating rig SWR meter
    - Unstable antenna or tuner
    - Power too low for a stable reading
    preconisation: Check the antenna and connectors; the sweep uses the maximum time per point.

ORT-5510:
  gravite: avertissement
  titre: Point de mesure à puissance réduite
  message: 'Point {frequence} : puissance lue sous la moitié de la demande (poste qui se protège ?).'
  causes:
  - Protection du poste sur TOS élevé
  - Alimentation insuffisante
  preconisation: Vérifier l'antenne à cette fréquence ; le TOS lu y est peu fiable.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - reduced
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5510/
  depuis_version: 0.123.0
  en:
    titre: Sweep point at reduced power
    message: 'Point {frequence}: power read below half of the request (rig protecting itself?).'
    causes:
    - Rig protection on high SWR
    - Insufficient power supply
    preconisation: Check the antenna at this frequency; the SWR read there is unreliable.

ORT-5511:
  gravite: info
  titre: Point de mesure sans lecture du TOS
  message: 'Point {frequence} : aucune lecture du TOS.'
  causes:
  - Le poste n'a pas donné de valeur de TOS pendant l'émission du point
  preconisation: Relancer la mesure ; si cela se répète, vérifier le TOS-mètre du poste.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - unread
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5511/
  depuis_version: 0.123.0
  en:
    titre: Sweep point without SWR reading
    message: 'Point {frequence}: no SWR reading.'
    causes:
    - The rig gave no SWR value while transmitting the point
    preconisation: Restart the sweep; if it repeats, check the rig's SWR meter.

ORT-5512:
  gravite: avertissement
  titre: Remise en état du poste incomplète après la mesure
  message: 'Remise en état après la mesure de TOS : {ecarts}.'
  causes:
  - Réglage refusé ou en erreur (puissance, mode, fréquence, coupleur)
  - Valeur relue différente de celle d'avant la mesure
  - Poste pas revenu en réception confirmée
  preconisation: Remettre à la main la fréquence, le mode, la puissance et le coupleur indiqués.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5512/
  depuis_version: 0.123.0
  en:
    titre: Rig not fully restored after the sweep
    message: 'Restore after the SWR sweep: {ecarts}.'
    causes:
    - Setting refused or failed (power, mode, frequency, tuner)
    - Read-back value different from before the sweep
    - Rig not back on confirmed receive
    preconisation: Restore by hand the frequency, mode, power and tuner shown.

ORT-5801:
  gravite: avertissement
  titre: 'PTT par RTS ou DTR : risque d''émission brève'
  message: 'PTT par {methode} : l''ouverture du port peut déclencher une émission brève au démarrage ou au reset
    USB.'
  causes:
  - Interface qui commande le PTT par une ligne du port série
  - Certains pilotes série lèvent RTS/DTR à l'ouverture
  preconisation: Vérifier sur charge fictive que le démarrage de la station et un reset USB ne font pas émettre
    ; préférer le PTT par CAT si le poste le permet.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5801/
  depuis_version: 0.123.0
  en:
    titre: 'PTT by RTS or DTR: risk of a short transmission'
    message: 'PTT by {methode}: opening the port may key the radio briefly at start-up or on USB reset.'
    causes:
    - Interface keying PTT through a serial port line
    - Some serial drivers raise RTS/DTR on open
    preconisation: Check on a dummy load that station start-up and a USB reset do not key the radio; prefer CAT
      PTT if the radio supports it.

ORT-5802:
  gravite: avertissement
  titre: Contrôle des bandes désactivé
  message: 'Contrôle des bandes DÉSACTIVÉ : seul le poste empêche d''émettre hors des bandes.'
  causes:
  - enforce_bands = false choisi dans l'assistant
  - Usage CB, 45 m ou marine où l'opérateur gère lui-même les fréquences
  preconisation: Vérifier le réglage « TX limit » (ou équivalent) du poste ; l'opérateur reste responsable des fréquences
    d'émission.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5802/
  depuis_version: 0.123.0
  en:
    titre: Band checking disabled
    message: 'Band checking DISABLED: only the radio prevents transmitting out of band.'
    causes:
    - enforce_bands = false chosen in the wizard
    - CB, 45 m or marine use where the operator manages frequencies
    preconisation: Check the radio's "TX limit" (or equivalent) setting; the operator remains responsible for transmit
      frequencies.

ORT-5803:
  gravite: avertissement
  titre: Chargement d'un profil refusé pendant l'émission
  message: 'Refusé : le poste émet (ou son état est illisible). Charge le profil une fois revenu en réception.'
  causes:
  - Émission en cours par la station ou au micro du poste
  - 'Fichier d''état de la passerelle illisible (dans le doute : refus)'
  preconisation: Attendre le retour en réception puis recommencer.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5803/
  depuis_version: 0.123.0
  en:
    titre: Profile load refused while transmitting
    message: 'Refused: the radio is transmitting (or its state is unreadable). Load the profile once back in receive.'
    causes:
    - Transmission in progress from the station or the radio's own microphone
    - 'Gateway status file unreadable (when in doubt: refuse)'
    preconisation: Wait until the radio is back in receive and try again.

ORT-5804:
  gravite: avertissement
  titre: 'PTT actif pendant le test : retour en réception forcé'
  message: 'ATTENTION : le PTT était actif, retour en réception forcé.'
  causes:
  - Poste resté en émission (micro, pédale, logiciel numérique)
  - Ligne PTT de l'interface active au repos
  preconisation: Vérifier pourquoi le poste émettait avant toute émission à distance (interface, réglage USB SEND
    / Keying).
  action_auto: retour_rx
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5804/
  depuis_version: 0.123.0
  en:
    titre: 'PTT active during the test: forced back to receive'
    message: 'WARNING: PTT was active, forced back to receive.'
    causes:
    - Radio left transmitting (mic, footswitch, digital-mode software)
    - Interface PTT line active at rest
    preconisation: Find out why the radio was transmitting before any remote transmission (interface, USB SEND /
      Keying setting).

ORT-5805:
  gravite: critique
  titre: STOP TX de trx-monitor sans confirmation
  message: 'ÉCHEC : le poste n''est pas confirmé en réception (rigctld injoignable ou poste bloqué).'
  causes:
  - rigctld arrêté ou bloqué
  - Poste qui ne répond plus
  - Poste resté en émission
  preconisation: Couper l'émission sur le poste lui-même, puis vérifier rigctld et le câble.
  action_auto: retour_rx
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5805/
  depuis_version: 0.123.0
  en:
    titre: trx-monitor STOP TX not confirmed
    message: 'FAILED: the radio is not confirmed in receive (rigctld unreachable or radio stuck).'
    causes:
    - rigctld stopped or stuck
    - Radio not answering
    - Radio stuck in transmit
    preconisation: Stop the transmission on the radio itself, then check rigctld and the cable.

ORT-5806:
  gravite: erreur
  titre: Mise en page sans commande de sécurité
  message: 'Écran {ecran} : {erreur}.'
  causes:
  - Bouton PTT ou STOP absent, masqué ou placé dans un accordéon / une zone à calques
  - Deux boutons PTT sur le même écran
  preconisation: Laisser le PTT et le STOP visibles sur chaque écran, un seul PTT par écran.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - layout_invalid
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5806/
  depuis_version: 0.123.0
  en:
    titre: Layout without safety control
    message: 'Screen {ecran}: {erreur}.'
    causes:
    - PTT or STOP button missing, hidden or inside an accordion / layered area
    - Two PTT buttons on the same screen
    preconisation: Keep PTT and STOP visible on every screen, a single PTT per screen.

ORT-5901:
  gravite: erreur
  titre: 'Essai : état PTT relu incohérent'
  message: 'Cycle {n} : l''état relu sur le poste ne correspond pas aux ordres.'
  causes:
  - Relecture du PTT en cache dans rigctld
  - Méthode PTT mal choisie
  - Poste lent à passer en émission
  preconisation: Vérifier la méthode PTT (trx-setup) et lancer l'étape « coupure par le poste » de trx-hwtest ;
    ne pas émettre à distance avant correction.
  action_auto: retour_rx
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - ptt_cycle
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5901/
  depuis_version: 0.123.0
  en:
    titre: 'Test: inconsistent PTT readback'
    message: 'Cycle {n}: the state read back from the rig does not match the commands.'
    causes:
    - PTT readback cached in rigctld
    - Wrong PTT method
    - Rig slow to key
    preconisation: Check the PTT method (trx-setup) and run the "rig unkey" step of trx-hwtest; do not transmit
      remotely until fixed.

ORT-5902:
  gravite: critique
  titre: 'Essai de panne : l''émission n''a pas été coupée'
  message: 'L''ÉMISSION N''A PAS ÉTÉ COUPÉE dans le délai lors de l''essai « {essai} » : voir le superviseur.'
  causes:
  - Sécurité de la passerelle inopérante sur ce poste
  - PTT qui ne retombe pas par CAT
  - Relecture du PTT fausse
  preconisation: Ne pas utiliser ce poste à distance ; couper le poste à la main, vérifier la méthode PTT et envoyer
    le rapport d'essai.
  action_auto: retour_rx
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-5902/
  depuis_version: 0.123.0
  en:
    titre: 'Fault drill: transmission was not cut'
    message: 'TRANSMISSION WAS NOT CUT in time during the "{essai}" drill: see the supervisor.'
    causes:
    - Gateway safety ineffective on this rig
    - PTT does not drop via CAT
    - Wrong PTT readback
    preconisation: Do not use this rig remotely; unkey the rig by hand, check the PTT method and send the test report.


# ====================================================================================================
# 6000–6999 : Modules
# ====================================================================================================

ORT-6401:
  gravite: erreur
  titre: Cluster DX activé mais incomplet
  message: '[cluster] {probleme}.'
  causes:
  - Aucune source active
  - Indicatif de l'opérateur absent (obligatoire pour les clusters telnet et le RBN)
  - '« cluster » absent de [modules] run : le module ne serait jamais lancé'
  preconisation: Compléter par TRX Console, menu 12 (sources, indicatif) et ajouter « cluster » à [modules] run.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6401/
  depuis_version: 0.123.0
  en:
    titre: DX cluster enabled but incomplete
    message: '[cluster] {probleme}.'
    causes:
    - No active source
    - Operator callsign missing (required for telnet clusters and RBN)
    - '"cluster" missing from [modules] run: the module would never start'
    preconisation: Complete it with TRX Console, menu 12 (sources, callsign) and add "cluster" to [modules] run.

ORT-6402:
  gravite: avertissement
  titre: Serveur de spots injoignable
  message: 'Cluster DX : {source} ({adresse}) injoignable ({detail}), nouvel essai dans {delai_s} s.'
  causes:
  - Pas d'accès à Internet depuis la station
  - Serveur arrêté ou adresse / port faux
  - Pare-feu sortant
  preconisation: Vérifier l'accès à Internet de la station et l'adresse de la source (menu Cluster DX) ; la station
    réessaie seule (10 s à 5 min).
  action_auto: nouvel_essai
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - unreachable
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6402/
  depuis_version: 0.123.0
  en:
    titre: Spot server unreachable
    message: 'DX cluster: {source} ({adresse}) unreachable ({detail}), retry in {delai_s} s.'
    causes:
    - No Internet access from the station
    - Server down or wrong address / port
    - Outgoing firewall
    preconisation: Check the station Internet access and the source address (DX Cluster menu); the station retries
      by itself (10 s to 5 min).

ORT-6403:
  gravite: info
  titre: Connexion au cluster fermée par le serveur
  message: 'Cluster DX : {source} a fermé la connexion, reconnexion dans {delai_s} s.'
  causes:
  - Redémarrage ou maintenance du serveur
  - Coupure réseau passagère
  preconisation: 'Aucune : la station se reconnecte seule.'
  action_auto: nouvel_essai
  ntfy_defaut: false
  priorite_ntfy: 2
  codes_machine:
  - closed
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6403/
  depuis_version: 0.123.0
  en:
    titre: Cluster connection closed by the server
    message: 'DX cluster: {source} closed the connection, reconnecting in {delai_s} s.'
    causes:
    - Server restart or maintenance
    - Temporary network loss
    preconisation: 'None: the station reconnects by itself.'

ORT-6404:
  gravite: avertissement
  titre: Connexion au cluster muette
  message: 'Cluster DX : {source} n''envoie plus rien depuis 5 min (connexion morte), reconnexion.'
  causes:
  - Liaison coupée sans fermeture propre (box, VPN, NAT)
  - Serveur figé
  preconisation: Aucune si cela reste rare ; sinon vérifier la stabilité du réseau de la station.
  action_auto: nouvel_essai
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - idle
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6404/
  depuis_version: 0.123.0
  en:
    titre: Silent cluster connection
    message: 'DX cluster: {source} has sent nothing for 5 min (dead connection), reconnecting.'
    causes:
    - Link dropped without a clean close (router, VPN, NAT)
    - Server frozen
    preconisation: None if rare; otherwise check the station network stability.

ORT-6405:
  gravite: erreur
  titre: Indicatif refusé par le cluster
  message: 'Cluster DX : indicatif refusé par {source} ({detail}) ; source abandonnée jusqu''au redémarrage.'
  causes:
  - Indicatif mal saisi ou non reconnu par le serveur
  - Indicatif banni ou déjà connecté ailleurs
  - Indicatif invalide dans la configuration
  preconisation: Corriger l'indicatif dans le menu Cluster DX ; la source n'est plus réessayée pour éviter un bannissement.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - callsign_refused
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6405/
  depuis_version: 0.123.0
  en:
    titre: Callsign refused by the cluster
    message: 'DX cluster: callsign refused by {source} ({detail}); source dropped until restart.'
    causes:
    - Callsign mistyped or not recognised by the server
    - Callsign banned or already connected elsewhere
    - Invalid callsign in the configuration
    preconisation: Fix the callsign in the DX Cluster menu; the source is no longer retried to avoid a ban.

ORT-6406:
  gravite: erreur
  titre: Mot de passe refusé par le cluster
  message: 'Cluster DX : mot de passe refusé par {source} ; source abandonnée jusqu''au redémarrage.'
  causes:
  - Mot de passe faux ou changé sur le serveur
  preconisation: Corriger le mot de passe de la source dans le menu Cluster DX (enregistré dans secrets.toml), puis
    redémarrer.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - password_refused
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6406/
  depuis_version: 0.123.0
  en:
    titre: Password refused by the cluster
    message: 'DX cluster: password refused by {source}; source dropped until restart.'
    causes:
    - Wrong password or changed on the server
    preconisation: Fix the source password in the DX Cluster menu (stored in secrets.toml), then restart.

ORT-6407:
  gravite: erreur
  titre: Le cluster demande un mot de passe
  message: 'Cluster DX : {source} demande un mot de passe et aucun n''est enregistré ; source abandonnée.'
  causes:
  - Serveur réservé aux membres
  - Mot de passe absent de secrets.toml
  preconisation: Enregistrer le mot de passe de la source dans le menu Cluster DX, ou choisir un autre serveur.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - password_required
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6407/
  depuis_version: 0.123.0
  en:
    titre: The cluster asks for a password
    message: 'DX cluster: {source} asks for a password and none is stored; source dropped.'
    causes:
    - Members-only server
    - Password missing from secrets.toml
    preconisation: Store the source password in the DX Cluster menu, or pick another server.

ORT-6408:
  gravite: avertissement
  titre: Bascule vers un autre cluster
  message: 'Cluster DX : {source} a échoué {n} fois de suite, bascule vers {source_suivante}.'
  causes:
  - Serveur instable ou injoignable
  preconisation: Aucune si un autre cluster prend le relais ; vérifier l'ordre des sources si cela se répète.
  action_auto: repli_source_suivante
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - failed
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6408/
  depuis_version: 0.123.0
  en:
    titre: Switching to another cluster
    message: 'DX cluster: {source} failed {n} times in a row, switching to {source_suivante}.'
    causes:
    - Unstable or unreachable server
    preconisation: None if another cluster takes over; check the source order if it keeps happening.

ORT-6409:
  gravite: avertissement
  titre: Aucune source du Cluster DX connectée
  message: 'Cluster DX : {etat}.'
  causes:
  - Toutes les sources injoignables ou refusées
  - Pas d'accès à Internet
  - Aucun spot reçu depuis 15 min (pastille orange)
  preconisation: Voir l'état de chaque source dans la rubrique Cluster DX de la page ou dans trx-monitor ; vérifier
    Internet et les indicatifs.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - red
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6409/
  depuis_version: 0.123.0
  en:
    titre: No DX cluster source connected
    message: 'DX cluster: {etat}.'
    causes:
    - All sources unreachable or refused
    - No Internet access
    - No spot received for 15 min (orange dot)
    preconisation: Check each source state in the DX Cluster section of the page or in trx-monitor; check Internet
      and callsigns.

ORT-6410:
  gravite: avertissement
  titre: Page des spots CB illisible
  message: 'Cluster DX : la page de {source} est illisible ({detail}) ; nouvel essai dans {delai_s} s.'
  causes:
  - Le site clusterdx.org a changé sa page
  - Page trop grosse ou réponse incomplète
  preconisation: Mettre à jour la station ; si le défaut persiste, le signaler (rapport de problème).
  action_auto: nouvel_essai
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - format
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6410/
  depuis_version: 0.123.0
  en:
    titre: CB spot page unreadable
    message: 'DX cluster: the page of {source} is unreadable ({detail}); retry in {delai_s} s.'
    causes:
    - The clusterdx.org site changed its page
    - Page too large or incomplete reply
    preconisation: Update the station; if it persists, report it (problem report).

ORT-6411:
  gravite: avertissement
  titre: Table des pays (cty.dat) absente ou illisible
  message: 'Cluster DX : {fichier} absent ou illisible : pays et continents inconnus ; filtre de continent inopérant.'
  causes:
  - Premier démarrage sans accès à Internet
  - Fichier abîmé ou incomplet
  preconisation: Laisser la station le télécharger (accès Internet) ou le mettre à jour depuis le menu Cluster DX.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6411/
  depuis_version: 0.123.0
  en:
    titre: Country table (cty.dat) missing or unreadable
    message: 'DX cluster: {fichier} missing or unreadable: countries and continents unknown; continent filter inactive.'
    causes:
    - First start without Internet access
    - Damaged or incomplete file
    preconisation: Let the station download it (Internet access) or update it from the DX Cluster menu.

ORT-6412:
  gravite: info
  titre: Mise à jour de cty.dat impossible
  message: 'Cluster DX : mise à jour de cty.dat impossible ({detail}) ; l''ancienne table est gardée.'
  causes:
  - Pas d'accès à Internet
  - Site de cty.dat indisponible
  - Téléchargement incomplet ou trop gros
  preconisation: Aucune immédiate ; la mise à jour sera retentée (toutes les 6 h).
  action_auto: nouvel_essai
  ntfy_defaut: false
  priorite_ntfy: 2
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6412/
  depuis_version: 0.123.0
  en:
    titre: cty.dat update failed
    message: 'DX cluster: cty.dat update failed ({detail}); the old table is kept.'
    causes:
    - No Internet access
    - cty.dat site unavailable
    - Incomplete or oversized download
    preconisation: Nothing right now; the update is retried (every 6 h).

ORT-6413:
  gravite: info
  titre: Indicatif refusé par le réglage du Cluster DX
  message: 'Indicatif refusé : {detail}.'
  causes:
  - Indicatif vide ou de forme invalide
  - Mot de passe vide, trop long ou avec un caractère de contrôle
  preconisation: Saisir votre indicatif radioamateur (ex. F4XXX) ; il est le seul envoyé aux clusters.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 2
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6413/
  depuis_version: 0.123.0
  en:
    titre: Callsign refused by the DX cluster setup
    message: 'Callsign refused: {detail}.'
    causes:
    - Empty or malformed callsign
    - Password empty, too long or with a control character
    preconisation: Enter your amateur callsign (e.g. F4XXX); it is the only thing sent to clusters.

ORT-6501:
  gravite: erreur
  titre: Module extérieur déclaré mais absent ou non démarré
  message: Le module {module} est déclaré mais ne répond pas ou n'a pas démarré ({detail}).
  causes:
  - Module non installé, ou programme introuvable au chemin réglé
  - Module arrêté, ou lancement impossible (droits, dépendance manquante)
  - Adresse ou port du module faux dans station.toml
  preconisation: Vérifier que le module est installé et lancé, et que son chemin ou son adresse dans station.toml
    sont justes ; consulter son journal.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - freedv_missing
  - state.freedv.cause
  - module_absent
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6501/
  depuis_version: 0.123.0
  en:
    titre: External module declared but missing or not started
    message: Module {module} is declared but does not answer or did not start ({detail}).
    causes:
    - Module not installed, or program not found at the configured path
    - Module stopped, or could not be started (permissions, missing dependency)
    - Wrong module address or port in station.toml
    preconisation: Check that the module is installed and running and that its path or address in station.toml is
      right; read its log.

ORT-6502:
  gravite: erreur
  titre: Version du module incompatible
  message: Le module {module} parle la version {version_module}, la station attend {version_attendue}.
  causes:
  - Module plus ancien ou plus récent que la station
  - Mise à jour faite d'un seul côté
  preconisation: Mettre à jour le module ou openRemoteTRX pour qu'ils parlent la même version.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - breizh_event refused (proto)
  - api
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6502/
  depuis_version: 0.123.0
  en:
    titre: Incompatible module version
    message: Module {module} speaks version {version_module}, the station expects {version_attendue}.
    causes:
    - Module older or newer than the station
    - Only one side was updated
    preconisation: Update the module or openRemoteTRX so that both speak the same version.

ORT-6503:
  gravite: erreur
  titre: Échec de la négociation avec le module
  message: 'La négociation avec le module {module} a échoué : {motif}.'
  causes:
  - Clé d'appairage ou jeton différents des deux côtés
  - Format audio, latence ou paramètres d'interface refusés
  - Socket, port ou périphérique audio mal réglés
  preconisation: Vérifier la configuration d'interface (clé, socket, port, périphérique audio) des deux côtés, puis
    refaire l'appairage si besoin.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - breizh_event refused (format
  - latency)
  - auth
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6503/
  depuis_version: 0.123.0
  en:
    titre: Negotiation with the module failed
    message: 'Negotiation with module {module} failed: {motif}.'
    causes:
    - Pairing key or token differs on the two sides
    - Audio format, latency or interface parameters refused
    - Wrong socket, port or audio device settings
    preconisation: Check the interface settings (key, socket, port, audio device) on both sides, then pair again
      if needed.

ORT-6504:
  gravite: avertissement
  titre: Le module ne répond plus (battement perdu)
  message: Le module {module} ne répond plus depuis {duree_s} s.
  causes:
  - Module planté ou gelé
  - Machine du module surchargée
  - Réseau coupé entre la station et le module
  preconisation: Consulter le journal du module ; il est relancé par la station quand c'est prévu, sinon le redémarrer.
  action_auto: repli_direct
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - breizh_event lost
  - state.freedv.cause
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6504/
  depuis_version: 0.123.0
  en:
    titre: Module no longer answers (heartbeat lost)
    message: Module {module} has not answered for {duree_s} s.
    causes:
    - Module crashed or frozen
    - Module host overloaded
    - Network cut between the station and the module
    preconisation: Read the module log; the station restarts it when this is planned, otherwise restart it.

ORT-6505:
  gravite: avertissement
  titre: Catalogue du module invalide ou non traduit
  message: Le catalogue d'erreurs du module {module} est invalide ({motif}) ; ses événements sont affichés en texte
    brut.
  causes:
  - Fichier <PREFIXE>-catalog.yaml absent, mal formé ou incomplet
  - Entrée sans traduction anglaise
  preconisation: Signaler le défaut à l'auteur du module.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 2
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6505/
  depuis_version: 0.123.0
  en:
    titre: Module catalogue invalid or untranslated
    message: The error catalogue of module {module} is invalid ({motif}); its events are shown as raw text.
    causes:
    - <PREFIX>-catalog.yaml file missing, malformed or incomplete
    - Entry without an English translation
    preconisation: Report the problem to the module author.

ORT-6506:
  gravite: avertissement
  titre: Code reçu absent du catalogue du module
  message: Le module {module} a envoyé le code {code_module}, absent de son catalogue.
  causes:
  - Catalogue du module plus ancien que le module lui-même
  preconisation: Mettre à jour le catalogue du module.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 2
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6506/
  depuis_version: 0.123.0
  en:
    titre: Received code missing from the module catalogue
    message: Module {module} sent code {code_module}, which is not in its catalogue.
    causes:
    - Module catalogue older than the module itself
    preconisation: Update the module catalogue.

ORT-6507:
  gravite: erreur
  titre: Le module perturbe la station (CPU, latence audio)
  message: 'Le module {module} perturbe la station : {motif}.'
  causes:
  - Module trop gourmand en processeur ou en mémoire
  - Module trop lent à lire ses messages
  - Machine trop petite pour les modules lancés
  preconisation: Le module est isolé ou arrêté ; réduire sa charge ou le lancer sur une autre machine.
  action_auto: arreter_module
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6507/
  depuis_version: 0.123.0
  en:
    titre: Module disturbs the station (CPU, audio latency)
    message: 'Module {module} disturbs the station: {motif}.'
    causes:
    - Module uses too much CPU or memory
    - Module too slow to read its messages
    - Host too small for the modules that run on it
    preconisation: The module is isolated or stopped; reduce its load or run it on another machine.

ORT-6508:
  gravite: avertissement
  titre: Préfixe non enregistré
  message: Le module {module} utilise le préfixe {prefixe}, absent du registre des modules.
  causes:
  - Module de tiers pas encore déclaré dans errors/modules.yaml
  preconisation: Déclarer le module dans le registre des préfixes.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 2
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6508/
  depuis_version: 0.123.0
  en:
    titre: Unregistered prefix
    message: Module {module} uses prefix {prefixe}, which is not in the module registry.
    causes:
    - Third-party module not yet declared in errors/modules.yaml
    preconisation: Declare the module in the prefix registry.

ORT-6511:
  gravite: avertissement
  titre: Manifeste de module invalide
  message: 'Le module {module} est ignoré : {probleme}.'
  causes:
  - manifest.toml mal écrit ou TOML invalide
  - Valeur hors limites (cpu_quota, memory_max_mb, nice, ports)
  - Événement ou commande inconnus de cette version de la station
  - Module déclaré deux fois, ou module du dossier supplémentaire portant le nom d'un module fourni
  preconisation: Corriger le manifeste du module (ou mettre à jour le module) ; les autres modules continuent de
    tourner.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6511/
  depuis_version: 0.123.0
  en:
    titre: Invalid module manifest
    message: 'Module {module} ignored: {probleme}.'
    causes:
    - Badly written manifest.toml or invalid TOML
    - Value out of range (cpu_quota, memory_max_mb, nice, ports)
    - Event or command unknown to this station version
    - Module declared twice, or an extra module using the name of a built-in one
    preconisation: Fix the module manifest (or update the module); other modules keep running.

ORT-6512:
  gravite: info
  titre: Module désactivé par son manifeste
  message: 'Le module « {module} » est désactivé par son manifeste : il n''est pas lancé.'
  causes:
  - Le manifeste porte start = "disabled"
  preconisation: Retirer le module de [modules] run, ou utiliser une version du module qui peut être lancée.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 2
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6512/
  depuis_version: 0.123.0
  en:
    titre: Module disabled by its manifest
    message: 'Module "{module}" is disabled by its manifest: not started.'
    causes:
    - The manifest says start = "disabled"
    preconisation: Remove the module from [modules] run, or use a version of the module that can be started.

ORT-6513:
  gravite: avertissement
  titre: Aucun module utilisable
  message: 'Aucun module utilisable : le bus des modules n''est pas démarré.'
  causes:
  - Tous les modules de [modules] run sont invalides, introuvables ou désactivés
  preconisation: Lire les avertissements précédents (un par module) et corriger [modules] run ou les manifestes.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6513/
  depuis_version: 0.123.0
  en:
    titre: No usable module
    message: 'No usable module: the module bus is not started.'
    causes:
    - Every module in [modules] run is invalid, missing or disabled
    preconisation: Read the previous warnings (one per module) and fix [modules] run or the manifests.

ORT-6514:
  gravite: erreur
  titre: Bus des modules indisponible
  message: 'Modules indisponibles ({detail}) : la station fonctionne sans eux.'
  causes:
  - Port du bus ({port}) déjà occupé sur 127.0.0.1 (autre passerelle, autre logiciel)
  - Clé des modules illisible
  - Dossier d'état non inscriptible
  preconisation: Vérifier qu'une seule passerelle tourne et que [modules] bus_port est libre ; redémarrer la station.
    La radio fonctionne sans les modules (cluster DX, présence…).
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6514/
  depuis_version: 0.123.0
  en:
    titre: Module bus unavailable
    message: 'Modules unavailable ({detail}): the station runs without them.'
    causes:
    - Bus port ({port}) already in use on 127.0.0.1 (another gateway or program)
    - Module key unreadable
    - State folder not writable
    preconisation: Make sure only one gateway is running and [modules] bus_port is free; restart the station. The
      radio works without modules (DX cluster, presence…).

ORT-6515:
  gravite: erreur
  titre: Clé des modules invalide
  message: '{fichier} : clé des modules invalide. Supprimer le fichier pour en générer une nouvelle.'
  causes:
  - Fichier modules.key tronqué ou abîmé (disque plein, copie partielle)
  - Fichier remplacé par un autre
  preconisation: 'Arrêter la station, supprimer le fichier de clé indiqué puis redémarrer : une nouvelle clé est
    créée et les modules se reconnectent.'
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6515/
  depuis_version: 0.123.0
  en:
    titre: Invalid module key
    message: '{fichier}: invalid module key. Delete the file to generate a new one.'
    causes:
    - modules.key truncated or damaged (full disk, partial copy)
    - File replaced by another one
    preconisation: 'Stop the station, delete the key file shown, then restart: a new key is created and modules
      reconnect.'

ORT-6516:
  gravite: erreur
  titre: Compte d'exécution des modules inutilisable
  message: 'Le superviseur est root et le compte « {compte} » est inutilisable ({detail}) : module {module} non
    lancé (jamais en root).'
  causes:
  - '[modules] run_as vide, égal à root ou compte inexistant (Debian / Pi)'
  - Compte supprimé après l'installation
  preconisation: Indiquer dans [modules] run_as le compte de la station créé par l'installation (ou relancer install.sh),
    puis réactiver le module.
  action_auto: refus
  ntfy_defaut: true
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6516/
  depuis_version: 0.123.0
  en:
    titre: Module run account unusable
    message: 'The supervisor runs as root and account "{compte}" is unusable ({detail}): module {module} not started
      (never as root).'
    causes:
    - '[modules] run_as empty, root, or missing account (Debian / Pi)'
    - Account deleted after installation
    preconisation: Set [modules] run_as to the station account created by the installer (or rerun install.sh), then
      re-enable the module.

ORT-6517:
  gravite: avertissement
  titre: Arrêt inattendu d'un module
  message: 'Module {module} : arrêt inattendu (code {code_sortie}), relance dans {delai_s} s.'
  causes:
  - Erreur dans le module (voir son journal)
  - Fichier du module illisible au démarrage (clés de présence, configuration)
  - Mémoire insuffisante
  preconisation: Lire le journal du module (cluster.log, presence.log dans le dossier d'état). Le superviseur le
    relance avec un délai croissant (1 s à 30 s).
  action_auto: nouvel_essai
  ntfy_defaut: true
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6517/
  depuis_version: 0.123.0
  en:
    titre: Unexpected module stop
    message: 'Module {module}: unexpected stop (exit code {code_sortie}), restart in {delai_s} s.'
    causes:
    - Error inside the module (see its log)
    - Module file unreadable at start (presence keys, configuration)
    - Not enough memory
    preconisation: Read the module log (cluster.log, presence.log in the state folder). The supervisor restarts
      it with a growing delay (1 s to 30 s).

ORT-6518:
  gravite: avertissement
  titre: Message illisible d'un module
  message: 'Module {module} : message illisible ignoré ({detail}).'
  causes:
  - Module d'une autre version
  - Message trop long ou JSON abîmé
  preconisation: Mettre à jour le module ; signaler à son auteur si le message revient.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 2
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6518/
  depuis_version: 0.123.0
  en:
    titre: Unreadable module message
    message: 'Module {module}: unreadable message ignored ({detail}).'
    causes:
    - Module from another version
    - Message too long or damaged JSON
    preconisation: Update the module; report to its author if it keeps happening.

ORT-6519:
  gravite: avertissement
  titre: Station injoignable depuis un module
  message: 'Module {module} : station injoignable ({detail}), nouvel essai dans {delai_s} s.'
  causes:
  - Passerelle arrêtée ou en redémarrage
  - Bus des modules non démarré (voir entrée « Bus des modules indisponible »)
  preconisation: Rien à faire si la passerelle redémarre ; sinon vérifier qu'elle tourne (trx-monitor) et lire son
    journal.
  action_auto: nouvel_essai
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6519/
  depuis_version: 0.123.0
  en:
    titre: Station unreachable from a module
    message: 'Module {module}: station unreachable ({detail}), retry in {delai_s} s.'
    causes:
    - Gateway stopped or restarting
    - Module bus not started (see "Module bus unavailable")
    preconisation: Nothing to do if the gateway is restarting; otherwise check it is running (trx-monitor) and read
      its log.

ORT-6520:
  gravite: info
  titre: Commande de module refusée pendant l'émission
  message: 'Commande {commande} du module {module} refusée : le poste est en émission.'
  causes:
  - Le module demande un changement de fréquence (QSY) pendant une émission
  preconisation: 'Aucune : la commande pourra être refaite en réception.'
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 2
  codes_machine:
  - ptt_active
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6520/
  depuis_version: 0.123.0
  en:
    titre: Module command refused while transmitting
    message: 'Command {commande} from module {module} refused: the radio is transmitting.'
    causes:
    - The module asks for a frequency change (QSY) during a transmission
    preconisation: 'None: the command can be sent again once back in receive.'

ORT-6521:
  gravite: avertissement
  titre: Action d'un module non autorisée
  message: 'Module {module} : {action} non autorisé par son manifeste.'
  causes:
  - Le manifeste du module ne déclare pas ce droit (commandes, messages vers les clients, jetons, commandes des
    clients)
  - Module modifié sans mise à jour du manifeste
  preconisation: Mettre à jour le module ; ne donner un droit dans le manifeste qu'à un module de confiance.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - forbidden
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6521/
  depuis_version: 0.123.0
  en:
    titre: Module action not allowed
    message: 'Module {module}: {action} not allowed by its manifest.'
    causes:
    - The module manifest does not declare this right (commands, client messages, tokens, client commands)
    - Module changed without updating its manifest
    preconisation: Update the module; only grant a right in the manifest to a trusted module.

ORT-6522:
  gravite: info
  titre: Commande non disponible
  message: '{commande} : non disponible ({detail}).'
  causes:
  - Opération inconnue de cette version de la station
  - Le module ne reçoit pas de commandes
  - Aucune commande du poste disponible pour les modules
  preconisation: Mettre à jour le module ou la station pour qu'ils aient la même version.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 2
  codes_machine:
  - unavailable
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6522/
  depuis_version: 0.123.0
  en:
    titre: Command unavailable
    message: '{commande}: unavailable ({detail}).'
    causes:
    - Operation unknown to this station version
    - The module does not accept commands
    - No radio command available to modules
    preconisation: Update the module or the station so they are the same version.

ORT-6523:
  gravite: info
  titre: Trop de messages d'un module
  message: 'Module {module} : trop de messages vers les clients, réessayer plus tard.'
  causes:
  - Le module envoie plus de messages que le débit permis
  preconisation: Aucune si c'est passager ; sinon signaler à l'auteur du module.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 2
  codes_machine:
  - rate_limited
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6523/
  depuis_version: 0.123.0
  en:
    titre: Too many messages from a module
    message: 'Module {module}: too many messages to clients, try again later.'
    causes:
    - The module sends more messages than the allowed rate
    preconisation: None if temporary; otherwise report to the module author.

ORT-6524:
  gravite: avertissement
  titre: Délai de réponse dépassé entre la station et un module
  message: '{cote} n''a pas répondu à temps ({delai_s} s).'
  causes:
  - Module bloqué ou surchargé
  - Relais distant lent (présence de groupe)
  - Station surchargée
  preconisation: Réessayer ; si le délai revient, lire le journal du module et la charge de la machine.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - timeout
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6524/
  depuis_version: 0.123.0
  en:
    titre: Response timeout between the station and a module
    message: '{cote} did not answer in time ({delai_s} s).'
    causes:
    - Module stuck or overloaded
    - Slow remote relay (group presence)
    - Station overloaded
    preconisation: Try again; if it keeps happening, read the module log and the machine load.

ORT-6525:
  gravite: avertissement
  titre: Changement de fréquence demandé par un module refusé
  message: 'QSY demandé par le module {module} refusé ({raison}) : {detail}.'
  causes:
  - Fréquence ou mode invalide
  - Hors des bandes autorisées, ou poste pas en réception confirmée
  - Poste ou rigctld injoignable (cat_down) ou erreur du poste (rig_error)
  preconisation: Vérifier la fréquence demandée et les bandes de station.toml ; pour cat_down / rig_error, voir
    les erreurs CAT de la station.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - invalid
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6525/
  depuis_version: 0.123.0
  en:
    titre: Frequency change requested by a module refused
    message: 'QSY requested by module {module} refused ({raison}): {detail}.'
    causes:
    - Invalid frequency or mode
    - Outside allowed bands, or radio not in confirmed receive
    - Radio or rigctld unreachable (cat_down) or radio error (rig_error)
    preconisation: Check the requested frequency and the bands in station.toml; for cat_down / rig_error, see the
      station CAT errors.

ORT-6526:
  gravite: avertissement
  titre: Jeton de session refusé
  message: Jeton présenté au module {module} refusé ({motif}).
  causes:
  - Jeton expiré ou session fermée
  - Jeton mal formé ou signature fausse (tentative d'usurpation possible)
  preconisation: Se reconnecter à la station ; si des signatures fausses se répètent, vérifier qui accède au module.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - token_expired
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6526/
  depuis_version: 0.123.0
  en:
    titre: Session token refused
    message: Token presented to module {module} refused ({motif}).
    causes:
    - Token expired or session closed
    - Malformed token or bad signature (possible spoofing attempt)
    preconisation: Reconnect to the station; if bad signatures keep appearing, check who is accessing the module.

ORT-6527:
  gravite: erreur
  titre: Erreur inattendue dans le bus des modules
  message: 'Erreur inattendue ({contexte}) : {detail}. La station continue.'
  causes:
  - Défaut du logiciel (station ou module)
  preconisation: Faire un rapport de problème (menu 8 de TRX Console) avec le journal ; la surveillance de l'émission
    n'est jamais interrompue.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - internal
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6527/
  depuis_version: 0.123.0
  en:
    titre: Unexpected error in the module bus
    message: 'Unexpected error ({contexte}): {detail}. The station carries on.'
    causes:
    - Software defect (station or module)
    preconisation: Send a problem report (TRX Console menu 8) with the log; transmit monitoring is never interrupted.

ORT-6528:
  gravite: avertissement
  titre: Fichier d'un module non écrit
  message: '{module} : {fichier} non écrit ({detail}).'
  causes:
  - Disque plein
  - Droits insuffisants sur le dossier d'état (compte des modules)
  preconisation: Vérifier la place libre et les droits du dossier d'état de la station ; le module continue mais
    le diagnostic (trx-monitor, console) peut être en retard.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6528/
  depuis_version: 0.123.0
  en:
    titre: Module file not written
    message: '{module}: {fichier} not written ({detail}).'
    causes:
    - Disk full
    - Insufficient rights on the state folder (module account)
    preconisation: Check free space and rights on the station state folder; the module carries on but diagnostics
      (trx-monitor, console) may lag.

ORT-6531:
  gravite: erreur
  titre: Clé d'appairage de Breizh Audio Box inutilisable
  message: 'Breizh Audio Box NON utilisé (émissions en direct) : {probleme}.'
  causes:
  - Fichier breizh.key absent (clé jamais créée)
  - Fichier illisible par le compte de la station
  - Fichier lisible par tous les comptes (droits 0640 ou 0600 attendus)
  - Clé mal formée (43 caractères attendus)
  preconisation: Créer ou recopier la clé d'appairage avec TRX Console (menu 22) et la même clé dans Breizh Audio
    Box ; corriger les droits du fichier.
  action_auto: repli_direct
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6531/
  depuis_version: 0.123.0
  en:
    titre: Breizh Audio Box pairing key unusable
    message: 'Breizh Audio Box NOT used (direct transmissions): {probleme}.'
    causes:
    - breizh.key missing (key never created)
    - File unreadable by the station account
    - File readable by every account (0640 or 0600 expected)
    - Malformed key (43 characters expected)
    preconisation: Create or copy the pairing key with TRX Console (menu 22) and put the same key in Breizh Audio
      Box; fix the file permissions.

ORT-6532:
  gravite: info
  titre: Breizh Audio Box a quitté le mode OpenRemoteTRX
  message: 'Breizh a quitté le mode OpenRemoteTRX ({motif}) : émissions en direct.'
  causes:
  - Mode OpenRemoteTRX désactivé dans Breizh Audio Box
  - Breizh Audio Box fermé proprement
  preconisation: Réactiver le mode OpenRemoteTRX dans Breizh Audio Box si voulu.
  action_auto: repli_direct
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - breizh_event lost
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6532/
  depuis_version: 0.123.0
  en:
    titre: Breizh Audio Box left OpenRemoteTRX mode
    message: 'Breizh left OpenRemoteTRX mode ({motif}): transmissions go direct.'
    causes:
    - OpenRemoteTRX mode switched off in Breizh Audio Box
    - Breizh Audio Box closed cleanly
    preconisation: Switch OpenRemoteTRX mode back on in Breizh Audio Box if wanted.

ORT-6533:
  gravite: avertissement
  titre: 'Repli pendant l''émission : fin en direct'
  message: 'Breizh ne répond plus depuis {lost_ms} ms : fin de l''émission en direct, gain {gain_db} dB.'
  causes:
  - Breizh Audio Box trop lent ou arrêté pendant l'émission
  - Gigue du réseau local (Wi-Fi)
  - Réglages block_timeout_ms / lost_ms trop serrés pour ce réseau
  preconisation: Relier les deux PC en filaire ; si les replis se répètent, augmenter [breizh] block_timeout_ms
    et lost_ms. Réactivation automatique après reactivate_after_s, ou « Réactiver ».
  action_auto: repli_direct
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - breizh_event fallback
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6533/
  depuis_version: 0.123.0
  en:
    titre: 'Fallback during transmission: rest goes direct'
    message: 'Breizh has not answered for {lost_ms} ms: rest of the transmission goes direct, gain {gain_db} dB.'
    causes:
    - Breizh Audio Box too slow or stopped during the transmission
    - LAN jitter (Wi-Fi)
    - block_timeout_ms / lost_ms too tight for this network
    preconisation: Wire both PCs; if fallbacks repeat, raise [breizh] block_timeout_ms and lost_ms. Automatic reactivation
      after reactivate_after_s, or "Reactivate".

ORT-6534:
  gravite: info
  titre: Blocs de son revenus trop tard de Breizh Audio Box
  message: '{n} blocs de son remplacés par le son d''origine pendant l''émission (retour de Breizh trop tardif).'
  causes:
  - Traitement de Breizh plus long que block_timeout_ms
  - Gigue du réseau local
  preconisation: Relier les PC en filaire ou augmenter [breizh] block_timeout_ms.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - state.breizh.late
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6534/
  depuis_version: 0.123.0
  en:
    titre: Audio blocks returned too late by Breizh Audio Box
    message: '{n} audio blocks replaced by the original audio during the transmission (Breizh return too late).'
    causes:
    - Breizh processing longer than block_timeout_ms
    - LAN jitter
    preconisation: Wire the PCs or raise [breizh] block_timeout_ms.

ORT-6535:
  gravite: erreur
  titre: Mode OpenRemoteTRX non activé dans Breizh Audio Box
  message: 'Liaison refusée : mode OpenRemoteTRX non activé dans Breizh (nouvel essai dans 60 s).'
  causes:
  - Breizh Audio Box tourne mais son mode OpenRemoteTRX est coupé
  preconisation: Activer le mode OpenRemoteTRX dans Breizh Audio Box.
  action_auto: repli_direct
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - breizh_event refused (mode_off)
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6535/
  depuis_version: 0.123.0
  en:
    titre: OpenRemoteTRX mode not enabled in Breizh Audio Box
    message: 'Link refused: OpenRemoteTRX mode not enabled in Breizh (retry in 60 s).'
    causes:
    - Breizh Audio Box is running but its OpenRemoteTRX mode is off
    preconisation: Enable OpenRemoteTRX mode in Breizh Audio Box.

ORT-6536:
  gravite: avertissement
  titre: Breizh Audio Box sert déjà une autre station
  message: 'Liaison refusée : Breizh sert déjà une autre station (nouvel essai dans 60 s).'
  causes:
  - Une autre station OpenRemoteTRX utilise ce Breizh Audio Box
  - Ancienne session de cette station pas encore expirée chez Breizh
  preconisation: Arrêter l'autre station ou utiliser un autre Breizh Audio Box ; attendre une minute après un redémarrage.
  action_auto: repli_direct
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - breizh_event refused (busy)
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6536/
  depuis_version: 0.123.0
  en:
    titre: Breizh Audio Box already serving another station
    message: 'Link refused: Breizh is already serving another station (retry in 60 s).'
    causes:
    - Another OpenRemoteTRX station is using this Breizh Audio Box
    - Previous session of this station not yet expired on Breizh
    preconisation: Stop the other station or use another Breizh Audio Box; wait a minute after a restart.

ORT-6537:
  gravite: erreur
  titre: Breizh Audio Box n'a pas coupé son CAT
  message: 'Liaison refusée : Breizh n''a pas coupé son CAT (nouvel essai dans 60 s).'
  causes:
  - 'Breizh Audio Box pilote encore le poste par CAT : deux logiciels se disputeraient le poste'
  preconisation: 'Couper le CAT dans Breizh Audio Box : seule la station commande le poste.'
  action_auto: repli_direct
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - breizh_event refused (cat_on)
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6537/
  depuis_version: 0.123.0
  en:
    titre: Breizh Audio Box did not disable its CAT
    message: 'Link refused: Breizh has not disabled its CAT (retry in 60 s).'
    causes:
    - 'Breizh Audio Box still controls the rig by CAT: two programs would fight over the rig'
    preconisation: 'Disable CAT in Breizh Audio Box: only the station controls the rig.'

ORT-6538:
  gravite: erreur
  titre: Réponse de Breizh Audio Box mal formée
  message: 'Liaison refusée : réponse de Breizh mal formée ({motif}) (nouvel essai dans 60 s).'
  causes:
  - Défaut de Breizh Audio Box (nonce, JSON ou code d'erreur inconnu)
  - Versions de développement incompatibles
  preconisation: Mettre à jour Breizh Audio Box et signaler le défaut à son auteur avec le journal Breizh (TRX Console
    menu 22).
  action_auto: repli_direct
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - breizh_event refused (nonce
  - json
  - code)
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6538/
  depuis_version: 0.123.0
  en:
    titre: Malformed reply from Breizh Audio Box
    message: 'Link refused: malformed reply from Breizh ({motif}) (retry in 60 s).'
    causes:
    - Breizh Audio Box defect (nonce, JSON or unknown error code)
    - Incompatible development versions
    preconisation: Update Breizh Audio Box and report the defect to its author with the Breizh log (TRX Console
      menu 22).

ORT-6539:
  gravite: avertissement
  titre: Paquets de Breizh Audio Box refusés
  message: '{n} paquet(s) refusé(s) en une minute ({motifs}).'
  causes:
  - Clé d'appairage différente des deux côtés (tag)
  - Autre appareil qui envoie vers le port de la station (foreign)
  - Paquets rejoués ou hors session
  - Version de protocole différente
  preconisation: Vérifier que la même clé d'appairage est dans les deux logiciels (TRX Console menu 22) ; chercher
    l'appareil qui envoie sur ce port.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - breizh_event bad_packets
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6539/
  depuis_version: 0.123.0
  en:
    titre: Packets from Breizh Audio Box refused
    message: '{n} packet(s) refused within one minute ({motifs}).'
    causes:
    - Different pairing key on each side (tag)
    - Another device sending to the station port (foreign)
    - Replayed or out-of-session packets
    - Different protocol version
    preconisation: Check the same pairing key is in both programs (TRX Console menu 22); look for the device sending
      to this port.

ORT-6540:
  gravite: info
  titre: Breizh Audio Box joint ou repris
  message: '{detail}.'
  causes:
  - Première liaison établie
  - Breizh répond de nouveau après une perte
  - Reprise automatique après reactivate_after_s ou à la demande de l'opérateur
  preconisation: Aucune.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - breizh_event connected
  - back
  - reactivated
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6540/
  depuis_version: 0.123.0
  en:
    titre: Breizh Audio Box joined or resumed
    message: '{detail}.'
    causes:
    - First link established
    - Breizh answers again after a loss
    - Automatic resume after reactivate_after_s or on operator request
    preconisation: None.

ORT-6541:
  gravite: erreur
  titre: 'Erreur inattendue : liaison avec Breizh Audio Box'
  message: 'Liaison avec Breizh Audio Box : erreur inattendue ({erreur}) ; la station continue.'
  causes:
  - Défaut du programme (cas non prévu)
  preconisation: Signaler le problème avec le journal de la station (menu 8 de TRX Console).
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6541/
  depuis_version: 0.126.0
  en:
    titre: 'Unexpected error: Breizh Audio Box link'
    message: 'Breizh Audio Box link: unexpected error ({erreur}); the station carries on.'
    causes:
    - Program defect (unforeseen case)
    preconisation: Report the problem with the station log (TRX Console menu 8).

ORT-6561:
  gravite: avertissement
  titre: Décodeur FreeDV arrêté
  message: '{decodeur} s''est arrêté (code {code}) : relance dans {delai_s} s.'
  causes:
  - Plantage du décodeur
  - Processus tué (mémoire insuffisante, utilisateur)
  preconisation: Rien si c'est rare ; sinon lancer le décodeur à la main et signaler le défaut à l'équipe FreeDV.
  action_auto: nouvel_essai
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - state.freedv.cause
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6561/
  depuis_version: 0.123.0
  en:
    titre: FreeDV decoder stopped
    message: '{decodeur} stopped (code {code}): restart in {delai_s} s.'
    causes:
    - Decoder crash
    - Process killed (out of memory, user)
    preconisation: Nothing if rare; otherwise run the decoder by hand and report the defect to the FreeDV team.

ORT-6562:
  gravite: avertissement
  titre: Sortie d'un décodeur FreeDV illisible
  message: 'Lecture impossible de {decodeur} : {erreur} ; relance.'
  causes:
  - Ligne trop longue ou format de sortie inattendu (autre version du décodeur)
  preconisation: Utiliser la version des décodeurs prévue par la station ; signaler le défaut avec le journal.
  action_auto: nouvel_essai
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - state.freedv.cause
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6562/
  depuis_version: 0.123.0
  en:
    titre: FreeDV decoder output unreadable
    message: 'Cannot read {decodeur}: {erreur}; restarting.'
    causes:
    - Line too long or unexpected output format (other decoder version)
    preconisation: Use the decoder version expected by the station; report the defect with the log.

ORT-6563:
  gravite: erreur
  titre: FreeDV abandonné après ses relances
  message: 'FreeDV abandonné après ses relances ({cause}) : son du poste remis.'
  causes:
  - Plus de 5 relances des décodeurs en 10 minutes
  - Décodeur introuvable, gelé ou planté de façon répétée
  preconisation: Lire la cause, corriger (chemins, compilation, charge) puis choisir de nouveau le mode FreeDV.
  action_auto: repli_son_du_poste
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - freedv_event fault
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6563/
  depuis_version: 0.123.0
  en:
    titre: FreeDV given up after its restarts
    message: 'FreeDV given up after its restarts ({cause}): rig audio restored.'
    causes:
    - More than 5 decoder restarts within 10 minutes
    - Decoder repeatedly missing, frozen or crashing
    preconisation: Read the cause, fix it (paths, build, load) then select FreeDV mode again.

ORT-6564:
  gravite: erreur
  titre: Mode FreeDV en erreur dans la chaîne audio
  message: 'Mode FreeDV en erreur : le son du poste passe tel quel ({erreur}).'
  causes:
  - Erreur inattendue entre la carte son et les décodeurs
  preconisation: Quitter puis reprendre le mode FreeDV ; envoyer un rapport de problème avec le journal.
  action_auto: repli_son_du_poste
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6564/
  depuis_version: 0.123.0
  en:
    titre: FreeDV mode error in the audio chain
    message: 'FreeDV mode error: rig audio passes through unchanged ({erreur}).'
    causes:
    - Unexpected error between the sound card and the decoders
    preconisation: Leave and re-enter FreeDV mode; send a problem report with the log.

ORT-6565:
  gravite: avertissement
  titre: 'Décodeur FreeDV trop lent : son jeté'
  message: '{n} morceaux de son jetés : décodeur FreeDV trop lent.'
  causes:
  - Décodeur qui consomme sous le temps réel (freedv-ka9q sans le patch de cadence)
  - Machine trop chargée
  preconisation: Utiliser les décodeurs patchés fournis ; réduire la charge de la station.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - trx-monitor freedv.drops
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6565/
  depuis_version: 0.123.0
  en:
    titre: 'FreeDV decoder too slow: audio dropped'
    message: '{n} audio chunks dropped: FreeDV decoder too slow.'
    causes:
    - Decoder running below real time (freedv-ka9q without the pacing patch)
    - Computer overloaded
    preconisation: Use the patched decoders provided; lower the station load.

ORT-6566:
  gravite: info
  titre: Mode FreeDV non changé pendant l'émission
  message: 'Émission en cours : mode FreeDV changé après.'
  causes:
  - Émission de la station ou au micro du poste en cours
  preconisation: Changer le mode FreeDV une fois revenu en réception.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - freedv_tx
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6566/
  depuis_version: 0.123.0
  en:
    titre: FreeDV mode not changed while transmitting
    message: 'Transmitting: change FreeDV mode afterwards.'
    causes:
    - Station or rig-microphone transmission in progress
    preconisation: Change FreeDV mode once back on receive.

ORT-6567:
  gravite: erreur
  titre: 'Erreur inattendue : mode FreeDV'
  message: 'Mode FreeDV : erreur inattendue ({erreur}) ; la station continue.'
  causes:
  - Défaut du programme (cas non prévu)
  preconisation: Signaler le problème avec le journal de la station (menu 8 de TRX Console).
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6567/
  depuis_version: 0.126.0
  en:
    titre: 'Unexpected error: FreeDV mode'
    message: 'FreeDV mode: unexpected error ({erreur}); the station carries on.'
    causes:
    - Program defect (unforeseen case)
    preconisation: Report the problem with the station log (TRX Console menu 8).

ORT-6801:
  gravite: info
  titre: 'Essai SELCALL : RIT refusé ou illisible'
  message: 'RIT du poste {etat} ({detail}) : décale la SOURCE de {decalage_hz} Hz à la main.'
  causes:
  - Poste sans RIT accessible par Hamlib
  - Lecture du RIT en échec
  preconisation: Décaler la source de la trame à la main pour l'essai de tolérance ±300 Hz.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6801/
  depuis_version: 0.123.0
  en:
    titre: 'SELCALL test: RIT refused or unreadable'
    message: 'Rig RIT {etat} ({detail}): shift the SOURCE by {decalage_hz} Hz by hand.'
    causes:
    - Rig without RIT reachable through Hamlib
    - RIT read failed
    preconisation: Shift the frame source by hand for the ±300 Hz tolerance test.

ORT-6802:
  gravite: info
  titre: 'Trame SELCALL de fin omise : TOT trop proche'
  message: 'Trame SELCALL de fin omise : plus assez de temps avant le TOT ({secondes} s) ; roger bip à la place.'
  causes:
  - Relâché trop près du TOT pour loger la trame (jusqu'à 3,7 s)
  preconisation: Relâcher un peu plus tôt pour que la trame parte.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6802/
  depuis_version: 0.123.0
  en:
    titre: 'End-of-over SELCALL skipped: TOT too close'
    message: 'End-of-over SELCALL skipped: not enough time left before the TOT ({secondes} s); roger beep instead.'
    causes:
    - Released too close to the TOT to fit the burst (up to 3.7 s)
    preconisation: Release a bit earlier so the burst can be sent.

ORT-6803:
  gravite: avertissement
  titre: 'Appel SELCALL refusé : plus long que le TOT'
  message: 'Appel SELCALL refusé : {duree_s} s pour un TOT de {tot_s} s.'
  causes:
  - manual_repeat trop grand pour le TOT réglé
  preconisation: Réduire manual_repeat dans [selcall] sur la station, ou augmenter le TOT sous son plafond.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - selcall_too_long
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6803/
  depuis_version: 0.123.0
  en:
    titre: 'SELCALL call refused: longer than the TOT'
    message: 'SELCALL call refused: {duree_s} s for a TOT of {tot_s} s.'
    causes:
    - manual_repeat too large for the configured TOT
    preconisation: Reduce manual_repeat in [selcall] on the station, or raise the TOT below its ceiling.

ORT-6804:
  gravite: erreur
  titre: Appel SELCALL interrompu
  message: 'Appel SELCALL {cause} : coupure.'
  causes:
  - Trame plus longue que prévu (durée + 2 s)
  - Erreur de génération ou de lecture audio de la trame
  preconisation: Consulter les journaux de la passerelle ; réessayer l'appel.
  action_auto: retour_rx
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - selcall_timeout
  - selcall_failed
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6804/
  depuis_version: 0.123.0
  en:
    titre: SELCALL call interrupted
    message: 'SELCALL call {cause}: unkeyed.'
    causes:
    - Burst longer than expected (duration + 2 s)
    - Burst generation or audio playback error
    preconisation: Check the gateway logs; try the call again.

ORT-6805:
  gravite: info
  titre: Appel SELCALL reçu
  message: 'SELCALL : appel reçu, squelch ouvert (décalage {delta_hz} Hz, S/B {snr_db} dB).'
  causes:
  - Un correspondant a envoyé le code SELCALL armé sur la station
  preconisation: Écouter et répondre ; réarmer le SELCALL pour refermer le squelch.
  action_auto: aucune
  ntfy_defaut: true
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6805/
  depuis_version: 0.123.0
  en:
    titre: SELCALL call received
    message: 'SELCALL: call received, squelch open (offset {delta_hz} Hz, S/N {snr_db} dB).'
    causes:
    - A station sent the SELCALL code armed on this station
    preconisation: Listen and answer; re-arm SELCALL to close the squelch.

ORT-6806:
  gravite: info
  titre: Trame SELCALL rejetée
  message: 'SELCALL : trame rejetée ({motif}).'
  causes:
  - Signal trop faible ou brouillé
  - Trame d'une autre station (contrôle faux ou longueur invalide)
  - Décalage de fréquence au-delà de ±300 Hz
  preconisation: Aucune si c'est rare ; sinon demander au correspondant de vérifier son niveau et sa fréquence.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 1
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6806/
  depuis_version: 0.123.0
  en:
    titre: SELCALL frame rejected
    message: 'SELCALL: frame rejected ({motif}).'
    causes:
    - Signal too weak or garbled
    - Frame from another station (bad check or invalid length)
    - Frequency offset beyond ±300 Hz
    preconisation: None if rare; otherwise ask the other station to check its level and frequency.

ORT-6807:
  gravite: avertissement
  titre: État SELCALL illisible
  message: 'État SELCALL illisible ({detail}) : fonction désactivée.'
  causes:
  - Fichier selcall.json abîmé (coupure de courant, disque plein)
  - Fichier modifié à la main
  preconisation: Réarmer le SELCALL depuis la page ou l'application ; le fichier est réécrit.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6807/
  depuis_version: 0.123.0
  en:
    titre: SELCALL state unreadable
    message: 'SELCALL state unreadable ({detail}): function disabled.'
    causes:
    - selcall.json damaged (power loss, full disk)
    - File edited by hand
    preconisation: Re-arm SELCALL from the page or the app; the file is rewritten.

ORT-6808:
  gravite: avertissement
  titre: État SELCALL non enregistré
  message: 'État SELCALL non enregistré : {detail}.'
  causes:
  - Disque plein
  - Droits insuffisants sur le dossier d'état
  preconisation: Vérifier la place libre et les droits du dossier d'état ; le SELCALL fonctionne mais sera perdu
    au redémarrage.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6808/
  depuis_version: 0.123.0
  en:
    titre: SELCALL state not saved
    message: 'SELCALL state not saved: {detail}.'
    causes:
    - Disk full
    - Insufficient rights on the state folder
    preconisation: Check free space and rights on the state folder; SELCALL works but will be lost at restart.

ORT-6809:
  gravite: info
  titre: SELCALL non disponible
  message: SELCALL non disponible sur cette station.
  causes:
  - '[selcall] enabled = false dans station.toml'
  - Trame d'émission indisponible (appel manuel, réglage du niveau)
  preconisation: Activer [selcall] dans station.toml (menu 14) si vous voulez l'utiliser.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 2
  codes_machine:
  - selcall_unavailable
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6809/
  depuis_version: 0.123.0
  en:
    titre: SELCALL unavailable
    message: SELCALL is not available on this station.
    causes:
    - '[selcall] enabled = false in station.toml'
    - Transmit frame unavailable (manual call, level setting)
    preconisation: Enable [selcall] in station.toml (menu 14) if you want to use it.

ORT-6810:
  gravite: info
  titre: 'Appel SELCALL impossible : aucun code armé'
  message: 'Appel SELCALL impossible : aucun code armé.'
  causes:
  - SELCALL désactivé ou sans code
  preconisation: Armer un code SELCALL (3 à 8 chiffres) avant d'envoyer un appel.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 2
  codes_machine:
  - selcall_not_armed
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6810/
  depuis_version: 0.123.0
  en:
    titre: 'SELCALL call impossible: no code armed'
    message: 'SELCALL call impossible: no code armed.'
    causes:
    - SELCALL disabled or without a code
    preconisation: Arm a SELCALL code (3 to 8 digits) before sending a call.

ORT-6811:
  gravite: info
  titre: Code SELCALL invalide
  message: 'Code SELCALL invalide : {min} à {max} chiffres attendus.'
  causes:
  - Code saisi avec des lettres, ou trop court / trop long
  preconisation: Saisir un code de 3 à 8 chiffres.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 2
  codes_machine:
  - invalid_params
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6811/
  depuis_version: 0.123.0
  en:
    titre: Invalid SELCALL code
    message: 'Invalid SELCALL code: {min} to {max} digits expected.'
    causes:
    - Code typed with letters, or too short / too long
    preconisation: Enter a code of 3 to 8 digits.

ORT-6812:
  gravite: avertissement
  titre: 'Réglage automatique SELCALL : ALC illisible'
  message: 'Réglage automatique du niveau SELCALL : ALC illisible sur ce poste, niveau inchangé.'
  causes:
  - Le poste ne publie pas l'ALC par Hamlib
  - Lecture CAT en échec pendant l'émission
  preconisation: Régler le niveau de la trame à la main (curseur « niveau », -30 à -1 dBFS) en surveillant l'ALC
    du poste.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6812/
  depuis_version: 0.123.0
  en:
    titre: 'SELCALL auto level: ALC unreadable'
    message: 'SELCALL automatic level: ALC unreadable on this radio, level unchanged.'
    causes:
    - The radio does not report ALC through Hamlib
    - CAT read failing during transmit
    preconisation: Set the frame level by hand (level slider, -30 to -1 dBFS) while watching the radio ALC.

ORT-6813:
  gravite: avertissement
  titre: 'Réglage automatique SELCALL : ALC dès le plus bas niveau'
  message: 'Réglage automatique du niveau SELCALL : l''ALC agit dès {niveau} dBFS ; niveau au plus bas ({niveau_min}
    dBFS).'
  causes:
  - Gain d'entrée audio USB du poste trop élevé
  - Poste pas en mode données (USB-D…)
  preconisation: Réduire le gain d'entrée (USB MOD level) du poste puis relancer le réglage automatique.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6813/
  depuis_version: 0.123.0
  en:
    titre: 'SELCALL auto level: ALC active at the lowest level'
    message: 'SELCALL automatic level: ALC active from {niveau} dBFS; level set to the minimum ({niveau_min} dBFS).'
    causes:
    - Radio USB audio input gain too high
    - Radio not in a data mode (USB-D…)
    preconisation: Lower the radio input gain (USB MOD level) and run the automatic setting again.

ORT-6814:
  gravite: erreur
  titre: Erreur inattendue du SELCALL
  message: 'SELCALL : erreur inattendue ({contexte}).'
  causes:
  - Défaut du logiciel
  preconisation: Faire un rapport de problème (menu 8 de TRX Console) avec le journal de la passerelle.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6814/
  depuis_version: 0.123.0
  en:
    titre: Unexpected SELCALL error
    message: 'SELCALL: unexpected error ({contexte}).'
    causes:
    - Software defect
    preconisation: Send a problem report (TRX Console menu 8) with the gateway log.

ORT-6901:
  gravite: avertissement
  titre: Module « presence » injoignable depuis la console
  message: 'Présence de groupe : {detail}.'
  causes:
  - Station arrêtée ou module « presence » pas lancé
  - Demande impossible à déposer (droits du dossier d'état)
  - Demande refusée par le module ou le relais
  preconisation: Démarrer la station, vérifier [presence] enabled et « presence » dans [modules] run, voir le journal
    (menu 7).
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6901/
  depuis_version: 0.123.0
  en:
    titre: '"presence" module unreachable from the console'
    message: 'Group presence: {detail}.'
    causes:
    - Station stopped or "presence" module not started
    - Request cannot be dropped (state folder permissions)
    - Request refused by the module or the relay
    preconisation: Start the station, check [presence] enabled and "presence" in [modules] run, read the log (menu
      7).

ORT-6902:
  gravite: avertissement
  titre: 'Présence de groupe : pseudo absent'
  message: 'Présence de groupe : aucun pseudo choisi, rien n''est envoyé au relais.'
  causes:
  - '[presence] activé sans pseudo'
  preconisation: Choisir un pseudo dans le menu 24 de TRX Console ou la rubrique « Amis » de la page.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - pseudo_missing
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6902/
  depuis_version: 0.123.0
  en:
    titre: 'Group presence: no nickname'
    message: 'Group presence: no nickname chosen, nothing is sent to the relay.'
    causes:
    - '[presence] enabled without a nickname'
    preconisation: Choose a nickname in TRX Console menu 24 or the "Friends" section of the page.

ORT-6903:
  gravite: avertissement
  titre: Relais de présence injoignable
  message: 'Présence de groupe : relais injoignable ({detail}), nouvel essai dans {delai_s} s.'
  causes:
  - Pas d'accès à Internet depuis la station
  - Relais arrêté ou adresse relay_url fausse
  - Erreur TLS ou DNS
  - Réponse du relais illisible ou trop grande
  preconisation: Vérifier l'accès à Internet et [presence] relay_url ; la station réessaie seule (1 à 16 min). La
    radio n'est pas concernée.
  action_auto: nouvel_essai
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - relay_unreachable
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6903/
  depuis_version: 0.123.0
  en:
    titre: Presence relay unreachable
    message: 'Group presence: relay unreachable ({detail}), retry in {delai_s} s.'
    causes:
    - No Internet access from the station
    - Relay down or wrong relay_url
    - TLS or DNS error
    - Unreadable or oversized relay reply
    preconisation: Check Internet access and [presence] relay_url; the station retries by itself (1 to 16 min).
      The radio is not affected.

ORT-6904:
  gravite: erreur
  titre: Enregistrement refusé par le relais de présence
  message: 'Présence de groupe : enregistrement de la station refusé par le relais ({motif}).'
  causes:
  - Preuve de travail demandée hors bornes
  - Relais plein ou fermé aux nouvelles stations
  - Version de la station refusée
  preconisation: Réessayer plus tard ; si le refus persiste, contacter l'administrateur du relais.
  action_auto: nouvel_essai
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - register_{motif}
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6904/
  depuis_version: 0.123.0
  en:
    titre: Registration refused by the presence relay
    message: 'Group presence: station registration refused by the relay ({motif}).'
    causes:
    - Proof of work requested out of bounds
    - Relay full or closed to new stations
    - Station version refused
    preconisation: Try again later; if it persists, contact the relay administrator.

ORT-6905:
  gravite: info
  titre: Relais de présence en pause ou chargé
  message: 'Présence de groupe : relais {etat}, nouvel essai dans {delai_s} s.'
  causes:
  - Relais mis en pause par son administrateur
  - Trop de requêtes (limite de débit)
  preconisation: 'Aucune : la station attend le délai indiqué par le relais.'
  action_auto: nouvel_essai
  ntfy_defaut: false
  priorite_ntfy: 2
  codes_machine:
  - relay_paused
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6905/
  depuis_version: 0.123.0
  en:
    titre: Presence relay paused or busy
    message: 'Group presence: relay {etat}, retry in {delai_s} s.'
    causes:
    - Relay paused by its administrator
    - Too many requests (rate limit)
    preconisation: 'None: the station waits for the delay given by the relay.'

ORT-6906:
  gravite: avertissement
  titre: Requête refusée par le relais de présence
  message: 'Présence de groupe : requête refusée par le relais ({motif}).'
  causes:
  - Station inconnue du relais (réenregistrement automatique)
  - Erreur du relais
  - Relais d'une autre version
  preconisation: Aucune si cela cesse au cycle suivant ; sinon vérifier la version du relais et le journal presence.log.
  action_auto: nouvel_essai
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - relay_error_{motif}
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6906/
  depuis_version: 0.123.0
  en:
    titre: Request refused by the presence relay
    message: 'Group presence: request refused by the relay ({motif}).'
    causes:
    - Station unknown to the relay (automatic re-registration)
    - Relay error
    - Relay from another version
    preconisation: None if it clears at the next cycle; otherwise check the relay version and presence.log.

ORT-6907:
  gravite: avertissement
  titre: Action refusée par le relais de présence
  message: 'Présence de groupe : {action} refusé par le relais ({motif}).'
  causes:
  - Groupe supprimé ou station plus membre
  - Liste des membres refusée
  - Erreur du relais
  preconisation: Rafraîchir la rubrique « Amis » ; si le refus persiste, contacter l'administrateur du groupe.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - http_{code}
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6907/
  depuis_version: 0.123.0
  en:
    titre: Action refused by the presence relay
    message: 'Group presence: {action} refused by the relay ({motif}).'
    causes:
    - Group deleted or station no longer a member
    - Member list refused
    - Relay error
    preconisation: Refresh the "Friends" section; if it persists, contact the group administrator.

ORT-6908:
  gravite: avertissement
  titre: Liste des membres d'un groupe refusée
  message: 'Présence de groupe {groupe} : version de la liste des membres refusée ({motif}).'
  causes:
  - Signature fausse ou signataire non administrateur (liste falsifiée par le relais ?)
  - Chaîne des versions rompue ou clé d'administrateur changée sans rotation
  - Liste mal formée
  preconisation: Contacter l'administrateur du groupe ; si la signature est fausse, ne plus faire confiance au relais
    et refaire le groupe.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6908/
  depuis_version: 0.123.0
  en:
    titre: Group member list refused
    message: 'Group presence {groupe}: member list version refused ({motif}).'
    causes:
    - Bad signature or signer not an administrator (list forged by the relay?)
    - Broken version chain or admin key changed without rotation
    - Malformed list
    preconisation: Contact the group administrator; if the signature is bad, stop trusting the relay and recreate
      the group.

ORT-6909:
  gravite: avertissement
  titre: Clé de groupe reçue refusée
  message: 'Présence de groupe {groupe} : clé remise refusée ({motif}).'
  causes:
  - Clé chiffrée pour une autre version de la liste
  - Signature fausse ou signataire inconnu
  - Déchiffrement impossible
  preconisation: Attendre le cycle suivant ; si cela persiste, demander à l'administrateur de vous réinviter.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6909/
  depuis_version: 0.123.0
  en:
    titre: Group key refused
    message: 'Group presence {groupe}: received key refused ({motif}).'
    causes:
    - Key sealed for another list version
    - Bad signature or unknown signer
    - Cannot decrypt
    preconisation: Wait for the next cycle; if it persists, ask the administrator to invite you again.

ORT-6910:
  gravite: info
  titre: État d'un membre refusé
  message: 'Présence de groupe {groupe} : état de {membre} refusé ({motif}).'
  causes:
  - Clé de groupe ancienne ou inconnue
  - État mal formé, trop gros ou daté du futur
  - Signature fausse
  preconisation: Aucune si cela reste rare ; le membre concerné doit mettre sa station à jour ou à l'heure.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 1
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6910/
  depuis_version: 0.123.0
  en:
    titre: Member state refused
    message: 'Group presence {groupe}: state of {membre} refused ({motif}).'
    causes:
    - Old or unknown group key
    - Malformed, oversized or future-dated state
    - Bad signature
    preconisation: None if rare; that member should update their station or fix its clock.

ORT-6911:
  gravite: info
  titre: Station retirée d'un groupe
  message: 'Présence de groupe {groupe} : la station n''en fait plus partie (exclue ou groupe supprimé).'
  causes:
  - Exclusion par un administrateur
  - Groupe supprimé
  preconisation: Demander une nouvelle invitation à l'administrateur si c'est une erreur.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 2
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6911/
  depuis_version: 0.123.0
  en:
    titre: Station removed from a group
    message: 'Group presence {groupe}: the station is no longer a member (excluded or group deleted).'
    causes:
    - Excluded by an administrator
    - Group deleted
    preconisation: Ask the administrator for a new invitation if this is a mistake.

ORT-6912:
  gravite: info
  titre: Demande d'adhésion refusée automatiquement
  message: 'Présence de groupe {groupe} : demande d''adhésion de {station} refusée ({motif}).'
  causes:
  - Jeton d'invitation inconnu, déjà utilisé ou expiré
  - Preuve de la demande fausse
  preconisation: Envoyer une nouvelle invitation au demandeur s'il est légitime.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 2
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6912/
  depuis_version: 0.123.0
  en:
    titre: Join request refused automatically
    message: 'Group presence {groupe}: join request from {station} refused ({motif}).'
    causes:
    - Invitation token unknown, already used or expired
    - Bad request proof
    preconisation: Send a new invitation to the requester if legitimate.

ORT-6913:
  gravite: info
  titre: Invitation refusée
  message: 'Invitation refusée : {motif}.'
  causes:
  - Lien d'invitation abîmé ou incomplet
  - Invitation expirée
  - Invitation pour un autre relais
  - Déjà membre de ce groupe ou demande en attente
  preconisation: Demander un nouveau lien d'invitation à l'administrateur du groupe (menu 24 ou « Inviter » de la
    page).
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 2
  codes_machine:
  - invitation_expired
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6913/
  depuis_version: 0.123.0
  en:
    titre: Invitation refused
    message: 'Invitation refused: {motif}.'
    causes:
    - Damaged or incomplete invitation link
    - Invitation expired
    - Invitation for another relay
    - Already a member of this group or request pending
    preconisation: Ask the group administrator for a new invitation link (menu 24 or "Invite" on the page).

ORT-6914:
  gravite: info
  titre: Trop de groupes
  message: Trop de groupes pour cette station.
  causes:
  - Nombre maximal de groupes (créés ou rejoints) atteint
  preconisation: Quitter un groupe inutilisé avant d'en créer ou d'en rejoindre un autre.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 2
  codes_machine:
  - quota
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6914/
  depuis_version: 0.123.0
  en:
    titre: Too many groups
    message: Too many groups for this station.
    causes:
    - Maximum number of groups (created or joined) reached
    preconisation: Leave an unused group before creating or joining another one.

ORT-6915:
  gravite: info
  titre: Station pas encore enregistrée auprès du relais
  message: 'Station pas encore enregistrée auprès du relais : réessayer dans une minute.'
  causes:
  - Premier démarrage de la présence (preuve de travail en cours)
  - Relais injoignable ou enregistrement refusé
  preconisation: Attendre la fin de l'enregistrement (quelques secondes à quelques minutes sur un Pi) ; voir la
    ligne « Présence » de trx-monitor.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 2
  codes_machine:
  - not_registered
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6915/
  depuis_version: 0.123.0
  en:
    titre: Station not yet registered with the relay
    message: 'Station not yet registered with the relay: try again in a minute.'
    causes:
    - First presence start (proof of work in progress)
    - Relay unreachable or registration refused
    preconisation: Wait for registration to finish (seconds to minutes on a Pi); see the "Presence" line in trx-monitor.

ORT-6916:
  gravite: info
  titre: Action réservée à un administrateur du groupe
  message: '{action} : réservé à un administrateur du groupe.'
  causes:
  - La station est simple membre ou co-administrateur
  - Un co-administrateur ne peut pas exclure un administrateur
  preconisation: Demander à l'administrateur du groupe.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 2
  codes_machine:
  - not_admin
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6916/
  depuis_version: 0.123.0
  en:
    titre: Action reserved to a group administrator
    message: '{action}: reserved to a group administrator.'
    causes:
    - The station is a plain member or co-administrator
    - A co-administrator cannot exclude an administrator
    preconisation: Ask the group administrator.

ORT-6917:
  gravite: info
  titre: Groupe ou membre inconnu
  message: '{objet} inconnu.'
  causes:
  - Groupe quitté ou supprimé entre-temps
  - Membre déjà retiré du groupe
  - Rôle inconnu
  preconisation: Rafraîchir la rubrique « Amis ».
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 2
  codes_machine:
  - unknown_group
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6917/
  depuis_version: 0.123.0
  en:
    titre: Unknown group or member
    message: Unknown {objet}.
    causes:
    - Group left or deleted meanwhile
    - Member already removed from the group
    - Unknown role
    preconisation: Refresh the "Friends" section.

ORT-6918:
  gravite: info
  titre: Saisie refusée (présence de groupe)
  message: '{champ} refusé : {regle}.'
  causes:
  - Pseudo, texte libre ou nom de groupe trop long ou avec des caractères interdits
  - Plage « Au shack » invalide (durée de 1 min à 24 h, 7 plages au plus)
  - Niveau de partage invalide
  - Paramètres de commande invalides (client d'une autre version)
  preconisation: 'Corriger la saisie : lettres sans accent, chiffres, espace et . / _ - ; 16 caractères pour un
    pseudo ou un texte.'
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 2
  codes_machine:
  - pseudo
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6918/
  depuis_version: 0.123.0
  en:
    titre: Input refused (group presence)
    message: '{champ} refused: {regle}.'
    causes:
    - Nickname, free text or group name too long or with forbidden characters
    - Invalid "In the shack" slot (1 min to 24 h, 7 slots max)
    - Invalid sharing level
    - Invalid command parameters (client from another version)
    preconisation: 'Fix the input: unaccented letters, digits, space and . / _ - ; 16 characters for a nickname
      or text.'

ORT-6919:
  gravite: info
  titre: Présence de groupe non disponible
  message: Présence de groupe non disponible.
  causes:
  - Module « presence » absent de [modules] run ou arrêté
  - Compte visiteur (réception seule)
  - Erreur inattendue du module
  preconisation: Activer [presence] et ajouter « presence » à [modules] run (menu 14), puis redémarrer la station.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 2
  codes_machine:
  - friends_unavailable
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6919/
  depuis_version: 0.123.0
  en:
    titre: Group presence unavailable
    message: Group presence unavailable.
    causes:
    - '"presence" module missing from [modules] run or stopped'
    - Visitor account (receive only)
    - Unexpected module error
    preconisation: Enable [presence] and add "presence" to [modules] run (menu 14), then restart the station.

ORT-6920:
  gravite: erreur
  titre: Fichier de clés de la présence illisible
  message: 'Présence de groupe : fichier de clés {fichier} illisible ({detail}) ; le module ne démarre pas.'
  causes:
  - Fichier presence.key abîmé ou tronqué
  - Fichier d'une autre version (format inconnu)
  - Droits de lecture insuffisants
  preconisation: 'Restaurer le fichier depuis une sauvegarde ; à défaut, le supprimer : une nouvelle identité est
    créée et il faut rejoindre de nouveau chaque groupe.'
  action_auto: nouvel_essai
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6920/
  depuis_version: 0.123.0
  en:
    titre: Presence key file unreadable
    message: 'Group presence: key file {fichier} unreadable ({detail}); the module does not start.'
    causes:
    - presence.key damaged or truncated
    - File from another version (unknown format)
    - Insufficient read rights
    preconisation: 'Restore the file from a backup; otherwise delete it: a new identity is created and every group
      must be joined again.'

ORT-6921:
  gravite: erreur
  titre: Données de la présence illisibles
  message: '{fichier} illisible ({detail}) : mis de côté, repart de zéro.'
  causes:
  - Fichier abîmé (coupure de courant, disque plein)
  - Fichier modifié à la main
  preconisation: 'Les groupes connus de la station sont perdus : les rejoindre de nouveau (le fichier abîmé est
    gardé en .illisible pour diagnostic).'
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6921/
  depuis_version: 0.123.0
  en:
    titre: Presence data unreadable
    message: '{fichier} unreadable ({detail}): set aside, starting from scratch.'
    causes:
    - Damaged file (power loss, full disk)
    - File edited by hand
    preconisation: 'The station''s known groups are lost: join them again (the damaged file is kept as .illisible
      for diagnosis).'

ORT-6922:
  gravite: erreur
  titre: Erreur inattendue de la présence de groupe
  message: 'Présence de groupe : erreur inattendue ({contexte}) ; nouvel essai dans {delai_s} s.'
  causes:
  - Défaut du logiciel
  preconisation: Faire un rapport de problème (menu 8 de TRX Console) avec presence.log.
  action_auto: nouvel_essai
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - internal
  - friends_error
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6922/
  depuis_version: 0.123.0
  en:
    titre: Unexpected group presence error
    message: 'Group presence: unexpected error ({contexte}); retry in {delai_s} s.'
    causes:
    - Software defect
    preconisation: Send a problem report (TRX Console menu 8) with presence.log.

ORT-6923:
  gravite: erreur
  titre: Signature invalide reçue (attaque possible)
  message: 'Présence de groupe {groupe} : {objet} signé par une clé inconnue ou signature fausse ; refusé.'
  causes:
  - Relais compromis ou intermédiaire qui modifie les messages
  - Administrateur dont la clé a changé
  preconisation: Rien n'est accepté. Vérifier auprès de l'administrateur du groupe ; si cela se répète, quitter
    le groupe et prévenir l'administrateur du relais.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-6923/
  depuis_version: 0.126.0
  en:
    titre: Invalid signature received (possible attack)
    message: 'Group presence {groupe}: {objet} signed by an unknown key or with a bad signature; refused.'
    causes:
    - Compromised relay or man in the middle altering messages
    - Administrator whose key changed
    preconisation: Nothing is accepted. Check with the group administrator; if it repeats, leave the group and warn
      the relay administrator.


# ====================================================================================================
# 7000–7999 : Monitor inter-stations
# ====================================================================================================

ORT-7001:
  gravite: info
  titre: Liaison monitor établie
  message: Liaison de monitoring établie avec {station}.
  causes:
  - Appairage terminé ou liaison rétablie
  preconisation: Aucune.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 2
  prevu: true
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-7001/
  depuis_version: 0.123.0
  en:
    titre: Monitor link established
    message: Monitoring link established with {station}.
    causes:
    - Pairing completed or link restored
    preconisation: None.

ORT-7010:
  gravite: avertissement
  titre: Échec ICE, bascule en port UDP
  message: La liaison avec {station} n'a pas pu s'établir par ICE ; bascule sur le port UDP {port}.
  causes:
  - Box ou pare-feu qui bloque la traversée NAT
  - Serveur STUN injoignable
  preconisation: Ouvrir le port UDP côté receveur si besoin.
  action_auto: repli_udp
  ntfy_defaut: false
  priorite_ntfy: 3
  prevu: true
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-7010/
  depuis_version: 0.123.0
  en:
    titre: ICE failed, falling back to UDP port
    message: The link with {station} could not be set up through ICE; falling back to UDP port {port}.
    causes:
    - Router or firewall blocking NAT traversal
    - STUN server unreachable
    preconisation: Open the UDP port on the receiving side if needed.

ORT-7020:
  gravite: avertissement
  titre: File d'envoi saturée
  message: La file d'envoi vers {station} est saturée ({taille_ko} ko) ; des données sont perdues.
  causes:
  - Profil d'envoi trop riche pour le débit permis
  - Liaison lente ou coupée
  preconisation: Réduire le profil d'envoi ou augmenter le débit permis.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  prevu: true
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-7020/
  depuis_version: 0.123.0
  en:
    titre: Send queue full
    message: The send queue to {station} is full ({taille_ko} kB); data is being dropped.
    causes:
    - Sending profile too rich for the allowed bit rate
    - Slow or broken link
    preconisation: Reduce the sending profile or raise the allowed bit rate.

ORT-7030:
  gravite: erreur
  titre: Clé distante changée, liaison suspendue
  message: La clé de {station} a changé ; la liaison est suspendue.
  causes:
  - Station distante réinstallée
  - Usurpation possible
  preconisation: Vérifier auprès de l'opérateur distant, puis refaire l'appairage.
  action_auto: suspendre_liaison
  ntfy_defaut: true
  priorite_ntfy: 4
  prevu: true
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-7030/
  depuis_version: 0.123.0
  en:
    titre: Remote key changed, link suspended
    message: The key of {station} has changed; the link is suspended.
    causes:
    - Remote station reinstalled
    - Possible impersonation
    preconisation: Check with the remote operator, then pair again.


# ====================================================================================================
# 8000–8999 : Superviseur et processus
# ====================================================================================================

ORT-8001:
  gravite: erreur
  titre: Redémarrage d'un processus par le superviseur
  message: 'Reprise niveau {niveau} ({action}) : {problemes}.'
  causes:
  - Passerelle muette, gelée ou incapable de couper
  - rigctld injoignable
  - 'Processus arrêté (mode géré) : {processus} s''est arrêté avec le code {code}'
  preconisation: Consulter le journal du processus concerné (passerelle ou rigctld).
  action_auto: redemarrer_passerelle
  ntfy_defaut: true
  priorite_ntfy: 3
  codes_machine:
  - restart_gateway
  - restart_rigctld
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-8001/
  depuis_version: 0.123.0
  en:
    titre: Process restarted by the supervisor
    message: 'Recovery level {niveau} ({action}): {problemes}.'
    causes:
    - Gateway silent, frozen or unable to unkey
    - rigctld unreachable
    - 'Process stopped (managed mode): {processus} exited with code {code}'
    preconisation: Read the log of the process concerned (gateway or rigctld).

ORT-8002:
  gravite: erreur
  titre: Module désactivé après des arrêts répétés
  message: 'Module {module} arrêté {n} fois en moins de {fenetre_s} s : désactivé.'
  causes:
  - Le module plante dès son démarrage (fichier abîmé, configuration refusée, dépendance absente)
  preconisation: Lire le journal du module, corriger la cause, puis réactiver le module (ou redémarrer la station).
  action_auto: arreter_module
  ntfy_defaut: true
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-8002/
  depuis_version: 0.123.0
  en:
    titre: Module disabled after repeated stops
    message: 'Module {module} stopped {n} times within {fenetre_s} s: disabled.'
    causes:
    - The module crashes at start (damaged file, rejected configuration, missing dependency)
    preconisation: Read the module log, fix the cause, then re-enable the module (or restart the station).

ORT-8003:
  gravite: erreur
  titre: Passerelle muette
  message: 'Le fichier d''état de la passerelle est figé ou absent depuis {age_s} s : redémarrage de la passerelle.'
  causes:
  - Passerelle arrêtée, plantée ou gelée
  - Passerelle qui ne démarre pas (audio absent, configuration)
  - 'Disque plein ou droits : fichier d''état non écrit'
  preconisation: Consulter le journal de la passerelle ; vérifier l'espace disque et les périphériques audio.
  action_auto: redemarrer_passerelle
  ntfy_defaut: true
  priorite_ntfy: 3
  codes_machine:
  - gateway_silent
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-8003/
  depuis_version: 0.123.0
  en:
    titre: Gateway silent
    message: 'The gateway status file has been frozen or missing for {age_s} s: restarting the gateway.'
    causes:
    - Gateway stopped, crashed or frozen
    - Gateway failing to start (audio missing, configuration)
    - 'Disk full or permissions: status file not written'
    preconisation: Read the gateway log; check disk space and audio devices.

ORT-8004:
  gravite: erreur
  titre: Réinitialisation USB du poste
  message: 'Reprise niveau 2 (reset_usb) : {problemes}.'
  causes:
  - Port du poste disparu pendant une émission connue
  - Relances de la passerelle et de rigctld sans effet
  preconisation: Vérifier le câble USB et le hub ; consulter les journaux.
  action_auto: reset_usb
  ntfy_defaut: true
  priorite_ntfy: 3
  codes_machine:
  - reset_usb
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-8004/
  depuis_version: 0.123.0
  en:
    titre: Rig USB reset
    message: 'Recovery level 2 (reset_usb): {problemes}.'
    causes:
    - Rig port vanished during a known transmission
    - Gateway and rigctld restarts had no effect
    preconisation: Check the USB cable and hub; read the logs.

ORT-8005:
  gravite: erreur
  titre: Réinitialisation USB impossible
  message: 'Réinitialisation USB impossible : {detail}.'
  causes:
  - Périphérique introuvable dans /sys (port absent)
  - Droits insuffisants sur /sys
  - 'Windows : réinitialisation USB non prise en charge'
  preconisation: Débrancher puis rebrancher le câble USB du poste à la main.
  action_auto: redemarrer_rigctld
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-8005/
  depuis_version: 0.123.0
  en:
    titre: USB reset not possible
    message: 'USB reset not possible: {detail}.'
    causes:
    - Device not found in /sys (port missing)
    - Insufficient rights on /sys
    - 'Windows: USB reset not supported'
    preconisation: Unplug and replug the rig USB cable by hand.

ORT-8006:
  gravite: critique
  titre: Redémarrage de la machine par le superviseur
  message: 'Reprise niveau 3 (reboot) : {problemes}. « T 0 » envoyé, redémarrage de la machine.'
  causes:
  - Relances de la passerelle, de rigctld et réinitialisation USB sans effet
  preconisation: Après le redémarrage, consulter les journaux ; au-delà de {max_par_heure} redémarrages par heure,
    la station passe en mode sûr.
  action_auto: redemarrer_systeme
  ntfy_defaut: true
  priorite_ntfy: 3
  codes_machine:
  - reboot
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-8006/
  depuis_version: 0.123.0
  en:
    titre: Machine reboot by the supervisor
    message: 'Recovery level 3 (reboot): {problemes}. "T 0" sent, rebooting the machine.'
    causes:
    - Gateway restart, rigctld restart and USB reset had no effect
    preconisation: After the reboot, read the logs; beyond {max_par_heure} reboots per hour the station enters safe
      mode.

ORT-8007:
  gravite: critique
  titre: 'Redémarrage refusé : historique non inscriptible'
  message: 'Historique des redémarrages non inscriptible : pas de redémarrage, passerelle arrêtée.'
  causes:
  - Disque plein ou en lecture seule
  - Droits sur le dossier d'état du superviseur
  preconisation: Libérer de l'espace ou corriger les droits du dossier d'état, puis relancer la station.
  action_auto: arreter_passerelle
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-8007/
  depuis_version: 0.123.0
  en:
    titre: 'Reboot refused: history not writable'
    message: 'Reboot history not writable: no reboot, gateway stopped.'
    causes:
    - Disk full or read-only
    - Permissions on the supervisor state folder
    preconisation: Free some space or fix the state folder permissions, then restart the station.

ORT-8008:
  gravite: critique
  titre: 'Mode sûr : station en réception, accès coupé'
  message: 'MODE SÛR : {raison}. Poste en réception, passerelle arrêtée ; intervention requise.'
  causes:
  - Trop de redémarrages de la machine en une heure ({n} pour {max_par_heure} permis)
  - Pannes qui persistent malgré l'échelle de reprise
  - Fichier de mode sûr illisible (on reste en mode sûr par prudence)
  preconisation: Corriger la cause d'après les journaux, puis sortir du mode sûr sur la station (TRX Console menu
    9 ou « trx-supervisor --clear-safe-mode »).
  action_auto: mode_sur
  ntfy_defaut: true
  priorite_ntfy: 4
  codes_machine:
  - safe_mode
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-8008/
  depuis_version: 0.123.0
  en:
    titre: 'Safe mode: station on receive, access cut'
    message: 'SAFE MODE: {raison}. Rig on receive, gateway stopped; manual intervention required.'
    causes:
    - Too many machine reboots within an hour ({n} for {max_par_heure} allowed)
    - Faults persisting despite the recovery ladder
    - Safe-mode file unreadable (staying in safe mode as a precaution)
    preconisation: Fix the cause from the logs, then leave safe mode on the station (TRX Console menu 9 or "trx-supervisor
      --clear-safe-mode").

ORT-8009:
  gravite: erreur
  titre: Mode sûr non enregistré
  message: 'Mode sûr non enregistré sur le disque ({detail}) : il ne survivra pas à un redémarrage du superviseur.'
  causes:
  - Disque plein ou en lecture seule
  - Droits sur le dossier d'état
  preconisation: Libérer de l'espace ou corriger les droits du dossier d'état.
  action_auto: mode_sur
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-8009/
  depuis_version: 0.123.0
  en:
    titre: Safe mode not saved
    message: 'Safe mode not saved to disk ({detail}): it will not survive a supervisor restart.'
    causes:
    - Disk full or read-only
    - Permissions on the state folder
    preconisation: Free some space or fix the state folder permissions.

ORT-8010:
  gravite: erreur
  titre: Action du superviseur en échec
  message: 'Action {action} du superviseur en échec : {detail}.'
  causes:
  - systemctl en erreur ou hors délai
  - 'rigctld adopté (lancé à la main) : le superviseur ne peut pas le relancer'
  - Processus impossible à tuer
  - rigctld introuvable lors d'une relance
  preconisation: Consulter le journal du superviseur ; lancer rigctld par la station plutôt qu'à la main.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-8010/
  depuis_version: 0.123.0
  en:
    titre: Supervisor action failed
    message: 'Supervisor action {action} failed: {detail}.'
    causes:
    - systemctl error or timeout
    - 'Adopted rigctld (started by hand): the supervisor cannot restart it'
    - Process cannot be killed
    - rigctld not found on restart
    preconisation: Read the supervisor log; let the station start rigctld rather than starting it by hand.

ORT-8011:
  gravite: info
  titre: Station rétablie
  message: 'Station rétablie : plus aucun problème détecté.'
  causes:
  - Tous les problèmes signalés ont disparu
  preconisation: Aucune.
  action_auto: aucune
  ntfy_defaut: true
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-8011/
  depuis_version: 0.123.0
  en:
    titre: Station recovered
    message: 'Station recovered: no problem detected any more.'
    causes:
    - All reported problems have cleared
    preconisation: None.

ORT-8012:
  gravite: info
  titre: Station en service
  message: 'Station en service : passerelle {passerelle}, poste {poste}, mode sûr {mode_sur}, problèmes {problemes}
    ; prochain message dans {heures} h.'
  causes:
  - Battement périodique (alive_every_h)
  preconisation: 'Aucune : l''absence de ce message indique une station éteinte ou injoignable.'
  action_auto: aucune
  ntfy_defaut: true
  priorite_ntfy: 1
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-8012/
  depuis_version: 0.123.0
  en:
    titre: Station in service
    message: 'Station in service: gateway {passerelle}, rig {poste}, safe mode {mode_sur}, problems {problemes};
      next message in {heures} h.'
    causes:
    - Periodic heartbeat (alive_every_h)
    preconisation: 'None: missing this message means the station is off or unreachable.'

ORT-8013:
  gravite: avertissement
  titre: Alerte ntfy non envoyée
  message: 'Envoi d''alerte impossible : {detail}.'
  causes:
  - Pas d'accès Internet ou serveur ntfy injoignable
  - Adresse notify_url fausse
  - Délai de 5 s dépassé
  preconisation: Vérifier notify_url et l'accès Internet de la station.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-8013/
  depuis_version: 0.123.0
  en:
    titre: ntfy alert not sent
    message: 'Could not send alert: {detail}.'
    causes:
    - No Internet access or ntfy server unreachable
    - Wrong notify_url
    - 5 s timeout exceeded
    preconisation: Check notify_url and the station's Internet access.

ORT-8014:
  gravite: critique
  titre: Boucle de supervision en erreur
  message: Erreur dans la boucle de supervision ({n}/{max}) ; au-delà, le superviseur s'arrête pour être relancé.
  causes:
  - Défaut interne du superviseur
  - Fichier ou ressource système inattendu
  preconisation: Consulter le journal du superviseur et signaler le problème ; systemd le relance (Restart=always).
  action_auto: arreter_superviseur
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-8014/
  depuis_version: 0.123.0
  en:
    titre: Supervision loop error
    message: Error in the supervision loop ({n}/{max}); beyond that the supervisor exits to be restarted.
    causes:
    - Internal supervisor fault
    - Unexpected file or system resource
    preconisation: Read the supervisor log and report the problem; systemd restarts it (Restart=always).

ORT-8015:
  gravite: erreur
  titre: Superviseur déjà en cours d'exécution
  message: Un superviseur est déjà en cours d'exécution (port de verrouillage {port} occupé).
  causes:
  - Station déjà lancée (tâche planifiée, service)
  - Autre programme sur le port de verrouillage
  preconisation: Arrêter l'autre instance (trx-supervisor --stop) ou changer instance_lock_port.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-8015/
  depuis_version: 0.123.0
  en:
    titre: Supervisor already running
    message: A supervisor is already running (lock port {port} in use).
    causes:
    - Station already started (scheduled task, service)
    - Another program on the lock port
    preconisation: Stop the other instance (trx-supervisor --stop) or change instance_lock_port.

ORT-8016:
  gravite: erreur
  titre: La station ne s'arrête pas
  message: 'La station ne s''est pas arrêtée en {delai_s} s : regardez ses journaux.'
  causes:
  - Superviseur bloqué
  - Dossier d'état non inscriptible (demande d'arrêt non déposée)
  preconisation: Consulter les journaux ; en dernier recours, arrêter la tâche ou le processus à la main.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-8016/
  depuis_version: 0.123.0
  en:
    titre: Station does not stop
    message: 'The station did not stop within {delai_s} s: check its logs.'
    causes:
    - Supervisor stuck
    - State folder not writable (stop request not written)
    preconisation: Read the logs; as a last resort, end the task or process by hand.

ORT-8017:
  gravite: erreur
  titre: 'Superviseur disparu : passerelle arrêtée'
  message: 'Le superviseur (pid {pid}) a disparu : arrêt de la passerelle, poste remis en réception.'
  causes:
  - Superviseur arrêté ou planté (mode géré)
  - Tâche planifiée stoppée
  preconisation: Relancer la station ; consulter le journal du superviseur.
  action_auto: arreter_passerelle
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-8017/
  depuis_version: 0.123.0
  en:
    titre: 'Supervisor gone: gateway stopped'
    message: 'The supervisor (pid {pid}) has disappeared: gateway stopping, rig back on receive.'
    causes:
    - Supervisor stopped or crashed (managed mode)
    - Scheduled task stopped
    preconisation: Restart the station; read the supervisor log.

ORT-8018:
  gravite: erreur
  titre: Surveillance des accès en erreur
  message: 'Surveillance des accès en erreur : {detail}.'
  causes:
  - Défaut interne de la passerelle
  preconisation: Consulter le journal de la passerelle et signaler le problème.
  action_auto: nouvel_essai
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-8018/
  depuis_version: 0.123.0
  en:
    titre: Access watch error
    message: 'Access watch error: {detail}.'
    causes:
    - Internal gateway fault
    preconisation: Read the gateway log and report the problem.

ORT-8019:
  gravite: erreur
  titre: Erreur inattendue d'un composant (la station continue)
  message: '{composant} : erreur inattendue ({erreur}) ; la station continue sans lui.'
  causes:
  - Défaut du logiciel
  - Donnée inattendue reçue d'un client ou d'un module
  preconisation: Envoyer un rapport de problème avec le journal de la passerelle (TRX Console menu 8).
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - netprobe_error
  - friends_error
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-8019/
  depuis_version: 0.123.0
  en:
    titre: Unexpected component error (station carries on)
    message: '{composant}: unexpected error ({erreur}); the station carries on without it.'
    causes:
    - Software defect
    - Unexpected data from a client or a module
    preconisation: Send a problem report with the gateway log (TRX Console menu 8).
  deprecated: true
  remplace_par: ORT-4018, ORT-4509, ORT-5028, ORT-6541, ORT-6567, ORT-6922, ORT-8018 (une erreur inattendue par
    domaine)

ORT-8020:
  gravite: avertissement
  titre: Aucune adresse d'alerte (ntfy)
  message: 'Aucune URL d''alerte (notify_url) : les récupérations du superviseur ne seront pas notifiées.'
  causes:
  - notify_url vide dans [supervisor]
  preconisation: Renseigner [supervisor] notify_url avec l'adresse d'un sujet ntfy (https://...).
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-8020/
  depuis_version: 0.123.0
  en:
    titre: No alert address (ntfy)
    message: 'No alert URL (notify_url): supervisor recoveries will not be notified.'
    causes:
    - notify_url empty in [supervisor]
    preconisation: Set [supervisor] notify_url to the address of an ntfy topic (https://...).

ORT-8021:
  gravite: erreur
  titre: Service de la station en échec ou arrêté
  message: '{service} : {etat}.'
  causes:
  - Service arrêté après une panne (voir le journal)
  - Service désactivé ou non installé
  - Démarrage ou arrêt refusé par systemd
  preconisation: 'Voir le journal (TRX Console, menu 7 : journalctl -u {service} -n 50), corriger la cause, puis
    « Démarrer la station » ; s''il n''est pas installé : sudo bash install.sh.'
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-8021/
  depuis_version: 0.123.0
  en:
    titre: Station service failed or stopped
    message: '{service}: {etat}.'
    causes:
    - Service stopped after a failure (see the log)
    - Service disabled or not installed
    - Start or stop refused by systemd
    preconisation: 'Read the log (TRX Console, menu 7: journalctl -u {service} -n 50), fix the cause, then "Start
      the station"; if not installed: sudo bash install.sh.'

ORT-8022:
  gravite: avertissement
  titre: 'Fichier d''état de la passerelle illisible'
  message: 'Lecture du fichier d''état de la passerelle impossible ({erreur}) : passerelle considérée comme muette.'
  causes:
  - 'Fichier en cours d''écriture ou abîmé'
  - 'Droits du fichier'
  preconisation: 'Rien à faire si cela reste isolé ; sinon vérifier le dossier d''état et les droits, puis le rapport de dépannage.'
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-8022/
  depuis_version: 0.135.0
  en:
    titre: 'Gateway status file unreadable'
    message: 'Reading the gateway status file failed ({erreur}): gateway considered silent.'
    causes:
    - 'File being written or damaged'
    - 'File permissions'
    preconisation: 'Nothing to do if isolated; otherwise check the state folder and permissions, then the troubleshooting report.'

ORT-8023:
  gravite: avertissement
  titre: 'Relevé de la machine impossible'
  message: 'Relevé de la machine (mémoire, disque, Pi) impossible ({erreur}) : alertes de la machine suspendues.'
  causes:
  - 'Système de fichiers /proc ou /sys inaccessible'
  - 'Défaut du programme'
  preconisation: 'Signaler le problème avec le rapport de dépannage (menu 2.3 de TRX Console).'
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-8023/
  depuis_version: 0.135.0
  en:
    titre: 'Host reading failed'
    message: 'Host reading (memory, disk, Pi) failed ({erreur}): host alerts suspended.'
    causes:
    - '/proc or /sys file system unavailable'
    - 'Program defect'
    preconisation: 'Report the problem with the troubleshooting report (TRX Console menu 2.3).'

ORT-8024:
  gravite: erreur
  titre: 'Lancement ou arrêt des modules en erreur'
  message: 'Modules : {action} en erreur ({erreur}) ; la station fonctionne sans eux.'
  causes:
  - 'Manifeste ou réglage [modules] incohérent'
  - 'Défaut du programme'
  preconisation: 'Vérifier [modules] de station.toml, puis le rapport de dépannage.'
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-8024/
  depuis_version: 0.135.0
  en:
    titre: 'Module start or stop failed'
    message: 'Modules: {action} failed ({erreur}); the station runs without them.'
    causes:
    - 'Inconsistent manifest or [modules] setting'
    - 'Program defect'
    preconisation: 'Check [modules] in station.toml, then the troubleshooting report.'


# ====================================================================================================
# 9000–9999 : Configuration et installation
# ====================================================================================================

ORT-9001:
  gravite: erreur
  titre: station.toml invalide
  message: 'station.toml est refusé : {nb_problemes} problème(s). Premier : {probleme}.'
  causes:
  - Fichier TOML mal écrit (guillemet, crochet ou virgule manquant)
  - Réglage refusé par la validation (voir les entrées de la famille « station.toml »)
  - Configuration écrite pour une autre version de la station
  preconisation: Corriger la ligne indiquée (TRX Console, menu 14) ou relancer l'assistant de configuration (menu
    2). La station ne démarre pas tant que le fichier est refusé.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9001/
  depuis_version: 0.123.0
  en:
    titre: station.toml invalid
    message: 'station.toml is rejected: {nb_problemes} problem(s). First one: {probleme}.'
    causes:
    - Malformed TOML (missing quote, bracket or comma)
    - Setting rejected by validation (see the other station.toml entries)
    - Configuration written for another station version
    preconisation: Fix the reported line (TRX Console, menu 14) or run the setup wizard again (menu 2). The station
      will not start while the file is rejected.

ORT-9002:
  gravite: erreur
  titre: Réglage inconnu dans station.toml
  message: '[{section}] : clé inconnue « {cle} ».'
  causes:
  - Faute de frappe dans le nom d'un réglage
  - Réglage d'une version plus récente ou retiré depuis
  - Section mal placée
  preconisation: Vérifier l'orthographe dans la notice de station.toml, ou supprimer la ligne. Une clé inconnue
    est bloquante pour éviter qu'un réglage de sécurité mal orthographié soit ignoré.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9002/
  depuis_version: 0.123.0
  en:
    titre: Unknown setting in station.toml
    message: '[{section}]: unknown key "{cle}".'
    causes:
    - Typo in a setting name
    - Setting from a newer version, or removed since
    - Setting in the wrong section
    preconisation: Check the spelling against the station.toml reference, or remove the line. Unknown keys are blocking
      so that a misspelled safety setting is never silently ignored.

ORT-9003:
  gravite: erreur
  titre: Structure de station.toml invalide
  message: 'Structure invalide dans station.toml : {detail}.'
  causes:
  - Champ obligatoire absent (par exemple une bande [[bands]] sans nom)
  - Section écrite comme une valeur simple
  preconisation: Comparer la section à l'exemple config/station.example.toml, ou relancer l'assistant.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9003/
  depuis_version: 0.123.0
  en:
    titre: Invalid station.toml structure
    message: 'Invalid structure in station.toml: {detail}.'
    causes:
    - Mandatory field missing (e.g. a [[bands]] entry without a name)
    - Section written as a plain value
    preconisation: Compare the section with config/station.example.toml, or run the setup wizard again.

ORT-9004:
  gravite: erreur
  titre: Version du format de station.toml non prise en charge
  message: 'schema_version {version} non pris en charge (attendu : {attendu}).'
  causes:
  - Fichier écrit par une version très différente de la station
  - Valeur modifiée à la main
  preconisation: Remettre schema_version à la valeur attendue après vérification, ou refaire la configuration avec
    l'assistant.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9004/
  depuis_version: 0.123.0
  en:
    titre: Unsupported station.toml format version
    message: 'schema_version {version} is not supported (expected: {attendu}).'
    causes:
    - File written by a very different station version
    - Value edited by hand
    preconisation: Set schema_version back to the expected value after checking, or redo the configuration with
      the wizard.

ORT-9005:
  gravite: erreur
  titre: Réglage oui/non mal écrit
  message: '[{section}] {champ} doit valoir true ou false.'
  causes:
  - Valeur écrite entre guillemets ("true") ou en français (oui/non)
  - Nombre à la place d'un booléen
  preconisation: Écrire true ou false sans guillemets.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9005/
  depuis_version: 0.123.0
  en:
    titre: On/off setting malformed
    message: '[{section}] {champ} must be true or false.'
    causes:
    - Value written in quotes ("true") or as yes/no
    - Number instead of a boolean
    preconisation: Write true or false without quotes.

ORT-9006:
  gravite: erreur
  titre: Valeur de réglage hors limites
  message: '[{section}] {champ} : valeur {valeur} hors limites (de {min} à {max}).'
  causes:
  - Valeur saisie à la main hors de la plage permise
  - Unité confondue (secondes et millisecondes, % et dB)
  - Nombre décimal là où un entier est attendu
  preconisation: Remettre une valeur dans la plage indiquée (la notice de station.toml donne les bornes et la valeur
    par défaut).
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9006/
  depuis_version: 0.123.0
  en:
    titre: Setting out of range
    message: '[{section}] {champ}: value {valeur} out of range ({min} to {max}).'
    causes:
    - Value typed by hand outside the allowed range
    - Unit mix-up (seconds vs milliseconds, % vs dB)
    - Decimal number where an integer is expected
    preconisation: Put the value back within the stated range (the station.toml reference gives the limits and the
      default).

ORT-9007:
  gravite: erreur
  titre: Valeur de réglage mal formée
  message: '[{section}] {champ} : « {valeur} » n''a pas le format attendu ({format}).'
  causes:
  - Nom de mode, de module ou de compte avec des caractères interdits
  - Adresse IP, réseau CIDR, URL ou date mal écrits
  - Valeur choisie hors de la liste permise
  preconisation: Corriger la valeur d'après le format indiqué dans le message ou dans la notice de station.toml.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9007/
  depuis_version: 0.123.0
  en:
    titre: Malformed setting value
    message: '[{section}] {champ}: "{valeur}" does not have the expected format ({format}).'
    causes:
    - Mode, module or account name with forbidden characters
    - Malformed IP address, CIDR network, URL or date
    - Value outside the allowed list
    preconisation: Fix the value according to the format given in the message or in the station.toml reference.

ORT-9008:
  gravite: erreur
  titre: Seuils de réglage dans le mauvais ordre
  message: '[{section}] {champ_bas} doit rester plus petit que {champ_haut}.'
  causes:
  - Seuil d'avertissement réglé au-delà du seuil d'alerte ou de coupure
  - Un seul des deux seuils modifié
  preconisation: Régler le seuil d'avertissement avant celui d'alerte (ou de coupure), en gardant un écart.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9008/
  depuis_version: 0.123.0
  en:
    titre: Thresholds in the wrong order
    message: '[{section}] {champ_bas} must stay below {champ_haut}.'
    causes:
    - Warning threshold set above the alert or cut-off threshold
    - Only one of the two thresholds changed
    preconisation: Set the warning threshold below the alert (or cut-off) threshold, keeping a margin.

ORT-9009:
  gravite: erreur
  titre: Réglages de sécurité d'émission incohérents
  message: 'Réglage de sécurité refusé : {regle}.'
  causes:
  - TOT supérieur à son plafond, ou TOT absolu du superviseur pas au-dessus du plafond
  - Bip d'avertissement réglé après la fin du TOT
  - Délai de perte du battement inférieur à deux battements
  preconisation: 'Respecter 0 < tot_s <= tot_ceiling_s < tot_abs_s, 0 < warn_before_s < tot_s et heartbeat_timeout_ms
    >= 2 x heartbeat_interval_ms. Valeurs par défaut : 90 s, 120 s, 135 s, 10 s, 500 ms, 2000 ms.'
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9009/
  depuis_version: 0.123.0
  en:
    titre: Inconsistent transmit safety settings
    message: 'Safety setting rejected: {regle}.'
    causes:
    - TOT above its ceiling, or supervisor absolute TOT not above the ceiling
    - Warning beep set after the end of the TOT
    - Heartbeat loss delay shorter than two heartbeats
    preconisation: 'Keep 0 < tot_s <= tot_ceiling_s < tot_abs_s, 0 < warn_before_s < tot_s and heartbeat_timeout_ms
      >= 2 x heartbeat_interval_ms. Defaults: 90 s, 120 s, 135 s, 10 s, 500 ms, 2000 ms.'

ORT-9010:
  gravite: critique
  titre: rigctld exposé hors de la machine
  message: '[network] rigctld_host = {hote} : rigctld doit rester local (127.0.0.1), il n''a aucune authentification.'
  causes:
  - rigctld_host remplacé par une adresse du réseau
  - Essai d'un logiciel extérieur qui veut joindre rigctld
  preconisation: Remettre rigctld_host = "127.0.0.1". Pour piloter le poste à distance, passer par la page ou l'application,
    jamais par rigctld.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9010/
  depuis_version: 0.123.0
  en:
    titre: rigctld exposed outside the machine
    message: '[network] rigctld_host = {hote}: rigctld must stay local (127.0.0.1), it has no authentication.'
    causes:
    - rigctld_host set to a network address
    - Attempt to let an external program reach rigctld
    preconisation: Set rigctld_host = "127.0.0.1" again. For remote control use the web page or the app, never rigctld
      itself.

ORT-9011:
  gravite: critique
  titre: Réglage réservé interdit dans extra_conf
  message: '[rig] extra_conf : {cles} interdit(s) ici (réglé par [spectrum] ; serveur UDP de Hamlib sans authentification).'
  causes:
  - Option de rigctld ajoutée à la main pour ouvrir la diffusion du spectre
  - Copie d'une ligne de commande trouvée sur Internet
  preconisation: Retirer ces options de extra_conf et régler le spectre par la section [spectrum].
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9011/
  depuis_version: 0.123.0
  en:
    titre: Reserved option forbidden in extra_conf
    message: '[rig] extra_conf: {cles} not allowed here (set by [spectrum]; Hamlib UDP server has no authentication).'
    causes:
    - rigctld option added by hand to open spectrum streaming
    - Command line copied from the Internet
    preconisation: Remove these options from extra_conf and configure the spectrum in the [spectrum] section.

ORT-9012:
  gravite: erreur
  titre: Modèle ou port du poste manquant
  message: '[rig] {champ} : {detail}.'
  causes:
  - Configuration incomplète (assistant interrompu)
  - Port effacé lors d'un changement de poste
  preconisation: 'Relancer l''assistant (menu 2) : il cherche le modèle dans la liste de Hamlib et détecte le port.'
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9012/
  depuis_version: 0.123.0
  en:
    titre: Rig model or port missing
    message: '[rig] {champ}: {detail}.'
    causes:
    - Incomplete configuration (wizard interrupted)
    - Port cleared when changing radios
    preconisation: 'Run the setup wizard again (menu 2): it looks the model up in Hamlib''s list and detects the
      port.'

ORT-9013:
  gravite: erreur
  titre: Méthode PTT inconnue
  message: '[rig] ptt_type « {valeur} » invalide (choix : {choix}).'
  causes:
  - Faute de frappe (casse, espace)
  - Méthode non prise en charge par la station
  preconisation: Choisir une des méthodes proposées (CAT conseillé) ; l'assistant la propose à partir du poste.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9013/
  depuis_version: 0.123.0
  en:
    titre: Unknown PTT method
    message: '[rig] ptt_type "{valeur}" is invalid (choices: {choix}).'
    causes:
    - Typo (case, space)
    - Method not supported by the station
    preconisation: Pick one of the listed methods (CAT recommended); the wizard proposes one for your radio.

ORT-9014:
  gravite: erreur
  titre: Bande d'émission mal définie
  message: '[[bands]] « {bande} » : bornes invalides ({bas} à {haut} MHz).'
  causes:
  - Borne basse supérieure ou égale à la borne haute
  - Fréquence écrite en kHz au lieu de MHz
  - Borne nulle ou négative
  preconisation: Écrire low_mhz < high_mhz en MHz (ex. 7.000 et 7.200).
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9014/
  depuis_version: 0.123.0
  en:
    titre: Transmit band badly defined
    message: '[[bands]] "{bande}": invalid limits ({bas} to {haut} MHz).'
    causes:
    - Lower limit greater than or equal to the upper limit
    - Frequency written in kHz instead of MHz
    - Zero or negative limit
    preconisation: Write low_mhz < high_mhz in MHz (e.g. 7.000 and 7.200).

ORT-9015:
  gravite: erreur
  titre: Deux services sur le même port
  message: '{service} : le port {port} est déjà pris par {autre}.'
  causes:
  - bus_port, port de Breizh Audio Box ou port du spectre égal à un port déjà utilisé
  - Second port du spectre réglé sur le port CAT ou PTT du poste
  preconisation: Choisir un port libre (bus des modules, Breizh) ; pour le spectre, indiquer le SECOND port série
    du poste, réglé en CI-V.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9015/
  depuis_version: 0.123.0
  en:
    titre: Two services on the same port
    message: '{service}: port {port} is already used by {autre}.'
    causes:
    - bus_port, Breizh Audio Box port or spectrum port equal to a port already in use
    - Spectrum second port set to the radio's CAT or PTT port
    preconisation: Choose a free port (module bus, Breizh); for the spectrum, give the radio's SECOND serial port,
      set to CI-V.

ORT-9016:
  gravite: critique
  titre: Module réglé pour tourner en root
  message: '[modules] run_as : un module ne doit jamais tourner en root.'
  causes:
  - run_as = "root" écrit à la main pour contourner un problème de droits
  preconisation: Remettre le compte de service (trx) et corriger plutôt les droits du fichier en cause.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9016/
  depuis_version: 0.123.0
  en:
    titre: Module set to run as root
    message: '[modules] run_as: a module must never run as root.'
    causes:
    - run_as = "root" written by hand to work around a permission problem
    preconisation: Set the service account (trx) back and fix the permissions of the file at fault instead.

ORT-9017:
  gravite: erreur
  titre: Adresse de liaison refusée (non privée ou non chiffrée)
  message: '[{section}] {champ} : {probleme}.'
  causes:
  - Breizh Audio Box indiqué par un nom ou une adresse publique (le micro circule en clair)
  - Breizh activé sans adresse
  - Relais de présence en http:// vers une autre machine que 127.0.0.1
  preconisation: 'Breizh : adresse IP privée du PC de Breizh (10.x, 172.16-31.x, 192.168.x...). Présence : adresse
    https:// du relais.'
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9017/
  depuis_version: 0.123.0
  en:
    titre: Link address refused (not private or not encrypted)
    message: '[{section}] {champ}: {probleme}.'
    causes:
    - Breizh Audio Box given by name or by a public address (microphone audio travels in clear)
    - Breizh enabled without an address
    - Presence relay over http:// to a host other than 127.0.0.1
    preconisation: 'Breizh: private IP address of the Breizh PC (10.x, 172.16-31.x, 192.168.x...). Presence: https://
      address of the relay.'

ORT-9018:
  gravite: avertissement
  titre: Modification de station.toml refusée
  message: 'Changement REFUSÉ (la station ne démarrerait pas) : {probleme}. station.toml n''a pas été changé.'
  causes:
  - Valeur saisie refusée par la validation
  - Modification faite dans l'éditeur qui casse une règle
  preconisation: Reprendre la modification d'après le problème indiqué ; l'ancienne version reste en service.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9018/
  depuis_version: 0.123.0
  en:
    titre: station.toml change refused
    message: 'Change REFUSED (the station would not start): {probleme}. station.toml was not changed.'
    causes:
    - Value rejected by validation
    - Edit that breaks a rule
    preconisation: Redo the change according to the reported problem; the previous version stays in service.

ORT-9019:
  gravite: erreur
  titre: Enregistrement de station.toml impossible
  message: 'Enregistrement impossible ({cause}) : station.toml n''a pas été changé.'
  causes:
  - Copie de sauvegarde impossible (droits, disque plein)
  - station.toml modifié par ailleurs pendant la saisie
  - Mot de passe d'administration refusé (sudo)
  preconisation: Recommencer ; si l'échec persiste, vérifier l'espace disque et les droits sur /etc/trx-remote.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9019/
  depuis_version: 0.123.0
  en:
    titre: Saving station.toml failed
    message: 'Save failed ({cause}): station.toml was not changed.'
    causes:
    - Backup copy impossible (permissions, disk full)
    - station.toml changed elsewhere meanwhile
    - Administrator password refused (sudo)
    preconisation: Try again; if it keeps failing, check free disk space and permissions on /etc/trx-remote.

ORT-9020:
  gravite: avertissement
  titre: station.toml illisible pour ce compte
  message: Lecture de {fichier} impossible ({detail}). Si tu viens d'être ajouté au groupe « trx », ferme ta session
    puis rouvre-la.
  causes:
  - Compte de bureau pas encore dans le groupe trx (session ouverte avant l'installation)
  - Droits du fichier modifiés
  preconisation: Se déconnecter puis se reconnecter ; sinon relancer l'installation qui remet les droits (root:trx,
    0640).
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9020/
  depuis_version: 0.123.0
  en:
    titre: station.toml not readable by this account
    message: Cannot read {fichier} ({detail}). If you were just added to the "trx" group, log out and back in.
    causes:
    - Desktop account not yet in the trx group (session opened before installation)
    - File permissions changed
    preconisation: Log out and back in; otherwise rerun the installation, which restores the permissions (root:trx,
      0640).

ORT-9021:
  gravite: avertissement
  titre: Droits de station.toml incorrects
  message: 'Droits de station.toml : {probleme}.'
  causes:
  - Fichier recopié ou édité hors de TRX Console
  - 'Groupe trx absent du fichier : le service ne peut plus le lire'
  - Fichier lisible par tous (empreintes des mots de passe)
  preconisation: sudo chgrp trx {fichier} && sudo chmod 640 {fichier}, ou relancer l'installation.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9021/
  depuis_version: 0.123.0
  en:
    titre: Wrong station.toml permissions
    message: 'station.toml permissions: {probleme}.'
    causes:
    - File copied or edited outside TRX Console
    - 'trx group missing: the service can no longer read it'
    - World-readable file (password hashes)
    preconisation: sudo chgrp trx {fichier} && sudo chmod 640 {fichier}, or rerun the installation.

ORT-9022:
  gravite: info
  titre: Station pas encore configurée
  message: '{fichier} absent : station pas encore configurée.'
  causes:
  - Première installation
  - Configuration effacée à la désinstallation
  preconisation: TRX Console, menu 2 (assistant de configuration).
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9022/
  depuis_version: 0.123.0
  en:
    titre: Station not configured yet
    message: '{fichier} missing: station not configured yet.'
    causes:
    - First installation
    - Configuration erased at uninstall
    preconisation: TRX Console, menu 2 (setup wizard).

ORT-9023:
  gravite: info
  titre: Aucun éditeur de texte
  message: 'Aucun éditeur de texte trouvé : installe nano (sudo apt install nano).'
  causes:
  - Système minimal sans nano ni vi
  preconisation: sudo apt install nano, puis menu 14 à nouveau.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9023/
  depuis_version: 0.123.0
  en:
    titre: No text editor
    message: 'No text editor found: install nano (sudo apt install nano).'
    causes:
    - Minimal system without nano or vi
    preconisation: sudo apt install nano, then menu 14 again.

ORT-9101:
  gravite: erreur
  titre: Profil de poste illisible ou abîmé
  message: 'Profil « {profil} » inutilisable : {detail}.'
  causes:
  - Fichier de profil abîmé (TOML invalide)
  - Fichier qui n'est pas un profil (en-tête [profil] absent)
  - Droits de lecture
  preconisation: Supprimer ce profil (menu 18) et réenregistrer le poste depuis une configuration qui fonctionne.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9101/
  depuis_version: 0.123.0
  en:
    titre: Radio profile unreadable or damaged
    message: 'Profile "{profil}" unusable: {detail}.'
    causes:
    - Damaged profile file (invalid TOML)
    - File is not a profile ([profil] header missing)
    - Read permissions
    preconisation: Delete this profile (menu 18) and save the radio again from a working configuration.

ORT-9102:
  gravite: erreur
  titre: Profil de poste d'une autre version
  message: 'Profil « {profil} » enregistré au format {format} (version {version}) : {detail}.'
  causes:
  - Profil enregistré par une version plus récente de la station
  - Profil trop ancien dont la conversion n'est pas possible
  - Section inattendue hors du poste
  preconisation: 'Version plus récente : mettre la station à jour. Profil trop ancien : refaire la configuration
    du poste (menu 2) puis le réenregistrer (menu 18).'
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9102/
  depuis_version: 0.123.0
  en:
    titre: Radio profile from another version
    message: 'Profile "{profil}" saved in format {format} (version {version}): {detail}.'
    causes:
    - Profile saved by a newer station version
    - Profile too old to be converted
    - Unexpected section outside the radio settings
    preconisation: 'Newer version: update the station. Too old: redo the radio configuration (menu 2) then save
      it again (menu 18).'

ORT-9103:
  gravite: erreur
  titre: Profil de poste refusé par la validation
  message: 'Profil refusé, la station ne démarrerait pas avec : {probleme}.'
  causes:
  - Profil d'une ancienne version dont un réglage n'est plus permis
  - station.toml actuel lui-même illisible
  preconisation: Corriger d'abord station.toml (menu 14) si c'est lui qui est en cause ; sinon refaire la configuration
    du poste (menu 2) puis le réenregistrer (menu 18).
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9103/
  depuis_version: 0.123.0
  en:
    titre: Radio profile rejected by validation
    message: 'Profile rejected, the station would not start with: {probleme}.'
    causes:
    - Profile from an old version with a setting no longer allowed
    - Current station.toml itself unreadable
    preconisation: First fix station.toml (menu 14) if it is at fault; otherwise redo the radio configuration (menu
      2) then save it again (menu 18).

ORT-9104:
  gravite: info
  titre: Nom de profil refusé
  message: 'Nom refusé : 40 caractères au plus, lettres, chiffres, espaces et - _ . + seulement.'
  causes:
  - Caractère spécial ou nom trop long
  preconisation: Choisir un nom plus simple.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9104/
  depuis_version: 0.123.0
  en:
    titre: Profile name refused
    message: 'Name refused: 40 characters at most, letters, digits, spaces and - _ . + only.'
    causes:
    - Special character or name too long
    preconisation: Choose a simpler name.

ORT-9105:
  gravite: erreur
  titre: secrets.toml illisible ou mal formé
  message: 'secrets.toml : {probleme}.'
  causes:
  - Fichier édité à la main (TOML invalide, table [secrets] absente)
  - Entrée au nom invalide
  - Droits de lecture
  preconisation: Ressaisir les mots de passe des sources par TRX Console, menu 12 (le fichier est réécrit proprement
    en 0600).
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9105/
  depuis_version: 0.123.0
  en:
    titre: secrets.toml unreadable or malformed
    message: 'secrets.toml: {probleme}.'
    causes:
    - File edited by hand (invalid TOML, missing [secrets] table)
    - Entry with an invalid name
    - Read permissions
    preconisation: Re-enter the source passwords with TRX Console, menu 12 (the file is rewritten cleanly with mode
      0600).

ORT-9106:
  gravite: avertissement
  titre: Mot de passe de source refusé
  message: 'Mot de passe refusé : {probleme}.'
  causes:
  - Valeur vide ou trop longue
  - Caractère de contrôle (il permettrait d'envoyer une commande au serveur)
  preconisation: Saisir le mot de passe sans retour à la ligne ni caractère invisible.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9106/
  depuis_version: 0.123.0
  en:
    titre: Source password refused
    message: 'Password refused: {probleme}.'
    causes:
    - Empty or too long value
    - Control character (it could send a command to the server)
    preconisation: Type the password without line breaks or invisible characters.

ORT-9107:
  gravite: avertissement
  titre: secrets.toml lisible par d'autres comptes
  message: 'secrets.toml : droits {mode} : lisible par d''autres comptes (0600 attendu).'
  causes:
  - Fichier recopié ou édité avec un autre outil
  preconisation: 'Le module les corrige lui-même quand il le peut ; sinon : sudo chmod 600 {fichier} && sudo chown
    trx {fichier}.'
  action_auto: repli_correction_droits
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9107/
  depuis_version: 0.123.0
  en:
    titre: secrets.toml readable by other accounts
    message: 'secrets.toml: mode {mode}: readable by other accounts (0600 expected).'
    causes:
    - File copied or edited with another tool
    preconisation: 'The module fixes it itself when it can; otherwise: sudo chmod 600 {fichier} && sudo chown trx
      {fichier}.'

ORT-9108:
  gravite: avertissement
  titre: Identifiant de station invalide
  message: '{fichier} : identifiant de station invalide. Supprimer le fichier pour en générer un nouveau.'
  causes:
  - Fichier station-id abîmé ou modifié à la main
  - Disque en lecture seule à la création
  preconisation: 'Supprimer le fichier station-id du dossier d''état : la passerelle en recrée un au démarrage.
    La station fonctionne sans.'
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9108/
  depuis_version: 0.123.0
  en:
    titre: Invalid station identifier
    message: '{fichier}: invalid station identifier. Delete the file to generate a new one.'
    causes:
    - station-id file damaged or edited by hand
    - Read-only disk at creation time
    preconisation: 'Delete the station-id file from the state folder: the gateway creates a new one at start-up.
      The station works without it.'

ORT-9201:
  gravite: avertissement
  titre: Mise en page refusée
  message: 'Mise en page refusée : {erreur}.'
  causes:
  - Widget mal placé (hors grille, chevauchement, trop petit)
  - Champ ou type de widget inconnu, conteneur mal formé
  - Profil trop volumineux ou JSON invalide
  preconisation: Corriger la mise en page dans le designer ; rien n'est enregistré tant qu'elle est refusée.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - layout_invalid
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9201/
  depuis_version: 0.123.0
  en:
    titre: Layout refused
    message: 'Layout refused: {erreur}.'
    causes:
    - Widget badly placed (outside the grid, overlapping, too small)
    - Unknown field or widget type, malformed container
    - Profile too large or invalid JSON
    preconisation: Fix the layout in the designer; nothing is saved while it is refused.

ORT-9202:
  gravite: avertissement
  titre: Thème refusé (contraste ou couleur d'émission)
  message: 'Thème refusé : {erreur}.'
  causes:
  - Contraste insuffisant entre deux couleurs
  - Couleur trop proche de la couleur d'émission, réservée
  - Police non autorisée ou taille hors limites
  preconisation: Choisir des couleurs plus contrastées et garder le rouge d'émission pour l'émission seule.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - layout_invalid
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9202/
  depuis_version: 0.123.0
  en:
    titre: Theme refused (contrast or transmit colour)
    message: 'Theme refused: {erreur}.'
    causes:
    - Insufficient contrast between two colours
    - Colour too close to the reserved transmit colour
    - Font not allowed or size out of range
    preconisation: Choose more contrasting colours and keep the transmit red for transmitting only.

ORT-9203:
  gravite: avertissement
  titre: Mise en page d'un format plus récent
  message: 'Format {format} trop récent pour cette station (format {format_station}) : mets la station à jour.'
  causes:
  - Mise en page créée par une application ou un designer plus récents que la station
  preconisation: Mettre la station à jour (menu 10 ou 13).
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - layout_invalid
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9203/
  depuis_version: 0.123.0
  en:
    titre: Layout from a newer format
    message: 'Format {format} too recent for this station (format {format_station}): update the station.'
    causes:
    - Layout created by an app or designer newer than the station
    preconisation: Update the station (menu 10 or 13).

ORT-9204:
  gravite: avertissement
  titre: 'Mise en page enregistrée abîmée : profil d''usine servi'
  message: 'Profil de mise en page de « {compte} » illisible ou invalide ({detail}) : copie conservée, profil d''usine
    servi.'
  causes:
  - Fichier abîmé (coupure de courant, disque)
  - Profil devenu invalide après une mise à jour de la station
  preconisation: Refaire la mise en page dans le designer ; la copie abîmée est gardée pour analyse.
  action_auto: repli_profil_usine
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9204/
  depuis_version: 0.123.0
  en:
    titre: 'Saved layout damaged: factory layout served'
    message: 'Layout profile of "{compte}" unreadable or invalid ({detail}): copy kept, factory layout served.'
    causes:
    - Damaged file (power cut, disk)
    - Profile became invalid after a station update
    preconisation: Redo the layout in the designer; the damaged copy is kept for analysis.

ORT-9205:
  gravite: info
  titre: Widget lié à une fonction absente du poste
  message: '{widget} : « {fonction} » n''est pas déclaré par ce poste ; le widget sera masqué.'
  causes:
  - Mise en page faite pour un autre poste
  - Fonction non exposée par Hamlib pour ce modèle
  preconisation: Aucune action nécessaire, ou retirer le widget de la mise en page.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9205/
  depuis_version: 0.123.0
  en:
    titre: Widget bound to a function the radio lacks
    message: '{widget}: "{fonction}" is not declared by this radio; the widget will be hidden.'
    causes:
    - Layout made for another radio
    - Function not exposed by Hamlib for this model
    preconisation: No action needed, or remove the widget from the layout.

ORT-9301:
  gravite: erreur
  titre: Python absent ou trop ancien
  message: 'Python {version} : Python 3.11 ou plus récent est nécessaire.'
  causes:
  - Debian 11 ou plus ancien
  - Windows sans Python, ou Python installé sans « Add python.exe to PATH »
  preconisation: Debian 12 et plus ; sous Windows, installer Python 3.12 (python.org ou winget) puis relancer installer.cmd.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9301/
  depuis_version: 0.123.0
  en:
    titre: Python missing or too old
    message: 'Python {version}: Python 3.11 or newer is required.'
    causes:
    - Debian 11 or older
    - Windows without Python, or Python installed without "Add python.exe to PATH"
    preconisation: Debian 12 or later; on Windows install Python 3.12 (python.org or winget) then rerun installer.cmd.

ORT-9302:
  gravite: erreur
  titre: Modules Python manquants
  message: 'Module {module} absent : {role} indisponible.'
  causes:
  - Installation interrompue
  - Environnement Python abîmé
  - 'Indicateur Windows : pystray ou Pillow absents'
  - 'trx-monitor : Textual absent'
  preconisation: 'Relancer l''installation (sudo bash install.sh ; sous Windows : installer.cmd).'
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9302/
  depuis_version: 0.123.0
  en:
    titre: Missing Python modules
    message: 'Module {module} missing: {role} unavailable.'
    causes:
    - Interrupted installation
    - Damaged Python environment
    - 'Windows indicator: pystray or Pillow missing'
    - 'trx-monitor: Textual missing'
    preconisation: 'Rerun the installation (sudo bash install.sh; on Windows: installer.cmd).'

ORT-9303:
  gravite: avertissement
  titre: Compte absent d'un groupe nécessaire
  message: 'Groupe {groupe} : {detail}.'
  causes:
  - Compte pas encore inscrit dans dialout (ports série) ou trx (configuration)
  - Inscrit, mais session ouverte avant l'inscription
  - Installation lancée sans sudo depuis un compte utilisateur
  preconisation: 'Se déconnecter puis se reconnecter ; sinon : sudo usermod -aG {groupe} {compte}.'
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9303/
  depuis_version: 0.123.0
  en:
    titre: Account missing from a required group
    message: 'Group {groupe}: {detail}.'
    causes:
    - Account not yet in dialout (serial ports) or trx (configuration)
    - Added, but session opened before
    - Installation run without sudo from a user account
    preconisation: 'Log out and back in; otherwise: sudo usermod -aG {groupe} {compte}.'

ORT-9304:
  gravite: erreur
  titre: Paquet d'installation incomplet
  message: 'Fichier manquant : {fichier}. Décompresse tout le zip et lance install.sh depuis son dossier.'
  causes:
  - Zip décompressé partiellement
  - install.sh lancé depuis un autre dossier
  - Version illisible dans pyproject.toml
  preconisation: Décompresser tout le zip dans un dossier vide et relancer sudo bash install.sh depuis ce dossier.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9304/
  depuis_version: 0.123.0
  en:
    titre: Installation package incomplete
    message: 'Missing file: {fichier}. Unpack the whole zip and run install.sh from its folder.'
    causes:
    - Zip partially unpacked
    - install.sh run from another folder
    - Unreadable version in pyproject.toml
    preconisation: Unpack the whole zip in an empty folder and run sudo bash install.sh from there.

ORT-9305:
  gravite: erreur
  titre: Droits administrateur nécessaires
  message: 'Cette installation a besoin des droits administrateur. Tape : sudo bash {script}.'
  causes:
  - Script lancé sans sudo
  preconisation: Relancer avec sudo.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9305/
  depuis_version: 0.123.0
  en:
    titre: Administrator rights required
    message: 'This installation needs administrator rights. Type: sudo bash {script}.'
    causes:
    - Script run without sudo
    preconisation: Run it again with sudo.

ORT-9306:
  gravite: erreur
  titre: Pas d'accès Internet pendant l'installation
  message: 'Pas d''accès à {hote} : vérifie la connexion Internet.'
  causes:
  - PC hors ligne
  - DNS en panne
  - Pare-feu d'entreprise qui bloque deb.debian.org ou pypi.org
  preconisation: Rétablir la connexion Internet puis relancer l'installation.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9306/
  depuis_version: 0.123.0
  en:
    titre: No Internet access during installation
    message: 'No access to {hote}: check the Internet connection.'
    causes:
    - PC offline
    - DNS failure
    - Corporate firewall blocking deb.debian.org or pypi.org
    preconisation: Restore the Internet connection then rerun the installation.

ORT-9307:
  gravite: erreur
  titre: Installation des paquets Debian impossible
  message: '{etape} impossible (apt-get).'
  causes:
  - Dépôts Debian injoignables
  - Autre installation apt en cours (verrou)
  - Sources APT mal configurées
  preconisation: Attendre la fin de l'autre installation, vérifier sudo apt-get update à la main, puis relancer.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9307/
  depuis_version: 0.123.0
  en:
    titre: Debian packages installation failed
    message: '{etape} failed (apt-get).'
    causes:
    - Debian repositories unreachable
    - Another apt operation running (lock)
    - Badly configured APT sources
    preconisation: Wait for the other installation to finish, try sudo apt-get update by hand, then rerun.

ORT-9308:
  gravite: erreur
  titre: Installation des modules Python impossible
  message: 'Installation des modules Python impossible : {detail}.'
  causes:
  - Pas d'accès à pypi.org (Internet, pare-feu d'entreprise)
  - 'EMPREINTE DIFFÉRENTE : module modifié par rapport à celui figé dans requirements.lock'
  - Paquet sans requirements.lock (ancien ou incomplet)
  - Création de l'environnement Python impossible
  preconisation: 'Vérifier Internet ; une empreinte différente est un signal de sécurité : ne pas contourner, demander
    un paquet officiel récent.'
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9308/
  depuis_version: 0.123.0
  en:
    titre: Python modules could not be installed
    message: 'Python modules installation failed: {detail}.'
    causes:
    - No access to pypi.org (Internet, corporate firewall)
    - 'HASH MISMATCH: module differs from the one pinned in requirements.lock'
    - Package without requirements.lock (old or incomplete)
    - Python environment cannot be created
    preconisation: 'Check the Internet; a hash mismatch is a security signal: do not bypass it, ask for a recent
      official package.'

ORT-9309:
  gravite: erreur
  titre: Installation de TRX distant ou activation de la version impossible
  message: '{etape} impossible (détails dans {journal}).'
  causes:
  - Paquet abîmé
  - Disque plein
  - Version déjà active (--reactiver)
  - --reactiver lancé hors de /opt/trx-remote/releases/<version>
  preconisation: Lire le compte-rendu ({journal}), libérer de la place si besoin, puis relancer depuis un zip complet.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9309/
  depuis_version: 0.123.0
  en:
    titre: Installing TRX distant or activating the version failed
    message: '{etape} failed (details in {journal}).'
    causes:
    - Damaged package
    - Disk full
    - Version already active (--reactiver)
    - --reactiver run outside /opt/trx-remote/releases/<version>
    preconisation: Read the log ({journal}), free some space if needed, then rerun from a complete zip.

ORT-9310:
  gravite: avertissement
  titre: Configuration refusée par la version installée
  message: 'Configuration refusée par la version {version} : {suite}.'
  causes:
  - Réglage refusé par la nouvelle validation (nouvelle règle, clé retirée)
  preconisation: Corriger station.toml (menu 14) ou relancer l'assistant ; au retour arrière, la configuration d'avant
    la mise à jour est remise automatiquement si elle existe.
  action_auto: repli_config_precedente
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9310/
  depuis_version: 0.123.0
  en:
    titre: Configuration refused by the installed version
    message: 'Configuration refused by version {version}: {suite}.'
    causes:
    - Setting rejected by the new validation (new rule, removed key)
    preconisation: Fix station.toml (menu 14) or rerun the wizard; on rollback the pre-update configuration is restored
      automatically when available.

ORT-9311:
  gravite: critique
  titre: 'Empreinte d''un module Python différente : installation arrêtée'
  message: 'Le module {module} téléchargé n''a pas l''empreinte attendue ({detail}) : rien n''est installé.'
  causes:
  - Fichier modifié en chemin (proxy, miroir compromis)
  - requirements.lock périmé par rapport au paquet
  preconisation: Ne pas forcer l'installation. Réessayer plus tard ou depuis un autre réseau ; si l'écart persiste,
    le signaler avec le message complet.
  action_auto: arreter_installation
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9311/
  depuis_version: 0.126.0
  en:
    titre: 'Python module hash mismatch: installation stopped'
    message: 'Downloaded module {module} does not have the expected hash ({detail}): nothing is installed.'
    causes:
    - File altered in transit (proxy, compromised mirror)
    - requirements.lock out of date for the package
    preconisation: Do not force the installation. Try again later or from another network; if the mismatch persists,
      report it with the full message.

ORT-9501:
  gravite: erreur
  titre: Journal Android illisible
  message: 'Lecture impossible : {detail}.'
  causes:
  - Zip abîmé ou incomplet
  - Zip qui n'est pas un rapport de bug Android (aucun bugreport-….txt)
  - Fichier introuvable
  preconisation: Refaire le rapport de bug sur le téléphone (docs/site/android/journaux.html) et le renvoyer en
    entier.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9501/
  depuis_version: 0.123.0
  en:
    titre: Android log unreadable
    message: 'Cannot read: {detail}.'
    causes:
    - Damaged or incomplete zip
    - Zip that is not an Android bug report (no bugreport-….txt)
    - File not found
    preconisation: Take the bug report again on the phone (docs/site/android/journaux.html) and send it whole.

ORT-9502:
  gravite: avertissement
  titre: 'Téléphone : copie ou lecture du journal impossible'
  message: 'Téléphone : {detail}.'
  causes:
  - Téléphone débranché ou débogage USB non autorisé
  - adb introuvable
  - Fichier absent de /sdcard/Download
  preconisation: Brancher le téléphone, autoriser le débogage USB, ou copier le fichier à la main dans Téléchargements.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9502/
  depuis_version: 0.123.0
  en:
    titre: 'Phone: cannot copy or read the log'
    message: 'Phone: {detail}.'
    causes:
    - Phone unplugged or USB debugging not authorised
    - adb not found
    - File missing from /sdcard/Download
    preconisation: Plug the phone in, authorise USB debugging, or copy the file by hand to Downloads.

ORT-9503:
  gravite: avertissement
  titre: Rapport HTML du journal Android non écrit
  message: Rapport HTML non écrit ({detail}).
  causes:
  - Dossier en lecture seule
  - Disque plein
  preconisation: Indiquer un autre emplacement avec --html CHEMIN.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9503/
  depuis_version: 0.123.0
  en:
    titre: Android log HTML report not written
    message: HTML report not written ({detail}).
    causes:
    - Read-only folder
    - Disk full
    preconisation: Give another location with --html PATH.

ORT-9504:
  gravite: erreur
  titre: 'Application Android : plantage'
  message: '{type} de l''application : {exception}.'
  causes:
  - Exception non rattrapée dans l'application (Kotlin)
  - 'Plantage natif (WebRTC, audio) : signal du code natif'
  preconisation: Envoyer le rapport HTML (sans données personnelles) avec la version de l'application.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - plantage
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9504/
  depuis_version: 0.123.0
  en:
    titre: 'Android app: crash'
    message: 'App {type}: {exception}.'
    causes:
    - Uncaught exception in the app (Kotlin)
    - 'Native crash (WebRTC, audio): signal from native code'
    preconisation: Send the HTML report (no personal data) with the app version.
  deprecated: true
  remplace_par: AND-1001 (catalogue de l'application Android, AND-catalog.yaml)

ORT-9505:
  gravite: erreur
  titre: Application Android bloquée (ANR)
  message: 'Application bloquée (ANR) : {detail}.'
  causes:
  - Fil principal de l'application bloqué (réseau, audio, disque)
  preconisation: Envoyer le rapport HTML avec ce qui était fait au moment du blocage.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - blocage
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9505/
  depuis_version: 0.123.0
  en:
    titre: Android app not responding (ANR)
    message: 'App not responding (ANR): {detail}.'
    causes:
    - App main thread blocked (network, audio, disk)
    preconisation: Send the HTML report with what was being done when it froze.
  deprecated: true
  remplace_par: AND-1002 (catalogue de l'application Android, AND-catalog.yaml)

ORT-9506:
  gravite: avertissement
  titre: 'Application Android : installation en échec'
  message: 'Installation (Play Store) : {detail}.'
  causes:
  - Version debug installée qui bloque celle du Store (autre signature)
  - Fichier APK abîmé
  - Erreur du Play Store (DF-…)
  preconisation: Désinstaller l'ancienne version (debug) puis réinstaller depuis le Store.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - installation
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9506/
  depuis_version: 0.123.0
  en:
    titre: 'Android app: install failed'
    message: 'Install (Play Store): {detail}.'
    causes:
    - Debug build installed, blocking the Store build (different signature)
    - Damaged APK
    - Play Store error (DF-…)
    preconisation: Uninstall the old (debug) version then reinstall from the Store.
  deprecated: true
  remplace_par: AND-1003 (catalogue de l'application Android, AND-catalog.yaml)

ORT-9507:
  gravite: avertissement
  titre: Application Android arrêtée par Android
  message: 'Application arrêtée par Android : {detail}.'
  causes:
  - Manque de mémoire du téléphone (lowmemorykiller)
  - Économiseur de batterie qui tue le service
  preconisation: Exclure l'application de l'optimisation de batterie ; fermer les applications gourmandes.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - arret
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9507/
  depuis_version: 0.123.0
  en:
    titre: Android app killed by Android
    message: 'App stopped by Android: {detail}.'
    causes:
    - Phone low on memory (lowmemorykiller)
    - Battery saver killing the service
    preconisation: Exclude the app from battery optimisation; close heavy apps.
  deprecated: true
  remplace_par: AND-1004 (catalogue de l'application Android, AND-catalog.yaml)

ORT-9508:
  gravite: info
  titre: Erreurs écrites par l'application Android
  message: 'Erreurs écrites par l''application : {tag} : {message} ({nombre} fois).'
  causes:
  - Erreurs journalisées par l'application ou par WebRTC dans son processus
  preconisation: Lire les plus fréquentes dans le rapport HTML ; à joindre à un rapport de problème.
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - erreur
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9508/
  depuis_version: 0.123.0
  en:
    titre: Errors logged by the Android app
    message: 'Errors logged by the app: {tag}: {message} ({nombre} times).'
    causes:
    - Errors logged by the app or by WebRTC in its process
    preconisation: Read the most frequent ones in the HTML report; attach them to a problem report.
  deprecated: true
  remplace_par: AND-1005 (catalogue de l'application Android, AND-catalog.yaml)

ORT-9701:
  gravite: erreur
  titre: Module pyserial absent (spectre HF)
  message: 'Module pyserial absent : pip install pyserial (spectre désactivé).'
  causes:
  - Installation incomplète des modules Python de la station
  preconisation: Réinstaller la station (paquet officiel) ou installer pyserial dans son environnement Python.
  action_auto: repli_mode_normal
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - no_pyserial
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9701/
  depuis_version: 0.123.0
  en:
    titre: pyserial module missing (HF spectrum)
    message: 'pyserial module missing: pip install pyserial (spectrum disabled).'
    causes:
    - Incomplete install of the station's Python modules
    preconisation: Reinstall the station (official package) or install pyserial in its Python environment.

ORT-9702:
  gravite: avertissement
  titre: Fichier des mémoires illisible
  message: 'Fichier de mémoires illisible ({detail}) : copie conservée ({fichier}.corrupt), démarrage avec une liste
    vide.'
  causes:
  - Fichier abîmé (coupure de courant pendant l'écriture, disque)
  - Fichier modifié à la main avec une erreur
  preconisation: Récupérer les mémoires dans la copie .corrupt si possible ; sinon les recréer depuis la page ou
    l'application.
  action_auto: repli_liste_vide
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9702/
  depuis_version: 0.123.0
  en:
    titre: Memory file unreadable
    message: 'Memory file unreadable ({detail}): copy kept ({fichier}.corrupt), starting with an empty list.'
    causes:
    - Damaged file (power cut during write, disk)
    - File edited by hand with an error
    preconisation: Recover the memories from the .corrupt copy if possible; otherwise recreate them from the page
      or the app.

ORT-9703:
  gravite: info
  titre: Mémoires indisponibles sur cette station
  message: Les mémoires ne sont pas disponibles sur cette station.
  causes:
  - Passerelle lancée sans fichier de mémoires (configuration ou version)
  preconisation: Mettre la station à jour ; vérifier le dossier d'état.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  codes_machine:
  - memories_unavailable
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9703/
  depuis_version: 0.123.0
  en:
    titre: Memories unavailable on this station
    message: Memories are not available on this station.
    causes:
    - Gateway started without a memory store (configuration or version)
    preconisation: Update the station; check the state folder.

ORT-9704:
  gravite: avertissement
  titre: Fiche de qualification invalide
  message: 'Fiche {fichier} écartée : {problemes}.'
  causes:
  - Fichier TOML illisible ou mal formé
  - Section ou champ inconnu
  - Statut utilisable alors que le socle n'est pas disponible
  - Dossier du catalogue introuvable
  preconisation: Corriger la fiche (trx-qualif --catalogue DOSSIER la vérifie) ; une fiche invalide n'est jamais
    utilisée à moitié.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9704/
  depuis_version: 0.123.0
  en:
    titre: Invalid qualification sheet
    message: 'Sheet {fichier} rejected: {problemes}.'
    causes:
    - Unreadable or malformed TOML file
    - Unknown section or field
    - Usable status while the core is not available
    - Catalogue folder not found
    preconisation: Fix the sheet (trx-qualif --catalogue FOLDER checks it); an invalid sheet is never half-used.

ORT-9705:
  gravite: info
  titre: Paramètre d'outil hors bornes
  message: '{parametre} : {probleme}.'
  causes:
  - --tot hors de 2 à 60 s ou trop proche du délai de battement
  - --cycles hors de 100 à 100 000
  - --tx-levels au-dessus de -12 dBFS (risque de saturation)
  preconisation: Relancer la commande avec une valeur permise (voir --help).
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9705/
  depuis_version: 0.123.0
  en:
    titre: Tool parameter out of range
    message: '{parametre}: {probleme}.'
    causes:
    - --tot outside 2 to 60 s or too close to the heartbeat timeout
    - --cycles outside 100 to 100,000
    - --tx-levels above -12 dBFS (clipping risk)
    preconisation: Run the command again with an allowed value (see --help).

ORT-9706:
  gravite: avertissement
  titre: 'station.toml modifié mais invalide : comptes inchangés'
  message: 'station.toml modifié mais invalide : comptes et visiteurs inchangés ({problemes}).'
  causes:
  - Modification à la main avec une erreur
  - Fichier en cours d'écriture (illisible un instant)
  preconisation: Corriger station.toml (TRX Console menu 14) ; la station reprend la nouvelle liste dès que le fichier
    est valide.
  action_auto: nouvel_essai
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9706/
  depuis_version: 0.123.0
  en:
    titre: 'station.toml changed but invalid: accounts unchanged'
    message: 'station.toml changed but invalid: accounts and listeners unchanged ({problemes}).'
    causes:
    - Hand edit with an error
    - File being written (unreadable for a moment)
    preconisation: Fix station.toml (TRX Console menu 14); the station takes the new list as soon as the file is
      valid.

ORT-9707:
  gravite: critique
  titre: Bibliothèque audio absente (sounddevice / PortAudio)
  message: 'sounddevice indisponible : {erreur}.'
  causes:
  - Module Python sounddevice non installé
  - 'Bibliothèque PortAudio absente du système (Linux : libportaudio2)'
  preconisation: 'Réinstaller la station (paquet officiel) ; sous Debian / Pi : sudo apt install libportaudio2.'
  action_auto: arreter_passerelle
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9707/
  depuis_version: 0.123.0
  en:
    titre: Audio library missing (sounddevice / PortAudio)
    message: 'sounddevice unavailable: {erreur}.'
    causes:
    - Python module sounddevice not installed
    - 'PortAudio library missing on the system (Linux: libportaudio2)'
    preconisation: 'Reinstall the station (official package); on Debian / Pi: sudo apt install libportaudio2.'

ORT-9708:
  gravite: erreur
  titre: Source ou sortie audio d'essai invalide
  message: 'Réglage audio « {reglage} » invalide : {erreur}.'
  causes:
  - Fichier WAV d'essai (file:…) absent, illisible ou vide
  - WAV qui n'est pas en PCM 16 bits 48 kHz mono ou stéréo
  - Fichier de sortie impossible à créer
  - 'Valeur de tone: / click: qui n''est pas un nombre'
  preconisation: Corriger [audio] capture_device / playback_device dans station.toml (réservés aux essais sans poste)
    ou relancer trx-setup.
  action_auto: arreter_passerelle
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9708/
  depuis_version: 0.123.0
  en:
    titre: Invalid test audio source or output
    message: 'Audio setting "{reglage}" is invalid: {erreur}.'
    causes:
    - Test WAV file (file:…) missing, unreadable or empty
    - WAV not 16-bit PCM 48 kHz mono or stereo
    - Output file cannot be created
    - 'tone: / click: value is not a number'
    preconisation: Fix [audio] capture_device / playback_device in station.toml (test values without a rig) or run
      trx-setup again.

ORT-9709:
  gravite: erreur
  titre: 'Modules WebRTC absents : API non démarrée'
  message: 'API WebRTC indisponible ({erreur}) : réception seule.'
  causes:
  - aiortc ou aiohttp non installés
  - Installation incomplète ou modules compilés manquants
  preconisation: Réinstaller la station depuis le paquet officiel (modules vérifiés par empreinte).
  action_auto: repli_reception_seule
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9709/
  depuis_version: 0.123.0
  en:
    titre: 'WebRTC modules missing: API not started'
    message: 'WebRTC API unavailable ({erreur}): receive only.'
    causes:
    - aiortc or aiohttp not installed
    - Incomplete installation or missing compiled modules
    preconisation: Reinstall the station from the official package (modules checked by hash).

ORT-9710:
  gravite: avertissement
  titre: 'Aucun compte client : pas d''API'
  message: 'Aucun client autorisé ([[clients]]) : pas d''API, le poste reste en réception seule.'
  causes:
  - station.toml sans section [[clients]]
  - Assistant interrompu avant la création d'un compte
  preconisation: Créer un compte opérateur avec TRX Console ou trx-setup.
  action_auto: repli_reception_seule
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9710/
  depuis_version: 0.123.0
  en:
    titre: 'No client account: no API'
    message: 'No authorized client ([[clients]]): no API, the rig stays receive only.'
    causes:
    - station.toml without [[clients]]
    - Wizard interrupted before an account was created
    preconisation: Create an operator account with TRX Console or trx-setup.

ORT-9711:
  gravite: erreur
  titre: 'Exposition de l''API jugée dangereuse : API non démarrée'
  message: 'API non démarrée (réception seule) : {probleme}.'
  causes:
  - API ouverte hors de la boucle locale sans HTTPS ni proxy déclaré
  - Compte avec un ancien jeton en clair exposé au réseau
  preconisation: Activer HTTPS (tls_cert / tls_key ou proxy inverse) ou écouter seulement sur un VPN (docs/acces-distant.md).
  action_auto: repli_reception_seule
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9711/
  depuis_version: 0.123.0
  en:
    titre: 'API exposure deemed unsafe: API not started'
    message: 'API not started (receive only): {probleme}.'
    causes:
    - API open beyond loopback without HTTPS or a declared proxy
    - Account with an old clear token exposed to the network
    preconisation: Enable HTTPS (tls_cert / tls_key or a reverse proxy) or listen on a VPN only (docs/acces-distant.md).

ORT-9712:
  gravite: avertissement
  titre: Fichier de réglages de la station illisible
  message: '{fichier} illisible ({erreur}) : {repli}.'
  causes:
  - Fichier abîmé (coupure de courant pendant l'écriture, disque plein)
  - Fichier modifié à la main avec une erreur
  - Droits insuffisants
  preconisation: Refaire les réglages concernés depuis la page ou l'application (le fichier sera réécrit) ; vérifier
    le disque.
  action_auto: repli_valeurs_par_defaut
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9712/
  depuis_version: 0.123.0
  en:
    titre: Station settings file unreadable
    message: '{fichier} unreadable ({erreur}): {repli}.'
    causes:
    - Damaged file (power cut during write, disk full)
    - File edited by hand with a mistake
    - Insufficient permissions
    preconisation: Redo the affected settings from the page or app (the file will be rewritten); check the disk.

ORT-9713:
  gravite: erreur
  titre: Rapport de diagnostic impossible
  message: 'Rapport impossible : {detail}.'
  causes:
  - Bureau ou dossier personnel non accessible en écriture
  - Disque plein
  preconisation: Libérer de la place ou vérifier les droits du dossier, puis recommencer (menu 8).
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9713/
  depuis_version: 0.123.0
  en:
    titre: Diagnostic report failed
    message: 'Report failed: {detail}.'
    causes:
    - Desktop or home folder not writable
    - Disk full
    preconisation: Free some space or check folder permissions, then try again (menu 8).

ORT-9714:
  gravite: erreur
  titre: Commande introuvable
  message: 'Commande introuvable : {commande}.'
  causes:
  - Outil système absent (systemctl, journalctl, sudo, pkexec...)
  - Installation incomplète
  - Relais .cmd Windows dont la version active a disparu
  preconisation: 'Relancer l''installation (sudo bash install.sh ; sous Windows : installer.cmd).'
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9714/
  depuis_version: 0.123.0
  en:
    titre: Command not found
    message: 'Command not found: {commande}.'
    causes:
    - System tool missing (systemctl, journalctl, sudo, pkexec...)
    - Incomplete installation
    - Windows .cmd relay whose active version disappeared
    preconisation: 'Rerun the installation (sudo bash install.sh; on Windows: installer.cmd).'

ORT-9715:
  gravite: info
  titre: Option de commande inconnue ou invalide
  message: 'Option inconnue ou valeur invalide : {option}.'
  causes:
  - Faute de frappe dans la ligne de commande
  - Option d'une autre version
  preconisation: Relancer avec --aide pour voir les options.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9715/
  depuis_version: 0.123.0
  en:
    titre: Unknown or invalid command option
    message: 'Unknown option or invalid value: {option}.'
    causes:
    - Typo on the command line
    - Option from another version
    preconisation: Run again with --help to list the options.

ORT-9716:
  gravite: erreur
  titre: Import de la configuration d'un autre PC impossible
  message: 'Import de {fichier} impossible : {detail}.'
  causes:
  - Fichier à importer introuvable
  - Fichier TOML illisible
  preconisation: Vérifier le chemin et le contenu du fichier, ou faire la configuration avec l'assistant.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9716/
  depuis_version: 0.123.0
  en:
    titre: Importing the configuration from another PC failed
    message: 'Import of {fichier} failed: {detail}.'
    causes:
    - File to import not found
    - Unreadable TOML file
    preconisation: Check the file path and content, or configure with the wizard.

ORT-9717:
  gravite: info
  titre: Indicateur de bureau indisponible
  message: 'Indicateur : {detail}.'
  causes:
  - Bureau sans GNOME ou outil gnome-extensions absent
  - Extension absente (version antérieure à 0.49.0) ou pas encore connue de GNOME (reconnexion)
  - Échec de l'activation ou de la mise à jour
  preconisation: 'Se déconnecter puis se reconnecter ; installer une version récente (menu 13). Sous Windows : relancer
    installer.cmd.'
  action_auto: aucune
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9717/
  depuis_version: 0.123.0
  en:
    titre: Desktop indicator unavailable
    message: 'Indicator: {detail}.'
    causes:
    - Desktop without GNOME or gnome-extensions tool missing
    - Extension missing (version before 0.49.0) or not yet known to GNOME (log in again)
    - Enable or refresh failure
    preconisation: 'Log out and back in; install a recent version (menu 13). On Windows: rerun installer.cmd.'

ORT-9718:
  gravite: info
  titre: Tests de la station indisponibles
  message: 'Tests non lancés : {detail}.'
  causes:
  - Version installée antérieure à 0.42.0 (tests absents)
  - pytest non installé et pas d'accès Internet
  preconisation: Installer une version récente (menu 13) ou rétablir Internet pour installer pytest.
  action_auto: refus
  ntfy_defaut: false
  priorite_ntfy: 3
  doc: https://bob56fr.github.io/openRemoteTRX/erreurs/ORT-9718/
  depuis_version: 0.123.0
  en:
    titre: Station tests unavailable
    message: 'Tests not run: {detail}.'
    causes:
    - Installed version older than 0.42.0 (tests missing)
    - pytest not installed and no Internet access
    preconisation: Install a recent version (menu 13) or restore Internet access to install pytest.

