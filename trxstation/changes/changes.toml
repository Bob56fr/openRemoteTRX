# Changements d'openRemoteTRX vus par l'opérateur, poste par poste (étape 407, demande de l'utilisateur du 2026-11-28).
# Lu par openRemoteTRX Console (menu « Changements pour mon poste ») ; publié sur GitHub Pages pour être lu AVANT une
# mise à jour. Une entrée par changement visible, la plus récente en haut ; textes courts dans les 4 langues
# (allemand vouvoyé), sans adresse ni nom de machine.
#   date    : jour de la version (AAAA-MM-JJ)
#   version : version de la station qui l'apporte
#   type    : "correctif", "nouveaute" ou "securite"
#   postes  : ["*"] = tous les postes ; "icom", "yaesu", "kenwood" = marque (famille Hamlib : numéro // 1000) ;
#             ou numéro Hamlib du modèle en texte ("3094" = IC-7300MK2)
# Toute étape qui change ce que voit l'opérateur ou ce que fait un poste AJOUTE son entrée ici (tests/test_changes.py).

