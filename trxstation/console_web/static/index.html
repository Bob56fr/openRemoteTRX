<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRX Console</title>
<link rel="stylesheet" href="/static/vendor/xterm.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="wrap">
  <section class="hero" aria-label="État de la station">
    <canvas id="wf" aria-hidden="true"></canvas>
    <div class="brand">
      <h1 id="title">TRX Console</h1>
      <div class="sub" id="sub"></div>
      <div class="pills" id="pills"></div>
    </div>
    <div class="vfo" aria-label="Poste">
      <div class="freq" id="freq">--.---.--</div>
      <div class="meta" id="meta"></div>
    </div>
  </section>

  <div class="tools">
    <label class="search" for="q"><span aria-hidden="true">🔎</span><input id="q" type="search" autocomplete="off"></label>
    <button class="btn" id="all" type="button"></button>
    <button class="btn" id="none" type="button"></button>
    <div class="levels" id="levels" role="group"></div>
    <button class="btn" id="lang" type="button"></button>
    <button class="btn" id="logout" type="button" hidden></button>
  </div>
  <p class="first" id="first" hidden></p>
  <div class="grid" id="grid"></div>
</div>

<aside class="help" id="help" role="tooltip" aria-live="polite"></aside>
<div class="toast" id="toast" role="status" hidden></div>

<section class="term" id="term" aria-label="Terminal">
  <div class="bar"><span id="term-label"></span><span class="state" id="term-state"></span>
    <button type="button" id="term-toggle"></button></div>
  <div class="term-body" id="term-body"></div>
</section>
<button type="button" class="term-tab" id="term-tab" hidden></button>

<script src="/static/vendor/xterm.js"></script>
<script src="/static/vendor/addon-fit.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
