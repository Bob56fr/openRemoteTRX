<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>openRemoteTRX Console</title>
<link rel="stylesheet" href="/static/vendor/xterm.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="wrap">
  <section class="hero" aria-label="État de la station">
    <canvas id="wf" aria-hidden="true"></canvas>
    <div class="brand">
      <h1 id="title">openRemoteTRX Console</h1>
      <div class="sub" id="sub"></div>
      <div class="pills" id="pills"></div>
      <a class="webapp" id="webapp" target="_blank" rel="noopener" hidden></a>
      <a class="webapp" id="dashboard" target="_blank" rel="noopener" hidden></a>
    </div>
    <div class="vfo" aria-label="Poste">
      <div class="freq" id="freq">--.---.--</div>
      <div class="meta" id="meta"></div>
      <a class="site" href="https://www.rf-diy.com" target="_blank" rel="noopener">www.rf-diy.com</a>
    </div>
  </section>

  <div class="tools">
    <label class="search" for="q"><span aria-hidden="true">🔎</span><input id="q" type="search" autocomplete="off"></label>
    <button class="btn" id="all" type="button"></button>
    <button class="btn" id="none" type="button"></button>
    <div class="levels" id="levels" role="group"></div>
    <div class="levels" id="langs" role="group"></div>
    <button class="btn" id="logout" type="button" hidden></button>
  </div>
  <p class="first" id="first" hidden></p>
  <div class="grid" id="grid"></div>
</div>

<aside class="help" id="help" role="tooltip" aria-live="polite"></aside>
<div class="toast" id="toast" role="status" hidden></div>

<section class="term" id="term" aria-label="Terminal">
  <div class="bar"><span id="term-label"></span><span class="state" id="term-state"></span>
    <button type="button" id="term-max"></button><button type="button" id="term-toggle"></button></div>
  <div class="term-body" id="term-body"></div>
</section>
<button type="button" class="term-tab" id="term-tab" hidden></button>

<section class="flow" id="flow" aria-label="Menu" aria-live="polite">
  <header><span class="fkey" id="flow-key"></span><h2 id="flow-title"></h2><button type="button" class="btn" id="flow-term"></button><button type="button" class="btn" id="flow-stop"></button></header>
  <div class="flow-log" id="flow-log"></div>
  <div class="flow-form" id="flow-form"></div>
</section>
<button type="button" class="term-tab flow-tab" id="flow-tab" hidden></button>

<section class="dash" id="dash" aria-label="Tableau de bord" hidden>
  <header><h2 id="dash-title"></h2>
    <button type="button" class="btn stop" id="dash-stop"></button>
    <button type="button" class="btn" id="dash-term"></button>
    <button type="button" class="btn" id="dash-close"></button></header>
  <div class="dash-flash" id="dash-flash" role="status" hidden></div>
  <p class="dash-stale" id="dash-stale" hidden></p>
  <div class="dash-grid" id="dash-grid"></div>
  <section class="dash-log"><h3 id="dash-log-title"></h3><ol id="dash-log-lines"></ol></section>
</section>

<script src="/static/vendor/xterm.js"></script>
<script src="/static/vendor/addon-fit.js"></script>
<script src="/static/flow.js"></script>
<script src="/static/dash.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
