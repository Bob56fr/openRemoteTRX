# Module de monitoring inter-stations, mode R (docs/cdc-monitoring.md § 17, étape 209).
# AUCUN droit : ni événement du bus, ni commande, ni message vers les pages. Il lit des fichiers d'état (passerelle,
# superviseur, journaux JSON) et échange des enveloppes chiffrées avec le relais. Jamais de commande vers une station.
[module]
name = "monlink"
version = "0.1.0"
api = "1.0"
entry = "trxstation.monlink.service"
start = "auto"
description = "Monitoring inter-stations : télémétrie chiffrée par le relais, pour aider ou être aidé"

[rights]
events = []
commands = []
client_messages = false
verify_tokens = false
client_commands = false

[resources]
cpu_quota = 10        # % d'un cœur (preuve de travail de l'enregistrement et scrypt d'un code : quelques secondes)
memory_max_mb = 96
nice = 15

[degradation]
levels = [4, 5]       # pause, arrêt

[network]
ports = []            # n'écoute sur aucun port (requêtes sortantes vers le relais seulement)
