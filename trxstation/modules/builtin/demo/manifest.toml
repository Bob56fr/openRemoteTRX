# Module factice de validation du socle (lot 1a).
[module]
name = "demo"
version = "0.1.0"
api = "1.0"
entry = "trxstation.modules.demo_module"
start = "auto"
description = "Module factice : pause pendant le PTT, messages au terminal"

[rights]
events = ["ptt", "freq_mode", "trx_state", "degrade"]
commands = []
client_messages = true
verify_tokens = false

[resources]
cpu_quota = 10        # % d'un cœur
memory_max_mb = 128
nice = 10

[degradation]
levels = [4, 5]       # pause, arrêt

[network]
ports = []
