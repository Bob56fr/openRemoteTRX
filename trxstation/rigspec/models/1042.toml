# Yaesu FTDX10 : d'après le manuel CAT de Yaesu (FTDX10 CAT 2308-F) et le premier essai du FTDX10 (lectures facultatives jusqu'à 2,5 s) ;
# délais à mesurer par la qualification (étape 393).
format = 1
model = 1042
name = "Yaesu FTDX10"
receivers = 1
verified = false

[timing]
read_delay_s = 4.0      # poste lent : une relecture peut attendre plusieurs lectures facultatives
tuner_delay_s = 3.0
linked_changes = true   # mémoire par bande : une fréquence envoyée peut remettre le mode de la bande

[filters]
kind = "steps"          # largeur par paliers imposés (commande SH), sans préréglage FIL
quick = [1800, 2400, 2800, 3000, 3500, 4000]    # appui bref : du DX à la HIFI (choix de l'utilisateur)

[filters.steps]         # manuel CAT FTDX10 2308-F, tableau 3 (palier 00 = défaut du filtre de toit, jamais demandé)
USB = [300, 400, 600, 850, 1100, 1200, 1500, 1650, 1800, 1950, 2100, 2250, 2400, 2450, 2500, 2600, 2700, 2800, 2900, 3000, 3200, 3500, 4000]
LSB = [300, 400, 600, 850, 1100, 1200, 1500, 1650, 1800, 1950, 2100, 2250, 2400, 2450, 2500, 2600, 2700, 2800, 2900, 3000, 3200, 3500, 4000]
CW = [50, 100, 150, 200, 250, 300, 350, 400, 450, 500, 600, 800, 1200, 1400, 1700, 2000, 2400, 3000, 3200, 3500, 4000]
CWR = [50, 100, 150, 200, 250, 300, 350, 400, 450, 500, 600, 800, 1200, 1400, 1700, 2000, 2400, 3000, 3200, 3500, 4000]
RTTY = [50, 100, 150, 200, 250, 300, 350, 400, 450, 500, 600, 800, 1200, 1400, 1700, 2000, 2400, 3000, 3200, 3500, 4000]
RTTYR = [50, 100, 150, 200, 250, 300, 350, 400, 450, 500, 600, 800, 1200, 1400, 1700, 2000, 2400, 3000, 3200, 3500, 4000]

[squelch]
source = "busy"         # commande BY : récepteur occupé, lu sur le poste
