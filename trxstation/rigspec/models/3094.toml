# Icom IC-7300MK2 : d'après le manuel CI-V et l'usage de la station ; délais à mesurer par la qualification (étape 393).
format = 1
model = 3094
name = "Icom IC-7300MK2"
receivers = 1
verified = false

[timing]
read_delay_s = 0.0
tuner_delay_s = 2.0
linked_changes = false  # une fréquence envoyée par la CAT ne change pas le mode

[filters]
kind = "presets"        # FIL1 / FIL2 / FIL3 par mode
presets = 3

[squelch]
source = "dcd"          # Hamlib get_dcd (CI-V « 15 01 »), à vérifier sur le poste ; abandonné seul au premier refus
# Étalonnage du squelch (étape 412) : SQL de Hamlib quand le poste affiche 1… 9, 9+10, relevé par le menu 2.10 sur un
# vrai IC-7300MK2 (export du 2026-11-28, Hamlib 5.0.0~git, mode PKTUSB)
calibration = [0.3650, 0.4000, 0.4310, 0.4670, 0.5060, 0.5450, 0.5880, 0.6310, 0.6550, 0.7330]
