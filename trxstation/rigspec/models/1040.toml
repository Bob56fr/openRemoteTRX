# Yaesu FTDX101D : d'après le manuel CAT de Yaesu (FTDX101D CAT 1904-A) et le premier essai du FTDX10 (lectures facultatives jusqu'à 2,5 s) ;
# délais à mesurer par la qualification (étape 393).
format = 1
model = 1040
name = "Yaesu FTDX101D"
receivers = 2
verified = false

[timing]
read_delay_s = 4.0      # poste lent : une relecture peut attendre plusieurs lectures facultatives
tuner_delay_s = 3.0
linked_changes = true   # mémoire par bande : une fréquence envoyée peut remettre le mode de la bande

[filters]
kind = "steps"          # largeur par paliers imposés (commande SH), sans préréglage FIL
mode_width = -1          # mode changé sans toucher à la largeur ni au filtre de toit (0 = 2400 Hz et RF02 chez Hamlib)

[squelch]
source = "busy"         # commande BY : récepteur occupé, lu sur le poste (Hamlib n'a pas get_dcd pour ce poste)
query = "BY;"           # manuel FTDX101D CAT 1904-A : réponse « BY P1 P2; », P1 = MAIN, P2 = SUB : 1 = RX BUSY ON
reply = 'BY([01])[01];'
open_value = "1"

[transmit]              # côté d'émission (touches TX du MAIN et du SUB) : manuel CAT FTDX101D 1904-A, commandes FT, FA, FB
side_query = "FT;"
side_reply = 'FT([01]);'
main_value = "0"        # « FT0; » : le MAIN émet
sub_value = "1"         # « FT1; » : le SUB émet
main_freq_query = "FA;"
sub_freq_query = "FB;"
freq_reply = 'F[AB](\d{9});'
