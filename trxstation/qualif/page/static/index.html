<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valise de qualification</title>
<link rel="stylesheet" href="/static/valise.css">
<script src="/static/valise.js" defer></script>
</head>
<body>
<header id="bandeau">
  <div id="txband" class="txband" hidden></div>
  <div class="ligne-bandeau">
    <div class="ident">
      <div id="titre" class="titre"></div>
      <div id="poste" class="poste"></div>
      <div id="details" class="details"></div>
    </div>
    <div class="voyants">
      <span id="v-station" class="voyant"></span>
      <span id="v-branchement" class="voyant"></span>
      <span id="v-ptt" class="voyant"></span>
      <span id="v-pilote" class="voyant pilote"></span>
    </div>
    <button id="stop" class="stop" type="button">STOP</button>
  </div>
</header>
<div id="avis" class="avis" hidden></div>
<main>
  <section id="zone" class="zone" hidden></section>
  <div class="haut">
    <section class="carte">
      <div id="maintenant" class="maintenant"></div>
      <div class="mesures">
        <div class="m"><span id="t-freq"></span><b id="m-freq">—</b></div>
        <div class="m"><span id="t-po"></span><b id="m-po">—</b></div>
        <div class="m"><span id="t-swr"></span><b id="m-swr">—</b></div>
        <div class="m"><span id="t-alc"></span><b id="m-alc">—</b></div>
        <div class="m"><span id="t-s"></span><b id="m-s">—</b></div>
      </div>
    </section>
    <section class="carte">
      <div id="compte" class="compte"></div>
      <div class="prog"><i id="prog"></i></div>
      <div id="station-boutons" class="boutons petits"></div>
    </section>
  </div>
  <div class="outils">
    <button id="tout" type="button" class="principal"></button>
    <button id="echecs" type="button" class="second"></button>
    <span class="vide"></span>
    <div id="legende" class="legende"></div>
  </div>
  <div id="themes" class="themes"></div>
  <details class="journal">
    <summary id="t-journal"></summary>
    <pre id="journal"></pre>
  </details>
</main>
<div id="intervention" class="fond" hidden>
  <div class="fenetre" role="alertdialog" aria-modal="true" aria-labelledby="iv-titre">
    <h2 id="iv-titre"></h2>
    <h3 id="iv-t-why"></h3>
    <p id="iv-why"></p>
    <h3 id="iv-t-what"></h3>
    <p id="iv-what" class="quoi"></p>
    <p id="iv-rule" class="regle"></p>
    <label id="iv-label" for="iv-mot"></label>
    <input id="iv-mot" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <p id="iv-erreur" class="erreur" hidden></p>
    <div class="actions">
      <button id="iv-valider" type="button" class="principal"></button>
      <button id="iv-passer" type="button"></button>
    </div>
  </div>
</div>
</body>
</html>
