# Dossiers de la station TRX distant (systemd-tmpfiles).
# /run/trx-remote : fichier d'état de la passerelle, lisible par TRX Console et trx-monitor.
# /var/lib/trx-remote : mode sûr, historique des redémarrages, mémoires partagées.
d /run/trx-remote 0755 trx trx -
d /var/lib/trx-remote 0750 trx trx -
