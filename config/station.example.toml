# station.toml : source de vérité de la station (générée par trx-setup).
# Les clés de [rig], [network], [bands], le plafond du TOT et [supervisor] ne se
# modifient que sur le Pi. Le smartphone ne pourra changer que le reste.
schema_version = 1
config_revision = 1

[rig]
model = 1
port = ""
ptt_type = "RIG"   # RIG (CAT), RTS, DTR, GPIO, GPION, NONE
ptt_port = ""
extra_conf = []
max_power_w = 0   # puissance maximale du poste en watts (ex. 100) : la page affiche des watts ; 0 = inconnue, des pourcentages
tx_modes = []   # modes où l'émission est permise. Icom : ["PKTUSB", "PKTLSB", "PKTFM", "PKTAM"] (l'audio USB n'existe qu'en modes données) ; vide = aucune restriction

[audio]
capture_device = ""
playback_device = ""
sample_rate = 48000
rx_gain_db = 0.0
tx_gain_db = 0.0

[tools]
hamlib_dir = ""   # Windows : dossier contenant bin\rigctld.exe

[network]
rigctld_host = "127.0.0.1"   # doit rester local
rigctld_port = 4532
gateway_bind = "127.0.0.1"   # 127.0.0.1 = machine seule ; hors machine : TLS requis (docs/acces-distant.md)
gateway_port = 8443
web_client = true   # page web de contrôle sur le même port
tls_cert = ""   # HTTPS natif (PEM) ; vide = pas de TLS (proxy HTTPS ou VPN devant)
tls_key = ""
allow_insecure_http = false   # true : écoute réseau sans TLS (VPN uniquement)
trusted_proxies = ["127.0.0.1", "::1"]   # crus pour X-Forwarded-For
ice_servers = ["stun:stun.l.google.com:19302"]   # [] : réseau local ou VPN seulement

[safety]
tot_s = 90
tot_ceiling_s = 120
enforce_bands = true   # false : le poste interdit déjà l'émission hors bandes (« TX limit » des Icom) ; la station ne la contrôle plus
warn_before_s = 10
heartbeat_interval_ms = 500
heartbeat_timeout_ms = 2000
rig_temp_warn_c = 40   # température du poste (si Hamlib la donne) : avertissement
rig_temp_cut_c = 50    # émission à distance coupée, reprise sous rig_temp_warn_c (TRX Console, menu 16)
allow_replay = false   # rediffusion d'un enregistrement de l'audio reçu (accordée par l'assistant, responsabilité de l'opérateur)

[supervisor]
tot_abs_s = 135   # TOT absolu (> tot_ceiling_s) : coupe aussi l'émission faite au micro du poste
poll_interval_s = 1.0
max_reboots_per_hour = 3
notify_url = ""
status_path = "/run/trx-remote/gateway-status.json"
state_dir = "/var/lib/trx-remote"
service_mode = "auto"   # auto | systemd | managed
instance_lock_port = 47321
stale_after_s = 2.0
startup_grace_s = 30.0
mismatch_grace_s = 1.5
rigctld_fail_s = 5.0
recovery_wait_s = 20.0
healthy_reset_s = 120.0
temp_alert_c = 80.0
mem_alert_pct = 90   # mémoire utilisée (%) : alerte ntfy seule ; 0 = aucune
disk_alert_pct = 90   # disque utilisé (%), dossier d'état et / : alerte ntfy seule ; 0 = aucune
alive_every_h = 1.0   # message « Station en service » sans sonnerie par notify_url, toutes les N heures ; 0 = aucun
allow_local_tx = true   # true : station partagée, l'émission au micro du poste n'est coupée que par tot_abs_s
gateway_unit = "trx-gateway.service"
rigctld_unit = "rigctld.service"

[modules]
run = []   # modules à faire tourner, ex. ["demo"] ; [] = aucun (pas de bus, comportement inchangé)
bus_port = 47810   # API interne des modules, écoute en 127.0.0.1 seulement
run_as = "trx"   # Linux : compte des modules quand le superviseur est root (jamais root)
extra_dir = ""   # modules supplémentaires ; vide = modules fournis seulement

[update]
enabled = true   # cherche une nouvelle version sur GitHub au démarrage puis toutes les 24 h (installation après confirmation seulement)
allow_prerelease = false   # true : propose aussi les pré-versions

[spectrum]
enabled = false   # spectre HF du poste (waterfall HF) ; false = un seul port, comme avant
source = "rigctld"   # civ_port : second port CI-V du poste (Icom) ; rigctld : Hamlib 4.6+ async ([rig] speed = 115200)
port = ""   # civ_port : second port du poste (ex. COM7), jamais le port CAT ; trx-setup --spectre PORT
civ_address = ""   # civ_port : adresse CI-V du poste en hexadécimal (ex. B6), revérifiée à chaque ouverture
baud = 115200   # civ_port : débit du second port
data_port = 4572   # rigctld : UDP sur 127.0.0.1
max_fps = 10   # images par seconde envoyées aux clients (1 à 20)

[selcall]   # squelch numérique par appel de groupe (docs/selcall-cahier-des-charges.md)
enabled = false   # fonction disponible sur cette station
send_on_tx_end = false   # trame émise en fin d'émission, à la place du roger bip
manual_repeat = 3   # appel manuel : nombre d'émissions de la trame (1 à 5)
manual_gap_ms = 500
filter_mode = "attenuate"   # tonalités dans l'audio reçu : mute | attenuate | chime
attenuation_db = 20
audio_delay_ms = 500   # retard de l'audio reçu (250 à 1 000 ms)
tx_level_dbfs = -6.0   # niveau de la trame émise (sous le seuil d'ALC)
notify_on_call = true   # notification ntfy à l'ouverture
history_size = 10

[access]   # visiteurs en réception seule (docs/visiteurs-cahier-des-charges.md) ; TRX Console menu 20 ; relu sans redémarrer
max_listeners = 0   # visiteurs connectés en même temps ; 0 = fonction désactivée
max_operators = 4   # connexions opérateur (quota à part, jamais pris par un visiteur)
listeners_need_operator = true   # true : visiteurs admis seulement si un opérateur est connecté
operator_grace_s = 60   # opérateur perdu : attente avant de déconnecter les visiteurs (0 à 600 s)
listeners_outside_bands = false   # false : silence pour les visiteurs hors [[bands]]
listener_spectrum_fps = 5   # spectre HF des visiteurs : images par seconde au plus (1 à 20)
# Surcharge : au-delà pendant 10 s, visiteurs déconnectés ; réouverture après 5 min nettement en dessous
overload_temp_c = 85   # température du processeur (°C)
overload_cpu_pct = 90   # charge de tous les cœurs (%)
overload_lag_ms = 100   # retard de la boucle de la passerelle (ms)
overload_mem_pct = 10   # mémoire libre minimale (%)

[swr]   # mesure de TOS de l'antenne (docs/tos-cahier-des-charges.md) ; réglages de la station seulement
enabled = true   # false : mesure absente
max_power_pct = 50   # plafond de puissance, % de la puissance du poste (5 à 50)
max_points = 50   # points d'une mesure au plus (2 à 200)
point_tx_max_s = 2.0   # émission d'un point au plus, en secondes (0.5 à 3)

[breizh]   # Breizh Audio Box dans la chaîne d'émission (docs/breizh-cahier-des-charges.md) ; le micro circule EN CLAIR sur le réseau local
enabled = false
host = ""   # adresse IP PRIVÉE du PC de Breizh
port = 47100   # port UDP de Breizh (1024 à 65535)
key_file = ""   # clé d'appairage ; vide = breizh.key à côté de ce fichier
block_timeout_ms = 40   # bloc pas revenu à temps : part sans traitement (15 à 100 ms)
lost_ms = 100   # sans retour pendant ce délai : repli en direct (50 à 500 ms, > block_timeout_ms)
fallback_gain_db = -6.0   # gain du son direct en repli (-20 à 0 dB)
reactivate_after_s = 60   # stabilité avant le retour automatique (0 = à la main, 30 à 3600 s)

[netprobe]   # sonde de qualité réseau (docs/netprobe-cahier-des-charges.md) : mesure et affiche, n'agit jamais sur l'émission
enabled = true
heartbeat_interval_s = 1.0   # battement réseau (0.5 à 10 s)
outage_missed_beats = 3   # battements sans écho = coupure (2 à 20)
lan_target = "auto"   # box à sonder ; auto = passerelle par défaut
internet_target = "1.1.1.1"   # cible Internet ; "" = aucune
# Seuils de DÉPART de l'indicateur ; ceux choisis dans la page ou l'application (statistiques) priment
loss_warn_pct = 2.0   # perte sur 60 s : orange (%)
loss_alert_pct = 10.0   # perte sur 60 s : rouge (%)
rtt_warn_ms = 250   # aller-retour p95 sur 60 s : orange (ms)
rtt_alert_ms = 600   # aller-retour p95 sur 60 s : rouge (ms)
alert_outage_s = 10   # coupure plus longue : alerte par notify_url (0 = aucune)
alert_cooldown_s = 300   # délai minimal entre deux alertes de la sonde (s)
log_retention_days = 7   # résumés de 10 s (1 à 30 jours)
stats_retention_days = 30   # coupures et statistiques (7 à 90 jours)
vpn_shared_warn = true   # avertir quand deux appareils semblent partager un profil VPN
rsrp_warn_dbm = -105   # signal 4G/5G de l'application : orange (dBm)
rsrp_alert_dbm = -115   # rouge (dBm)
sinr_warn_db = 3   # rapport signal/bruit : orange (dB)
sinr_alert_db = 0   # rouge (dB)

# Compte visiteur (exemple) : role = "listener", pseudo montré aux autres connectés à la place de l'identifiant.
# [[clients]]
# id = "club1"
# password_hash = "..."   # TRX Console menu 20 (jamais de mot de passe en clair)
# role = "listener"
# pseudo = "Radio-club"
# enabled = true
# expires = "2026-12-31"

